<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>highlight — the elements against the board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; padding: 28px 32px; background: #fbfbfa; color-scheme: light; font: 13px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
      .row { display: flex; gap: 28px; align-items: flex-start; }
      .col { width: 336px; display: flex; flex-direction: column; gap: 10px; }
      .cap { font-size: 12px; color: #555b63; max-width: 336px; }
      h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4px; }
      .strip { margin-bottom: 18px; }
    </style>
  </head>
  <body>
    <h1>Highlight · member-of · the hierarchy panel — the built elements</h1>
    <div class="strip"><mosaica-status id="strip"></mosaica-status></div>
    <div class="row">
      <div class="col"><mosaica-filter-panel id="filters"></mosaica-filter-panel><div class="cap">3 · The chip carries the verb.</div></div>
      <div class="col"><mosaica-hierarchy id="tree"></mosaica-hierarchy><div class="cap">4 · The hierarchy panel, over the browse verb.</div></div>
      <div class="col"><mosaica-artifact-card id="card"></mosaica-artifact-card><div class="cap">5 · The card's member_of clauses.</div></div>
      <div class="col"><mosaica-layer-picker id="layers"></mosaica-layer-picker><div class="cap">6 · A filter layer is still a layer.</div></div>
    </div>
    <script type="module" src="/.highlight-boards.ts"></script>
  </body>
</html>
