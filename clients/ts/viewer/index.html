<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Tessera viewer</title>
    <!-- No icon to fetch: a headed browser asks for one and the dev server's 404 reads as an error. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <!-- The elements fetch no font; this page loads Instrument Sans, their default face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- The explorer is the map with its status strip, toolbar (the layer picker and the legend),
         filters, artifact list, selection and detail card (design client-components §7); the
         instruments beside it are the demo's own — dataset and principal, where the session
         credential stays, and the readouts that measure rather than show. -->
    <tessera-explorer id="explorer" layout="overlay"></tessera-explorer>
    <aside id="instruments"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
