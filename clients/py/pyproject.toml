[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tesseradb"
version = "0.1.0"
description = "Tessera's Python package: the notebook widget as the [widget] extra; the SDK and the in-process instance join it later (decision 0095)."
requires-python = ">=3.10"
# The base install has no JavaScript in it and no dependency beyond the standard library:
# `authorise` is one HTTPS call, made with `urllib`. A consumer, never a component (CLAUDE.md).
dependencies = []

[project.optional-dependencies]
# The widget: anywidget plus the components' single-file bundle, which the wheel's build hook
# (`hatch_build.py`) builds with Node at wheel-build time and packages under `tesseradb/static/`.
# A user installing the wheel needs no Node; a developer installing from this checkout does.
widget = ["anywidget>=0.9"]
dev = ["anywidget>=0.9", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["tesseradb"]
# The bundle is produced by the hook, never committed (`static/` is gitignored but for its
# marker), so it is declared an artifact — hatchling would otherwise drop it as untracked.
artifacts = ["tesseradb/static/tessera-components.js", "tesseradb/static/tessera-components.js.sri"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["tesseradb", "hatch_build.py", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
