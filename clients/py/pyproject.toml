[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tesseradb"
version = "0.1.0"
description = "Tessera's Python package: the notebook widget as the [widget] extra, the SDK as the [local] one; the in-process instance joins them later (decision 0095)."
license = "Apache-2.0"
requires-python = ">=3.10"
# The base install has no JavaScript in it and no third-party Python in it: `authorise` is one
# HTTPS call, made with `urllib`. A consumer, never a component (CLAUDE.md). The wheel stays
# `py3-none-any`.
#
# The one dependency is the companion platform wheel, which carries the `tessera` binary and the
# `_tessera` extension module, so `pip install tesseradb` reaches the server without a cargo
# toolchain. It is pinned exactly: nothing is deployed and a format change refuses a stale bundle,
# so the binary and the SDK move together. The marker keeps an unsupported platform installable —
# there the base install is what it always was, pure Python with no binary.
#
# Opting out is `pip install tesseradb --no-deps`, which is exact because this is the only entry.
dependencies = [
  "tesseradb-native==0.1.0; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
]

[project.optional-dependencies]
# The widget: anywidget plus the components' single-file bundle, which the wheel's build hook
# (`hatch_build.py`) builds with Node at wheel-build time and packages under `tesseradb/static/`.
# A user installing the wheel needs no Node; a developer installing from this checkout does.
widget = ["anywidget>=0.9"]
# The SDK: a database in a directory, filled from frames and files. pyarrow is the only hard
# dependency — a pandas or polars frame reaches it through `pa.table`, so neither is required.
local = ["pyarrow>=14"]
# `tomli` is the TOML reader the corpus regeneration tests parse both documents with, on the
# Pythons below 3.11 that carry no `tomllib`. It is a test dependency and reaches no other extra.
dev = [
  "anywidget>=0.9", "pyarrow>=14", "pandas", "pytest", "ruff",
  "tomli>=2; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["tesseradb"]
# The bundle is produced by the hook, never committed (`static/` is gitignored but for its
# marker), so it is declared an artifact — hatchling would otherwise drop it as untracked.
artifacts = ["tesseradb/static/tessera-components.js", "tesseradb/static/tessera-components.js.sri"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["tesseradb", "hatch_build.py", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
