# GBIF occurrence — 3,654,488,638 records of what was found where, the ladder's largest rung and
# the first to use most of one `u32` entity space.
#
# Produced by `prepare.py`, which writes an edited copy of this file next to the parquets;
# `[sources]` is relative to the declaring document (configuration.md §3), so the copy beside the
# data is what `tessera build` reads and this one is what gets reviewed.
#
# **One marker is filled by the run rather than committed.** `# <vocabulary>` is the `kingdom`
# value set, whose size is a property of the corpus the run saw.
#
# **The schema is sparse, and that is the rung's shape** (owner ruling, 2026-09-09): one column per
# attribute type, so what this rung measures is 3.65×10⁹ rows through the build rather than a wide
# row through it. Rung 4 measured 118.9 GB of abstracts and rung 5 measured seven tiered levels
# over 2.33×10⁸ rows; this one measures the row count.

[sources]
points   = "points.parquet"
kingdom  = "vocab-kingdom.parquet"
taxonomy = "members-taxonomy.parquet"

[defaults]
source          = "points"
entity_id_field = "entity_id"

# ---------------------------------------------------------------------------------------------
# **One view, and every entity is in it.** A record GBIF publishes without `decimallatitude` and
# `decimallongitude` is not placeable, and with one view there is nowhere else for it to be drawn,
# counted or sampled — so `prepare.py` drops those rows before it assigns an entity id rather than
# carrying them as positionless entities. The count and the fraction are in `manifest.json` and in
# `README.md`. Rung 5 carried its unplaceable rows because it has a second view they appear in.
#
# The extent is written on the **input** side of the projection (`projections.md` §4.2) — the box
# below is longitude and latitude in degrees and it is Web Mercator's whole domain, so it snaps to
# the world square at zoom offset 0 and a 16-bit cell is exactly an XYZ tile at zoom 16. The
# transform, the normalisation and the south-running y all happen inside the build, which is why
# `points.parquet` carries `lon` and `lat` exactly as GBIF publishes them.
#
# **A record beyond ±85.0511° is kept and clamps to the boundary.** Web Mercator has no position
# for it, quantisation clamps, and the polar records are real observations — dropping them would
# take a decision about Antarctica on rendering grounds. `prepare.py` reports how many.
#
# **`countrycode` is the compartment**: the country the occurrence was recorded in, 251 values,
# US 1.25×10⁹, AU 320M, FR 206M. It is a property of the record rather than a synthetic stand-in,
# and it is this rung's equivalent of rung 5's `publisher`.
#
# **The `default` never fires.** A record whose `countrycode` is null or empty carries
# `UNRECORDED`, written into the column by `prepare.py`, so the column is never empty and a
# principal holding no term **sees nothing**. Written as a real term rather than left to the
# view's `default` for rung 5's reason: the campaign's principal ladder starts at 1% of the corpus
# and cannot be composed under a floor every principal would hold for free. A `public` default
# would put 1.6% of the map in front of a viewer with no grant at all, and every masked count
# taken against it would measure that floor rather than the compartment.
# ---------------------------------------------------------------------------------------------

[[view]]
name             = "geo"
title            = "Where it was recorded"
projection       = "web_mercator"
extent           = { lon = [-180.0, 180.0], lat = [-85.0511287798066, 85.0511287798066] }
source           = "points"
visibility       = "public"
point_visibility = { field = "countrycode", default = "UNRECORDED" }

# ---------------------------------------------------------------------------------------------
# The one vocabulary, minted from the corpus and **closed**: a value it does not name is a refusal
# rather than a quietly minted category.
#
# `visibility = "public"`. A kingdom names no country, so serving "this corpus contains fungi" to a
# principal holding one country's term discloses nothing about a compartment they do not hold —
# the split the Overture rung draws between its categories and its country. The nine names are the
# published top of GBIF's backbone taxonomy rather than anything this corpus is in a position to
# withhold, and the file is a roster of which of them these records happened to carry.
# ---------------------------------------------------------------------------------------------

# <vocabulary>

# ---------------------------------------------------------------------------------------------
# Attributes — **one per type, and the sparseness is the declaration** (owner ruling, 2026-09-09).
#
# `kingdom` is the category and the only rendered column: nine values, a legend and a colour, and
# it is the iconic view of this corpus. It is also why the taxonomy layer below does not start at
# kingdom — a rendered category costs one byte in every row, where a level-0 artifact over
# 2.81×10⁹ members costs 22.5 GB resident in the build.
#
# `specieskey` is the keyword and a genuine lookup: ~10⁶ distinct values, one per accepted species,
# and a viewer who has a key wants the occurrences under it. `render` on a keyword is refused (the
# hot column is a fixed-width slot per row); `index = true` puts the string in entity space at no
# cost to the hot column.
#
# `year` is the numeric, indexed rather than rendered. A range over it is what a map of three and a
# half billion observations is asked for — "since 2020" — and 377 distinct values need no colour
# ramp. Rendering it would cost two bytes in every row, 7.3 GB over the corpus, for a legend a
# category already gives.
#
# `scientificname` claims neither placement flag, so it is blob-resident (records §5): no hot
# column, no entity-space structure, no operand on `/v1/meta`, and its value comes back on
# drill-down. That is what "stored, not indexed" is, and it is what the row detail needs.
#
# ⊘ **No text column.** `locality` is 48.45 GiB compressed, the corpus's largest, and the text
# index over it is deferred past the first build — see `README.md` for what adding it would take.
# ---------------------------------------------------------------------------------------------

[[attribute]]
name       = "kingdom"
title      = "Kingdom"
type       = "category"
vocabulary = "kingdom"
render     = true

[[attribute]]
name  = "specieskey"
title = "GBIF species key"
type  = "keyword"
index = true

[[attribute]]
name  = "year"
title = "Year"
type  = "u16"
index = true

[[attribute]]
name  = "scientificname"
title = "Scientific name"
type  = "keyword"

# ---------------------------------------------------------------------------------------------
# **The taxonomy, three levels, family → genus → species.** It starts at family and that is the
# rung's one structural concession to the box: `merge_member_runs` holds the largest single
# artifact's members resident as `u64` while it sorts them, so a level-0 artifact is what sets the
# `layers` stage's peak. Extrapolated from the census's 200-part sample: kingdom Animalia is
# 2,809,414,577 members and 22.5 GB, family Anatidae is 177,354,694 and 1.4 GB. Three levels over
# 3.65×10⁹ rows is ~1.1×10¹⁰ membership entries, against rung 5's 1.63×10⁹.
#
# A member row is one occurrence with a list whose positions are the three declared levels
# (GeoNames' `members-admin.parquet` form). A null entry means *in no artifact at that level*,
# which is what a chain that simply ends is. **A hole in the chain becomes an artifact, not a
# null**: a row with a species and no family carries an explicit `NOT_RECORDED` key at the family
# level, because `parent_edges` is `windows(2)` and does not read past a gap — skipping would
# state a containment no row makes. A level is filled only where something *below* it is present.
#
# `value_set = "open"`: no artifact roster is supplied, so the artifacts are exactly what the
# member file names and each carries its own key as its name. `require_member_visibility =
# { count = 1 }` with `artifact_visibility = "inherited"` is what makes containment structural
# rather than declared — a genus is served only to a principal who can already see an occurrence
# in it.
# ---------------------------------------------------------------------------------------------

[[layer]]
name                      = "taxonomy/tree"
title                     = "Taxonomy"
views                     = ["geo"]
membership                = "enumerated"
value_set                 = "open"
hierarchy                 = { kind = "tiered", prune_children = true }
visibility                = "public"
artifact_visibility       = { default = "inherited" }
require_member_visibility = { count = 1 }

[[layer.levels]]
level = 0
title = "Family"
zoom  = [0, 5]

[[layer.levels]]
level = 1
title = "Genus"
zoom  = [4, 10]

[[layer.levels]]
level = 2
title = "Species"
zoom  = [9, 16]

# Recomputed per viewer from `membership ∩ M_auth` and nothing else, so they are contained by
# construction and take no visibility declaration. Without them a taxonomy layer cannot answer
# "zoom to this clade" for the clade the viewer can actually see.
[layer.content]
computed = ["centroid", "box"]

[layer.members]
source = "taxonomy"
