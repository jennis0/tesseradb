[workspace]
resolver = "2"
members = [
    "crates/tessera-types",
    "crates/tessera-roaring",
    "crates/tessera-cache",
    "crates/tessera-analyse",
    "crates/tessera-plugin",
    "crates/tessera-authz",
    "crates/tessera-filter",
    "crates/tessera-store",
    "crates/tessera-spatial",
    "crates/tessera-lifecycle",
    "crates/tessera-engine",
    "crates/tessera-wire",
    "crates/tessera-config",
    "crates/tessera-server",
    "crates/tessera-filter-write",
    "crates/tessera-build",
    "crates/tessera-corpus",
    "crates/tessera-cli",
    "crates/tessera-bench",
    "crates/tessera-python",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
croaring = "2"
rayon = "1"
proptest = "1"
# **Pinned exactly.** `tessera_store::columns` writes `columns.arrow` in place by learning the
# file's layout from arrow's own `FileWriter` run into a recording sink, which depends on that
# writer handing each buffer to the sink separately. A 59.x that encoded a batch contiguously
# before writing it would materialise the whole body — ~70 GB at rung 6 — inside the layout pass.
# The `Recorder`'s refusal above `MAX_FRAMING_WRITE` is what catches it; the pin is what stops a
# `cargo update` from reaching it in the first place.
arrow = { version = "=59.1.0", default-features = false, features = ["ipc"] }
tempfile = "3"
# Test-only, and dev-only everywhere it is used: compile-fail harness for the invariants that
# are upheld by the type system (I4). See crates/tessera-types/tests/compile_fail.rs.
trybuild = "1"
rand = "0.8"
memmap2 = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
# The record blob's block compression (records-and-search §3). The same libzstd the parquet
# feature above already links, taken directly for the whole-block frames the blob reads and
# writes.
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
arc-swap = "1"
parking_lot = "0.12"
# Facade only, no subscriber: a no-op wherever nothing attaches one. Promoted here on its
# second consumer (tessera-store's step-down warn, tessera-server's request logging) per the
# workspace convention that a dependency taken by two crates is versioned in one place.
tracing = "0.1"

# Debug info in dev and test builds is line tables only. The 161 integration-test binaries each
# statically link the engine; with full debug info they ran 300–600 MB apiece, every upstream
# edit gave each a fresh hash, and cargo never removes the old one — `target/debug/deps` reached
# 311 GB across 7,024 files on 2026-09-02. Line tables keep backtraces and panics resolvable to a
# file and line; only stepping through locals in a debugger wants more, and that can be asked for
# with `CARGO_PROFILE_DEV_DEBUG=full` on the one build that needs it. A nightly `cargo sweep
# --time 2` in the user crontab removes what accumulates regardless.
[profile.dev]
debug = "line-tables-only"
