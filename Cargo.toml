[workspace]
resolver = "2"
members = [
    "crates/tessera-types",
    "crates/tessera-plugin",
    "crates/tessera-authz",
    "crates/tessera-store",
    "crates/tessera-spatial",
    "crates/tessera-lifecycle",
    "crates/tessera-engine",
    "crates/tessera-wire",
    "crates/tessera-server",
    "crates/tessera-build",
    "crates/tessera-cli",
]

[workspace.dependencies]
croaring = "2"
proptest = "1"
arrow = { version = "59", default-features = false, features = ["ipc"] }
tempfile = "3"
rand = "0.8"
memmap2 = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
