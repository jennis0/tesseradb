# cargo-deny's configuration: which licences, sources and crates the Rust dependency graph may
# contain. `cargo deny check licenses bans sources` runs in the gate; the release workflow also runs
# `advisories`, which reads the RustSec database over the network.

[graph]
# The shipped artifacts are built with default features.
all-features = false

[licenses]
# Every licence a dependency of the shipped binary, the Python extension or a test may be used
# under. A crate offering a choice (`MIT OR LGPL-2.1-or-later`) passes when one of its options is
# here. Each of these permits redistribution in a binary with the notices in THIRD_PARTY_LICENSES.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are Apache-2.0 and are described by the repository's LICENSE.
ignore = true

[bans]
multiple-versions = "allow"
# Development-only path dependencies carry no version, which cargo publish allows and drops.
wildcards = "allow"
deny = [
  # TLS is rustls throughout, so the binary links no system OpenSSL and runs on any glibc or musl
  # host of its target.
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# A vulnerability anywhere in the graph fails the check. An unmaintained crate fails it only where a
# workspace crate depends on it directly, which is where it can be replaced.
unmaintained = "workspace"
