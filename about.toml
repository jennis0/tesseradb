# cargo-about's configuration for THIRD_PARTY_LICENSES, the notices of every crate compiled into the
# mosaica binary and the _mosaica extension module. Regenerate it with
# `python3 scripts/third-party-licenses.py` after a dependency changes; the release workflow refuses a
# stale copy. The accepted licences are the ones deny.toml allows.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
workarounds = ["ring", "rustls", "chrono", "clap"]
