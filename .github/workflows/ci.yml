# The per-PR gate of conformance design §6 — and only that tier.
#
# §6 specifies three: per-PR, nightly, and a release gate. The other two carry things this one
# deliberately does not — rotating seeds over the full mask catalogue, time-boxed fuzzing of the
# wire decoder and manifest parser, external oracles, criterion budgets, and the dependency-graph
# assertions that keep a `conformance` feature out of a release binary. They are marked in §6 as
# specified-but-unbuilt and are left that way rather than half-built, because a nightly that runs
# one seed batch is this gate with a worse schedule.
#
# What runs is exactly the gate CLAUDE.md defines, plus the conformance suite. Nothing here builds
# from the Phase 0 corpus: every fixture the suite uses is synthesised from a seed, which is what
# makes a hosted runner possible at all.
#
# `reference/tests` used to be excluded **wholesale** on that ground, and the ground held for one
# of its six modules and three cases of a second. Measured 2026-08-30 at `2bde89a6`: 62 of its 71
# tests ran green with no corpus at all, in 21 s — a count that moves whenever a test is added, so
# it is a measurement of the gap, not a figure to assert against. What the exclusion cost included
# the oracle's only known-answer test of the identity permutation — whose independence from
# `identity.rs` is the whole reason the shared vectors mean anything — while the Rust half of that
# same pair ran here, so only one side of a cross-implementation check was gated. The corpus-free
# part now runs in the `conformance` job, which already builds the venv it needs.
#
# The step runs the **directory** and names the exclusions, rather than listing the modules that
# are wanted, for the reason `test_oracle_layering.py` derives its module set from `oracle/`: a
# list of what to run is a list that a new file is silently absent from, and the file absent from
# it is the one nobody thought about. So `test_differential.py` is ignored as a whole file and
# `test_identity.py`'s three `fixture_bundle` cases are deselected as three node ids, and anything
# else added under `reference/tests` runs here the day it lands.
#
# Both directions of drift then arrive as a red job: a renamed case stops matching its `--deselect`
# and errors on the missing corpus, and a new corpus-dependent case is simply run and errors —
# where `-k "not fixture_bundle"` would have swallowed either silently. Nothing here is turned into
# a `skip`: a corpus test reported as a pass is worse than one that is visibly not run.
#
# What CI still does not see is the viewport differential against real term skew. Repointing it at a
# synthetic corpus would cost it exactly the realistic term distribution it exists for, so it stays
# out. I1 keeps CI coverage through the overlay-journal differential and its two defective engines.
# Recorded so the omission reads as a decision rather than an oversight.
#
# What the Rust job does not execute, on the same principle. `cargo test --workspace` skips every
# `#[ignore]`d test — 22 of the 2,283 distinct tests the workspace harnesses list — and each of
# those 22 either builds a real corpus, runs for minutes to hours, or measures rather than asserts.
# Nothing here runs them and no other tier does either: §6's nightly, which would, is specified and
# unbuilt. So a property held only by an ignored test is a property nothing gates on.
#
# Runner cost is the constraint that decides whether a gate stays enabled. Measured wall-clock on a
# developer machine, 2026-08-01, so that a runner which turns out much slower is recognisable as a
# difference rather than as normal: `cargo test --workspace` 94 s; `pytest conformance/tests` 24 s
# from deleted fixtures, including the 150,000-item catalogue build.
#
# Both are **measurements with a date, not a current budget**, and the distinction is load-bearing
# because four other sites cite the 94 s — `conformance.md` §6, `correctness-suite.md` §16 twice,
# and `tests/scale.rs`'s module doc — and two of those cite it as the budget an ignored test is
# excluded against. The workspace has grown since (2,283 distinct tests at 2026-08-30) and neither
# figure has been re-measured, so neither may be quoted as headroom. What the exclusion of the
# ignored set actually rests on is what those tests do — real corpora, minutes to hours — which is
# durable and independent of any figure. Re-measure before either number is used to decide anything.

name: gate

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a second push to the same PR makes the earlier run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # `ld terminated with signal 7 [Bus error]` while linking two `tessera-engine` test binaries,
      # with 32 GB of disk free, so the constraint is memory and not space. rustc links with `lld`,
      # which writes its output through an `mmap`; a page the kernel cannot back raises SIGBUS
      # rather than reporting a failed allocation. Cargo defaults to one job per core, so four of
      # the workspace's largest binaries link at once on a 16 GB runner, each pulling in arrow,
      # parquet, croaring and zstd statically. Two at a time halves the peak. The debug level stays
      # `line-tables-only` (Cargo.toml) so a CI backtrace still names a line; drop that next if
      # this is not enough.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      # Headroom, not the fix: the runner ships ~25 GB of toolchains this build never touches, and
      # 161 test binaries plus their incrementals fill what is left. Measured on this runner, the
      # step takes / from 14 GB free to 32 GB.
      - name: make room for the test binaries
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      # `stable`, matching rust-toolchain.toml's channel. Note this is a rolling channel, not a
      # pin: the `.stderr` fixtures under crates/tessera-types/tests/ui are compiler output, so a
      # rustc release can turn this job red on wording alone. See that test's own doc for why
      # regenerating them is a judgement call rather than maintenance.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--no-fail-fast` is load-bearing. Without it cargo stops at the first test
      # binary that fails and never runs the rest, so the summary reports the failures it reached
      # alongside a passing total that is quietly smaller than the run before it — which reads as
      # success at a glance. That has already been mistaken for a green gate here.
      - run: cargo test --workspace --no-fail-fast
      # Runs here rather than in `checks` so it reuses the build above: `--quick` asks the compiled
      # harnesses what they would run, and would otherwise compile the workspace a second time. It
      # counts what the gate executes against what exists, and refuses a bare `#[ignore]`.
      - run: bash scripts/check-test-reachability.sh --quick
      - run: cargo clippy --workspace --all-targets -- -D warnings

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The grep-based half of the architecture: forbidden dependency edges, the
      # no-tokio-in-engine-or-store rule, I4's cross-space conversions, and I10's EntityId in the
      # wire payload. Necessary and nowhere near sufficient — it runs here because locally it runs
      # from an opt-in pre-commit hook that is skipped in any worktree without a track marker,
      # which is not a gate.
      - run: bash scripts/check-layers.sh

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite spawns the real `tessera` binary as a subprocess and speaks the real API — it
      # never calls into the engine directly. So the release binary is a prerequisite, not an
      # optimisation, and building it as its own step keeps a compile failure legible as a compile
      # failure rather than as a suite error.
      - run: cargo build --release -p tessera-cli
      # The dependency list is **read from `reference/pyproject.toml`**, not restated here. That
      # file argues the point at its own site: an undeclared dependency is a suite that runs on the
      # machine it was written on, and it has already been bitten twice by one. A second copy of
      # the list in this file would drift the same way.
      #
      # The package itself is deliberately not installed. It has no `[build-system]`, and both
      # suites reach `oracle` by the `sys.path` insert their conftests make — which is how the
      # suite runs locally, so it is how it should run here. Installing it would mean CI exercising
      # a different import path from every developer.
      - name: install the oracle's dependencies
        run: |
          python3 -m venv reference/.venv
          reference/.venv/bin/pip install --upgrade pip
          reference/.venv/bin/pip install $(reference/.venv/bin/python -c "
          import tomllib
          d = tomllib.load(open('reference/pyproject.toml', 'rb'))
          print(' '.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))
          ")
      - run: reference/.venv/bin/ruff check --config reference/pyproject.toml reference conformance
      # Fixtures are built once and cached in /tmp by a stamped recipe; on a fresh runner every one
      # of them is built from scratch, which is most of this job's wall-clock.
      - run: reference/.venv/bin/pytest conformance/tests conformance/suite -v
      # The oracle's own tests — everything in `reference/tests` that does not build from the Phase
      # 0 corpus. Run from `reference/` because that is where `pyproject.toml`'s `testpaths` and the
      # node ids below are rooted; a `--deselect` given a repo-relative path matches nothing and is
      # not an error, which is precisely the silent exclusion this step exists to stop being.
      - name: the oracle's own tests, minus what needs the Phase 0 corpus
        working-directory: reference
        run: |
          .venv/bin/pytest -v tests \
            --ignore tests/test_differential.py \
            --deselect tests/test_identity.py::test_fixture_bundle_rows_are_stored_in_morton_then_tessera_id_order \
            --deselect tests/test_identity.py::test_fixture_bundle_identity_column_agrees_with_the_key \
            --deselect tests/test_identity.py::test_fixture_bundle_sidecar_round_trips_through_the_locator

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node >= 20, which both scripts below need: `check-clients.sh` refuses without npm on PATH,
      # and `clients/py/check.sh`'s wheel is built by a hatchling hook that shells out to npm.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `check-clients.sh` requires an installed tree rather than installing one itself, so that a
      # developer's stale `node_modules` fails loudly instead of being silently repaired.
      - run: npm --prefix clients/ts ci
      # The two halves of CLAUDE.md's gate that ran nowhere until now. The TypeScript client is in
      # the gate because one rename — `ead7e90` — shipped three defects into `clients/` that a
      # Rust-and-Python gate could not see, each found later by a separate investigation. The
      # Python half exercises the wheel's build hook for real, that hook being the only thing
      # between `pip install tesseradb[widget]` and a widget with no JavaScript in it.
      - run: bash scripts/check-clients.sh
      - run: bash clients/py/check.sh
