[package]
name = "tessera-filter"
version = "0.1.0"
edition = "2021"

[dependencies]
tessera-types = { path = "../tessera-types" }
# For the CSR postings format only — `PostingsReader`, `DeltaTier` and their ordinal-addressed
# format core. This crate reads attribute postings; it never reads an authorisation posting, and
# nothing here constructs a `TermId`. See lib.rs for why the dependency is on the format rather
# than the other way round.
tessera-authz = { path = "../tessera-authz" }
croaring.workspace = true
# The value column is an Arrow IPC file, as every other columnar artefact in the bundle is
# (contracts §2.1). Reading it here rather than through `tessera-store` is what keeps the layer
# rule intact: `check-layers.sh` denies filter → store, so this crate stays entity-space and never
# meets `RowId`.
arrow.workspace = true
# The value column is mapped rather than read: at 10⁹ it is 1 GB per byte of declared width per
# column, and a generation opens every declared column at once. See `values::read_values`.
memmap2 = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
