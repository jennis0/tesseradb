[package]
name = "mosaica-catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Principals, groups, credentials and OIDC providers for Mosaica. Internal crate of the mosaica binary, with no stable API."

[dependencies]
# The rule for a term a credential holds.
mosaica-access = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
subtle = "2.6"
sha2 = { workspace = true }
getrandom = "0.2"
serde_json = { workspace = true }
url = "2.5.8"
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
