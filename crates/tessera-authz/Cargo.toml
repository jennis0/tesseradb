[package]
name = "tessera-authz"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
# Per-stage bench accessors on `DeltaTier` — the record search and the view construction, which
# `posting_at` does in one call. OFF by default; `tessera-bench` is the only crate that turns it
# on (mirroring `tessera-engine/bench-timing`), and it adds no behaviour to either path.
bench-timing = []

[dependencies]
croaring = { workspace = true }
tessera-types = { path = "../tessera-types" }
# The single-flight cache the fragment tier is built on, shared with tessera-engine so the state
# machine and its rules exist once.
tessera-cache = { path = "../tessera-cache" }
rustc-hash = "1"
arrow = { workspace = true }
memmap2 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
croaring = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
