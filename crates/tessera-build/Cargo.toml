[package]
name = "tessera-build"
version = "0.1.0"
edition = "2021"

[dependencies]
rustc-hash = "1"
rayon = "1"
libc = "0.2"
tessera-types = { path = "../tessera-types" }
tessera-plugin = { path = "../tessera-plugin" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-store = { path = "../tessera-store" }
tessera-authz = { path = "../tessera-authz" }
arrow = { workspace = true }
parquet = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# Test-only: `tests/term_sweep_pairs.rs` drives `tessera_authz::term_sweep::sweep_term_postings`
# end to end, which takes the fold's tombstone set as a `croaring::Bitmap` (compaction §3). Not a
# [dependencies] entry — no non-test code in this crate names the type.
croaring = { workspace = true }
# Test-only: `tests/filter_postings.rs` reads the filter postings this build writes through the
# reader that will serve them, so the writer and the reader cannot drift on the record format.
# The build side names only `tessera_authz::write_delta_tier_at`, so this stays out of
# [dependencies] — a build-time dependency on the read crate would invert the layering.
tessera-filter = { path = "../tessera-filter" }
