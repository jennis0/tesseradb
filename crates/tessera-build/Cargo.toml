[package]
name = "tessera-build"
version = "0.1.0"
edition = "2021"

[dependencies]
rustc-hash = "1"
rayon = "1"
libc = "0.2"
# Entity-indexed build scratch lives in a mapped file rather than the heap — see `spill::MappedU32`.
memmap2 = { workspace = true }
tessera-types = { path = "../tessera-types" }
tessera-plugin = { path = "../tessera-plugin" }
tessera-spatial = { path = "../tessera-spatial" }
# The text family's analysers, resolved at schema parse so a name this build does not carry is
# refused where its author can read the message (decision 0070).
tessera-analyse = { path = "../tessera-analyse" }
tessera-store = { path = "../tessera-store" }
tessera-authz = { path = "../tessera-authz" }
# The build writes the filter artefact through the crate that reads it, exactly as it writes
# authorisation postings through `tessera-authz` — the format's owner owns both halves, so the
# writer and the reader cannot drift. An earlier revision kept this test-only on the grounds that a
# build-time dependency on a read crate inverts the layering; that stopped being true when the build
# began emitting the value column rather than only its accelerator.
tessera-filter = { path = "../tessera-filter" }
tessera-filter-write = { path = "../tessera-filter-write" }
# Non-test: the presence bitmap the value column is addressed by (filter-index §2.1).
croaring = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
chrono = { workspace = true }

[dev-dependencies]
# The read route, for the text index's end-to-end test only: a build crate that depended on the
# engine in anger would invert the layer graph, which `check-layers.sh` denies. A dev-dependency is
# the same shape the engine's own tests use to reach the build.
tessera-engine = { path = "../tessera-engine" }
croaring = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

