[package]
name = "mosaica-server"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
# Emit `x-mosaica-stage-ns` on `/v1/viewport`. Compiling this in is NECESSARY BUT NOT SUFFICIENT:
# emission also requires `[serve] stage_timing = true` at runtime, which defaults to false. Two
# gates because cargo unifies features across a `--workspace` build, so the compile-time gate
# alone cannot be trusted to stay off in a binary built alongside `mosaica-bench`.
bench-timing = ["mosaica-engine/bench-timing"]
# The correctness suite's faults build (decision 0071): the write executor's fault switchboard,
# its three publication-seam pause sites, and the bearer-gated /control/faults/* arming surface.
# OFF by default, and the default build is what every deployment gets — a binary built with this
# goes to ITS OWN target directory (see mosaica-cli's feature comment for the command), never
# target/release/mosaica, which the oracle harness owns. `scripts/check-layers.sh` rule 2 asserts
# no default-features release build reaches the switchboard, from the resolved feature graph.
fault-injection = ["mosaica-engine/fault-injection", "mosaica-lifecycle/fault-injection"]

[dependencies]
mosaica-types = { path = "../mosaica-types" }
mosaica-access = { path = "../mosaica-access" }
mosaica-config = { path = "../mosaica-config" }
mosaica-engine = { path = "../mosaica-engine" }
mosaica-wire = { path = "../mosaica-wire" }
mosaica-lifecycle = { path = "../mosaica-lifecycle" }
mosaica-catalogue = { path = "../mosaica-catalogue" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
# The streamed bodies implement `futures_core::Stream` by hand (stream.rs's
# `StreamBody`); axum's `Body::from_stream` consumes it. Already in the tree via axum — this
# only makes the trait nameable.
futures-core = "0.3"
# The request log wraps request and response bodies; already in the tree via axum.
http-body = "1"
bytes = "1"
serde = { workspace = true }
# `raw_value`: the request log embeds a request body as it was sent.
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
arrow = { workspace = true }
rustc-hash = "1"
# OIDC access tokens: the signature against the provider's JWKS, then issuer, audience and
# lifetime. Its ring backend is already in the tree through rustls.
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
# Fetching a provider's JWKS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Self dev-dependency, the same shape as mosaica-lifecycle's and mosaica-engine's: this crate's
# integration tests run against the faults build so the arming surface is exercised over real
# HTTP, and `cargo tree -e normal` does not see this edge — which is what keeps rule 2 green.
# `bench-timing` is named for the same reason as in `mosaica-engine`: so `-p` and `--workspace`
# select the same tests rather than agreeing only by accident of `mosaica-bench`'s default feature.
# Two of the byte-identity tests here force the parallel tile fan-out behind it. Compiling it in
# does not emit the header — that still needs `[serve] stage_timing = true`, which defaults false.
mosaica-server = { path = ".", features = ["fault-injection", "bench-timing"] }
tempfile = { workspace = true }
mosaica-build = { path = "../mosaica-build" }
mosaica-spatial = { path = "../mosaica-spatial" }
parquet = { workspace = true }
jsonschema = { version = "0.51", default-features = false }
serde_yaml_ng = "0.10"
# Signs the OIDC access tokens the auth tests present.
ring = "0.17"
