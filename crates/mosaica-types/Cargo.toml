[package]
name = "mosaica-types"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
serde = { workspace = true, optional = true }
# A layer declaration's labels are read by the one label rule.
mosaica-access = { path = "../mosaica-access" }
# `IdentityKey::generate`: the operating system's random source, for the key every new bundle gets.
getrandom = "0.2"

# `src/process.rs`' two allocator calls, and nothing else in this crate. Declared per-target rather
# than plainly so that off glibc *this* crate takes no edge at all and its module compiles to
# no-ops. It says nothing about the workspace: mosaica-build and mosaica-engine depend on libc
# unconditionally for `posix_fallocate`, `madvise`, `flock` and `statvfs`, so a musl or macOS build
# still links it.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# Self dev-dependency, the same shape as mosaica-engine's and mosaica-server's, and here for the
# same reason: `serde` gates the whole `layer` module and with it 22 of this crate's 39 tests, so
# without this edge `cargo test -p mosaica-types` runs 17 and `cargo test --workspace` runs all 39
# — the feature being unified on only by mosaica-lifecycle's normal edge. A developer running the
# crate's own tests on the module they are changing should see all of them, not a subset an
# unrelated member's dependency decided. `cargo tree -e normal` does not see a dev edge, so
# check-layers.sh's rule 2 is unaffected.
mosaica-types = { path = ".", features = ["serde"] }
# Test-only: parses reference/vectors/tessera_id.json against the known-answer vectors
# (Task 5). The crate itself remains dependency-free of serde_json.
serde_json = { workspace = true }
# Test-only: the I4 compile-fail rows (conformance §4.1). `cargo build` does not build
# dev-dependencies, so nothing a release binary carries can reach this.
trybuild = { workspace = true }

[features]
# Off by default: the crates that need it are the ones with an on-disk or on-the-wire form —
# mosaica-lifecycle (the WAL), mosaica-store (the manifest) and mosaica-server (`/v1/meta`), each of
# which depends on serde anyway. Every other crate keeps mosaica-types dependency-free of it.
#
# It also gates `layer`, which is a whole module rather than a set of derives: a layer declaration
# exists only to be written down, so a build without serde has no use for the type at all.
serde = ["dep:serde"]
