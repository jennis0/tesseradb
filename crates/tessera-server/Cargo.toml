[package]
name = "tessera-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Emit `x-tessera-stage-ns` on `/v1/viewport`. Compiling this in is NECESSARY BUT NOT SUFFICIENT:
# emission also requires `[serve] stage_timing = true` at runtime, which defaults to false. Two
# gates because cargo unifies features across a `--workspace` build, so the compile-time gate
# alone cannot be trusted to stay off in a binary built alongside `tessera-bench`.
bench-timing = ["tessera-engine/bench-timing"]

[dependencies]
tessera-types = { path = "../tessera-types" }
tessera-engine = { path = "../tessera-engine" }
tessera-wire = { path = "../tessera-wire" }
tessera-lifecycle = { path = "../tessera-lifecycle" }
tessera-plugin = { path = "../tessera-plugin" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
arrow = { workspace = true }
rustc-hash = "1"

[dev-dependencies]
tempfile = { workspace = true }
tessera-build = { path = "../tessera-build" }
tessera-spatial = { path = "../tessera-spatial" }
parquet = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
