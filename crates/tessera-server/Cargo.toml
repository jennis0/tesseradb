[package]
name = "tessera-server"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
# Emit `x-tessera-stage-ns` on `/v1/viewport`. Compiling this in is NECESSARY BUT NOT SUFFICIENT:
# emission also requires `[serve] stage_timing = true` at runtime, which defaults to false. Two
# gates because cargo unifies features across a `--workspace` build, so the compile-time gate
# alone cannot be trusted to stay off in a binary built alongside `tessera-bench`.
bench-timing = ["tessera-engine/bench-timing"]
# The correctness suite's faults build (decision 0071): the write executor's fault switchboard,
# its three publication-seam pause sites, and the bearer-gated /control/faults/* arming surface.
# OFF by default, and the default build is what every deployment gets — a binary built with this
# goes to ITS OWN target directory (see tessera-cli's feature comment for the command), never
# target/release/tessera, which the oracle harness owns. `scripts/check-layers.sh` rule 2 asserts
# no default-features release build reaches the switchboard, from the resolved feature graph.
fault-injection = ["tessera-engine/fault-injection", "tessera-lifecycle/fault-injection"]

[dependencies]
tessera-types = { path = "../tessera-types" }
tessera-config = { path = "../tessera-config" }
tessera-engine = { path = "../tessera-engine" }
tessera-wire = { path = "../tessera-wire" }
tessera-lifecycle = { path = "../tessera-lifecycle" }
tessera-plugin = { path = "../tessera-plugin" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["full"] }
# The streamed bodies implement `futures_core::Stream` by hand (stream.rs's
# `StreamBody`); axum's `Body::from_stream` consumes it. Already in the tree via axum — this
# only makes the trait nameable.
futures-core = "0.3"
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
arrow = { workspace = true }
rustc-hash = "1"

[dev-dependencies]
# Self dev-dependency, the same shape as tessera-lifecycle's and tessera-engine's: this crate's
# integration tests run against the faults build so the arming surface is exercised over real
# HTTP, and `cargo tree -e normal` does not see this edge — which is what keeps rule 2 green.
# `bench-timing` is named for the same reason as in `tessera-engine`: so `-p` and `--workspace`
# select the same tests rather than agreeing only by accident of `tessera-bench`'s default feature.
# Two of the byte-identity tests here force the parallel tile fan-out behind it. Compiling it in
# does not emit the header — that still needs `[serve] stage_timing = true`, which defaults false.
tessera-server = { path = ".", features = ["fault-injection", "bench-timing"] }
tempfile = { workspace = true }
tessera-build = { path = "../tessera-build" }
tessera-spatial = { path = "../tessera-spatial" }
parquet = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = { version = "0.51", default-features = false }
serde_yaml_ng = "0.10"
