[package]
name = "tessera-store"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tessera-types = { path = "../tessera-types", features = ["serde"] }
# The Roaring container assembler, shared with the filter index. `Permutation::project`
# stamps looked-up rows into a bit array, which *is* the container payload.
tessera-roaring = { path = "../tessera-roaring" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-analyse = { path = "../tessera-analyse" }
arrow = { workspace = true }
# `terms/pairs.parquet` is the one bundle artefact contracts §2 defines in Parquet rather than
# Arrow IPC; see `src/pairs.rs` for why its writer lives here with the other six.
parquet = { workspace = true }
croaring = { workspace = true }
memmap2 = { workspace = true }
# Category codes are drawn from OS entropy at every mint (`src/vocabulary.rs`): a code that is a
# position discloses vocabulary cardinality to anyone who can see one.
rand = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The reader's only log line: the honourable-state step-down (contracts §2.3). A facade crate
# with no subscriber attached is a no-op, so this adds a diagnostic, not a runtime.
tracing = { workspace = true }

[dev-dependencies]
# Fixture manifests carry the *real* `data_plugin_hash` of the plugin they stand for, so that a
# fixture copied into an engine test opens rather than being refused by the open-time agreement
# check. A pinned hex literal would need editing on every identity bump, which is how the previous
# placeholders survived. `tessera-plugin` is a leaf crate with no workspace edges.
tessera-plugin = { path = "../tessera-plugin" }
tempfile = { workspace = true }
rand = { workspace = true }
proptest = { workspace = true }
