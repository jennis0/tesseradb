[package]
name = "tessera-store"
version = "0.1.0"
edition = "2021"

[dependencies]
tessera-types = { path = "../tessera-types" }
tessera-spatial = { path = "../tessera-spatial" }
arrow = { workspace = true }
# `terms/pairs.parquet` is the one bundle artefact contracts §2 defines in Parquet rather than
# Arrow IPC; see `src/pairs.rs` for why its writer lives here with the other six.
parquet = { workspace = true }
croaring = { workspace = true }
memmap2 = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The reader's only log line: the honourable-state step-down (contracts §2.3). A facade crate
# with no subscriber attached is a no-op, so this adds a diagnostic, not a runtime.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
proptest = { workspace = true }
