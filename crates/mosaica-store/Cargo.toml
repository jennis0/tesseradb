[package]
name = "mosaica-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The on-disk bundle formats of Mosaica. Internal crate of the mosaica binary, with no stable API."

[dependencies]
mosaica-types = { workspace = true, features = ["serde"] }
mosaica-access = { workspace = true }
# The Roaring container assembler, shared with the filter index. `Permutation::project`
# stamps looked-up rows into a bit array, which *is* the container payload.
mosaica-roaring = { workspace = true }
mosaica-spatial = { workspace = true }
mosaica-analyse = { workspace = true }
# The postings, value-column, dictionary and record-blob writers an empty shard's base is written
# with (`src/empty_shard.rs`), which the build and a running service both call, and the postings
# reader the containment and term-image derivations walk (`derived::walk_posting`).
mosaica-authz = { workspace = true }
mosaica-filter = { workspace = true }
mosaica-filter-write = { workspace = true }
arrow = { workspace = true }
# `terms/pairs.parquet` is the one bundle artefact contracts §2 defines in Parquet rather than
# Arrow IPC; see `src/pairs.rs` for why its writer lives here with the other six.
parquet = { workspace = true }
croaring = { workspace = true }
# A manifest's `deny` and `tombstones` are portable Roaring bytes, and JSON carries them as base64.
base64 = "0.22"
memmap2 = { workspace = true }
# The system's page size, for the page-exact read advice on the band file.
libc = "0.2"
# Category codes are drawn from OS entropy at every mint (`src/vocabulary.rs`): a code that is a
# position discloses vocabulary cardinality to anyone who can see one.
rand = { workspace = true }
rayon = { workspace = true }
# The key index's page and header checksums, and the hash its keyword keys are.
crc32fast = { workspace = true }
twox-hash = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The reader's only log line: the honourable-state step-down (contracts §2.3). A facade crate
# with no subscriber attached is a no-op, so this adds a diagnostic, not a runtime.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }
proptest = { workspace = true }
