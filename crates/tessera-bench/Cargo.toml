[package]
name = "tessera-bench"
version = "0.1.0"
edition = "2021"
publish = false

# The measurement harness. NOTHING may depend on this crate — `scripts/check-layers.sh` asserts
# that. It sits above every other crate precisely so it can reach across layers (authz + store +
# spatial + engine + build together) without any shipped crate being allowed to.
#
# `bench-timing` is enabled by default HERE and only here. That is safe for this binary and
# unsafe for the workspace: cargo's resolver-2 unifies features across a `--workspace` build, so
# `tessera-cli` compiled in the same invocation also gets it. The second gate — `[serve]
# stage_timing`, default false — is what makes that harmless, and `scripts/check-no-stage-header.sh`
# asserts the shipped binary stays quiet.

[features]
default = ["bench-timing"]
bench-timing = ["tessera-engine/bench-timing", "tessera-server/bench-timing"]

[dependencies]
tessera-types = { path = "../tessera-types" }
tessera-plugin = { path = "../tessera-plugin" }
tessera-authz = { path = "../tessera-authz" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-store = { path = "../tessera-store" }
tessera-lifecycle = { path = "../tessera-lifecycle" }
tessera-engine = { path = "../tessera-engine" }
tessera-build = { path = "../tessera-build" }
tessera-server = { path = "../tessera-server" }

croaring = { workspace = true }
# Calibration task: the load arm decodes just enough of a 200 response's tile-stream Arrow IPC
# batch (the leading `u32 LE` length-prefixed stream — `tessera-wire::payload`'s framing doc) to
# sum the `served` column, for the points-served-per-second/per-user/per-request metrics. Checked
# against `scripts/check-layers.sh`'s deny list first: nothing there forbids `tessera-bench` (the
# harness, already above every other crate) from depending on `arrow` directly, and every crate
# this one already depends on (`tessera-engine`, `tessera-store`, `tessera-server`) pulls `arrow`
# in transitively anyway — this makes an existing transitive dependency a direct one, not a new
# edge into the trusted computing base. `tessera-wire` itself was the other option (same crate the
# server's own encoder lives in) but offers no matching *decoder*, so it would not have saved the
# `arrow` dependency, only added an unused one.
arrow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rustc-hash = "1"
toml = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
