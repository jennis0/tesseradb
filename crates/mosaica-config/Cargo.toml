[package]
name = "mosaica-config"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The mosaica.toml deployment file for Mosaica. Internal crate of the mosaica binary, with no stable API."

[dependencies]
# `CompactionSchedule` and the engine's own defaults for the keys it owns.
mosaica-engine = { workspace = true }
mosaica-types = { workspace = true }
serde = { workspace = true }
toml = "0.8"
# `Semaphore::MAX_PERMITS`, the bound an admission gate is refused past.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
# docs/reference/mosaica-toml.md is rendered from this crate's source (`src/reference.rs`).
mosaica-docgen = { path = "../mosaica-docgen" }
