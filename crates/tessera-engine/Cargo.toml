[package]
name = "tessera-engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Per-stage viewport timing (see `src/timing.rs`). OFF by default and must stay off in anything
# shipped: `tessera-server` additionally gates header emission on a config flag, and CI asserts a
# release `tessera-cli` emits no `x-tessera-stage-ns`. Enabling it here does NOT enable it there —
# but cargo's feature unification will, on a `--workspace` build, so both gates matter.
bench-timing = []
# Deliberate WAL/executor fault injection — see `tessera-lifecycle/src/faults.rs`. Enabled via the
# self dev-dependency below (tests) and via tessera-server/tessera-cli's declared, default-off
# feature (the correctness suite's faults build — decision 0071), so no default-features build
# carries it. It DOES still unify across a `cargo test --workspace` build, exactly as
# `bench-timing` does — measured, not assumed — so `scripts/check-layers.sh` asserts the property
# that actually matters: no default-features release build reaches it.
fault-injection = ["tessera-lifecycle/fault-injection"]

[dependencies]
tessera-types = { path = "../tessera-types" }
tessera-authz = { path = "../tessera-authz" }
tessera-store = { path = "../tessera-store" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-lifecycle = { path = "../tessera-lifecycle" }
# The filter artefact's reader. Entity-space only — it never sees a `RowId`, which is what
# `check-layers.sh` pins by denying it `tessera-store` and `tessera-spatial`.
tessera-filter = { path = "../tessera-filter" }
# **The analyser a text column was indexed with**, resolved from the manifest's recorded identity so
# a query is segmented by the same pipeline as the index (decision 0070). Analysing at the wire
# instead would put that choice in a second place, free to drift from the artefact.
tessera-analyse = { path = "../tessera-analyse" }
tessera-filter-write = { path = "../tessera-filter-write" }
tessera-plugin = { path = "../tessera-plugin" }
croaring = { workspace = true }
arc-swap = { workspace = true }
# D-D: the engine's shared compute pool for the intra-request tile-loop sweep. No `tokio`
# anywhere near this crate (lifecycle §7's sync-engine rule; see `scripts/check-layers.sh`'s
# `deny tessera-engine tokio`) — rayon's work-stealing pool is a plain-thread mechanism.
rayon = { workspace = true }
rustc-hash = "1"
arrow = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# `statvfs` for compaction §8's free-space pre-flight. No std API exposes it; `tessera-build`
# reaches for the same call for the same reason.
libc = "0.2"
rand = { workspace = true }
# `overlay_soft_limit` alarms. The counter is the operator's durable signal, but a
# counter nobody is told about is not an alarm, and the executor thread is the one place the
# overlay grows at runtime — so the log line has to be emitted from this crate. `tessera-store`
# already carries the same workspace-pinned dependency for the same reason.
tracing = { workspace = true }

[dev-dependencies]
# Self dev-dependency: the only way this crate's integration tests can enable a feature of the
# library they link against. Not a cycle — cargo permits it for dev-dependencies, and `cargo tree
# -e normal` does not see the edge, which is precisely what `scripts/check-layers.sh`'s rule 2
# relies on: it asks cargo for the resolved feature set on normal edges and fails on any
# `fault-injection` it finds there. (An earlier version of this note said the rule "reads
# `cargo tree`" while the rule was in fact a grep over manifest text that exempted this whole file.
# It is a `cargo tree` now, and demonstrated red by enabling the feature on the edge below.)
tessera-engine = { path = ".", features = ["fault-injection"] }
tempfile = { workspace = true }
tessera-build = { path = "../tessera-build" }
# **The corpus census, and this edge may only ever be a dev one.** The generator is a second
# statement of the corpus and stays one only while it cannot read an artefact
# (`correctness-suite.md` §13) — `check-layers.sh` asserts what *it* may depend on, and a normal
# edge from here would not trip that rule while still putting the fixture and the system in one
# dependency graph. It is a test-only edge, exactly as `tessera-build` above is.
tessera-corpus = { path = "../tessera-corpus" }
parquet = { workspace = true }
criterion = "0.5"
delaunator = "1.1.0"

[[bench]]
name = "viewport"
harness = false

# The two-axis sweep drives `Engine::set_serial_fallback_max_rows_for_test`, which does not exist
# at all without `bench-timing` (session.rs's `#[cfg]`), so this example cannot compile without the
# feature — declared here rather than left to fail a plain `cargo build --workspace`.
# `calibration_sweep`/`min_len_sweep` need no such entry: they read `StageTimings` fields, which
# are present (zeroed) in every build.
[[example]]
name = "tile_axis_sweep"
required-features = ["bench-timing"]
