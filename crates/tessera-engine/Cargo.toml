[package]
name = "tessera-engine"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Per-stage viewport timing (see `src/timing.rs`). OFF by default and must stay off in anything
# shipped: `tessera-server` additionally gates header emission on a config flag, and CI asserts a
# release `tessera-cli` emits no `x-tessera-stage-ns`. Enabling it here does NOT enable it there —
# but cargo's feature unification will, on a `--workspace` build, so both gates matter.
bench-timing = []
# Deliberate WAL/executor fault injection — see `tessera-lifecycle/src/faults.rs`. Enabled ONLY via
# the self dev-dependency below, so nothing `cargo build` produces can carry it. It DOES still
# unify across a `cargo test --workspace` build, exactly as `bench-timing` does — measured, not
# assumed — so `scripts/check-layers.sh` asserts the property that actually matters: no normal
# dependency enables it.
fault-injection = ["tessera-lifecycle/fault-injection"]

[dependencies]
tessera-types = { path = "../tessera-types" }
tessera-authz = { path = "../tessera-authz" }
tessera-store = { path = "../tessera-store" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-lifecycle = { path = "../tessera-lifecycle" }
tessera-plugin = { path = "../tessera-plugin" }
croaring = { workspace = true }
arc-swap = { workspace = true }
# D-D: the engine's shared compute pool for the intra-request tile-loop sweep. No `tokio`
# anywhere near this crate (lifecycle §7's sync-engine rule; see `scripts/check-layers.sh`'s
# `deny tessera-engine tokio`) — rayon's work-stealing pool is a plain-thread mechanism.
rayon = { workspace = true }
rustc-hash = "1"
arrow = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Self dev-dependency: the only way this crate's integration tests can enable a feature of the
# library they link against. Not a cycle — cargo permits it for dev-dependencies, and
# `cargo tree -e normal` (what `scripts/check-layers.sh` reads) does not see the edge.
tessera-engine = { path = ".", features = ["fault-injection"] }
tempfile = { workspace = true }
tessera-build = { path = "../tessera-build" }
parquet = { workspace = true }
criterion = "0.5"

[[bench]]
name = "viewport"
harness = false
