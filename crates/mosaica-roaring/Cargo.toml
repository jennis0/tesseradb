[package]
name = "mosaica-roaring"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
croaring.workspace = true
# `count_ranges` calls `roaring_bitmap_rank_many`, which croaring does not wrap. The version is the
# one croaring depends on, so both name the same `roaring_bitmap_t`.
croaring-sys = "5.2.2"

[dev-dependencies]
rand = { workspace = true }
