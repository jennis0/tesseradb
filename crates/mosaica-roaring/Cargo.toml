[package]
name = "mosaica-roaring"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Builds Roaring bitmaps from finished containers for Mosaica. Internal crate of the mosaica binary, with no stable API."

[dependencies]
croaring.workspace = true
# `count_ranges` calls `roaring_bitmap_rank_many`, and `OwnedView` `roaring_bitmap_frozen_view`,
# which croaring does not wrap. The version is the one croaring depends on, so both name the same
# `roaring_bitmap_t`: a croaring upgrade moves this version in step, or the cast in counts.rs reads
# one crate's struct as the other's.
croaring-sys = "5.2.2"

[dev-dependencies]
rand = { workspace = true }
