[package]
name = "tessera-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-build = { path = "../tessera-build" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-server = { path = "../tessera-server" }
clap = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = "0.3"

[features]
# Pass-through only (Task 2, tail discrimination): the actual gate lives on
# `tessera-engine`. Never enable in a serving build. Enable via
# `cargo build --release --features tessera-cli/skip-id-index` (or, per the
# discrimination script, `--features tessera-engine/skip-id-index` — either
# reaches the same feature since this workspace's binary crate re-exports it).
skip-id-index = ["tessera-server/skip-id-index"]
