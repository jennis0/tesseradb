[package]
name = "tessera-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-build = { path = "../tessera-build" }
tessera-spatial = { path = "../tessera-spatial" }
tessera-server = { path = "../tessera-server" }
clap = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = "0.3"
