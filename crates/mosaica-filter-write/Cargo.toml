[package]
name = "mosaica-filter-write"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
mosaica-filter = { path = "../mosaica-filter" }
mosaica-roaring = { path = "../mosaica-roaring" }
mosaica-authz = { path = "../mosaica-authz" }
mosaica-types = { path = "../mosaica-types" }
croaring = { workspace = true }
# The record blob's writer half (records-and-search §3): the block directory is an Arrow batch
# and the blocks are zstd frames. The read side lives in `mosaica-filter`; this crate is separate
# for the codegen reason the module doc gives, not because the formats differ.
arrow = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
