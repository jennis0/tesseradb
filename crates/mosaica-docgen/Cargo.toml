[package]
name = "mosaica-docgen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Reference pages rendered from the Mosaica sources."
publish = false

# Test support only: a crate's tests use it to render a reference page from that crate's source.
# Nothing in the `mosaica` binary depends on it.
[dependencies]
syn = { version = "2", features = ["full"] }
