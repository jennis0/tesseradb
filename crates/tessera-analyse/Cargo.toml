[package]
name = "tessera-analyse"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to the minor. `UNICODE_VERSION` in src/lib.rs records `icu4x-2.2` in every bundle's
# manifest and readers compare that string, so a caret range would let `cargo update` change the
# segmenter's dictionary data, and with it the token stream, under an unchanged identity. Moving
# these four moves that constant.
icu_normalizer = "=2.2"
icu_casemap = "=2.2"
icu_properties = "=2.2"
icu_segmenter = "=2.2"

[dev-dependencies]
serde_json = "1"
sha2 = { workspace = true }
