# Campaign handover, third wave (controller, 2026-09-05): issue #141, the keyword coalesce seam.
# Brief in .superpowers/sdd/2026-09-05-campaign-handover/brief-keyword-coalesce.md. One track,
# branched from the seam commit on main. A file outside its list is stop-and-report, never an edit
# to this file.

[frozen]
paths = [
  "CLAUDE.md",
  "docs/agents/*",
  "docs/decisions/*",
  "docs/design/*",
  "scripts/check-*",
  "scripts/fmt-file.sh",
  "scripts/install-hooks.sh",
  ".claude/track-allowlist.toml",
]

[shared]
paths = [
  "Cargo.lock",
]

# Issue #141: a keyword column's flush extents coalesce between folds, dictionary and all.
[track.keyword-coalesce]
paths = [
  "crates/tessera-filter-write/*",
  "crates/tessera-filter/*",
  "crates/tessera-engine/src/coalesce.rs",
  "crates/tessera-engine/src/compose.rs",
  "crates/tessera-engine/src/filter.rs",
  "crates/tessera-engine/src/write.rs",
  "crates/tessera-engine/src/lib.rs",
  "crates/tessera-engine/tests/*",
  "crates/tessera-store/src/manifest.rs",
  "crates/tessera-server/tests/*",
  "conformance/suite/test_endurance.py",
  "conformance/tests/*",
]

# The Python SDK campaign (controller, 2026-09-16): docs/design/python-sdk.md §12. Two tracks off
# e8da6c1a. `sdk-serve` is the server's port-0 announce line (§11.2 A) and later the payload
# emitter (§11.2 C); `sdk-py` is the package. Design documents are frozen: a sentence one of these
# tracks needs in system-architecture §7 or configuration.md is reported, and the controller adds it.
[track.sdk-serve]
paths = [
  "crates/tessera-server/src/*",
  "crates/tessera-server/tests/*",
  "crates/tessera-cli/src/*",
  "crates/tessera-build/src/config.rs",
]

[track.sdk-py]
paths = [
  "clients/py/*",
]
