# Artifact scale campaign file ownership — the allowlist behind `scripts/check-track-allowlist.sh`.
#
# Rewritten 2026-08-21 for the artifact scale campaign (controller), replacing the records-and-
# search epic map whose campaign closed. Tracks branch from `artifacts/scale` (5948b83) and merge
# back into it; the campaign's plan is docs/evidence/memos/2026-08-21-artifact-scale-plan.md.
#
# The rule this file gives teeth to: ownership is an allowlist, not an intention. A track that
# needs a file outside its list **stops and reports** — the controller reassigns or sequences.
# Editing this file to make a check pass is the failure mode it exists to prevent.
#
# Path syntax: shell glob, matched with bash `[[ path == pattern ]]`, so `*` spans `/`. Paths
# are repo-relative, exactly as `git diff --name-only` prints them.
#
# Wave 1 tracks: interleave (the write-path interleaving battery — one NEW test file, the
# deltest precedent: a new file cannot conflict with anything), cadence (the two cache-cadence
# defects, scale memo §8.1/§8.2), generator (the seeded generator's artifact arm reaches disk).

# FROZEN (controller, 2026-08-21). The authz, wire and plugin crates are outside this campaign;
# decisions and the normative designs change only through the owner; scripts are the checks
# themselves. `manifest.rs` stays frozen this wave — the route-recording work that will need it
# is not yet dispatched, and unfreezing happens with that dispatch, recorded here.
[frozen]
paths = [
  "crates/tessera-store/src/manifest.rs",
  "crates/tessera-authz/*",
  "crates/tessera-wire/*",
  "crates/tessera-plugin/*",
  "docs/decisions/*",
  "docs/design/architecture.md",
  "docs/design/write-path.md",
  "scripts/*",
]

# Files more than one track legitimately touches; expected to conflict textually at merge and
# reviewed at integration. `tessera-types`: controller-approved edits in practice — say so in
# the report.
[shared]
paths = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/tessera-types/*",
]

# Wave 1 — the write-path interleaving battery. A NEW file only, deliberately (the deltest
# precedent): the cadence track owns the engine sources and is running, and a new file cannot
# conflict with its edits.
[track.interleave]
paths = [
  "crates/tessera-engine/tests/artifact_interleavings.rs",
]

# Wave 1 — the cache-cadence defects (scale memo §8.1: the global artifact store version; §8.2:
# the lineage rebuilt per request). Owns the serving/caching seam and the artifact test files
# that pin it. Does NOT own the write path's commit-window logic — write.rs is here for the
# fold's warm/invalidation sites only; the interleaving battery's territory is behavioural, not
# textual, so the boundary is reviewed at integration.
[track.cadence]
paths = [
  "crates/tessera-engine/src/artifacts.rs",
  "crates/tessera-engine/src/session.rs",
  "crates/tessera-engine/src/write.rs",
  "crates/tessera-engine/src/viewport.rs",
  "crates/tessera-engine/src/cut.rs",
  "crates/tessera-lifecycle/src/*",
  "crates/tessera-engine/tests/artifact_serving.rs",
  "crates/tessera-engine/tests/artifact_fold.rs",
  "crates/tessera-engine/tests/artifact_growth.rs",
  "crates/tessera-engine/tests/artifact_hierarchy.rs",
  "crates/tessera-engine/tests/artifact_cache_cadence.rs",
]

# Wave 1 — the seeded generator's artifact arm reaches disk: the partition arm, attribute-column
# and members-file emission, spatial boundary layers, the census verb. Owns the corpus crate and
# the CLI's corpus verbs; a probe campaign it runs is the record of a measurement, so it owns
# probes/* for the same reason [track.dict] did in the last campaign.
[track.generator]
paths = [
  "crates/tessera-corpus/*",
  "crates/tessera-cli/src/main.rs",
  "crates/tessera-cli/tests/*",
  "probes/*",
]
