# Client-components campaign file ownership — the allowlist behind `scripts/check-track-allowlist.sh`.
#
# Rewritten 2026-08-25 for the client-components campaign (controller), replacing the artifact
# scale campaign's map, whose tracks have all merged. Tracks branch from `main` at 26ffaee (the
# decision files 0095–0101) and merge back into it; the plan is docs/client-handover.md §2 and the
# status record is docs/client-delivery.md.
#
# The rule this file gives teeth to: ownership is an allowlist, not an intention. A track that
# needs a file outside its list **stops and reports** — the controller reassigns or sequences.
# Editing this file to make a check pass is the failure mode it exists to prevent.
#
# Path syntax: shell glob, matched with bash `[[ path == pattern ]]`, so `*` spans `/`. Paths
# are repo-relative, exactly as `git diff --name-only` prints them.
#
# Wave 1 tracks (merged 2026-08-25): step01, docs6, s3. Wave 2: step2 (merged). Wave 3: step3 (merged). Wave 4: step4 (examples, react) and step5 (the widget), in parallel on disjoint files.

# FROZEN (controller, 2026-08-25). Decisions and the two normative designs change only through
# the owner; scripts are the checks themselves; authz and plugin crates are outside this campaign.
# `crates/tessera-wire/*` came OFF the previous campaign's freeze for this one: the D12 column is
# a points-frame schema change and `payload.rs` is the only place that schema is built — a freeze
# that made the ruled column unbuildable would be the stale freeze the manifest.rs precedent
# (2026-08-22) says is worse than none. It is owned by [track.s3] alone.
[frozen]
paths = [
  "crates/tessera-authz/*",
  "crates/tessera-plugin/*",
  "docs/decisions/*",
  "docs/design/architecture.md",
  "docs/design/write-path.md",
  "scripts/*",
]

# Files more than one track legitimately touches; expected to conflict textually at merge and
# reviewed at integration. `clients/ts/package.json`: step01 renames workspaces, docs6 adds the
# wire-example workspace. `docs/design/client-components.md` is the controller's, edited at
# integration only — a track that finds the design wrong reports it.
[shared]
paths = [
  "Cargo.lock",
  "clients/ts/package.json",
  "clients/ts/package-lock.json",
  "docs/client-delivery.md",
]

# Wave 1 — steps 0 and 1: the presented frame into the client, then the store; the @tesseradb
# rename. Everything under clients/ts except the wire-example workspace docs6 creates.
[track.step01]
paths = [
  "clients/ts/core/*",
  "clients/ts/viewer/*",
  "clients/ts/spike/*",
  "clients/ts/scripts/*",
  "clients/ts/README.md",
  "clients/ts/tsconfig.base.json",
  "run_demo.sh",
  "docs/design/client-architecture.md",
]

# Wave 1 — step 6, C3's documents: contracts §3.2 amended (documenting the wire as it is — no
# behaviour changes), the OpenAPI description and the test that keeps it true, the worked decodes
# sharing no code with ours, the obligations list.
[track.docs6]
paths = [
  "docs/design/contracts.md",
  "docs/design/client-obligations.md",
  "docs/openapi/*",
  "docs/design/README.md",
  "clients/ts/wire-example/*",
  "crates/tessera-server/tests/openapi.rs",
  "crates/tessera-server/Cargo.toml",
  "reference/*",
]

# Wave 1 — S3, the per-point membership column (D12): the wire's points frame gains per named
# layer one nullable u64; the engine resolves deepest-served per point; the server plumbs it. Owns
# the memo that carries the proposed leak-register row (C30) for the owner.
[track.s3]
paths = [
  "crates/tessera-wire/*",
  "crates/tessera-engine/src/*",
  "crates/tessera-engine/tests/*",
  "crates/tessera-server/src/*",
  "crates/tessera-server/tests/viewport_membership.rs",
  "crates/tessera-server/tests/http.rs",
  "crates/tessera-types/src/*",
  "docs/evidence/memos/2026-08-25-d12-membership-column.md",
]

# Wave 2 — step 2 (controller, 2026-08-25): `@tesseradb/deck` and `@tesseradb/components`, the
# viewer as the explorer plus instruments, box selection in the store (region counting is store
# work, so core is on the list), the harness beside the gate. Branches from main at the step 0–1
# merge (53eb4a7).
[track.step2]
paths = [
  "clients/ts/core/*",
  "clients/ts/deck/*",
  "clients/ts/components/*",
  "clients/ts/harness/*",
  "clients/ts/viewer/*",
  "clients/ts/scripts/*",
  "clients/ts/README.md",
  "clients/ts/tsconfig.base.json",
  "run_demo.sh",
]

# Wave 3 — step 3 (controller, 2026-08-25): artifacts and encoding — the membership column
# consumed, the lookup texture, the four artifact elements, lasso, the sidecar retired. Same files
# as step 2; branches from main at the step-2 merge.
[track.step3]
paths = [
  "clients/ts/core/*",
  "clients/ts/deck/*",
  "clients/ts/components/*",
  "clients/ts/harness/*",
  "clients/ts/viewer/*",
  "clients/ts/scripts/*",
  "clients/ts/README.md",
  "clients/ts/tsconfig.base.json",
  "run_demo.sh",
]

# Wave 4 — steps 4 and 5 in parallel (controller, 2026-08-25). Disjoint by construction: step 4 is
# the examples, `@tesseradb/react` and the harness's C1-page assertions; step 5 is the Python
# package, the notebook example and the components' bundle entry. Both branch from main at the
# step-3 merge. `clients/ts/package.json` is shared (both add workspaces).
[track.step4]
paths = [
  "clients/ts/react/*",
  "clients/ts/examples/*",
  "clients/ts/harness/*",
  "clients/ts/README.md",
]

[track.step5]
paths = [
  "clients/py/*",
  "clients/ts/components/*",
  "notebooks/*",
  "CLAUDE.md",
]
