# Campaign handover, third wave (controller, 2026-09-05): issue #141, the keyword coalesce seam.
# Brief in .superpowers/sdd/2026-09-05-campaign-handover/brief-keyword-coalesce.md. One track,
# branched from the seam commit on main. A file outside its list is stop-and-report, never an edit
# to this file.

[frozen]
paths = [
  "CLAUDE.md",
  "docs/agents/*",
  "docs/decisions/*",
  "docs/design/*",
  "scripts/check-*",
  "scripts/fmt-file.sh",
  "scripts/install-hooks.sh",
  ".claude/track-allowlist.toml",
]

[shared]
paths = [
  "Cargo.lock",
]

# Issue #141: a keyword column's flush extents coalesce between folds, dictionary and all.
[track.keyword-coalesce]
paths = [
  "crates/mosaica-filter-write/*",
  "crates/mosaica-filter/*",
  "crates/mosaica-engine/src/coalesce.rs",
  "crates/mosaica-engine/src/compose.rs",
  "crates/mosaica-engine/src/filter.rs",
  "crates/mosaica-engine/src/write/*",
  "crates/mosaica-engine/src/lib.rs",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-store/src/manifest.rs",
  "crates/mosaica-server/tests/*",
  "conformance/suite/test_endurance.py",
  "conformance/tests/*",
]

# The Python SDK campaign (controller, 2026-09-16): docs/design/python-sdk.md §12. Two tracks off
# e8da6c1a. `sdk-serve` is the server's port-0 announce line (§11.2 A) and later the payload
# emitter (§11.2 C); `sdk-py` is the package. Design documents are frozen: a sentence one of these
# tracks needs in system-architecture §7 or configuration.md is reported, and the controller adds it.
[track.sdk-serve]
paths = [
  "crates/mosaica-server/src/*",
  "crates/mosaica-server/tests/*",
  "crates/mosaica-engine/src/write/*",
  "crates/mosaica-engine/src/session.rs",
  "crates/mosaica-engine/tests/*",
  "conformance/tests/test_restart_replay.py",
]

# The build's supplied id column and the check note (python-sdk §11.2 A and §11.1).
[track.sdk-build]
paths = [
  "crates/mosaica-build/src/*",
  "crates/mosaica-build/tests/*",
  "crates/mosaica-cli/src/*",
  "crates/mosaica-cli/tests/*",
  "crates/mosaica-types/src/*",
]

[track.sdk-py]
paths = [
  "clients/py/*",
]

# The label-membership rule (python-sdk §11.2 H, owner ruling 2026-09-18): an attached artifact with no
# members of its own is served over its target's membership. Types, build, engine and server.
[track.sdk-labels]
paths = [
  "crates/mosaica-lifecycle/src/membership.rs",
  "crates/mosaica-types/src/*",
  "crates/mosaica-build/src/*",
  "crates/mosaica-build/tests/*",
  "crates/mosaica-engine/src/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-server/src/*",
  "crates/mosaica-server/tests/*",
  "crates/mosaica-cli/tests/*",
]

# The values route reads a layer column (python-sdk §11.2 F, owner ruling 2026-09-18). Engine and server.
[track.sdk-values]
paths = [
  "crates/mosaica-engine/src/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-server/src/*",
  "crates/mosaica-server/tests/*",
]

# Owner rulings 2026-09-18 on the SDK campaign's findings. `fix-wire` is four small fixes (#151 a
# runtime view on /v1/meta, #152 the build's per-(layer, view) key, #155 the restated values page's
# no-op record) and the publish route letting an attached record omit `members`/`excluding`; the
# contracts sentence is the controller's. `fix-group-cycle` is #153: a group view created in a
# commit window publishes its buffered rows in the same cycle.
[track.fix-wire]
paths = [
  "crates/mosaica-engine/src/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-build/src/*",
  "crates/mosaica-build/tests/*",
  "crates/mosaica-server/src/*",
  "crates/mosaica-server/tests/*",
  "crates/mosaica-lifecycle/src/*",
  "conformance/tests/*",
  "clients/py/*",
]

[track.fix-group-cycle]
paths = [
  "crates/mosaica-engine/src/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-server/src/*",
  "crates/mosaica-server/tests/*",
  "conformance/tests/*",
  "clients/py/tests/*",
]

# Issue #150, owner ruling (a), 2026-09-18: a generating set is projected over the whole row space and
# maintained at flush, merge and growth as a membership is; the containment partition declines an
# ordinal whose set reaches above the base rows. The write-cycle document's §4.1 is the controller's.
[track.fix-generating]
paths = [
  "crates/mosaica-engine/src/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-server/tests/*",
  "conformance/tests/*",
  "clients/py/tests/*",
]

# Owner rulings 2026-09-18. `fix-batch-id`: the SDK's batch id is a fresh id per request (never derived
# from the body); the server indexes every batch-carrying record by one exhaustive rule and trims the
# index at WAL rotation (#154). `fix-label-target`: a dependent's row names its target by mosaica id;
# the copied masked count and the client's join by count go. Contracts and decisions are the controller's.
[track.fix-batch-id]
paths = [
  "clients/py/*",
  "crates/mosaica-engine/src/write/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-lifecycle/src/*",
  "crates/mosaica-server/tests/*",
  "conformance/tests/*",
]

[track.fix-label-target]
paths = [
  "crates/mosaica-engine/src/viewport.rs",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-wire/*",
  "crates/mosaica-server/src/*",
  "crates/mosaica-server/tests/*",
  "conformance/*",
  "clients/ts/*",
  "clients/py/mosaica/static/*",
  "clients/py/tests/*",
]

# Found by the fix-wire round, 2026-09-18: on a group-scoped layer a view's browse returns another
# view's artifact (key and mosaica_id, count zero). A view of a scoped layer serves its own artifacts only.
[track.fix-scoped-roster]
paths = [
  "crates/mosaica-engine/src/*",
  "crates/mosaica-engine/tests/*",
  "crates/mosaica-build/tests/*",
  "crates/mosaica-server/tests/*",
  "conformance/tests/*",
  "clients/py/tests/*",
]
