# layer author chooses. Owns its design document and its probe directory.
[track.shape]
paths = [
  "docs/design/artifact-shapes.md",
  "docs/evidence/memos/2026-08-27-artifact-shapes.md",
  "probes/2026-08-27-artifact-shapes/*",
  "docs/design/README.md",
]

