# Campaign handover, second wave (controller, 2026-09-05). Briefs in
# .superpowers/sdd/2026-09-05-campaign-handover/. Three tracks branch from the seam commit on main.
# `crates/tessera-server/src/control.rs`, `crates/tessera-server/tests/*` and `conformance/*` are
# deliberately claimed by both `growth` and `wire`: the publish handler and the ingest handler
# share one file. Each track keeps to the functions its brief names; the controller merges.
# A file outside a track's list is stop-and-report, never an edit to this file.

[frozen]
paths = [
  "CLAUDE.md",
  "docs/agents/*",
  "docs/decisions/*",
  "docs/design/*",
  "scripts/check-*",
  "scripts/fmt-file.sh",
  "scripts/install-hooks.sh",
  ".claude/track-allowlist.toml",
]

[shared]
paths = [
  "Cargo.lock",
]

# Decision 0127: a membership grows through the control plane.
[track.growth]
paths = [
  "crates/tessera-lifecycle/*",
  "crates/tessera-engine/src/write.rs",
  "crates/tessera-engine/src/session.rs",
  "crates/tessera-engine/src/lib.rs",
  "crates/tessera-engine/tests/*",
  "crates/tessera-server/src/control.rs",
  "crates/tessera-server/tests/*",
  "docs/openapi/tessera.yaml",
  "conformance/*",
]

# Decisions 0128 and 0129: the taxonomy column and the access list, engine and driver.
[track.wire]
paths = [
  "crates/tessera-plugin/*",
  "crates/tessera-server/src/control.rs",
  "crates/tessera-server/tests/*",
  "conformance/*",
  "clients/py/tesseradb/*",
  "test_corpora/common/*",
  "test_corpora/*/README.md",
  "test_corpora/*/measurements*.json",
  "docs/ingest-campaign.md",
  "crates/tessera-corpus/*",
  "crates/tessera-bench/*",
  "crates/tessera-server/src/config.rs",
  "crates/tessera-server/src/state.rs",
  "crates/tessera-server/src/error.rs",
]

# R8(a): sub-laps inside the flush's text extents.
[track.text-laps]
paths = [
  "crates/tessera-engine/src/flush.rs",
  "crates/tessera-analyse/*",
  "crates/tessera-filter/*",
  "probes/2026-09-05-flush-attribution/*",
]
