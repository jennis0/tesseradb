# Value-suggestion campaign file ownership (controller, 2026-09-02). Briefs in
# .superpowers/sdd/2026-09-02-value-suggestion/. Tracks branch from the promotion commit and are
# merged in order engine → server → conformance, client alongside.

[frozen]
paths = [
  "crates/tessera-authz/*",
  "crates/tessera-plugin/*",
  "docs/decisions/*",
  "docs/design/*",
  "scripts/*",
]

[shared]
paths = [
  "Cargo.lock",
]

[track.engine]
paths = [
  "crates/tessera-analyse/*",
  "crates/tessera-filter/*",
  "crates/tessera-store/*",
  "crates/tessera-engine/*",
  "crates/tessera-bench/*",
]

[track.server]
paths = [
  "crates/tessera-server/*",
  "docs/openapi/tessera.yaml",
]

[track.client]
paths = [
  "clients/ts/*",
  "clients/py/tesseradb/static/*",
]

[track.conformance]
paths = [
  "conformance/*",
  "docs/design/conformance.md",
]
