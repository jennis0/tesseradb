<style>
/* =====================================================================
   Tessera white paper — design system.

   Every later figure is drawn with the tokens declared here and must not
   contain a literal colour. If a figure needs a colour this file does not
   name, add a token here rather than hardcoding it there.

   Palette provenance: the categorical slots --cat-1 … --cat-6 are the first
   six slots of the `dataviz` skill's reference categorical theme
   (references/palette.md), taken verbatim in both modes. They were validated
   with that skill's scripts/validate_palette.js against the surfaces used
   below — light #f8f9fa, dark #17181a — and pass every gate in both modes.
   One WARN stands in light mode: --cat-3 (2.67:1), --cat-4 (2.05:1) and
   --cat-5 (2.55:1) fall below 3:1 against the light surface, so the relief
   rule applies — any figure using those slots must carry visible direct
   labels or an accompanying table. Do not re-step the hexes to dodge it.

   Neutrals are cool-shifted toward the blue accent rather than pure grey.
   ===================================================================== */

/* ---------------------------------------------------------------------
   TOKENS — light (the default), also stamped explicitly so an author's
   data-theme="light" override beats an OS dark preference.
   --------------------------------------------------------------------- */
:root,
:root[data-theme="light"] {
  color-scheme: light;

  /* --- ground and ink --- */
  --bg:         #f7f8fa;  /* page plane behind everything */
  --surface:    #ffffff;  /* raised plane: figure frames, cards, callouts */
  --surface-2:  #eef0f4;  /* inset plane: code blocks, table zebra, wells */
  --fg:         #101317;  /* primary ink: body text, headings */
  --muted:      #565b63;  /* secondary ink: captions, labels, axis text */
  --rule:       #dcdfe5;  /* hairline: borders, dividers, table rules */

  /* --- interactive --- */
  --accent:      #1c5cab;              /* links, active controls, emphasis */
  --accent-weak: rgba(28,92,171,0.10); /* accent wash: selection, hover fill */
  --focus:       #2a78d6;              /* keyboard focus ring only */

  /* --- chart chrome (recessive; never used for data) --- */
  --grid:       #e7e9ee;  /* chart gridlines */
  --axis:       #b9bec7;  /* baselines, axis lines, tick marks */
  --annotation: #565b63;  /* callout leader lines and annotation ink */

  /* --- categorical series: fixed order, never cycled --- */
  --cat-1: #2a78d6;  /* blue */
  --cat-2: #eb6834;  /* orange */
  --cat-3: #1baf7a;  /* aqua    — sub-3:1 on light, needs relief */
  --cat-4: #eda100;  /* yellow  — sub-3:1 on light, needs relief */
  --cat-5: #e87ba4;  /* magenta — sub-3:1 on light, needs relief */
  --cat-6: #008300;  /* green */

  /* --- sequential ramp, single hue (magnitude: densities, heatmaps) --- */
  --seq-1: #cde2fb;
  --seq-2: #9ec5f4;
  --seq-3: #6da7ec;
  --seq-4: #3987e5;
  --seq-5: #256abf;
  --seq-6: #184f95;

  /* --- diverging poles + neutral midpoint (polarity: allowed vs denied) --- */
  --div-neg: #2a78d6;
  --div-mid: #f0efec;
  --div-pos: #e34948;

  /* --- masking: the paper's one subject-specific pair.
         Points inside M_auth versus points the viewer may not see. --- */
  --masked-in:  var(--cat-1);            /* inside the visible set */
  --masked-out: rgba(16,19,23,0.14);     /* outside it: absence, not a colour */
}

/* ---------------------------------------------------------------------
   TOKENS — dark. Same roles, re-selected for the dark ground; the
   categorical slots are the palette's own dark steps, not flipped hues.
   The :not() guard lets an explicit light stamp beat OS dark.
   --------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --bg:         #101214;
    --surface:    #17181a;
    --surface-2:  #1f2124;
    --fg:         #f2f3f5;
    --muted:      #a3a8b0;
    --rule:       #2b2e33;

    --accent:      #6da7ec;
    --accent-weak: rgba(109,167,236,0.16);
    --focus:       #6da7ec;

    --grid:       #24262a;
    --axis:       #3a3d43;
    --annotation: #a3a8b0;

    --cat-1: #3987e5;
    --cat-2: #d95926;
    --cat-3: #199e70;
    --cat-4: #c98500;
    --cat-5: #d55181;
    --cat-6: #008300;

    --seq-1: #184f95;
    --seq-2: #256abf;
    --seq-3: #2a78d6;
    --seq-4: #3987e5;
    --seq-5: #6da7ec;
    --seq-6: #9ec5f4;

    --div-neg: #3987e5;
    --div-mid: #383835;
    --div-pos: #e66767;

    --masked-out: rgba(242,243,245,0.14);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --bg:         #101214;
  --surface:    #17181a;
  --surface-2:  #1f2124;
  --fg:         #f2f3f5;
  --muted:      #a3a8b0;
  --rule:       #2b2e33;

  --accent:      #6da7ec;
  --accent-weak: rgba(109,167,236,0.16);
  --focus:       #6da7ec;

  --grid:       #24262a;
  --axis:       #3a3d43;
  --annotation: #a3a8b0;

  --cat-1: #3987e5;
  --cat-2: #d95926;
  --cat-3: #199e70;
  --cat-4: #c98500;
  --cat-5: #d55181;
  --cat-6: #008300;

  --seq-1: #184f95;
  --seq-2: #256abf;
  --seq-3: #2a78d6;
  --seq-4: #3987e5;
  --seq-5: #6da7ec;
  --seq-6: #9ec5f4;

  --div-neg: #3987e5;
  --div-mid: #383835;
  --div-pos: #e66767;

  --masked-out: rgba(242,243,245,0.14);
}

/* ---------------------------------------------------------------------
   TOKENS — mode-invariant. Status colours are reserved: they mean state,
   never "series 7". They always ship with a label, never colour alone
   (--status-warning is deliberately sub-3:1 on the light ground).
   --------------------------------------------------------------------- */
:root {
  --status-good:     #0ca30c;
  --status-warning:  #fab219;
  --status-serious:  #ec835a;
  --status-critical: #d03b3b;

  /* --- typefaces: a serif for argument, a sans for machinery ---
     No webfonts: the artifact CSP blocks font hosts, and a silent fallback
     is worse than a chosen stack. Figures stay in --font-ui throughout. */
  --font-prose: Charter, "Bitstream Charter", "Iowan Old Style", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --font-ui:    system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:  ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  /* --- type scale (1.22 ratio, anchored at 17px body) --- */
  --fs-xs:   0.75rem;    /* legend keys, tick labels, superscripts */
  --fs-sm:   0.8125rem;  /* captions, table cells, control labels */
  --fs-base: 1.0625rem;  /* running prose */
  --fs-lg:   1.1875rem;  /* standfirst, pull quotes */
  --fs-xl:   1.375rem;   /* h3 */
  --fs-2xl:  1.6875rem;  /* h2 */
  --fs-3xl:  clamp(2rem, 1.4rem + 2.4vw, 2.875rem); /* paper title */

  /* --- rhythm and geometry --- */
  --measure: 43rem;   /* prose column: ~82 characters at --fs-base */
  --band:    11rem;   /* how far a figure may break out on each side */
  --gutter:  1.25rem; /* minimum page margin */
  --flow:    1.05rem; /* default vertical gap between siblings */
  --radius:  4px;     /* restrained: this is a paper, not a product page */
  --hair:    1px;     /* hairline width */

  /* the grid template shared by .wp and its sections */
  --wp-cols:
    [full-start] minmax(var(--gutter), 1fr)
    [wide-start] minmax(0, var(--band))
    [text-start] minmax(0, var(--measure)) [text-end]
    minmax(0, var(--band)) [wide-end]
    minmax(var(--gutter), 1fr) [full-end];
}

/* ---------------------------------------------------------------------
   BASE
   --------------------------------------------------------------------- */
:root { background: var(--bg); }

.wp {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-prose);
  font-size: var(--fs-base);
  line-height: 1.62;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
  padding-block: 3.5rem 4.5rem;
}

/* ---------------------------------------------------------------------
   LAYOUT — one measure-limited column with two breakout bands.
   Put a figure at `grid-column: wide` (the default for <figure>) or use
   .wide / .full on any block. Sections re-declare the same template so a
   figure nested inside one still breaks out.
   --------------------------------------------------------------------- */
.wp,
.wp > section {
  display: grid;
  grid-template-columns: var(--wp-cols);
  row-gap: var(--flow);
  align-content: start;
}
.wp > section { grid-column: full; }

.wp > *,
.wp > section > * { grid-column: text; min-width: 0; }

/* breakouts — declared after the default so they win at equal specificity */
.wp figure,
.wp .wide  { grid-column: wide; }
.wp .full  { grid-column: full; }

/* ---------------------------------------------------------------------
   TYPE
   --------------------------------------------------------------------- */
.wp h1, .wp h2, .wp h3, .wp h4 {
  font-family: var(--font-ui);
  font-weight: 600;
  line-height: 1.2;
  text-wrap: balance;
  margin: 0;
}
.wp h1 { font-size: var(--fs-3xl); letter-spacing: -0.02em; font-weight: 620; }
.wp h2 { font-size: var(--fs-2xl); letter-spacing: -0.01em; margin-top: 2.4rem; }
.wp h3 { font-size: var(--fs-xl);  margin-top: 1.6rem; }
.wp h4 { font-size: var(--fs-lg);  margin-top: 1.2rem; color: var(--muted); }

.wp p, .wp ul, .wp ol, .wp dl, .wp blockquote { margin: 0; }
.wp ul, .wp ol { padding-left: 1.4rem; }
.wp li + li { margin-top: 0.35rem; }

.wp .eyebrow {
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.wp .standfirst {
  font-size: var(--fs-lg);
  line-height: 1.5;
  color: var(--fg);
}
.wp .status-note {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  line-height: 1.5;
  color: var(--muted);
  border-left: 2px solid var(--accent);
  padding: 0.6rem 0 0.6rem 0.85rem;
}

.wp blockquote {
  border-left: 2px solid var(--rule);
  padding-left: 1rem;
  color: var(--muted);
  font-style: italic;
}

.wp a {
  color: var(--accent);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}
.wp a:hover { background: var(--accent-weak); }

.wp code, .wp kbd, .wp samp {
  font-family: var(--font-mono);
  font-size: 0.875em;
  background: var(--surface-2);
  border-radius: 3px;
  padding: 0.1em 0.32em;
}
.wp pre {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  line-height: 1.5;
  background: var(--surface-2);
  border: var(--hair) solid var(--rule);
  border-radius: var(--radius);
  padding: 0.85rem 1rem;
  margin: 0;
  overflow-x: auto;
}
.wp pre code { background: none; padding: 0; font-size: inherit; }

/* small caps-ish inline term, for the security vocabulary */
.wp .term { font-variant: small-caps; letter-spacing: 0.02em; }

/* horizontal rule between major movements */
.wp hr {
  border: 0;
  border-top: var(--hair) solid var(--rule);
  margin: 1.6rem 0;
  width: 100%;
}

/* ---------------------------------------------------------------------
   FIGURES
   --------------------------------------------------------------------- */
.wp figure {
  margin: 0;
  padding-block: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.wp figure > figcaption {
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  line-height: 1.5;
  color: var(--muted);
  border-top: var(--hair) solid var(--rule);
  padding-top: 0.5rem;
  text-wrap: pretty;
}
.wp figcaption .fig-num {
  font-weight: 650;
  color: var(--fg);
  letter-spacing: 0.02em;
}

/* the plane a figure's graphic sits on */
.wp .fig-frame {
  background: var(--surface);
  border: var(--hair) solid var(--rule);
  border-radius: var(--radius);
  padding: 1rem;
}

/* Wide content scrolls inside its own box; the page never scrolls sideways.
   Note that svg/img/canvas shrink to fit by default (see below), so a
   .fig-scroll around a bare <svg> will never actually scroll — the graphic
   just gets smaller. That is usually what you want. A graphic that must
   keep its natural size and scroll instead (dense timelines, wide tables,
   Morton-order strips) carries .fig-fixed inside the .fig-scroll wrapper. */
.wp .fig-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
.wp .fig-scroll > .fig-fixed,
.wp .fig-scroll > .fig-fixed > svg,
.wp .fig-scroll > .fig-fixed > img,
.wp .fig-scroll > .fig-fixed > canvas { max-width: none; }

/* …but when the band IS wide enough, the graphic should use it rather than
   sitting at its intrinsic size with dead space to the right. min-width on
   the .fig-fixed wrapper still forces the scroll below that threshold. */
.wp .fig-scroll > .fig-fixed { width: 100%; }
.wp .fig-scroll > .fig-fixed > svg { width: 100%; height: auto; }

/* row of interactive widgets above a figure */
.wp .fig-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem 0.85rem;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  color: var(--muted);
}
.wp .fig-controls label { display: inline-flex; align-items: center; gap: 0.4rem; }
.wp .fig-controls button,
.wp .fig-controls select {
  font: inherit;
  color: var(--fg);
  background: var(--surface);
  border: var(--hair) solid var(--rule);
  border-radius: var(--radius);
  padding: 0.25rem 0.6rem;
  cursor: pointer;
}
.wp .fig-controls button[aria-pressed="true"] {
  background: var(--accent-weak);
  border-color: var(--accent);
  color: var(--accent);
}
.wp .fig-controls input[type="range"] { accent-color: var(--accent); }

/* legend — always present for two or more series */
.wp .fig-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 1rem;
  font-family: var(--font-ui);
  font-size: var(--fs-xs);
  color: var(--muted);
}
.wp .fig-legend > span { display: inline-flex; align-items: center; gap: 0.4rem; }
.wp .swatch {
  width: 0.7rem; height: 0.7rem;
  border-radius: 2px;
  background: var(--muted);
  flex: none;
}

/* text inside figures wears text tokens, never a series colour */
/* Muted is the DEFAULT for figure text, not an override. A `fill`
   presentation attribute has lower priority than any CSS rule, so a plain
   `.wp figure text { fill: … }` silently beats every fill="var(--cat-1)" a
   figure sets — the :not([fill]) guard is what lets a figure opt out. */
.wp figure text { font-family: var(--font-ui); }
.wp figure text:not([fill]):not([style*="fill"]) { fill: var(--muted); }
.wp figure svg { display: block; }

.wp img, .wp svg, .wp canvas { max-width: 100%; }
.wp img, .wp canvas { height: auto; }

/* ---------------------------------------------------------------------
   TABLES — the accessible fallback for every figure that needs one
   --------------------------------------------------------------------- */
.wp table {
  border-collapse: collapse;
  width: 100%;
  font-family: var(--font-ui);
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}
.wp th, .wp td {
  text-align: left;
  padding: 0.4rem 0.7rem 0.4rem 0;
  border-bottom: var(--hair) solid var(--rule);
  vertical-align: top;
}
.wp th { font-weight: 620; color: var(--fg); }
.wp td { color: var(--muted); }
.wp td.num, .wp th.num { text-align: right; padding-right: 0; }

/* ---------------------------------------------------------------------
   FOCUS & MOTION
   --------------------------------------------------------------------- */
.wp :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .wp *, .wp *::before, .wp *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------------------------------------------------------------------
   NARROW VIEWPORTS

   The breakout bands do NOT collapse on their own: once the viewport is
   narrower than measure + 2·band + 2·gutter, the band tracks and the
   measure track compete for the same shortfall and the prose column ends
   up squeezed to roughly half the screen. So step --band down explicitly
   before that happens, and to zero once there is no room for it at all.
   --------------------------------------------------------------------- */
@media (max-width: 68rem) {
  :root { --band: 7rem; }
}
@media (max-width: 58rem) {
  :root { --band: 4rem; }
}
@media (max-width: 48rem) {
  :root { --band: 2rem; }
}
@media (max-width: 40rem) {
  :root { --band: 0rem; --gutter: 1rem; --flow: 0.95rem; }
  .wp { padding-block: 2.25rem 3rem; }
  .wp .fig-frame { padding: 0.7rem; }
  .wp h2 { margin-top: 1.9rem; }
}
</style>

<!-- Shared figure runtime. This is an inline copy of src/lib/figure.js,
     which the build script does not glob (it globs src/*.html only).
     Keep the two identical: everything lands on the global TF. -->
<script>
/* Tessera white paper — shared figure runtime.
 *
 * This file is the readable reference copy. The build script globs only
 * `src/*.html`, so this file is NOT concatenated into the published page:
 * its contents are inlined verbatim inside the <script> block at the end of
 * `src/00-style.html`. The two must be kept identical.
 *
 * Everything lands on one global, `TF`. No modules, no imports, no network.
 */
(function (global) {
  "use strict";

  /* ---- theme ---------------------------------------------------------- */

  var mq = global.matchMedia
    ? global.matchMedia("(prefers-color-scheme: dark)")
    : null;

  /* Resolve the theme the page is actually painted in. An explicit
   * data-theme stamp on the root element wins over the OS preference in
   * both directions; this mirrors the CSS cascade in 00-style.html. */
  function theme() {
    var stamped = document.documentElement.getAttribute("data-theme");
    if (stamped === "dark" || stamped === "light") return stamped;
    return mq && mq.matches ? "dark" : "light";
  }

  /* Call fn("light"|"dark") whenever the effective theme changes.
   * Figures that read computed token values (e.g. to paint a canvas) must
   * subscribe; figures styled purely by CSS custom properties need not.
   * Returns an unsubscribe function. */
  function onThemeChange(fn) {
    var last = theme();
    function fire() {
      var now = theme();
      if (now === last) return;
      last = now;
      fn(now);
    }
    if (mq) {
      if (mq.addEventListener) mq.addEventListener("change", fire);
      else if (mq.addListener) mq.addListener(fire);
    }
    var obs = new MutationObserver(fire);
    obs.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"]
    });
    return function unsubscribe() {
      if (mq) {
        if (mq.removeEventListener) mq.removeEventListener("change", fire);
        else if (mq.removeListener) mq.removeListener(fire);
      }
      obs.disconnect();
    };
  }

  /* ---- SVG ------------------------------------------------------------ */

  var NS = "http://www.w3.org/2000/svg";

  /* Namespaced element factory.
   *   svg("rect", {x: 0, y: 0, width: 10, height: 4, fill: "var(--cat-1)"})
   * Two attribute names are treated specially:
   *   text     -> textContent
   *   children -> array of nodes to append
   * Attributes whose value is null or undefined are skipped, so callers can
   * pass optional attributes without branching. */
  function svg(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined) continue;
        if (k === "text") {
          el.textContent = String(v);
        } else if (k === "children") {
          for (var i = 0; i < v.length; i++) el.appendChild(v[i]);
        } else {
          el.setAttribute(k, String(v));
        }
      }
    }
    return el;
  }

  /* ---- numbers -------------------------------------------------------- */

  var GROUP = /\B(?=(\d{3})+(?!\d))/g;

  /* Group a number with thousands separators, at a fixed number of decimals.
   *   fmt(1048576)      -> "1,048,576"
   *   fmt(2.4157, 2)    -> "2.42"
   * Non-finite input renders as an em dash rather than "NaN". */
  function fmt(n, decimals) {
    if (n === null || n === undefined || !isFinite(n)) return "—";
    var d = decimals === undefined ? 0 : decimals;
    var neg = n < 0;
    var s = Math.abs(n).toFixed(d);
    var parts = s.split(".");
    parts[0] = parts[0].replace(GROUP, ",");
    return (neg ? "-" : "") + parts.join(".");
  }

  /* Format a duration given in microseconds, choosing µs / ms / s so the
   * mantissa stays readable. Measurements in probes/results.md are quoted in
   * microseconds, so that is the input unit.
   *   fmt.dur(430)      -> "430 µs"
   *   fmt.dur(21500)    -> "21.5 ms"
   *   fmt.dur(4200000)  -> "4.20 s"
   * The gap before the unit is a non-breaking space, so a value never wraps
   * away from its unit. Same in fmt.bytes. */
  fmt.dur = function (us) {
    if (us === null || us === undefined || !isFinite(us)) return "—";
    var a = Math.abs(us);
    if (a < 1000) return fmt(us, a < 10 ? 1 : 0) + " µs";
    if (a < 1e6) return fmt(us / 1000, a < 1e5 ? 1 : 0) + " ms";
    return fmt(us / 1e6, 2) + " s";
  };

  /* Format a byte count with binary prefixes. */
  fmt.bytes = function (b) {
    if (b === null || b === undefined || !isFinite(b)) return "—";
    var units = ["B", "KiB", "MiB", "GiB", "TiB"];
    var a = Math.abs(b), i = 0;
    while (a >= 1024 && i < units.length - 1) { a /= 1024; i++; }
    return fmt(b < 0 ? -a : a, i === 0 ? 0 : (a < 10 ? 2 : 1)) + " " + units[i];
  };

  /* ---- misc ----------------------------------------------------------- */

  /* Read a CSS custom property off an element (default :root). Figures that
   * paint to <canvas> cannot use var(); they read tokens through this and
   * re-read them from an onThemeChange callback. */
  function token(name, el) {
    return getComputedStyle(el || document.documentElement)
      .getPropertyValue(name)
      .trim();
  }

  /* True when the viewer has asked for reduced motion. Animated figures must
   * check this and present their end state immediately instead. */
  function reducedMotion() {
    return !!(global.matchMedia &&
      global.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  global.TF = {
    theme: theme,
    onThemeChange: onThemeChange,
    svg: svg,
    fmt: fmt,
    token: token,
    reducedMotion: reducedMotion,
    NS: NS
  };
})(window);
</script>
