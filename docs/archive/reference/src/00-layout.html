<!-- Layout override for the process-reference page.

     The white paper's design system is built around a measure-limited prose
     column with figures breaking out a little either side. That is right for
     an argument and wrong for a reference sheet: these pages are diagrams
     first, and a diagram wants the whole width of the screen.

     This block inherits every token from the shared system — colours, type
     scale, focus ring, figure chrome, theming — and replaces only the grid.
     Keep it after the shared style block in build order. -->
<style>
  /* One full-width column. No breakout bands, because everything breaks out. */
  .wp,
  .wp > section.part {
    display: block;
    max-width: none;
    padding-inline: clamp(1rem, 3vw, 3rem);
  }

  /* The measure still applies to running text, so the occasional paragraph
     of explanation stays readable — it just no longer governs the page. */
  .wp p,
  .wp li {
    max-width: 46rem;
  }

  /* Figures take the full column and are never constrained by the measure. */
  .wp figure,
  .wp figure.wide,
  .wp figure.full,
  .wp figcaption,
  .wp table {
    max-width: none;
    width: 100%;
    margin-inline: 0;
  }

  /* A diagram is the page's subject, so give its frame room to breathe and
     let it scroll inside itself rather than squashing on a narrow screen. */
  .wp .fig-frame {
    padding: clamp(0.75rem, 1.5vw, 1.5rem);
  }

  /* Captions under a full-width diagram need their own measure back, or they
     run to 1,600px of unreadable line length. */
  .wp figcaption {
    max-width: 60rem;
  }

  /* Reference tables are dense and wide; keep them legible rather than pretty. */
  .wp table {
    font-size: 0.9rem;
  }

  .wp .page-masthead {
    padding-block: 2.5rem 1rem;
  }
</style>
