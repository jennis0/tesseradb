<section class="part" id="proc-auth">

  <h2>Authorisation</h2>

  <p>Authorisation turns a viewer's credentials into one bitmap — the set of
  items that viewer may see — and does it once, at the start of a session.
  Everything the viewer does afterwards is arithmetic against that bitmap.</p>

  <figure id="fig-auth" class="full">
    <div class="fig-frame fig-scroll">
      <div class="fig-fixed" style="min-width: 1150px;">
        <svg viewBox="0 0 1250 816" role="img">
          <title>Credentials to a reusable mask, once per session</title>
          <desc>A viewer's credentials cross a trust boundary into the engine,
          where a caller-supplied authorisation plugin compiles them into a
          boolean expression and normalises it into a set of opaque term
          identifiers. The engine looks each satisfied term up in the term
          index, which holds one posting list of item identifiers per term, and
          unions those lists into a single bitmap: the mask, the set of items
          this viewer may see. The mask is cached and returned as an opaque
          token. Every subsequent query reuses that cached mask, brings it up to
          date against the overlay, and projects it through a permutation into
          row space, where geometry lives — the only crossing between the two
          identifier spaces. What returns to the caller is opaque per-session
          handles; entity identifiers never cross the trust boundary.</desc>

    <figcaption><span class="fig-num">Figure A.</span> Credentials become a
    mask once, at the start of a session, and every query afterwards reuses it.
    The caller-supplied plugin is the only thing that understands the policy: it
    compiles the viewer's grants into a set of opaque term identifiers, and the
    engine does nothing but union those terms' posting lists into a bitmap of
    the items the viewer may see. That bitmap lives in the engine's own
    identifier space; geometry is reached through a permutation, which is the
    single crossing between the two, and what leaves the trust boundary is
    opaque per-session handles.</figcaption>
  </figure>
