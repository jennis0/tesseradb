# Tessera's HTTP API: the viewer, session and control planes, as an OpenAPI 3.1 description.
#
# Hand-authored, and kept true by `crates/tessera-server/tests/openapi.rs`, which starts the
# server, exercises every route below (a success and at least one refusal each) and validates
# every JSON request and response body against the schemas in `components`. A field added to a
# response and not to this file fails that test, because every closed DTO is declared
# `additionalProperties: false`. Where this file and the server disagree, the server is right and
# this file is wrong.
#
# Each server names its plane and the prefix of the routes it serves in `x-tessera-plane` and
# `x-tessera-route-prefix`, which `clients/ts/core/test/contract.test.ts` reads to send each
# operation to its listener.
#
# What this file cannot say: the framed-Arrow bodies of `POST /v1/viewport`, `POST /v1/items` and
# `POST /v1/artifacts`, and the Arrow IPC forms of `POST /control/ingest`, `POST /control/values`
# and `PATCH /control/layers/{name}/artifacts`. They are not JSON, so each is declared as a binary
# media type and described in prose on its route. `docs/openapi/README.md` carries worked decodes
# of the framed bodies in Python and in JavaScript. The JSON frames of the two bulk reads have
# schemas below (`ItemsHead`, `ArtifactsHead`, `PageEnd`, `RecordsTrailer`).
openapi: 3.1.0
info:
  title: Tessera HTTP API
  version: "1"
  summary: The viewer, session and control planes of a Tessera server.
  description: |
    Three listeners. The **session plane** mints and revokes viewer sessions and is authenticated
    by the *session credential*, a shared secret the operator configures; it is never
    browser-facing. The **viewer plane** answers about the corpus as one principal may see it and
    is authenticated by the *session token* the session plane minted. The **control plane**
    declares, ingests, deletes, suppresses and publishes, reports the node's state, and is
    authenticated by the *operator credential*, a second shared secret. `/healthz` and `/readyz`
    sit on the viewer and session listeners, unauthenticated, bare status codes with no body.

    `api_version` is published by `GET /v1/meta` and by nothing else. There is no version header,
    on any plane. A client does not send one to negotiate, and a server does not refuse a client
    whose assumed version is wrong.

    Every refusal a route's handler makes is one envelope (`Error` below) with a closed code list.
    The codes group into three classes that tell a client whether to retry:

    - **Failure**: `500 fail-closed` and `503 not-ready`. Never a partial result.
    - **Backpressure**: `429 backpressure`. Retry the request unchanged after `Retry-After`, which
      every 429 carries with an agreeing body `retry_after_s`. The number depends on what shed the
      request: `1` for compute admission, and derived from the write executor's service
      time on the control plane. Read the header.
    - **Shape**: `422 contract`. The request has to change before it is sent again.

    `401`, `403`, `404` and `409` are in none of the three: they concern the credential or the
    thing addressed. A `401 bad-credential` on a session token that worked before is a revoked
    session, and a client treats it as `403 expired-token`: the session has ended, so
    re-authorise.

    The HTTP framework answers three refusals itself, before a handler runs, with a plain-text
    body instead of the envelope: `400` for a JSON body that does not parse or a path segment that
    is not UTF-8, `413` for a JSON body over its route's byte cap, and `415` for a JSON route
    called without `content-type: application/json`. Each route declares the ones it can return.

    On the viewer plane a refusal depends on the request and the deployment's configuration, and
    never on the viewer's data. `404 unknown` there is one status, one code and one detail string
    for *no such identifier* and *exists but is not visible to this principal*.
servers:
  - url: http://{viewer-host}
    description: The viewer plane's listener, `serve.viewer`. Routes under `/v1/`, and the probes.
    x-tessera-plane: viewer
    x-tessera-route-prefix: /v1/
    variables:
      viewer-host:
        default: 127.0.0.1:8080
  - url: http://{session-host}
    description: The session plane's listener, `serve.session`. Routes under `/session/`, and the probes.
    x-tessera-plane: session
    x-tessera-route-prefix: /session/
    variables:
      session-host:
        default: 127.0.0.1:8081
  - url: http://{control-host}
    description: "The control plane's listener, `serve.control`: a TCP address, or a Unix socket written `unix:<path>`. The server does not check that a TCP address is loopback. Routes under `/control/`."
    x-tessera-plane: control
    x-tessera-route-prefix: /control/
    variables:
      control-host:
        default: 127.0.0.1:8082

tags:
  - name: session
    description: Minting and revoking viewer sessions. Authenticated by the session credential.
  - name: viewer
    description: The corpus as one principal sees it. Authenticated by a session token.
  - name: probes
    description: Liveness and readiness, on the viewer and session listeners, unauthenticated, no body.
  - name: "control: ingest"
    description: New items, with their positions, labels and values. Control plane.
  - name: "control: values"
    description: Values on items that already exist. Control plane.
  - name: "control: changes"
    description: Deletions, suppressions and lifted suppressions. Control plane.
  - name: "control: status"
    description: The node's state, counters and published limits. Control plane.
  - name: "control: flush"
    description: Publishing buffered writes ahead of the next tick. Control plane.
  - name: "control: compact"
    description: Asking for a compaction fold. Control plane.
  - name: "control: attributes"
    description: Declaring attribute columns. Control plane.
  - name: "control: vocabularies"
    description: Declaring vocabularies and adding values to them. Control plane.
  - name: "control: views"
    description: Declaring plain views, and creating and dropping the views of a view group. Control plane.
  - name: "control: view groups"
    description: Declaring view groups. Control plane.
  - name: "control: layers"
    description: Registering and dropping annotation layers. Control plane.
  - name: "control: artifacts"
    description: Publishing a layer's artifacts and growing their memberships. Control plane.

paths:
  /session/authorise:
    post:
      tags: [session]
      operationId: authorise
      summary: Mint a viewer session from a credential the auth plugin understands.
      description: |
        `auth_data` is base64 of bytes the deployment's auth plugin evaluates. What the bytes mean
        is the plugin's to say; the built-in passthrough plugin reads them as JSON
        `{"terms": [...]}`. The server hashes the decoded bytes to find a mask fragment it has
        already built for them, so one credential has to arrive as the same bytes each time;
        base64 keeps them exact.

        A valid credential that yields no terms still mints a token, which sees nothing. The
        service cannot tell a wrong credential from one cleared for nothing, and refusing would
        say which.

        Subject to compute admission: a first authorise for a credential builds and writes a mask
        fragment.
      security:
        - sessionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoriseRequest"
      responses:
        "200":
          description: A session. `expires_at` is the time of the request plus the server's `token_max_lifetime_secs`, in seconds since the Unix epoch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoriseResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "422":
          description: "`auth_data` is not base64, or the deployment's plugin refused it. The detail carries the plugin's reason, which only a holder of the session credential reads."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /session/revoke:
    post:
      tags: [session]
      operationId: revoke
      summary: End a session by its `token_id`, which is not the token itself.
      description: |
        Revocation names the session by `token_id`, so the token is sent once, when it is minted,
        and never again. A `token_id` that names no live session is also answered `204`, since any
        other answer would let a caller enumerate sessions.
      security:
        - sessionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "204":
          description: Revoked, or never live. No body.
        "401":
          $ref: "#/components/responses/BadCredential"
        "422":
          $ref: "#/components/responses/Contract"

  /healthz:
    get:
      tags: [probes]
      operationId: healthz
      summary: Liveness. Unauthenticated, no body.
      security: []
      responses:
        "200":
          description: The process is up.

  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      summary: Readiness. Unauthenticated, no body.
      description: |
        `200` when the write executor is running and no partition is serving a stepped-down
        manifest, and `503` otherwise.
      security: []
      responses:
        "200":
          description: Ready to serve.
        "503":
          description: Not ready. No body and no `Retry-After`, because a figure that varied with the write executor's state would tell an unauthenticated caller about it.

  /v1/meta:
    get:
      tags: [viewer]
      operationId: meta
      summary: The deployment's shape as this principal may know it.
      description: |
        `views`, `groups`, `scoped_scalars`, the scoped entries of `filter_operands`, and `layers`
        are filtered per principal: a view, group, family or layer this principal may not reach is
        absent, as a name nobody declared is. Everything else is the same for every principal. A
        client does not reuse this document across principals.

        Not subject to compute admission.
      security:
        - sessionToken: []
      responses:
        "200":
          description: The document. `declared_scalars` is the whole column schema; `filter_operands` is the subset a request may filter on, with each column's operators; `selection` carries the sampling parameters a client needs to read a count of drawn points as a density.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/categories/{column}:
    get:
      tags: [viewer]
      operationId: categories
      summary: What a category column's codes stand for, filtered by the vocabulary's `visibility`.
      description: |
        Two forms under one rule. `?codes=` resolves codes the caller already holds. The bare form
        lists values in ascending key order, resuming after `?after=` and bounded by `?limit=`,
        whose ceiling and default are `selection.max_category_values`. A `limit` above the ceiling
        is clamped, and `limit=0` is `422`. A `derived` vocabulary is filtered to the values this
        principal can see before either form runs, and a page is cut after the filter, so its
        length counts only values the principal may see.

        A code that resolves to nothing is left out and not refused, and an empty `values` is a
        `200`. No such code, a code no key explains, and a value this principal cannot see give
        one answer. This route serves no counts; `/v1/categories/{column}/suggest` serves a count
        beside each value a prefix matches.

        Not subject to compute admission. A `public` vocabulary is a walk of an in-memory map. A
        `derived` one composes this principal's visible set and probes one memory-mapped index
        entry per value it walks, over the whole vocabulary.
      security:
        - sessionToken: []
      parameters:
        - name: column
          in: path
          required: true
          description: |
            Any column in `/v1/meta`'s `declared_scalars` that carries a `category` block,
            including one with neither `render` nor `index`, which no filter can name. Or a
            group-scoped category family from `filter_operands`, which has one column per view of
            its group and so is addressed with a view: pin one here as `<column>@<key>`, or name
            the request's own view in `view`. A group-scoped column named with neither is `422`
            naming the group, and a pin naming no view of the group is the `404` an unknown view
            gets. A pin on an entity-scoped column is `422`, since it has one value set for the
            corpus.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+(@[A-Za-z0-9_.:-]+)?$"
        - name: view
          in: query
          required: false
          description: |
            The request's own view, for a group-scoped category. It is resolved through the
            session's reachable views as a viewer request's `view` is, and before the column, so a
            `view` naming nothing, or a view this principal may not reach, is the unknown-view
            `404` even where the column is entity-scoped. The scope decides only whether the view
            chooses a column.
          schema:
            type: string
        - name: codes
          in: query
          required: false
          description: Comma-separated `u32` codes to resolve. Present, the route resolves them; absent, it lists values. `next` is always `null` in this form.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Resume listing after this value key, the previous page's `next`.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to `selection.max_category_values`, its default; `0` is `422`.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The values this principal may be told about, in key order for the bare form and in request order for `?codes=`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: No such column, a column that is not a category, or a column whose vocabulary is missing. The three give one answer, so this route says no more about the schema than `/v1/meta` does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/categories/{column}/suggest:
    get:
      tags: [viewer]
      operationId: suggestCategoryValues
      summary: Typeahead over a category vocabulary, filtered by the vocabulary's `visibility`.
      description: |
        Returns the values whose key, title, or a word within either, starts with `q`.

        **Matching.** `q` and every indexed string are normalised alike: Unicode NFKC, then
        default case folding, then whitespace collapsed and trimmed. Each value contributes its
        whole folded key, its whole folded title where it has one, and the folded title, or the
        key where there is no title, from each word boundary after the first. A value matches when
        `q` is a prefix of one of these entries. There is no infix match, no fuzzy match and no
        stemming.

        **Order.** Ascending by the matched entry's folded string, then by entry kind (key, then
        title, then word start), then by key. The order is fixed when the index is built and is the
        same for every principal; it does not depend on frequency, recency or the count. A value
        appears once, at its first matching entry.

        **Visibility.** As on `/v1/categories/{column}`: a `public` vocabulary is suggested as
        declared, and a `derived` one offers a value only where at least one item carrying it is
        visible to this principal. The column and `view` are resolved as that route resolves
        them, `@key` pins and the group's `404` included.

        **No cursor.** A typeahead does not page; the user types another character. `more` says
        the walk stopped early: the page filled, or `selection.max_suggestion_walk` values were
        examined. Where the server answers from the session's set of visible values, which it
        builds for a principal whose visible set holds at most
        `selection.max_suggest_set_entities` items, `more` means only that the page filled.

        Not subject to compute admission. One suggest runs per session at a time: a second while
        one is running is `429 backpressure`, refused before any work, with `Retry-After`.
      security:
        - sessionToken: []
      parameters:
        - name: column
          in: path
          required: true
          description: "As on `/v1/categories/{column}`: any column carrying a `category` block, or a group-scoped family pinned as `<column>@<key>`."
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+(@[A-Za-z0-9_.:-]+)?$"
        - name: q
          in: query
          required: true
          description: The text typed, echoed in the response as received, not folded, so a client can match a response to its request. Empty matches every value and returns the first `limit` visible ones in index order. Over 256 bytes is `422`.
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to `selection.max_suggestions`, its default; `0` is `422`.
          schema:
            type: integer
            minimum: 1
        - name: counts
          in: query
          required: false
          description: "`true` serves `count` beside each value: how many items carrying it this principal may see, exact, computed per request. Without it `count` is absent. It does not affect the order."
          schema:
            type: boolean
        - name: view
          in: query
          required: false
          description: The request's own view, for a group-scoped category, resolved as on `/v1/categories/{column}`.
          schema:
            type: string
      responses:
        "200":
          description: At most `limit` values this principal may be told about, in matched-entry order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: No such column, a column that is not a category, or a column whose vocabulary is missing, as on `/v1/categories/{column}`; and a group-scoped family whose group this principal may not reach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/viewport:
    post:
      tags: [viewer]
      operationId: viewport
      summary: Masked counts per tile, a sample of points, and the annotation artifacts, over a region at a depth.
      description: |
        **The body is not JSON.** It is a sequence of frames, each a `u8` kind, a `u32`
        little-endian payload length and the payload, which is a complete Arrow IPC stream, or JSON
        for the trailer. The kinds:

        - `1` tiles: exactly one, first.
        - `2` sub-cells: exactly one when `underlay_offset` is present and not zero.
        - `5` artifacts: at most one, after the tiles and before any points. Absent, not empty,
          when no artifact is served.
        - `3` points: zero or more, each holding whole tiles.
        - `4` trailer: exactly one, last.

        A body without a trailer is incomplete, whatever the transport said. An unknown kind is a
        decoding error. [Wire framing](../openapi/README.md) gives each frame's columns and a
        worked decode in Python and in JavaScript.

        **Region and sample.** The request names exactly one of `bbox` and `tiles`. `k` is the
        most points a tile returns: it defaults to `selection.k_max_marks` and is capped by
        `selection.max_k`. A tile may return fewer than `k` while more are visible, which is how
        the client reads density. `k = 0` asks for counts only: the tiles and artifacts frames as
        at any `k`, and no points frame. A client keeps `k` the same or raises it as it zooms in;
        the server cannot check this.

        **Artifacts.** `layers` decides whether an artifacts frame can appear. `artifact_budget`
        is met by serving ancestors in place of their descendants, never by sampling, and has no
        effect on a flat layer. The frame's `matched` column answers `filters` for each artifact,
        and is null where the request carries no filter. Its `layer` column is
        dictionary-encoded. Its `rung` column is the declared level on a levelled layer, the depth
        in this response's own parent links on a treed layer, and `0` on a flat one. The
        `shape_x` and `shape_y` columns, `list<list<list<uint32>>>` of parts, rings and vertices,
        follow the fixed columns, and are absent from the schema when no served layer draws a
        shape or the request asked for none. A null in any column means the layer declares no such
        property. `target` (`uint64`) is the `tessera_id` of the artifact a row is attached to, a
        row of the same frame, such as the cluster a label names; null where the row is attached
        to nothing. A label's `masked_count` is its own.

        **Highlight.** A request carrying `highlight` gains three columns and loses none:
        `highlighted` fifth on the tiles frame (`uint64`, present on every response and equal to
        `matched` where there is no highlight), `highlighted` on the points frame (`bool`, after
        the render columns and before the membership columns, present only with a highlight), and
        `highlighted` on the artifacts frame (`bool`, after `matched`). The rows served are the
        same with and without a highlight.

        Subject to compute admission.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewportRequest"
      responses:
        "200":
          description: The framed body. Its headers carry the coordinates a client caches and revalidates by.
          headers:
            etag:
              description: The content key, quoted. It moves with the principal's identity, the served watermark, the overlay's version and the process, and is what a held band of tiles may be stored under. The server does not read `If-Match`, so a request carrying one is answered in full.
              required: true
              schema:
                type: string
            x-tessera-identity-key:
              description: The identity key, derived from the idset, the credential, its mask fragment and the view. A held band may be drawn only under the same key, so a client partitions its cache by it.
              required: true
              schema:
                type: string
            x-tessera-pin:
              description: The generation this response was computed from, as JSON `{"prefix", "segments_version"}`. It names the generation of this session's visible set. Until the refresh that follows a flush reaches this session, that is the previous generation, and the flush's new rows are not yet visible; deletions, suppressions, segments and the overlay are always current. Send it back as `pin`; its only effect is `x-tessera-stale`.
              required: true
              schema:
                type: string
            x-tessera-stale:
              description: "`1` where the request's `pin` differs from this response's `x-tessera-pin`, and `0` otherwise. It moves at every flush, merge and compaction, whether or not anything this principal can see changed, and after a flush it moves when the refresh reaches this session. Advisory."
              required: true
              schema:
                type: string
                enum: ["0", "1"]
            x-tessera-region:
              description: "Present exactly when the request's `filters` carry a `region` leaf. `exact` where every region is answered exactly against each point's stored position; `cover; depth=<d>` where a shape's edge crossed more than `max_region_cells` cells, and the answer is exact for a larger shape covering it, taken at depth `d`. It depends on the shape and the grid alone, not on the rows. With several region leaves it is the coarsest. A leaf naming an artifact is always exact."
              required: false
              schema:
                type: string
                pattern: "^(exact|cover; depth=[0-9]+)$"
            x-tessera-server-us:
              description: Server time from admission until the first frames were ready, in microseconds. The whole stream's time is the trailer's `stream_us`.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
            x-tessera-admission-us:
              description: Time spent waiting for compute admission, in microseconds.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Framed Arrow IPC streams and one JSON trailer.
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: Unknown `view`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The request needs to change:

            - `zoom` above 16;
            - neither or both of `bbox` and `tiles`, a `bbox` that is not finite or has a maximum below its minimum, or a tile prefix with bits above `zoom`;
            - an `underlay_offset` beyond `selection.max_underlay_offset`, past depth 16, or over the sub-cell budget, which is refused and not clamped;
            - an unknown filter column, or an operator outside its column's family (an unknown value is an empty operand and is not refused);
            - `none_of` naming a text column or two columns;
            - a `layers`, `levels`, `computed`, `artifact_rows` or `point_rows` value outside its schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/items:
    post:
      tags: [viewer]
      operationId: items
      summary: Every item this principal may see in one view that matches a filter, page by page, with the fields the caller names.
      description: |
        **The body is not JSON.** It is framed as the viewport's is, with these kinds:

        - `6` head: JSON `ItemsHead`, exactly one, first.
        - `7` records: one Arrow IPC stream holding one batch of up to `page_rows` rows. One or
          more, each followed by a page end; none only in a response cancelled before its first
          page, which happens only when the client has gone.
        - `8` page end: JSON `PageEnd`, carrying the cursor to resume after that page.
        - `4` trailer: JSON `RecordsTrailer`, exactly one, last.

        A body without a trailer is incomplete. A client whose connection drops resumes from the
        last page end it received, and discards a records frame that no page end follows. An
        unknown kind is a decoding error. [Wire framing](../openapi/README.md) walks a decode in
        Python and in JavaScript.

        **Reading a whole result.** A response carries at most `pages` pages and runs within the
        deployment's byte and time budgets. Pass the trailer's `next` back as `cursor`, unchanged,
        until it is null. The server keeps nothing between requests: every page is built from the
        latest data with the visible set composed again, so a deletion or suppression accepted
        during a read applies from the next page. A read returns each row at most once. A row
        inserted behind the cursor during a read is not returned, and one inserted ahead of it is.
        `fields`, `system_fields`, `filters`, `keep_unmatched` and `page_rows` may change between
        the requests of one read, and the page schema changes with them.

        **Columns.** `tessera_id` (`uint64`) first, then the named fields in the order named, then
        the system fields in the order named, then `tessera:matched` (`bool`) under
        `keep_unmatched`. Every named field is present whether or not an item carries a value. A
        number or boolean arrives as its declared type, `timestamp_us` as `timestamp[us, UTC]`, a
        keyword or text field as `utf8`, and a category as `dictionary<int32, utf8>` holding its
        keys, each frame's dictionary holding only the keys its rows carry. An absent value is
        null. `position` is two `float64` columns, `tessera:x` and `tessera:y`: the stored
        position converted back through the view's projection and frame, so degrees on a
        geographic view, exact to one step of the view's 32-bit grid. `external_id` is `binary`
        as `tessera:external_id`, null where the item has none. `labels` is `list<utf8>` as
        `tessera:labels`: the item's labels this principal holds, sorted. A rendered field is read
        from `view`, where the item card reads the first view the principal can reach, so the two
        can differ. An item joined into `view` before its own ingest is flushed has null record
        fields until that flush.

        **Group-scoped fields** resolve as a filter leaf on them does: under a view of the field's
        group, or of a group sharing its views, they read that view's column; elsewhere they are
        pinned as `<field>@<key>`.

        **Order.** `map` returns rows by map cell in `view`, then by `tessera_id`. `stored` returns
        them in the order the record store holds items, which groups items by their full set of
        access labels. The two orders return the same rows. With neither `order` nor `cursor`, the
        server takes `stored` when any named field's `homes` in `/v1/meta` is `["record"]`, and
        `map` otherwise; that choice may change. Reading a field held only in the record store in
        map order was measured 1.3 to 1.8 times slower than in stored order at 100,000-row pages,
        and 8 to 17 times slower at 1,000-row pages.

        **Pages.** A page ends at `page_rows` rows, or before the row that would take its Arrow
        bytes past `selection.max_page_bytes`; a single larger row is sent alone. A page holds at
        least one row while any remain, with one exception: a response that would otherwise carry
        no page carries one page of no rows, so that every response gives the read's columns and
        their types. That page's end carries the trailer's `next`, and `ended_by` `end` where
        `next` is null and `time` otherwise, and the trailer counts it as a page. When the
        response's time budget runs out, or the stream deadline cancels it, a page holding rows is
        sent short and the trailer follows. Every response moves the cursor on, including one
        that found no row under a sparse filter. A response can run past its time budget by one
        evaluation of the filter over a stretch of rows and one chunk of a page's scan.

        **Cursor.** Opaque, encrypted and authenticated under a key derived from the identity key,
        and bound to the route, the view and its incarnation, the order, and the credential that
        received it. A cursor that fails any of these is one `422` with one detail. A cursor
        issued under another idset is the `409` below. A cursor survives flushes, merges,
        compactions and restarts, and stops opening when the identity key is rotated.

        Runs under its own admission limit, `serve.bulk_admission`, so a long read takes no slot
        from the viewport and item routes. A read past the limit is refused at once with `429`.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemsRequest"
      responses:
        "200":
          description: The framed body. The headers are the viewport's, without its cache coordinates.
          headers:
            x-tessera-identity-key:
              description: The viewport's identity key for this principal and view, equal to the one a viewport over the same view returns. Absent only from a response cancelled before its first page, which is a head and a trailer ending by `deadline`.
              required: false
              schema:
                type: string
            x-tessera-region:
              description: "Present exactly when the request's `filters` carry a `region` leaf, with the viewport's values: the coarsest answer the head's count and the first page reached."
              required: false
              schema:
                type: string
                pattern: "^(exact|cover; depth=[0-9]+)$"
            x-tessera-server-us:
              description: Server time from admission to the head, in microseconds. The whole response's time is the trailer's `stream_us`.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
            x-tessera-admission-us:
              description: Time spent being admitted, in microseconds. Near zero, since a bulk read does not wait for a slot.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: A head, records frames each followed by a page end, and a trailer.
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: Unknown `view`, or a pin naming no view of its field's group that this principal can reach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`idset` was sent and is not the deployment's, or the cursor was issued under another idset. Resolve the items again by external id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The request needs to change:

            - the viewport's filter refusals;
            - an unknown key, a missing `view` or `fields`, or an `order` or `compression` outside its values;
            - an unknown or repeated field;
            - an unpinned group-scoped field outside its group, a pin on a field that is not group-scoped, or a group-scoped `text` field;
            - an unknown system field;
            - `page_rows` or `pages` of 0;
            - `count` with a `cursor`;
            - a cursor that does not open for this request, or whose order differs from `order`.

            `page_rows` above `selection.max_page_rows` is capped, not refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/items/{tessera_id}:
    post:
      tags: [viewer]
      operationId: item
      summary: One item's whole record, if this principal may see it.
      description: |
        The record is keyed by declared column name. A category appears as its vocabulary's key,
        and every number as a JSON number. A field the item has no value in is absent from
        `fields`, not `null`. `external_id` is the caller's own, in base64, present only where the
        item has one; it is the only place this plane serves an external id.

        `views` names every view the item is in that this principal may reach, each with the
        position that view places it at, and `scoped` carries the group-scoped values by the
        group's key. Both are filtered to the session's reachable views, so an item held only in
        views this principal cannot reach has an empty `views` and no scoped values, and nothing on
        this route names a view the principal cannot reach.

        `404 unknown` is the same status, code, detail and work for an identifier that names
        nothing and one that names an item this principal may not see. Subject to compute
        admission.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/TesseraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          $ref: "#/components/responses/Unknown"
        "409":
          description: "`idset` was sent and is not the deployment's. Resolve the item again by external id. Decided before the identifier is inverted, and the same for every identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/artifacts:
    post:
      tags: [viewer]
      operationId: artifacts
      summary: Every artifact of one layer this principal is served, page by page, with the properties the caller names.
      description: |
        The body is framed as `POST /v1/items` frames its body: a `6` head (JSON `ArtifactsHead`),
        `7` records frames each followed by an `8` page end (JSON `PageEnd`), and a `4` trailer
        (JSON `RecordsTrailer`). Its pages, budgets, page ends, trailer and cursor follow that
        route's rules, and a read is carried across responses by passing each response's `next`
        back as `cursor` until it is null. Every page is built from the latest data with the
        visible set composed again, so a deletion or suppression accepted during a read applies
        from the next page.

        **Rows.** Every artifact of `layer` this principal is served when its page is built,
        ordered by level and then by publication order within the level. Each page applies the
        viewport's own test to each artifact it walks: the artifact's label, its layer's existence
        criterion over this principal's visible members, and, where the layer declares content,
        whether this principal may read it. An attached artifact, such as a clustering's label, is
        served only while the artifact it is attached to is. Publication order is the publisher's
        and is not grouped by access labels.

        **Narrowing.** `level` reads one level of a levelled layer. `parent` reads the artifacts
        naming that artifact among their parents; a parent this principal is not served answers
        as a parent with no children does. `q` keeps the artifacts whose key, or whose first
        served text content, contains it, ignoring case; an authored shape is not text and is not
        searched. `filters` keeps the artifacts with at least one visible member matching it, and
        adds a `matched_count` column; under `keep_unmatched` every served artifact is returned,
        those with no matching member with a zero. An attached artifact is counted by the artifact
        it is attached to: its `matched_count` is its target's, it is kept or dropped as its
        target is, and the head's `matched` counts it so, as the viewport gives it its target's
        matched bit. A request with `filters` evaluates the filter over the whole view once per
        response.

        **Columns.** `tessera_id` (`uint64`) first, then the named properties in the order named,
        then `matched_count` (`uint64`) whenever the request carries `filters`.

        - `key`: `utf8`, null where the publisher supplied none.
        - `level`: `uint32`, the declared level, 0 on a layer without levels.
        - `parents`: `list<uint64>`, the parents this principal is also served.
        - `target`: `uint64`, the artifact this one is attached to, null where none.
        - `masked_count`: `uint64`, how many members this principal can see.
        - `content`: `list<utf8>`, the supplied content this principal is served, in the order of
          the layer's `supplied_content`, with an authored shape's slot empty, since that shape is
          served as `shape`.
        - `centroid`: `float64` columns `centroid_x` and `centroid_y`, over the members this
          principal can see, in the view's coordinates as `POST /v1/items` converts `position`,
          null where it sees none. A centroid is the members' mean in the view's projected space,
          converted, so on a geographic view it is not the mean of their longitudes and latitudes.
        - `box`: `float64` columns `box_x_min`, `box_y_min`, `box_x_max` and `box_y_max`, on the
          same terms.
        - `shape`: `binary`, a WKB `MultiPolygon` in the view's coordinates, null on a layer that
          draws no geometry: a hull over the members this principal can see, or a spatial or
          authored shape whole, as `POST /v1/artifacts/{tessera_id}` serves it. Every ring is
          closed and holds at least four points; a hull over one or two members, or over members
          on one line, is a zero-area polygon over their positions, repeated.

        **Cursor.** Bound to the route, the view and its incarnation, the layer, the `level` named
        and the credential that received it. A cursor that fails any of these is one `422` with
        one detail; one issued under another idset is the `409` below.

        Runs under the bulk-read admission limit, `serve.bulk_admission`, with `POST /v1/items`. A
        read past the limit is refused at once with `429`.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactsRequest"
      responses:
        "200":
          description: The framed body, with `POST /v1/items`' headers.
          headers:
            x-tessera-identity-key:
              description: As on `POST /v1/items`.
              required: false
              schema:
                type: string
            x-tessera-region:
              description: "Present exactly when the request's `filters` carry a `region` leaf, with the viewport's values."
              required: false
              schema:
                type: string
                pattern: "^(exact|cover; depth=[0-9]+)$"
            x-tessera-server-us:
              description: Server time from admission to the head, in microseconds.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
            x-tessera-admission-us:
              description: Time spent being admitted, in microseconds.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: A head, records frames each followed by a page end, and a trailer, as on `POST /v1/items`.
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: Unknown `view`, or one this principal cannot reach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`idset` was sent and is not the deployment's, or the cursor was issued under another idset."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The request needs to change:

            - the viewport's filter refusals;
            - an unknown key, or a missing `view`, `layer` or `fields`;
            - a layer that is unknown or not published to this principal, with one detail for both;
            - `level` on a layer whose kind has one level, or naming a level the layer does not hold;
            - an unknown or repeated property;
            - `parent` with `q`;
            - `page_rows` or `pages` of 0;
            - `count` with a `cursor`;
            - a `compression` outside its values;
            - a cursor that does not open for this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/artifacts/browse:
    post:
      tags: [viewer]
      operationId: browseArtifacts
      summary: "One page of a layer's hierarchy, by lineage: its roots, an artifact's children and parents, or a name search."
      description: |
        This route does not depend on the viewport. A layer whose artifacts are spread across the
        map may draw nothing at any zoom the viewport's budget reaches; this route serves the same
        artifacts by relation instead of by position, each row carrying the masked count the
        artifacts frame carries.

        **Three forms.** With neither `parent` nor `q` it returns the layer's roots, the artifacts
        with no served parent. `parent` returns the artifacts naming that one among their parents,
        with the named artifact's own served parents in `parents`, which is `[]` in the other two
        forms. `q` returns the artifacts whose key, or first supplied text content, contains it,
        ignoring case. Both together is `422`.

        **Visibility first.** Every artifact served has passed its own existence criterion,
        evaluated over the form's whole candidate set before `limit` and `cursor` apply, so a
        page's fill and its `next` count only artifacts this principal may see, and a withheld
        artifact leaves no gap. The order is total: count descending, then `tessera_id` ascending,
        so a cursor over tied counts neither repeats nor skips a row. A relation is named only
        where both ends are served: a child whose parent is withheld is a root here, and a parent
        below this principal's criterion is absent from `parents`.

        **Refusals.** They name deployment schema and never an artifact. An unknown layer, an
        attached layer, a `level` on a kind with one level, a level the layer does not hold,
        `limit = 0`, and both `parent` and `q`, are each `422`. A `parent` that names nothing, one
        of another layer, one suppressed, and one below this principal's criterion answer an empty
        page, since a refusal would tell the caller the artifact exists.

        Subject to compute admission.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowseRequest"
      responses:
        "200":
          description: One page of the layer's hierarchy as this principal sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: "`404 unknown`: no such `view`, or one this principal may not reach. The two give one answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`422 contract`: an unknown or attached layer, a `level` the kind or the layer does not have, `limit = 0`, both `parent` and `q`, or a malformed `filters`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/artifacts/{tessera_id}:
    post:
      tags: [viewer]
      operationId: artifact
      summary: One annotation artifact, with its masked count and geometry for this principal.
      description: |
        A separate route from `/v1/items/{tessera_id}`, so the shape of an answer does not say
        which of the two an identifier names. `masked_count` is this principal's count of the
        artifact's members, not its size. Geometry is computed per principal from the members this
        principal can see, in the same 32-bit-per-axis grid units as the viewport's `code`, so a
        client does not keep one principal's geometry for another. An absent geometry field means
        the layer declares no such property; an artifact whose content cannot be served is a
        `404` whole.

        Nothing by that identifier, a point's identifier, a layer this principal cannot reach, a
        suppressed artifact, and one below its layer's existence criterion all give one `404`.
        Subject to compute admission.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/TesseraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactRequest"
      responses:
        "200":
          description: The artifact as this principal sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: "`404 unknown`: nothing this principal may see by that identifier. An unknown `view` gets the same answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A stale `idset`, as on `/v1/items/{tessera_id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /control/ingest:
    post:
      tags: ["control: ingest"]
      operationId: ingest
      summary: Insert a batch of new items into one view.
      description: |
        The body is the batch's rows. `content-type` chooses the encoding: `application/json`,
        `application/x-ndjson` or none at all is JSON, an array of objects or one object per line,
        each keyed by column name; `application/vnd.apache.arrow.stream` is an Arrow IPC stream of
        one or more record batches. Any other `content-type` is `422`.

        **Columns.** The coordinates are `x` and `y` on a view whose projection is `none`, and
        `lon` and `lat` in degrees on any other; a number on every row in JSON, `float32` or
        `float64` in Arrow. A coordinate outside the view's extent is stored on its edge and
        counted in `clamped`; one outside the projection's domain is counted in `clipped`; a
        non-finite one is `422`. `access` holds the row's access labels: in JSON a string, a list
        of strings or `null`; in Arrow a required column of strings, lists of strings or a
        dictionary of strings. A null, an empty list and a label empty once trimmed are no label. A
        row with no label takes the view's `point_visibility.default`, and the batch is `422` where
        the view declares none. `external_id` is optional, base64 in JSON and `binary` in Arrow, at
        most 64 bytes. `node_id` is accepted and not stored. Every other column is a declared
        attribute, a group-scoped attribute of the view's group, or an enumerated layer; any other
        name is `422`.

        **Attributes.** A declared attribute the batch leaves out is absent on every row, and is
        counted in `padded_columns`. In JSON, an attribute one row names is named on every row,
        `null` where the row has no value. A category takes its vocabulary's key: under a `closed`
        vocabulary an unknown key is `422`, and under an `open` one it is added. An integer is
        read exactly, from a JSON number or a string of digits; `timestamp_us` is microseconds
        since the Unix epoch.

        **Layers.** A column named after an enumerated layer places each row in that layer's
        artifacts: a key, or a list of keys whose meaning follows the layer's `hierarchy`, `null`
        or `-1` for none. A `level` column places the keys at a level. On a `closed` layer an
        unknown key is `422`; on an `open` one it creates the artifact, counted in `minted`. A
        layer scoped to a view group needs the batch's view to be one of that group's.

        **Identity.** An external id that already has a row in this view is `409`: a position is
        not updated in place. One that has a row in another view joins that item, and a joining row
        whose labels or values differ from the item's is `409`. One whose item was deleted starts
        a new item, and one whose item is suppressed joins it and stays hidden. Two rows with the
        same external id are `409`.

        **Retries.** `x-tessera-batch-id` names the batch. The same bytes sent again under the same
        id answer `200` with `replayed: true` and change nothing; different bytes under a used id
        are `409`.

        **Limits.** The body is at most `ingest.ingest_max_batch_bytes` and the batch at most
        `ingest.ingest_max_batch_rows` rows; either over is `422`, and `/control/status` publishes
        both under `limits.ingest`. Past `ingest.ingest_admission` requests in flight across this
        route and `POST /control/values`, and while `ingest.ingest_buffer_max_items` items are
        buffered, the request is `429`. A `401` is answered before any other refusal, and a `429`
        for admission before the body is decoded.

        The answer follows the write-ahead log's fsync. The rows become visible in the publication
        cycle `publication` names.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/WriteView"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRecords"
          application/x-ndjson:
            schema:
              type: string
              description: One JSON object per line, each an `IngestRecord`. Blank lines are skipped.
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: An Arrow IPC stream whose columns are the JSON form's, at the Arrow types this route names.
      responses:
        "200":
          description: The batch was accepted, or was a replay of an accepted batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: "`x-tessera-view` names no view."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Nothing was written. The detail names the batch id or the external ids, in base64, where they are the reason.

            - The batch id was used for a different body
            - Two rows share an external id
            - An external id already has a row in this view
            - A row joining an item in another view carries labels or values that differ from the item's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The detail names a row by its index, never by its external id. Nothing was written.

            - The body is over the byte cap or cannot be read
            - `x-tessera-batch-id` is missing
            - `content-type` names another encoding
            - No `x-tessera-view` on a deployment with several views
            - A column is misnamed, undeclared or of the wrong type
            - A cell does not fit its column
            - A key is not in a closed vocabulary or layer
            - Unlabelled rows on a view with no default
            - The batch is over the row cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          description: "`503 not-ready`: the write executor is not running, or a partition is serving a stepped-down manifest. Nothing was taken."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /control/values:
    post:
      tags: ["control: values"]
      operationId: values
      summary: Fill attribute values, and layer memberships, on items that already exist.
      description: |
        The body is encoded as `POST /control/ingest`'s is, and creates no item. A row names its
        item by exactly one of `external_id`, and `tessera_id` with the `idset` it was minted
        under. `tessera_id` is a string of decimal digits, `utf8` in Arrow, and `idset` an integer,
        `uint32` in Arrow. A row naming an item the deployment does not hold is `422`, naming the
        row by its index. The other columns are declared attributes, group-scoped attributes and enumerated
        layers, as on ingest, and a row may leave any of them out.

        **The fill rule.** A cell that holds no value takes the one sent and is counted in
        `filled`. A cell that holds the same value is counted in `held` and is not written again.
        A cell that holds a different value is `409`, and the batch has no effect. A layer column
        adds each row to the artifacts it names, counted in `joined`, and on an `open` layer
        creates the artifacts it does not find, counted in `minted`.

        **Views.** A group-scoped attribute or a layer scoped to a group is written under the key
        of the view `x-tessera-view` names, which must be a view of that group. Without the header
        the batch may carry entity-scoped columns only.

        Retries, byte and row caps and admission are `POST /control/ingest`'s, and `/control/status`
        publishes the caps under `limits.values`. A replay answers `replayed: true`, `filled: 0`
        and `held` equal to the row count.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/WriteView"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesRecords"
          application/x-ndjson:
            schema:
              type: string
              description: One JSON object per line, each a `ValuesRecord`. Blank lines are skipped.
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: An Arrow IPC stream whose columns are the JSON form's. Every record batch of the stream carries the same columns.
      responses:
        "200":
          description: The batch was applied, or was a replay of an applied batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuesResponse"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: "`x-tessera-view` names no view."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cell holds a different value, the batch id was used for a different body, or `idset` is not the deployment's. The detail never names the held value. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Nothing was written.

            - The body is over the byte cap or cannot be read
            - `x-tessera-batch-id` is missing
            - A row names no item, two, one the deployment does not hold, or a `tessera_id` without an `idset`
            - Two idsets in one batch
            - A column is undeclared or of the wrong type
            - A scoped column or layer without a view of its group
            - The batch is over the row cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/changes:
    post:
      tags: ["control: changes"]
      operationId: changes
      summary: Delete, suppress or lift the suppression of items.
      description: |
        `delete` removes an item from every view and every count; the compaction fold removes its
        rows from disc. `suppress` hides an item from every viewer until `unsuppress` lifts it.
        There is no edit: to change an item's access labels, delete it and ingest it again under
        the same external id, and `op: "predicate"` is refused with that advice.

        Every item is checked and its address resolved before any is applied, so a request with one
        bad item applies nothing. An unknown `tessera_id` is answered ahead of an unknown external
        id. A request carries at most 10,000 items in at most 2 MiB; over either is `422`, and
        `/control/status` publishes both under `limits.changes`.

        A deletion or suppression is in force from the moment it is accepted, for every request,
        and the `200` follows the write-ahead log's fsync. This route is never shed with `429` and
        has no readiness check. A `500` means a change may be in force without being durable:
        sending the same request again is safe, and treating the items as visible is not.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ChangeItem"
      responses:
        "200":
          description: Every change is applied and durable. `publication` is the next cycle; the changes do not wait for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: An external id or a `tessera_id` names nothing the deployment holds. Nothing was applied. For a `tessera_id` the detail names the item by its index in the request; for an external id it is a fixed detail naming neither.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`idset` is not the deployment's. Nothing was applied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Nothing was applied.

            - The body is not a JSON array of change items, is over 2 MiB or carries more than 10,000 items
            - An unknown `op`
            - An item naming neither or both of `external_id` and `tessera_id`
            - `idset` with `external_id`, or none with `tessera_id`
            - Two idsets in one request
            - An external id that is not base64
            - A `tessera_id` that is not a decimal string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "`500 fail-closed`: the request was attempted and did not complete. The detail says whether a change may be in force and whether one was certainly not applied. Send the whole request again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`503 not-ready`: no item reached the write executor, which is not running. Nothing was applied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /control/status:
    get:
      tags: ["control: status"]
      operationId: status
      summary: The node's state, its counters and the write routes' limits.
      description: |
        One JSON document, read fresh on every request, including corpus-wide figures such as
        `entity_id_high_water`. Counters count from the process's start.

        `readiness` and `write_executor.ready` report whether the write executor's `posture` is
        `running`, and nothing else. `/readyz` also fails while a partition serves a stepped-down
        manifest, so it can answer `503` while this document reads ready.
      security:
        - operatorCredential: []
      responses:
        "200":
          description: The status document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"

  /control/flush:
    post:
      tags: ["control: flush"]
      operationId: flush
      summary: Publish buffered writes at the next tick instead of waiting for it.
      description: |
        Pulls the next publication cycle forward and answers `202` without waiting for it; two
        requests before one tick share it. `publication` names the first cycle certain to include
        every write buffered before the request. With `wait=visible` the `202` is held until that
        cycle has run, or until `serve.visible_wait_max_secs` passes. A tick flushes one view's
        buffered rows. Where several views hold rows, the cycle stays open, and `publication` does
        not reach its number, until every one of them has been published. A request body is not
        read.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      responses:
        "202":
          description: The cycle is requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "422":
          description: "`wait` has a value other than `visible`, or the query names another parameter. No cycle was requested."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /control/compact:
    post:
      tags: ["control: compact"]
      operationId: compact
      summary: Ask for a compaction fold at the next tick.
      description: |
        Sets a flag the write executor reads at its next tick, and answers `202` with no body. A
        fold rewrites the bundle with deleted rows removed and runs for minutes to hours on a
        large corpus. A request while a fold runs is dropped, and the `202` cannot say so;
        `compaction` on `/control/status` shows what happened, including a fold refused for want
        of memory or disc. The query string is not read.
      security:
        - operatorCredential: []
      responses:
        "202":
          description: The fold is requested. No body.
        "401":
          $ref: "#/components/responses/OperatorBadCredential"

  /control/attributes:
    put:
      tags: ["control: attributes"]
      operationId: declareAttribute
      summary: Declare an attribute column.
      description: |
        The body is a corpus declaration's `[[attribute]]` block in JSON, without the keys that
        say where a build reads the values. The column is added after every column declared
        before it. From the answer on, a batch may carry the column, `/v1/meta` lists it, and every
        item holds no value in it until one is written.

        The name is the column's identity. Declaring it again with the same fields answers `200`
        and changes nothing; with any field different it is `409`. A name a layer holds is `422`.
        `render = true` is refused on this route: declare a rendered column at a build.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDeclaration"
      responses:
        "200":
          description: The name already carries this declaration. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDeclared"
        "201":
          description: The column is declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDeclared"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "409":
          description: The name is declared with a different type, vocabulary, analyser, flags or scope. A column's type is written into every row, so it cannot change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: |
            - An unknown field or type
            - `render = true`
            - A name that is not a valid column name or is a layer's
            - A category with no `vocabulary`, or one naming no vocabulary
            - `vocabulary` on another type
            - `analyser` on a type other than `text`, or an unknown analyser
            - A group scope naming no view group, or a group that takes its views from another
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/vocabularies/{name}:
    put:
      tags: ["control: vocabularies"]
      operationId: declareVocabulary
      summary: Declare a vocabulary, the value set a category column draws on.
      description: |
        The body is a corpus declaration's `[[vocabulary]]` block in JSON, without the keys that
        say where a build reads the values. The server draws every value's code; a body naming a
        `code` is `422`.

        The name, `value_set`, `visibility`, `width` and `reserved` are the vocabulary's identity.
        Declaring it again with the same identity answers `200`, applies `values` as a page, as
        `PATCH /control/vocabularies/{name}/values` does, and changes nothing else. With a
        different identity it is `409`.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/VocabularyName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyDeclaration"
      responses:
        "200":
          description: The name already carries this identity, and the values were applied as a page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyDeclared"
        "201":
          description: The vocabulary is declared with the values sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyDeclared"
        "400":
          $ref: "#/components/responses/NotJsonOrPathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "409":
          description: The name is declared with a different value set, visibility, width or reserved list. A code's width is written into every row that carries one, so it cannot change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: |
            - An unknown field, such as `code`
            - A name that is not a valid identifier
            - A `width` other than `u8`, `u16` or `u32`
            - A reserved code that is 0 or past the width
            - An empty key, or a key named twice
            - More values than the width holds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/vocabularies/{name}/values:
    patch:
      tags: ["control: vocabularies"]
      operationId: addVocabularyValues
      summary: Add a page of values to a vocabulary, and set their titles.
      description: |
        Adds each key the vocabulary does not hold, with a code the server draws. A key it holds
        keeps its code. A title sent for a held key replaces the key's title, so a client draws the
        new name while every row carrying the code keeps its meaning. A page removes nothing. A
        page that adds no key and changes no title writes nothing.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/VocabularyName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyValues"
      responses:
        "200":
          description: The page is applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyValuesAdded"
        "400":
          $ref: "#/components/responses/NotJsonOrPathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: No vocabulary has this name. A page does not create one, since a vocabulary's width and visibility are its declaration's to state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: An unknown field; an empty key, or a key named twice; more values than the vocabulary's width holds. Nothing was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/view_groups/{name}:
    put:
      tags: ["control: view groups"]
      operationId: declareViewGroup
      summary: Declare a view group, whose views are created one key at a time.
      description: |
        The body is a corpus declaration's `[[view_group]]` block in JSON, without its roster and
        its source. The group starts with no views; `PUT /control/views/{group}/{key}` creates
        them. A group's name and a plain view's name share one namespace.

        The name is the group's identity. Declaring it again with the same fields answers `200`
        and changes nothing; with any field different it is `409`.
      security:
        - operatorCredential: []
      parameters:
        - name: name
          in: path
          required: true
          description: The group's name, which its views' ids begin with.
          schema:
            type: string
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewGroupDeclaration"
      responses:
        "200":
          description: The name already carries this declaration. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewGroupDeclared"
        "201":
          description: The group is declared, with no views.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewGroupDeclared"
        "400":
          $ref: "#/components/responses/NotJsonOrPathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: "`members` names no view group."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The name is declared with a different title, frame, projection, visibility, point default, metadata or `members`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: |
            - An unknown field
            - A name that is not a valid key, or a plain view's
            - An unknown projection
            - An extent that is not finite or has a maximum below its minimum
            - `members` naming a group that takes its own views from another, or with `metadata`
            - A metadata name declared twice, or of type `category`
            - A `visibility` label or point default the auth plugin refuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/views/{name}:
    put:
      tags: ["control: views"]
      operationId: declarePlainView
      summary: Declare a plain view, a coordinate system that belongs to no group.
      description: |
        The body is a corpus declaration's `[[view]]` block in JSON, without its source. The view
        starts with no rows and takes them at its first flush. A plain view's name and a group's
        name share one namespace, and a plain view has no drop route.

        The name is the view's identity. Declaring it again with the same fields answers `200` and
        changes nothing; with a different title, frame, projection, visibility or point default it is
        `409`.
      security:
        - operatorCredential: []
      parameters:
        - name: name
          in: path
          required: true
          description: The view's id, as a viewer request names it.
          schema:
            type: string
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlainViewDeclaration"
      responses:
        "200":
          description: The name already carries this declaration. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlainViewDeclared"
        "201":
          description: The view is declared, with no rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlainViewDeclared"
        "400":
          $ref: "#/components/responses/NotJsonOrPathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "409":
          description: The name is declared with a different title, frame, projection, visibility or point default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: |
            - An unknown field
            - A name that is not a valid key, or a view group's
            - An unknown projection
            - An extent that is not finite or has a maximum below its minimum
            - A `visibility` label or point default the auth plugin refuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/views/{group}/{key}:
    put:
      tags: ["control: views"]
      operationId: createView
      summary: Create a view of a view group.
      description: |
        The view's id is `<group>:<key>`. It starts with no rows, and takes the group's frame and
        projection. A viewer reaches it only where they satisfy the group's `visibility` and the
        view's own, where one is sent. A session authorised before the view was created does not
        reach it until it authorises again. Its metadata carries one value per name the group
        declares, each typed by its JSON form: a boolean, an integer, a number with a fraction, or
        a string. The record cannot be changed after it is created.

        A key held by a live view is `409`. A dropped key may be created again, and the new view
        starts with none of the old one's rows or artifacts.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/ViewGroup"
        - $ref: "#/components/parameters/ViewKey"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRecord"
      responses:
        "201":
          description: The view is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewCreated"
        "400":
          $ref: "#/components/responses/NotJsonOrPathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: No view group has this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A live view holds this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: |
            - An unknown field
            - A key that is not valid
            - A metadata value that is null, an array or an object, or that does not match the type the group declares
            - A metadata name the group does not declare, or one it declares left out
            - A `visibility` label the auth plugin refuses
            - A group that takes its views from another
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"
    delete:
      tags: ["control: views"]
      operationId: dropView
      summary: Drop a view of a view group and free its key.
      description: |
        The view leaves every roster at once, including the rosters of groups sharing its views,
        and its rows stay on disc, unreachable, until the compaction fold. Its artifacts become
        unreachable with it. Rows and group-scoped values buffered for it and not yet flushed are
        discarded, and `fills_dropped` counts the values.

        No item is deleted unless `delete_dangling` is `true`: then every item with a row in this
        view and in no other is deleted, as `POST /control/changes` deletes it, and `deleted`
        counts them.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/ViewGroup"
        - $ref: "#/components/parameters/ViewKey"
        - name: delete_dangling
          in: query
          required: false
          description: Also delete the items that have a row in this view and no other. Absent is `false`.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: The view is dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewDropped"
        "400":
          $ref: "#/components/responses/PathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: No live view of this group holds this key, or no group has this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            - `delete_dangling` is not `true` or `false`
            - `wait` has a value other than `visible`
            - The query names another parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/layers:
    put:
      tags: ["control: layers"]
      operationId: registerLayer
      summary: Register an annotation layer.
      description: |
        The body is a corpus declaration's `[[layer]]` block in JSON. `views` may name a view
        group, which stands for every view the group holds when the layer is registered. The
        answer follows the write-ahead log's fsync and carries the layer's `tessera_id`, the address
        `POST /control/changes` suppresses it by.

        A layer's name is its identity for ever: a name already registered, or one a dropped layer
        held, is `422`, including a second request with the same declaration. A refusal means the
        layer does not exist.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayerDeclaration"
      responses:
        "201":
          description: The layer is registered, with no artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerRegistered"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: |
            - An unknown field
            - A name that is empty, `all`, registered, or held by a dropped layer
            - A view that is neither a view nor a view group
            - A view outside the group a group-scoped layer names
            - A `depends_on` layer that is not registered, or the layer itself
            - Levels on a `nested` or `dag` layer, none on a `stacked` or `tiered` one, levels not numbered densely from 0, or a level whose `zoom` range holds no depth
            - A `fraction` outside (0, 1], or on a `spatial` or attribute layer
            - `shape` on a layer that is not `spatial`
            - Two drawn geometries
            - Content, dependencies, levels, labels or a layout on an attribute layer
            - An unknown computed property
            - A repeated view, level title or content name
            - A label the auth plugin cannot read
            - A `spatial` layer over both projected and unprojected views
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/layers/{name}:
    delete:
      tags: ["control: layers"]
      operationId: dropLayer
      summary: Drop a layer and retire its name.
      description: |
        The layer and its artifacts stop being served at once. Its name is never registered again,
        since bookmarks, edges and suppressions name a layer, and its entity ids are not reused.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/LayerName"
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: The layer is dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
        "400":
          $ref: "#/components/responses/PathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "422":
          description: |
            - No layer is registered under this name
            - `wait` has a value other than `visible`
            - The query names another parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/layers/{name}/artifacts:
    put:
      tags: ["control: artifacts"]
      operationId: publishArtifacts
      summary: Publish artifacts into one level of a layer, all or none.
      description: |
        The body is JSON only; `application/vnd.apache.arrow.stream` is `422`. Each artifact names
        its members by `members`, or by `excluding`, the view's items it leaves out. Members are
        addressed as the batch's `addressing` says: base64 external ids, or `tessera_id` decimal
        strings under the batch's `idset`. A member that names nothing is `404`, and a deleted one
        is `422`.

        An artifact whose `key` the level already holds is not created again: its members are
        added to the held membership, and a part it lacks (its parents, attachment, contents,
        shape or access labels) is filled. A part it holds with a different value is `409`, and the
        detail never names the held value. The answer is `201` if the batch created an artifact,
        and `200` if every key was held.

        A large membership is published with its first page here and the rest with `PATCH`.
        Per request: at most `ingest.max_artifacts_per_request` artifacts, `excluding` at most
        `ingest.max_excluded_per_request` long, a body of at most `ingest.publish_max_body_bytes`,
        and a shape of at most `serve.max_shape_vertices` vertices after it is fitted to each view.
        Over any is `422`; `/control/status` publishes them under `limits.publish`.

        The answer gives each artifact's `tessera_id` in the order sent, and never an ordinal or a
        membership's size. `shapes` reports what fitting each shape to each of the layer's views
        did.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/LayerName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Every key was held; the batch added members or filled parts, or changed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsPublished"
        "201":
          description: The batch created at least one artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsPublished"
        "400":
          $ref: "#/components/responses/PathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: A member or a content's generating set names nothing the deployment holds. The detail names it by its position in the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A held artifact holds a part with a different value, or a second `excluding` for a held key; or `idset` is not the deployment's. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            - The body is not JSON, is over its cap or is Arrow
            - An unknown field
            - No artifacts, or more than the cap
            - An artifact with neither `members` nor `excluding` that attaches to nothing, or with both
            - An exclusion list over its cap
            - `view` missing on a layer scoped to a group or present on another
            - `idset` missing with `tessera` addressing or present with `external`
            - A member that is not base64 or not a decimal string
            - A deleted member, or one that names no item with a row
            - An external-id member where the deployment carries no external ids
            - An unknown layer or level, or a layer whose membership is an attribute
            - A shape on a layer that declares none, none on one that does, the wrong kind, or one over the vertex cap
            - Labels the layer does not take, or none where it requires them
            - A parent or attachment that does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"
    patch:
      tags: ["control: artifacts"]
      operationId: growMemberships
      summary: Add members to artifacts a level holds, remove them from generating sets, and fill missing parts.
      description: |
        Each row names an artifact by the key it was published under; an unknown key is `422`, and
        this verb creates nothing. `members` joins the membership. With a `rank`, `members` and
        `leaving` move the generating set of the content at that rank instead, and a page that
        empties the set withdraws the content, reported as `withdrawn`. A part the artifact lacks
        is filled; one it holds with a different value is `409`. The batch commits whole. Only an
        `enumerated` layer's artifacts can be grown; a `spatial` or attribute layer is `422`.

        The body is JSON, or an Arrow IPC stream as `application/vnd.apache.arrow.stream`. The
        Arrow form carries one row per artifact: `key` as `utf8`, `members` as `list<utf8>` or
        `large_list<utf8>`, and optionally `view` as `utf8` and `access` in any form ingest's
        `access` takes, with `addressing`, `level` and `idset` in the schema's metadata as strings.
        It carries joining members and access labels only; every other part travels as JSON. Any
        other column or metadata key is `422`.

        At most `ingest.max_members_per_request` members, joining and leaving together, and a body
        of at most `ingest.publish_max_body_bytes`; over either is `422`, and `/control/status`
        publishes both under `limits.grow`. The answer never carries an ordinal or a membership's
        size.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/LayerName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrowRequest"
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: One row per artifact, with the envelope in the schema's metadata, as this route describes.
      responses:
        "200":
          description: The batch is applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipsGrown"
        "400":
          $ref: "#/components/responses/PathNotUtf8"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: A member names nothing the deployment holds. The detail names it by its position in the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An artifact holds a part with a different value, or `idset` is not the deployment's. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            - The body cannot be read or is over its cap
            - An unknown field, column or metadata key
            - No artifacts
            - More members than the cap
            - An unknown key, layer or level
            - A layer whose membership is not `enumerated`
            - `leaving` without a `rank`
            - `view` missing on a layer scoped to a group or present on another
            - `idset` missing with `tessera` addressing or present with `external`
            - A member that is not base64 or not a decimal string
            - A deleted member, or one that names no item with a row
            - An external-id member where the deployment carries no external ids
            - A shape the layer does not take
            - A content without a generating set on a layer whose content requires every member visible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

components:
  securitySchemes:
    sessionCredential:
      type: http
      scheme: bearer
      description: The session credential, a shared secret read from the file `serve.session_credential_file` names or the environment variable `serve.session_credential_env` names. Compared in constant time. Never handed to a browser.
    operatorCredential:
      type: http
      scheme: bearer
      description: The operator credential, a shared secret read from the file `serve.operator_credential_file` names or the environment variable `serve.operator_credential_env` names. Compared in constant time. Every path on the control listener requires it, and it is checked before the request's query or body is read, so a caller without it is answered `401` ahead of any other refusal.
    sessionToken:
      type: http
      scheme: bearer
      description: The `token` `POST /session/authorise` minted. A missing, malformed or unrecognised token, a revoked one included, is `401 bad-credential`; a recognised token past `expires_at` is `403 expired-token`. Either means the session has ended.

  parameters:
    TesseraId:
      name: tessera_id
      in: path
      required: true
      description: The item's or artifact's opaque identifier, a `u64` in decimal. It is a keyed permutation of the internal identity that blinds it, stable across sessions and meaningless without the key. It is not encryption.
      schema:
        type: string
        pattern: "^[0-9]+$"
    Wait:
      name: wait
      in: query
      required: false
      description: "`visible` holds the answer until the publication cycle this write is in has run, or until `serve.visible_wait_max_secs` passes, and the answer's `visible` says which. Absent answers at once. Any other value, or a query parameter the route does not define, is `422`."
      schema:
        type: string
        enum: [visible]
    BatchId:
      name: x-tessera-batch-id
      in: header
      required: true
      description: The batch's identity, chosen by the caller, for retries. The same body sent again under the same id is answered as it was and changes nothing; a different body under a used id is `409`. Missing, or not UTF-8, is `422`.
      schema:
        type: string
    WriteView:
      name: x-tessera-view
      in: header
      required: false
      description: The view the batch writes into, by id. Required where the deployment has more than one view. A name no view has is `404`; a value that is not UTF-8 is `422`.
      schema:
        type: string
    VocabularyName:
      name: name
      in: path
      required: true
      description: The vocabulary's name, as an attribute's `vocabulary` names it.
      schema:
        type: string
    ViewGroup:
      name: group
      in: path
      required: true
      description: The view group's name.
      schema:
        type: string
    ViewKey:
      name: key
      in: path
      required: true
      description: The view's key within its group. The view's id is `<group>:<key>`.
      schema:
        type: string
    LayerName:
      name: name
      in: path
      required: true
      description: The layer's name. A `/` in it is sent as `%2F`.
      schema:
        type: string

  responses:
    OperatorBadCredential:
      description: "`401 bad-credential`: the operator credential is missing or wrong. Nothing about the request was read."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotJson:
      description: The JSON body does not parse. The HTTP framework answers this before the handler runs, with a plain-text body.
      content:
        text/plain:
          schema:
            type: string
    PathNotUtf8:
      description: A path segment is not UTF-8 once percent-decoded. The HTTP framework answers this before the handler runs, with a plain-text body.
      content:
        text/plain:
          schema:
            type: string
    NotJsonOrPathNotUtf8:
      description: The JSON body does not parse, or a path segment is not UTF-8 once percent-decoded. The HTTP framework answers this before the handler runs, with a plain-text body.
      content:
        text/plain:
          schema:
            type: string
    NotJsonContentType:
      description: "The request does not carry `content-type: application/json`. The HTTP framework answers this before the handler runs, with a plain-text body."
      content:
        text/plain:
          schema:
            type: string
    DeclarationTooLarge:
      description: The body is over 2 MiB, the declaration routes' cap, published on `/control/status` as `limits.declarations.max_body_bytes`. The HTTP framework answers this before the handler runs, with a plain-text body.
      content:
        text/plain:
          schema:
            type: string
    WriteFailed:
      description: "`500 fail-closed`: the write could not be made durable, or the write executor stopped while holding it. It may have been applied in full, so this is not a refusal; the detail says so. Sending the same request again is safe."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExecutorNotReady:
      description: "`503 not-ready`: the write executor is not running. Nothing was taken."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadCredential:
      description: "`401 bad-credential`: the bearer credential is missing, malformed or not recognised. On a token that worked before, the session was revoked, and a client treats it as it treats `403`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExpiredToken:
      description: "`403 expired-token`: the token is recognised and its `expires_at` has passed. Re-authorise."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unknown:
      description: "`404 unknown`: nothing this principal may see by that identifier. The answer is the same whether or not something exists under it."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Contract:
      description: "`422 contract`: the request is wrong. Change it before sending it again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Backpressure:
      description: "`429 backpressure`: the whole request was shed, and nothing was answered in part. Send it again unchanged after `Retry-After`, which agrees with the body's `retry_after_s`."
      headers:
        Retry-After:
          required: true
          description: Seconds. `1` for compute admission and for a request waiting on another's build of the same projection or fragment; the control plane derives its figure from the write executor's service time. Read it rather than assuming it.
          schema:
            type: string
            pattern: "^[0-9]+$"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackpressureError"
    FailClosed:
      description: "`500 fail-closed`: the server could not compute the answer, for example a mask or a composition failed. No partial result is sent."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: The one error envelope, on every plane. The code list is closed.
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - bad-credential
            - expired-token
            - unknown
            - conflict
            - contract
            - backpressure
            - fail-closed
            - not-ready
        detail:
          type: string
          description: Human-readable. On the viewer plane a `404`'s detail is the same for every reason, so it tells a caller nothing about what exists. On the control plane it says what was refused. It may name the caller's own batch id or external ids, as the ingest route's `409`s do, and otherwise names a row or member by its position in the batch.
        retry_after_s:
          type: integer
          minimum: 0
          description: Present on every `429` and on nothing else, and equal to the `Retry-After` header.

    BackpressureError:
      description: An `Error` whose code is `backpressure` and whose `retry_after_s` is present.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [retry_after_s]
          properties:
            error:
              const: backpressure

    AuthoriseRequest:
      type: object
      additionalProperties: false
      required: [auth_data]
      properties:
        auth_data:
          type: string
          contentEncoding: base64
          description: "Bytes the auth plugin evaluates, which the plugin defines. The passthrough plugin reads JSON `{\"terms\": [\"<label>\", ...]}`."

    AuthoriseResponse:
      type: object
      additionalProperties: false
      required: [token, token_id, expires_at]
      properties:
        token:
          type: string
          description: "The session token, sent as `Authorization: Bearer <token>` on the viewer plane. The server does not log it, and the session plane does not take it back."
        token_id:
          type: integer
          minimum: 0
          description: The handle `POST /session/revoke` takes, which grants nothing.
        expires_at:
          type: integer
          minimum: 0
          description: Seconds since the Unix epoch. It is the time of the request plus the server's `token_max_lifetime_secs`.

    RevokeRequest:
      type: object
      additionalProperties: false
      required: [token_id]
      properties:
        token_id:
          type: integer
          minimum: 0

    Meta:
      type: object
      additionalProperties: false
      required: [api_version, bundle_format, idset, views, groups, declared_scalars, scoped_scalars, filter_operands, selection, layers]
      properties:
        api_version:
          type: integer
          const: 1
        bundle_format:
          type: integer
        idset:
          type: integer
          minimum: 0
          description: The identity set the `tessera_id`s were minted under. The identity key itself appears in no response on any plane.
        views:
          type: array
          description: The views this principal may reach, in serving order. A view whose own `visibility` label, or whose group's, the principal does not hold is absent, and naming it in a viewer request is the `404` a name nobody declared gets. The list is only shorter; nothing in it counts the views left out.
          items:
            type: object
            additionalProperties: false
            required: [id, display_name, quantisation, projection, world_aspect, tile_scheme, tile, group, key, metadata]
            properties:
              id:
                type: string
              display_name:
                type: string
              quantisation:
                type: object
                additionalProperties: false
                required: [x_min, x_max, y_min, y_max]
                description: The extent a point's `code` is scaled against in this view, 32 bits per axis over this range. Two views of one bundle may quantise differently, so a client decodes each view's positions against that view's extent.
                properties:
                  x_min: { type: number }
                  x_max: { type: number }
                  y_min: { type: number }
                  y_max: { type: number }
              projection:
                description: What placed this view's positions, as declared, and `none` for a view that projects nothing. The same for every principal.
                type: string
                enum: [web_mercator, equirectangular, gall_isographic, none]
              world_aspect:
                description: The ratio to draw the world at, width over height. `1` for `web_mercator`, `2cos φ₁` for an equirectangular projection, and `null` for `none`, which has no world to draw.
                type: [number, "null"]
              tile_scheme:
                description: The tile scheme this view's frame lines up with, which decides whether a basemap may be drawn under it. A scheme's name rather than a boolean, because an equirectangular frame lines up with a square tiling no server publishes. `null` means draw the points and no basemap.
                type: [string, "null"]
                enum: [xyz, null]
              tile:
                description: The tile this view's frame is under `tile_scheme`. Present exactly when `tile_scheme` is.
                type: [object, "null"]
                additionalProperties: false
                required: [z, x, y]
                properties:
                  z: { type: integer, minimum: 0 }
                  x: { type: integer, minimum: 0 }
                  y: { type: integer, minimum: 0 }
              group:
                description: The view group this view belongs to, or `null` for a plain view. `group`, `key` and `metadata` are `null` together.
                type: [string, "null"]
              key:
                description: This view's key within its group, chosen by the caller when the view was created. `id` is `<group>:<key>`.
                type: [string, "null"]
              metadata:
                description: The typed values this view carries, one per name its group declares. Empty on the views of a group that shares another group's views, whose metadata belongs to the owning group. One value per view, not per item, and nothing filters on it.
                type: [object, "null"]
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required: [type, value]
                  properties:
                    type:
                      type: string
                      enum: [bool, int, float, text, timestamp_us]
                    value:
                      description: The value, of `type`. A `timestamp_us` is microseconds since the Unix epoch.
                      type: [boolean, number, string]
        groups:
          type: array
          description: The view groups this principal may reach, in manifest order, each listing the view ids it may reach in creation order, so a client can offer previous and next without reading meaning into a key. A group cannot be named where a viewer request names a view. A group whose `visibility` the principal does not satisfy is absent with all its views. Empty where the deployment has plain views only.
          items:
            type: object
            additionalProperties: false
            required: [name, title, members_of, views]
            properties:
              name:
                type: string
              title:
                description: The group's title, or `null` where it declares none. The same for every principal who may reach the group.
                type: [string, "null"]
              members_of:
                description: The group whose views this group lays out a second time under the same keys, or `null` where the group owns its views.
                type: [string, "null"]
              views:
                description: This group's view ids, in creation order, as `<group>:<key>`.
                type: array
                items: { type: string }
        declared_scalars:
          type: array
          description: The whole entity-scoped column schema, in declaration order. `render = true` columns arrive in the points frame after `tessera_id` and `code`, in this order, each named by its column; under a view of a group, that group's `render = true` families (`scoped_scalars`) follow. Read the columns by name. Every such column is nullable, and a point whose item has no value is null, except in a category, where no value is code 0.
          items:
            $ref: "#/components/schemas/DeclaredScalar"
        scoped_scalars:
          type: array
          description: The group-scoped column families, with the same fields `declared_scalars` publishes plus the scope that says which views each arrives under. A family whose group this principal cannot reach is absent, as its `filter_operands` entry is.
          items:
            $ref: "#/components/schemas/ScopedScalar"
        filter_operands:
          type: array
          description: The columns a request may filter on, and each one's operators. `family` tells a client which control to draw; a category has a value list `/v1/categories/{column}` serves, and a keyword has none. `scope` is present only on a group-scoped attribute, whose values differ per view of the named group. A scoped entry whose group this principal cannot reach is absent, and a filter leaf naming it, bare or pinned, is the unknown-column `422`.
          items:
            type: object
            additionalProperties: false
            required: [column, family, operands]
            properties:
              column:
                type: string
              family:
                type: string
                enum: [category, keyword, numeric, text]
              operands:
                type: array
                items:
                  type: string
                  enum: [eq, in, prefix, contains, range, match, phrase]
              scope:
                type: object
                additionalProperties: false
                required: [group]
                description: The view group whose views this column's values are per. Under a view of that group, or of a group sharing its views, the request's own view chooses the column. Under any other view a leaf pins one as `<column>@<key>`. An unpinned leaf there is `422` naming the group, and a pin naming no view of it is the unknown-view `404`.
                properties:
                  group:
                    type: string
        selection:
          $ref: "#/components/schemas/Selection"
        layers:
          type: array
          description: The annotation layers this principal may know exist, and what each declares. Filtered per principal, and each layer's `views` list is filtered to the views the principal may reach. The number of artifacts is not published.
          items:
            $ref: "#/components/schemas/Layer"

    DeclaredScalar:
      type: object
      additionalProperties: false
      required: [name, arrow_type, category, analyser, render, index, homes]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: The column's name, unique in the bundle and safe in a path. Not qualified by view.
        arrow_type:
          type: string
          description: The storage type's name, such as `u8`, `u16`, `u32`, `u64`, `i8` to `i64`, `f32`, `f64`, `bool`, `timestamp_us`, `keyword` or `text`. The engine derives it, and this description does not list every value.
        category:
          description: Present for a category column and `null` for any other. A client builds a legend from it, since the points frame carries a category as a bare integer.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [vocabulary, kind, visibility]
              properties:
                vocabulary:
                  type: string
                kind:
                  type: string
                  enum: [declared, discovered]
                visibility:
                  type: string
                  enum: [public, derived]
                  description: "`public`: the values are served as declared to every session. `derived`: filtered per principal, so a value appears only where at least one item carrying it is visible."
        analyser:
          description: For a `text` column, the `<name>/<version>` of the analyser that segmented the index, which lets a client tell a text that says nothing from a query that segmented differently. `null` for every other type.
          type: [string, "null"]
        render:
          type: boolean
          description: The column arrives in the points frame, null where an item has no value, or code 0 for a category.
        index:
          type: boolean
          description: The column has a search structure. With neither flag set the column is stored with the record, returned by the item routes and not a filter operand.
        homes:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [rendered, value_column, record]
          description: "Where `POST /v1/items` reads the field from: `rendered`, the view's own columns; `value_column`, a per-item column in stored order; `record`, the record store. A field whose `homes` is `[\"record\"]` is read from the record store alone, fastest in `stored` order."

    ScopedScalar:
      type: object
      additionalProperties: false
      required: [name, arrow_type, scope, category, analyser, render, index, views]
      description: One group-scoped attribute's column family, which has one column per view of the group it names and otherwise declares what an entity-scoped column declares.
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: The column's name, as a filter leaf spells it before any pin. Unique in the bundle, across entity-scoped columns and families.
        arrow_type:
          type: string
          description: The storage type's name, spelt as `DeclaredScalar.arrow_type` is.
        scope:
          type: object
          additionalProperties: false
          required: [group]
          description: The view group this family has a column per view of.
          properties:
            group:
              type: string
        category:
          description: Present for a category family and `null` otherwise, as `DeclaredScalar.category` is.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [vocabulary, kind, visibility]
              properties:
                vocabulary:
                  type: string
                kind:
                  type: string
                  enum: [declared, discovered]
                visibility:
                  type: string
                  enum: [public, derived]
        analyser:
          description: For a `text` family, the `<name>/<version>` of the analyser that segmented its per-view indexes. `null` for every other family.
          type: [string, "null"]
        render:
          type: boolean
          description: The column arrives in the points frame under a view of this group, or of a group sharing its views, and under no other view. There it follows the entity-scoped render columns, and a row with no value is null.
        index:
          type: boolean
          description: The family's columns carry a per-item value column a filter can be answered from, which is what makes it a filter operand.
        views:
          type: array
          description: "Every view id whose rows carry this column and that this principal may reach: the owning group's own `<group>:<key>` ids, and the same keys under every group sharing those views. A client under a sharing group's view receives the column under that group's id. Filtered per id, as `views` is. Not the group's whole roster: a view created while the service runs has no column until a rebuild."
          items: { type: string }

    Selection:
      type: object
      additionalProperties: false
      description: The sampling parameters and request ceilings. They are the same for every principal, and a client needs them to read a count of drawn points as a density.
      required: [k_min, k_max_marks, max_k, theta_target_marks, max_underlay_offset, max_tiles_per_request, max_category_values, max_shape_vertices, max_region_vertices, max_region_cells, max_suggestions, max_suggestion_walk, max_suggest_set_entities, max_browse_rows, max_page_rows, max_page_bytes]
      properties:
        k_min:
          type: integer
          minimum: 0
        k_max_marks:
          type: integer
          minimum: 0
          description: The most points a tile draws, and `k`'s default.
        max_k:
          type: integer
          minimum: 0
          description: The server's ceiling on `k`. A tile draws at most `min(k, max_k, k_max_marks)` points.
        theta_target_marks:
          type: integer
          minimum: 0
        max_underlay_offset:
          type: integer
          minimum: 0
        max_tiles_per_request:
          type: integer
          minimum: 0
          description: The most tiles a viewport request may cover. A client needs it to tell this `422` from an error in its own arithmetic.
        max_category_values:
          type: integer
          minimum: 0
          description: "`/v1/categories`' page ceiling and default."
        max_shape_vertices:
          type: integer
          minimum: 0
          description: The most vertices a published shape may carry once fitted to each view. Over it, `PUT /control/layers/{name}/artifacts` is `422` naming the count and the cap.
        max_region_vertices:
          type: integer
          minimum: 0
          description: The most vertices a `region` filter leaf's `polygon` may carry. Over it the request is `422` naming the count and the cap.
        max_browse_rows:
          type: integer
          minimum: 1
          description: The most rows `POST /v1/artifacts/browse` returns in one page, and its default page size. `limit` is clamped to it, and `limit = 0` is `422`. It bounds the response; what a principal may be told is decided by each artifact's existence criterion before paging starts.
        max_page_rows:
          type: integer
          minimum: 1
          description: The most rows a `POST /v1/items` or `POST /v1/artifacts` page holds. A request's `page_rows` is capped to it.
        max_page_bytes:
          type: integer
          minimum: 1
          description: The most Arrow bytes a page holds before compression. A single row larger than this is sent alone.
        max_region_cells:
          type: integer
          minimum: 0
          description: The most boundary cells a `region` leaf's shape may cross at one depth. Over it the request is not refused; the server stops at the deepest depth that fits, answers exactly for a shape covering the requested one, and says so in `x-tessera-region`.
        max_suggestions:
          type: integer
          minimum: 1
          description: "`/v1/categories/{column}/suggest`'s page ceiling and `limit`'s default; `serve.max_suggestions`, default 20. With it a client tells a short list that is everything from one the server cut, which `more` alone does not say."
        max_suggestion_walk:
          type: integer
          minimum: 1
          description: The most values one suggestion request examines before it stops and answers `more` as `true`; `serve.max_suggestion_walk`, default 100,000. It bounds the request's time, not what it discloses; the listing route walks the whole vocabulary. A client that receives `more` on a page that did not fill reads it as this budget.
        max_suggest_set_entities:
          type: integer
          minimum: 1
          description: "The size of visible set at or under which a suggestion is answered from the session's set of the values its principal can see, rather than by probing the index once per value walked; `serve.max_suggest_set_entities`, default 10,000,000. Both answer with the same page under the same visibility rule, and the response does not say which answered. What differs is `more`, which from the set means the page filled and from the probe may mean the walk budget ran out. A caller learns which side of it their own visible set falls on, which a zoom-0 viewport already returns as `visible`."

    Layer:
      type: object
      additionalProperties: false
      required: [name, title, views, membership, hierarchy, levels, computed_content, shape, supplied_content, depends_on, version]
      properties:
        name:
          type: string
        title:
          type: [string, "null"]
        views:
          type: array
          items: { type: string }
        membership:
          description: Where the layer's artifacts get their members, a stored set per artifact or a shape resolved against stored positions. The engine derives it, and this description does not list every value.
          type: string
        hierarchy:
          type: object
          additionalProperties: false
          required: [kind, prune_children]
          properties:
            kind:
              type: string
              enum: [flat, nested, dag, stacked, tiered]
            prune_children:
              type: boolean
              description: The layer's default cut; `artifact_budget` may ask for more.
        levels:
          type: array
          description: Empty for a treed layer, whose lineage is in its parent links.
          items:
            type: object
            additionalProperties: false
            required: [level, title, zoom]
            properties:
              level:
                type: integer
                minimum: 0
              title:
                type: [string, "null"]
              zoom:
                description: "`[min, max]` tile depth. A viewport request naming no `levels` is answered at the levels whose range covers its depth; naming `levels` overrides this. Absent means served at every depth."
                oneOf:
                  - type: "null"
                  - type: array
                    minItems: 2
                    maxItems: 2
                    items: { type: integer, minimum: 0 }
        computed_content:
          type: array
          description: Properties computed for each principal from the members that principal can see, from `centroid`, `hull` and `box`.
          items: { type: string }
        shape:
          description: |
            The kind of the layer's one drawn geometry, or `null` where it draws none. `derived` is
            the hull over the members this principal can see, computed per principal. `predicate`
            is a spatial layer's membership shape, the same for every principal served the
            artifact. `authored` is a supplied `polygon`, `circle` or `ellipse` content, served
            under that content's own requirement and also the same for every principal. A client
            may keep a `predicate` or `authored` shape against a `tessera_id` across principals,
            and may not keep a `derived` one. The geometry itself is the artifacts frame's
            `shape_x` and `shape_y` and `ArtifactResponse.shape`, nested alike for every kind.
          oneOf:
            - type: "null"
            - type: string
              enum: [derived, predicate, authored]
        supplied_content:
          type: array
          description: The types of the content the publisher supplies, in the order of the artifacts frame's `content` column. An artifact whose content a principal may not read is not served to that principal at all.
          items: { type: string }
        depends_on:
          type: array
          description: The layers this layer's artifacts may attach to, as a clustering's labels attach to its clusters.
          items: { type: string }
        version:
          type: integer
          minimum: 0
          description: Moves with any change to who may reach the layer; a client compares it to notice one.

    CategoriesResponse:
      type: object
      additionalProperties: false
      required: [column, values, next]
      properties:
        column:
          type: string
        values:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, key, title]
            properties:
              code:
                type: integer
                minimum: 1
                description: Never `0`, which means no value.
              key:
                type: string
              title:
                type: [string, "null"]
                description: The declared title, or `null` where none was declared, as for every value a `discovered` vocabulary adds. A client shows the key in its place.
        next:
          type: [string, "null"]
          description: The last key returned, to pass as `?after=`; `null` when the list is complete, and always `null` for `?codes=`.

    SuggestResponse:
      type: object
      additionalProperties: false
      required: [column, q, values, more]
      properties:
        column:
          type: string
          description: The column as the caller spelt it.
        q:
          type: string
          description: The query as received, not folded.
        values:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, key, title, match]
            properties:
              code:
                type: integer
                minimum: 1
                description: Never `0`, which means no value.
              key:
                type: string
              title:
                type: [string, "null"]
                description: The declared title, or `null` where none was declared.
              match:
                type: object
                additionalProperties: false
                required: [field, start, len]
                description: Where the match is, in characters of the served string, so a client can highlight it without folding.
                properties:
                  field:
                    type: string
                    enum: [key, title]
                    description: The field that matched. A word-start match reports the field the word came from, and is `key` for a value with no title.
                  start:
                    type: integer
                    minimum: 0
                  len:
                    type: integer
                    minimum: 0
              count:
                type: integer
                minimum: 0
                description: Present only with `counts=true`. The items carrying this value that this principal may see, exact and computed per request. It does not affect the order.
        more:
          type: boolean
          description: "`true` where the walk stopped before its range was exhausted: the page filled, or `selection.max_suggestion_walk` values were examined. Answered from the session's set of visible values, it means only that the page filled. There is no cursor; a client asks for more by extending `q`."

    Pin:
      type: object
      additionalProperties: false
      required: [prefix, segments_version]
      description: A generation, the JSON of the `x-tessera-pin` header, sent back. Advisory; it grants nothing.
      properties:
        prefix:
          type: string
        segments_version:
          type: integer
          minimum: 0

    ViewportRequest:
      type: object
      additionalProperties: false
      required: [view, zoom]
      description: Exactly one of `bbox` and `tiles`.
      properties:
        view:
          type: string
          description: A view id from `/v1/meta`.
        zoom:
          type: integer
          minimum: 0
          maximum: 16
          description: The tile depth. The grid is 2¹⁶ by 2¹⁶.
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
          description: "`[x0, y0, x1, y1]` in the coordinates of the view's quantisation extent, with `x0 ≤ x1`, `y0 ≤ y1`, all finite. The request is answered for the depth-`zoom` tiles it intersects."
        tiles:
          type: array
          items:
            type: integer
            minimum: 0
          description: Depth-`zoom` Morton prefixes, in place of `bbox`. Answered in the request's order with repeats removed, the first kept. A prefix with bits above `zoom` is refused. A tile the client already holds can be left out, and costs the server nothing.
        k:
          type: integer
          minimum: 0
          description: The most points a tile returns. Defaults to `k_max_marks` and is capped by `max_k`. `0` asks for counts only. Keep it the same or raise it as the zoom deepens.
        filters:
          description: |
            The filter. It narrows which points are drawn, and answers one boolean for each served
            artifact: the artifacts frame's `matched` is `true` where a member this principal may
            see, inside the requested tiles, matches. `matched` is null on every response to a
            request with no filter.

            A filter changes nothing else about an artifact. The same artifacts are served with the
            same `masked_count`, filtered or not.
          allOf:
            - $ref: "#/components/schemas/FilterExpr"
        highlight:
          description: |
            A second expression in `filters`' grammar, answered on the same frames. A viewer
            narrowed by one clause and lit by another sends both here.

            It does not change which rows the response holds. The per-tile cap, the sampling and
            `served` run over the rows `filters` selects as they do without a highlight, so the
            same points are served with and without one, and a point stays where it is with its
            brightness changed. Use `filters` to narrow the map and `highlight` to light it.

            It is evaluated over the rows `filters` selects, so every answer is the conjunction of
            the two: the tiles frame's `highlighted` count (of the tile's `matched`, how many also
            satisfy it), the points frame's `highlighted` bit per served point, and the artifacts
            frame's `highlighted` bit. `highlighted ≤ matched ≤ visible` in every tile.

            Two highlights are one expression under `all_of` or `any_of`.
          allOf:
            - $ref: "#/components/schemas/FilterExpr"
        pin:
          $ref: "#/components/schemas/Pin"
        underlay_offset:
          type: integer
          minimum: 0
          description: Serve exact masked counts at depth `zoom + underlay_offset` as the sub-cells frame. Absent or `0` serves none and adds no bytes. Above `max_underlay_offset`, past depth 16, or over the sub-cell budget, it is refused, not clamped.
        layers:
          description: |
            Which annotation layers to answer for, and so whether an artifacts frame can appear.
            Absent or `[]` is none, with no artifact pass and no cost. `"all"` is every layer this
            principal reaches. An array is the named layers this principal reaches: a name it does
            not reach is left out whether or not it was asked for, so naming a layer does not tell
            the caller whether it exists.
          oneOf:
            - type: array
              items: { type: string }
            - type: string
              const: all
        artifact_budget:
          type: integer
          minimum: 0
          description: The most artifacts the client wants back. Met by serving ancestors in place of their descendants, never by sampling; accepted and without effect on a flat layer. Unbounded when absent.
        levels:
          description: |
            Which of each named layer's declared levels to answer for.

            Absent follows each layer's declaration: the levels whose `zoom` range covers this
            request's `zoom`, on the same 0 to 16 depth. The string `"all"` answers for every
            level, and an array for exactly those levels, among the ones the layer holds. A level a
            layer does not hold is left out rather than refused; any other value is `422`. An empty
            array is none, as `layers: []` is.

            A layer that declares no levels, a treed or flat one, sits at level 0 and is not
            affected by this field in any form. A layer that declares levels but no `zoom` range on
            any of them serves every level when the field is absent.

            The default differs from `layers`' because naming a layer has already asked for the
            artifact pass; what remains is which levels to pay for, and every level is the costly
            answer, so it is asked for by name. The field applies to every layer named, against
            each layer's own levels.
          oneOf:
            - type: array
              items: { type: integer, minimum: 0 }
            - type: string
              const: all
        computed:
          description: |
            Which of each layer's declared computed properties to serve.

            Absent is each layer's declaration. An array is that array intersected with each
            layer's declaration, and `[]` is none: counts and no geometry, with the artifacts frame
            still served. It narrows and cannot widen: a property a layer does not declare is not
            served for naming it. A name outside the three is `422`, where an unreachable layer's
            name is left out; the three words and each layer's set are published in `/v1/meta`, so
            the refusal discloses nothing.

            It controls cost, not disclosure. A derived shape is computed per artifact per request
            from the members the principal can see, while a client draws one at a time. Measured on
            a corpus of 2.42 million members, one request took 2,032 ms and 263 KB with shapes and
            164 ms and 26 KB without. Fetch the shape to draw from
            `POST /v1/artifacts/{tessera_id}`, which serves the same geometry and ignores this
            field.

            `shape` names the layer's one drawn geometry, of whichever kind `/v1/meta`'s `shape`
            gives it: the derived hull, the membership shape, or the authored one. `hull` is the
            declaration's word and is not accepted here. A predicate or authored shape is served at
            this request's `zoom`: vertices that would move the drawn edge by less than a pixel at
            that depth are dropped, and at most 2,048 are sent.
          type: array
          items:
            type: string
            enum: [centroid, box, shape]
        artifact_rows:
          description: |
            The columns of each artifact row. Absent or `"full"` is every column. `"identity"` is
            the same rows as five columns, `layer` (dictionary-encoded), `tessera_id`, `rung`,
            `matched` and `highlighted`, with the others absent from the schema rather than null.
            The rows, the `matched` and `highlighted` bits and the `rung` values are the same under
            either value, so the membership columns of the points frames still resolve, and the
            projection discloses nothing the full answer would not. It is for a filter change over
            rows the caller already holds. Any other value is `422`.
          type: string
          enum: [full, identity]
        point_rows:
          description: |
            The columns of each served point, as `artifact_rows` is for artifacts. Absent or
            `"full"` is every column. `"highlight"` is the same points as `(tessera_id,
            highlighted)`, the other columns absent from the schema. The points and the per-tile
            `served` counts are the same under either value.

            Nine bytes a point. It is for a client that changed only its highlight and holds every
            point it needs; it joins the bits to its points by `tessera_id`. When
            `x-tessera-stale` moves, the held points may no longer be what the same request serves,
            and the client asks again with `"full"`. Without a `highlight` it answers as `"full"`.
            Any other value is `422`.
          type: string
          enum: [full, highlight]

    BrowseRequest:
      type: object
      additionalProperties: false
      required: [view, layer]
      properties:
        view:
          type: string
          description: The view whose rows the counts are taken over. Required, since a masked count is taken in one view's rows.
        layer:
          type: string
          description: The layer to browse. A name outside the list `/v1/meta` publishes to this principal is `422`, as is a layer that attaches to another, which has no lineage of its own.
        level:
          type: integer
          minimum: 0
          description: The level to browse on a levelled layer (`stacked`, `tiered`). `422` on `flat`, `nested` and `dag`, which have one level, and on a level the layer does not hold, since a parameter accepted and ignored would give a wrong answer that looks right.
        parent:
          description: The children form. The artifacts naming this one among their parents, with its own served parents in `parents`. A `tessera_id`, as a number or its decimal string. One that names nothing, one of another layer, one suppressed and one below this principal's criterion all answer an empty page.
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"
        q:
          type: string
          description: The search form. The layer's artifacts whose key, or first supplied text content, contains this, ignoring case. Not with `parent`.
        filters:
          description: The viewport's filter. Each row then carries `matched_count`, the members this principal can see that match, and the page is ordered by it. Which artifacts are served, and their `masked_count`, do not change, and a row whose `matched_count` is zero is still served.
          allOf:
            - $ref: "#/components/schemas/FilterExpr"
        limit:
          type: integer
          minimum: 1
          description: Page size, clamped to `selection.max_browse_rows`, its default. `0` is `422`.
        cursor:
          type: string
          description: A previous page's `next`, unchanged. Opaque; it carries a count and an identifier this principal was already served.

    BrowseResponse:
      type: object
      required: [artifacts, parents]
      properties:
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/BrowseRow" }
        parents:
          type: array
          description: The requested artifact's own served parents in the children form, and `[]` in the other forms, so a client reads one shape.
          items: { $ref: "#/components/schemas/BrowseRow" }
        next:
          type: string
          description: The cursor for the next page. Absent on the last page.

    BrowseRow:
      type: object
      required: [tessera_id, masked_count, rung, parent_ids]
      properties:
        tessera_id:
          type: string
          description: A decimal string, as every viewer-plane JSON identifier is, since a JavaScript number does not hold a `u64` exactly.
        key:
          type: string
          description: The publisher's key, where one was supplied.
        name:
          type: string
          description: The artifact's first supplied text content, where this principal may read it; absent where the first content is an authored shape, which is not text. An artifact whose content cannot be served is left off the page.
        masked_count:
          type: integer
          description: How many of this artifact's members this principal can see. Not its size, and not changed by `filters`.
        matched_count:
          type: integer
          description: How many of the members this principal can see match `filters`. Present exactly when the request carries `filters`.
        rung:
          type: integer
          description: The declared level on a levelled layer, the depth in the served lineage on a treed one, and `0` on a flat one.
        parent_ids:
          type: array
          description: This artifact's parents that this principal is also served, ascending. Empty for a root and for an artifact whose parents are all withheld; a client reads both as no parent here.
          items: { type: string }

    FilterExpr:
      description: |
        A boolean expression over declared columns. A node is a leaf, exactly one column name
        mapped to exactly one operator, or a combinator: `all_of`, `any_of` or `none_of` over
        sub-expressions. `all_of: []` matches everything; `any_of: []` matches nothing;
        `none_of: []` is `422`, as is a `none_of` whose branches name different columns or a
        `text` column. The deployment bounds nesting, and an expression nested deeper is refused,
        not flattened.

        Values: a category takes its vocabulary's key (a string) or code (an integer), mixed
        freely; a keyword takes byte-exact strings; a number column takes numbers, and `range`
        takes an object of `gte`, `gt`, `lte` and `lt`, at least one and at most one per side; a
        `text` column takes `match` with a string or `{"query", "minimum_should_match"}`, and
        `phrase` with a string.

        An unknown column, or an operator outside the column's family, is `422`. An unknown value
        is an empty operand, so a client shows no matches alike for a value the viewer may not see
        and one that does not exist.

        `region` is a leaf of its own, not a column, and the name is reserved at the build. It is
        a set of rows over the whole view, composes with every other leaf, and can be negated with
        `none_of`, since every placed item has a position. It is cached per generation across
        principals. `x-tessera-region` says how exact its answer is.

        `member_of` is another leaf of its own, also reserved at the build: `{"layer",
        "artifact"}`, the artifact's members this principal can see, as a set of rows over the
        whole view, composed and negated as `region` is. A layer this principal's `/v1/meta` does
        not list is `422`. An artifact that names nothing, belongs to another layer, is suppressed
        or is below this principal's criterion is an empty operand, one answer for every reason.
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        all_of:
          type: array
          items: { $ref: "#/components/schemas/FilterExpr" }
        any_of:
          type: array
          items: { $ref: "#/components/schemas/FilterExpr" }
        none_of:
          type: array
          items: { $ref: "#/components/schemas/FilterExpr" }
        region:
          $ref: "#/components/schemas/RegionLeaf"
        member_of:
          $ref: "#/components/schemas/MemberOfLeaf"
      additionalProperties:
        $ref: "#/components/schemas/FilterLeafOperator"

    MemberOfLeaf:
      type: object
      description: |
        One artifact of one layer, as a set of rows over the whole view: the artifact's members
        that this principal may see.

        The two fields are refused differently. `layer` is deployment schema: a name outside the
        layer list `/v1/meta` publishes to this principal is `422`, and the answer is the same for
        a layer the principal may not reach and one never registered. `artifact` is a value and is
        not refused: an identifier that names nothing, one of another layer, one suppressed, one
        whose layer this principal does not reach, and one below its own existence criterion are
        all the empty operand. The artifact's own test, its layer's `visibility`, its own label and
        `require_member_visibility` against the principal's visible set, is the one the artifacts
        frame applies, and it runs before any membership is read.
      additionalProperties: false
      required: [layer, artifact]
      properties:
        layer:
          type: string
        artifact:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"

    RegionLeaf:
      type: object
      description: |
        Exactly one of `polygon`, `bbox`, `circle` and `ellipse`, a shape in the view's own space
        (its quantisation extent, as `/v1/meta` publishes it), with `space`. `space` is `view`, the
        default, or `wgs84` on a view that declares a projection: degrees, densified before they
        are projected so each edge is straight in the plane it was declared in. `wgs84` on a view
        that projects nothing is `422`. Or `artifact`: a published shape named by its
        `tessera_id`, answered from its stored membership under the artifact's own test. An
        artifact this principal would not be served, an identifier that names nothing, one on
        another view, and one whose layer draws an authored shape are an empty operand, one answer
        for every reason.

        A `polygon` is at least three vertices, closed implicitly, even-odd, with a point on an
        edge inside, and over `max_region_vertices` it is `422`. A `bbox` is `[x0, y0, x1, y1]`,
        closed on every side. A `circle` is `[cx, cy, r]`. An `ellipse` is
        `[cx, cy, a, b, angle_degrees]`. Coordinates are quantised to the view's 32-bit grid
        before anything is tested, so a client highlighting its own points quantises the same way.
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      properties:
        polygon:
          type: array
          minItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        circle:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
        ellipse:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: number }
        artifact:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"
        space:
          type: string
          enum: [view, wgs84]

    FilterLeafOperator:
      type: object
      description: One operator from the column's family in `/v1/meta`'s `filter_operands`, with its value. Value shapes depend on the family (see `FilterExpr`) and are not narrowed further here, since this description cannot know a column's family.
      minProperties: 1
      maxProperties: 1
      properties:
        eq: {}
        in:
          type: array
        prefix:
          type: string
        contains:
          type: string
        range:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            gte: { type: number }
            gt: { type: number }
            lte: { type: number }
            lt: { type: number }
        match:
          oneOf:
            - type: string
            - type: object
              additionalProperties: false
              required: [query, minimum_should_match]
              properties:
                query: { type: string }
                minimum_should_match: { type: integer, minimum: 1 }
        phrase:
          type: string
      additionalProperties: false

    ItemsRequest:
      type: object
      additionalProperties: false
      required: [view, fields]
      properties:
        view:
          type: string
          description: The view whose items are read, from `/v1/meta`. An item with no position in it is not returned.
        fields:
          type: array
          items: { type: string }
          description: Declared fields to return, by name, each once. A group-scoped field may be pinned as `<field>@<key>`. Empty returns `tessera_id` alone.
        system_fields:
          type: array
          items:
            type: string
            enum: [position, external_id, labels]
          description: System columns to return, in this order. Absent is none.
        filters:
          $ref: "#/components/schemas/FilterExpr"
        keep_unmatched:
          type: boolean
          description: Return every visible item with a `tessera:matched` column, rather than the matching ones only. Without `filters` every row is marked matched.
        count:
          type: boolean
          description: Put the numbers of visible and matching items in the head. Only on a request with no `cursor`; it costs one evaluation of the whole filter.
        order:
          type: string
          enum: [map, stored]
          description: Absent takes the cursor's order, or with no cursor the server's choice. A value different from the cursor's is `422`.
        page_rows:
          type: integer
          minimum: 1
          description: Rows per page, capped by `selection.max_page_rows`. Absent is the cap.
        pages:
          type: integer
          minimum: 1
          description: The most pages this response may carry. Absent is as many as the response's budgets allow.
        cursor:
          type: string
          description: A previous response's `next`, unchanged. Absent starts from the beginning.
        compression:
          type: string
          enum: [zstd]
          description: Compress every records frame's Arrow buffers with zstd. Absent is uncompressed.
        idset:
          type: integer
          minimum: 0
          description: As on `POST /v1/items/{tessera_id}`; a mismatch is `409`.

    ArtifactsRequest:
      type: object
      additionalProperties: false
      required: [view, layer, fields]
      properties:
        view:
          type: string
          description: The view whose rows the counts are taken over, from `/v1/meta`.
        layer:
          type: string
          description: A layer `/v1/meta` publishes to this principal. Attached layers are allowed.
        level:
          type: integer
          minimum: 0
          description: Only artifacts at this level, on a levelled layer.
        parent:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"
          description: A `tessera_id`. Only the artifacts naming it among their parents. Not with `q`.
        q:
          type: string
          description: Only artifacts whose key, or first served text content, contains this, ignoring case. Not with `parent`.
        filters:
          $ref: "#/components/schemas/FilterExpr"
        keep_unmatched:
          type: boolean
          description: Return every served artifact under `filters`, including those with no matching member.
        count:
          type: boolean
          description: Put the numbers of artifacts served and of those matching in the head. Only on a request with no `cursor`.
        fields:
          type: array
          items:
            type: string
            enum: [key, level, parents, target, masked_count, content, centroid, box, shape]
          description: Properties to return, each once, in this order.
        page_rows:
          type: integer
          minimum: 1
          description: Rows per page, capped by `selection.max_page_rows`. Absent is the cap.
        pages:
          type: integer
          minimum: 1
          description: The most pages this response may carry.
        cursor:
          type: string
          description: A previous response's `next`, unchanged.
        compression:
          type: string
          enum: [zstd]
          description: Compress every records frame's Arrow buffers with zstd.
        idset:
          type: integer
          minimum: 0
          description: As on `POST /v1/items/{tessera_id}`; a mismatch is `409`.

    ArtifactsHead:
      type: object
      additionalProperties: false
      required: [page_rows]
      description: The kind-6 frame of a `POST /v1/artifacts` body. `served` and `matched` are present exactly when the request asked for `count`.
      properties:
        page_rows:
          type: integer
          minimum: 1
          description: The page size used, after the cap.
        served:
          type: integer
          minimum: 0
          description: The artifacts the request selects that this principal is served, at the start of the response.
        matched:
          type: integer
          minimum: 0
          description: Of those, the ones with a visible member matching `filters`; `served` without one.

    ItemsHead:
      type: object
      additionalProperties: false
      required: [order, page_rows]
      description: The kind-6 frame. `visible` and `matched` are present exactly when the request asked for `count`.
      properties:
        order:
          type: string
          enum: [map, stored]
          description: The order this response's rows are in.
        page_rows:
          type: integer
          minimum: 1
          description: The page size used, after the cap.
        visible:
          type: integer
          minimum: 0
          description: Visible items in the view at the start of the response, the count the viewport serves.
        matched:
          type: integer
          minimum: 0
          description: Of those, the ones matching `filters`; `visible` without one.

    PageEnd:
      type: object
      additionalProperties: false
      required: [next, ended_by]
      description: The kind-8 frame, after each records frame.
      properties:
        next:
          type: [string, "null"]
          description: The cursor to resume after this page; null where no row remains.
        ended_by:
          type: string
          enum: [rows, bytes, time, end]
          description: "`rows`: the page holds `page_rows`. `bytes`: the next row would have taken it past `max_page_bytes`. `time`: the response's time ran out, or the stream deadline cancelled it, and the response ends after this page. `end`: no row remains."

    RecordsTrailer:
      type: object
      additionalProperties: false
      required: [pages, rows, next, ended_by, stream_us]
      description: The kind-4 frame of a `POST /v1/items` or `POST /v1/artifacts` body.
      properties:
        pages:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        next:
          type: [string, "null"]
          description: The cursor to resume from, null where no row remains. It can be past the last page end, where the scan went on without finding a row.
        ended_by:
          type: string
          enum: [end, pages, budget_bytes, budget_time, deadline]
          description: "`end`: no row remains. `pages`: the response carried `pages` pages. `budget_bytes` and `budget_time`: the response's byte or time budget ran out. `deadline`: the stream deadline cancelled it."
        stream_us:
          type: integer
          minimum: 0
          description: The whole response's wall time in microseconds, including waits on the client.

    ItemRequest:
      type: object
      additionalProperties: false
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
        idset:
          type: integer
          minimum: 0
          description: The idset the caller's `tessera_id` was minted under. Sending it makes a `tessera_id` from an earlier idset a `409` rather than another item's record.

    ItemResponse:
      type: object
      additionalProperties: false
      required: [fields, labels, views, scoped]
      properties:
        fields:
          type: object
          description: The record by declared column name. Values are JSON numbers, of every width, strings (a keyword, a text, or a category's key) or booleans. A field with no value is absent, not `null`.
          additionalProperties:
            type: [number, string, boolean]
        external_id:
          type: string
          contentEncoding: base64
          description: The caller's own external id, present only where the item has one.
        labels:
          type: array
          items:
            type: string
          description: The item's access labels that this session holds, as the auth plugin presents them, sorted. Never the item's whole label set, so a viewer does not learn a label their credential lacks. Always present; empty where this principal holds none of the item's labels.
        views:
          type: array
          description: The views this item is in that this principal may reach, sorted by id, each with the position that view places it at. A view the principal may not reach is left out, as a view nobody declared is. Always present. `[]` means none of the item's views is reachable; an item in no view at all is a `404` instead.
          items:
            type: object
            additionalProperties: false
            required: [id, x, y]
            properties:
              id:
                type: string
                description: The view's id, a plain view's name or `<group>:<key>`.
              x:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: The horizontal position in this view's own grid units, 32-bit fixed point against the extent `/v1/meta` publishes for this view, the quantity the viewport's Morton codes decode to. Split out on the server, since a JSON number cannot carry a 64-bit code exactly.
              y:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: The vertical position, on `x`'s terms.
        scoped:
          type: object
          description: "The group-scoped values, by family name and then by the group's key: `{\"mood\": {\"2026-Q1\": \"calm\"}}`. Two views sharing a key through a group that shares another's views share one entry. `/v1/meta`'s `scoped_scalars` says which group a family's keys belong to. Filtered per key as `views` is. A family with no reachable key, one this item holds no value under, and a `text` family, which stores no per-item value, are left out. Always present; `{}` where every attribute is entity-scoped."
          additionalProperties:
            type: object
            additionalProperties:
              type: [number, string, boolean]

    ArtifactRequest:
      type: object
      additionalProperties: false
      required: [view]
      properties:
        view:
          type: string
          description: The view whose rows the count is taken over. Required, unlike on `/v1/items/{tessera_id}`, since a masked count is taken in one view's rows.
        idset:
          type: integer
          minimum: 0
        zoom:
          type: integer
          minimum: 0
          maximum: 16
          description: The depth the caller draws at. A predicate or authored shape is then served without vertices that would move its edge by less than a pixel at that depth. Absent serves the whole simplified shape, at most 2,048 vertices. A derived hull is not affected.

    ArtifactResponse:
      type: object
      additionalProperties: false
      required: [layer, masked_count, rung]
      properties:
        layer:
          type: string
        key:
          type: string
          description: The publisher's key, absent where none was supplied.
        masked_count:
          type: integer
          minimum: 0
          description: How many of this artifact's members the asking principal can see. Not its size.
        centroid:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: In the viewport's 32-bit-per-axis grid units, over the members this principal can see. Absent where the layer declares none.
        box:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0 }
          description: "`[min_x, min_y, max_x, max_y]`, in grid units."
        shape:
          type: array
          description: "The artifact's one drawn geometry, as parts, then rings, then vertices, of the kind `/v1/meta`'s `shape` gives its layer: the derived hull, with each group of members its own part; the predicate shape; or the authored one. A part's first ring is its outer boundary and the rest are holes. Absent where the layer draws none."
          items:
            type: array
            description: One part, its outer ring and then its holes.
            items:
              type: array
              description: One closed ring in grid units; a derived hull's runs anticlockwise from its lowest vertex.
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: integer, minimum: 0 }
        content:
          type: array
          items: { type: string }
          description: The publisher's supplied content, in the order of the layer's `supplied_content` types. Absent where the layer declares none; never partial.
        rung:
          type: integer
          minimum: 0
          description: "The declared level on a levelled layer, and `0` on a treed or flat one, since this response holds one artifact and no parent links. The one field here about the artifact rather than the asking principal: two principals served it agree on it."

    PublicationAck:
      type: object
      additionalProperties: false
      required: [publication]
      description: When a write becomes visible. Every write route's answer carries these two fields.
      properties:
        publication:
          type: integer
          minimum: 0
          description: The publication cycle this write is in. It is visible once `/control/status`'s `publication` reaches this number.
        visible:
          type: boolean
          description: "Present only with `wait=visible`: `true` where the cycle ran before the answer, `false` where `serve.visible_wait_max_secs` passed first."

    IngestRecords:
      type: array
      description: A JSON ingest batch, one object per row.
      items:
        $ref: "#/components/schemas/IngestRecord"

    IngestRecord:
      type: object
      description: One row of a JSON ingest batch. The properties below are the route's own; any other key is a declared attribute, a group-scoped attribute of the view's group, or an enumerated layer's name.
      properties:
        external_id:
          type: [string, "null"]
          contentEncoding: base64
          description: The caller's identifier for the item, at most 64 bytes. Absent or `null` is an item with none, addressed later only by the `tessera_id` the answer gives.
        x:
          type: number
          description: The horizontal coordinate, on a view whose projection is `none`.
        y:
          type: number
          description: The vertical coordinate, on a view whose projection is `none`.
        lon:
          type: number
          description: Longitude in degrees, on a projected view.
        lat:
          type: number
          description: Latitude in degrees, on a projected view.
        access:
          description: The row's access labels, one per element. Absent, `null` or `[]` is no label, which the view's `point_visibility.default` fills.
          oneOf:
            - type: string
            - type: array
              items:
                type: [string, "null"]
            - type: "null"
        node_id:
          type: [string, "null"]
          description: Accepted and not stored.
        level:
          type: [integer, string, "null"]
          description: The level at which this row's layer keys are placed, as an integer or a string of digits. Read only where the batch carries a layer column.
      additionalProperties:
        description: "An attribute's value, or a layer's key or list of keys. A category takes its key; an integer is a JSON number or a string of digits; `timestamp_us` is microseconds since the Unix epoch; `null` is no value."
        type: [boolean, number, string, array, "null"]

    IngestResponse:
      type: object
      additionalProperties: false
      required: [accepted, over_bound, over_bound_ids, clipped, clamped, padded_columns, tessera_ids, minted, publication]
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Rows accepted. `0` on a replay, so a sum over retried batches counts each row once.
        over_bound:
          type: integer
          minimum: 0
          description: Rows whose labels resolve to more terms than the auth plugin's per-item bound. They are stored, not refused.
        over_bound_ids:
          type: array
          maxItems: 100
          description: The external ids of the first 100 of those rows that carry one, in base64.
          items:
            type: string
            contentEncoding: base64
        clipped:
          type: integer
          minimum: 0
          description: Rows whose coordinates lay outside the projection's domain and were stored on the frame's edge. Always `0` on a view whose projection is `none`.
        clamped:
          type: integer
          minimum: 0
          description: Rows whose coordinates lay outside the view's extent and were stored on its edge.
        padded_columns:
          type: integer
          minimum: 0
          description: Declared attributes the batch left out, each absent on every row.
        tessera_ids:
          type: array
          description: One `tessera_id` per row in the order sent, as a string of decimal digits, whether or not the row carries an external id. A replay answers the original ids.
          items:
            type: string
            pattern: "^[0-9]+$"
        minted:
          type: integer
          minimum: 0
          description: Artifacts the batch's layer columns created on `open` layers. A created artifact cannot be undone. `0` on a replay.
        replayed:
          const: true
          description: Present only when this body was already accepted under this batch id. Nothing was written.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`. A replay names the next cycle, later than the one that published its rows."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ValuesRecords:
      type: array
      description: A JSON values batch, one object per row.
      items:
        $ref: "#/components/schemas/ValuesRecord"

    ValuesRecord:
      type: object
      description: One row of a JSON values batch. It names its item by exactly one of `external_id`, and `tessera_id` with `idset`. Any other key is a declared attribute, a group-scoped attribute of the view's group, or an enumerated layer's name, as on ingest.
      properties:
        external_id:
          type: [string, "null"]
          contentEncoding: base64
          description: The item's external id.
        tessera_id:
          type: [string, "null"]
          pattern: "^[0-9]+$"
          description: The item's `tessera_id`, as a string of decimal digits.
        idset:
          type: [integer, string, "null"]
          description: The idset `tessera_id` was minted under, from `/v1/meta`. Required with `tessera_id` and refused with `external_id`.
        level:
          type: [integer, string, "null"]
          description: As on `IngestRecord`.
      additionalProperties:
        description: An attribute's value, or a layer's key or list of keys, as on `IngestRecord`. A key the row leaves out leaves that cell as it is.
        type: [boolean, number, string, array, "null"]

    ValuesResponse:
      type: object
      additionalProperties: false
      required: [rows, filled, held, joined, minted, publication]
      properties:
        rows:
          type: integer
          minimum: 0
          description: Rows the batch carried.
        filled:
          type: integer
          minimum: 0
          description: Cells that held no value and now hold the one sent. `0` on a replay.
        held:
          type: integer
          minimum: 0
          description: Cells that already held the value sent.
        joined:
          type: integer
          minimum: 0
          description: Memberships the layer columns added, to artifacts created by this batch and to held ones alike.
        minted:
          type: integer
          minimum: 0
          description: Artifacts the layer columns created on `open` layers.
        replayed:
          const: true
          description: Present only when this body was already accepted under this batch id. Nothing was written.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ChangeItem:
      type: object
      additionalProperties: false
      required: [op]
      description: One change. It names its item by exactly one of `external_id`, and `tessera_id` with `idset`.
      properties:
        op:
          type: string
          enum: [delete, suppress, unsuppress]
          description: "`delete` removes the item; `suppress` hides it; `unsuppress` lifts a suppression."
        external_id:
          type: string
          contentEncoding: base64
          description: The item's external id.
        tessera_id:
          type: string
          pattern: "^[0-9]+$"
          description: The item's `tessera_id`, as a string of decimal digits; a JSON number is `422`.
        idset:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The idset `tessera_id` was minted under, from `/v1/meta`. Every item of one request carries the same one.
      oneOf:
        - required: [external_id]
          not:
            anyOf:
              - required: [tessera_id]
              - required: [idset]
        - required: [tessera_id, idset]
          not:
            required: [external_id]

    AttributeDeclaration:
      type: object
      additionalProperties: false
      required: [name, type]
      description: A corpus declaration's `[[attribute]]` block, without the keys that say where a build reads its values.
      properties:
        name:
          type: string
          description: The column's name, unique among attributes and layers.
        title:
          type: [string, "null"]
          description: A human-readable title. Not part of the column's identity.
        type:
          type: string
          enum: [bool, u8, u16, u32, u64, i8, i16, i32, i64, f32, f64, timestamp_us, keyword, text, category]
          description: The value type. `category` stores its vocabulary's codes at the vocabulary's width.
        vocabulary:
          type: [string, "null"]
          description: The vocabulary a `category` draws on, by name. Required for a category and refused on any other type.
        analyser:
          type: [string, "null"]
          description: The analyser that segments a `text` column for search. Absent is `unicode`, the only one. Refused on any other type.
        index:
          type: boolean
          default: false
          description: Build a search structure, so a filter may name the column.
        render:
          type: boolean
          default: false
          description: Serve the column in the viewport's points frame. `true` is refused on this route.
        scope:
          description: "`entity`, one value per item, or `{\"group\": \"<view_group>\"}`, one value per item for each view of that group. Absent is `entity`."
          default: entity
          oneOf:
            - type: string
              const: entity
            - $ref: "#/components/schemas/GroupScope"

    GroupScope:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group:
          type: string
          description: The view group whose views the values or artifacts are per.

    AttributeDeclared:
      type: object
      additionalProperties: false
      required: [name, existing, publication]
      properties:
        name:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this declaration and nothing was written."
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    VocabularyDeclaration:
      type: object
      additionalProperties: false
      required: [value_set, visibility, width]
      description: A corpus declaration's `[[vocabulary]]` block, without its name, which is in the path, and without the keys that say where a build reads its values.
      properties:
        title:
          type: [string, "null"]
          description: A human-readable title. Not part of the identity.
        value_set:
          type: string
          enum: [closed, open]
          description: "`closed` refuses a key it does not hold at ingest; `open` adds it."
        visibility:
          type: string
          enum: [public, derived]
          description: "`public` serves the values as declared to every viewer. `derived` serves a value only to a viewer who can see an item carrying it."
        width:
          type: string
          enum: [u8, u16, u32]
          description: The code's width, which bounds how many values the vocabulary can hold.
        values:
          type: array
          default: []
          description: The values to add, each with a code the server draws.
          items:
            $ref: "#/components/schemas/VocabularyValue"
        reserved:
          type: array
          default: []
          description: Retired codes, never drawn. Each is from 1 to the width's maximum. Compared as a set.
          items:
            type: integer
            minimum: 1

    VocabularyValue:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          description: The value's key, which ingest sends and filters name. Unique in the vocabulary.
        title:
          type: [string, "null"]
          description: The name a client draws. On a key the vocabulary holds, a title replaces the held one.

    VocabularyValues:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyValue"

    VocabularyDeclared:
      type: object
      additionalProperties: false
      required: [name, existing, added, titles, publication]
      properties:
        name:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this identity."
        added:
          type: integer
          minimum: 0
          description: Keys the request added.
        titles:
          type: integer
          minimum: 0
          description: Held keys whose title the request changed.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    VocabularyValuesAdded:
      type: object
      additionalProperties: false
      required: [name, added, existing, titles, publication]
      properties:
        name:
          type: string
        added:
          type: integer
          minimum: 0
          description: Keys the page added.
        existing:
          type: integer
          minimum: 0
          description: Keys the page named that the vocabulary already held.
        titles:
          type: integer
          minimum: 0
          description: Held keys whose title the page changed.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    Extent:
      type: object
      additionalProperties: false
      required: [x, y]
      description: The frame a view's positions are quantised over, in the view's own coordinates. It cannot be changed after it is declared.
      properties:
        x:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "`[min, max]` on the horizontal axis."
        y:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "`[min, max]` on the vertical axis."

    ViewVisibility:
      description: The access labels a viewer must hold at least one of to reach the view, as one label or a list. It cannot be changed after it is declared.
      oneOf:
        - type: string
        - type: array
          items: { type: string }

    PointVisibility:
      type: object
      additionalProperties: false
      properties:
        default:
          type: [string, "null"]
          description: The access label an ingested row with no label takes. Absent or `null`, such a row is refused.

    Projection:
      type: string
      enum: [none, web_mercator, equirectangular, plate_carree, gall_isographic]
      default: none
      description: What places positions in the view. `none` takes coordinates as written; the others take longitude and latitude in degrees. `plate_carree` is another name for `equirectangular`.

    ViewGroupDeclaration:
      type: object
      additionalProperties: false
      required: [extent]
      description: A corpus declaration's `[[view_group]]` block, without its name, which is in the path, and without its roster and source.
      properties:
        title:
          type: [string, "null"]
        projection:
          $ref: "#/components/schemas/Projection"
        extent:
          $ref: "#/components/schemas/Extent"
        visibility:
          description: The labels every view of the group requires; a view's own `visibility` applies as well. Absent or `null` is `public`.
          oneOf:
            - $ref: "#/components/schemas/ViewVisibility"
            - type: "null"
        point_visibility:
          oneOf:
            - $ref: "#/components/schemas/PointVisibility"
            - type: "null"
        members:
          type: [string, "null"]
          description: Another view group whose views this group lays out a second time, under the same keys. That group must own its keys, and a group with `members` declares no `metadata`.
        metadata:
          type: array
          default: []
          description: The typed values each view of the group carries, in the order a client is served them.
          items:
            $ref: "#/components/schemas/MetadataField"

    MetadataField:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          description: The name, unique in the group.
        type:
          type: string
          enum: [bool, u8, u16, u32, u64, i8, i16, i32, i64, float, text, timestamp_us, category]
          description: The value's type. `category` is refused on this route.
        vocabulary:
          type: [string, "null"]
          description: The vocabulary a `category` draws on.

    ViewGroupDeclared:
      type: object
      additionalProperties: false
      required: [group, existing, publication]
      properties:
        group:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this declaration and nothing was written."
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    PlainViewDeclaration:
      type: object
      additionalProperties: false
      required: [extent]
      description: A corpus declaration's `[[view]]` block, without its name, which is in the path, and without its source.
      properties:
        title:
          type: [string, "null"]
          description: The name a client draws. Absent is the view's id.
        projection:
          $ref: "#/components/schemas/Projection"
        extent:
          $ref: "#/components/schemas/Extent"
        visibility:
          description: The view's visibility. Absent or `null` is `public`.
          oneOf:
            - $ref: "#/components/schemas/ViewVisibility"
            - type: "null"
        point_visibility:
          oneOf:
            - $ref: "#/components/schemas/PointVisibility"
            - type: "null"

    PlainViewDeclared:
      type: object
      additionalProperties: false
      required: [view, existing, publication]
      properties:
        view:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this declaration and nothing was written."
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ViewRecord:
      type: object
      additionalProperties: false
      description: A view's roster record. It cannot be changed after the view is created.
      properties:
        visibility:
          description: The view's own visibility, applied as well as the group's. Absent or `null` applies the group's alone.
          oneOf:
            - $ref: "#/components/schemas/ViewVisibility"
            - type: "null"
        metadata:
          type: object
          default: {}
          description: One value for each name the group declares, and no other. A `timestamp_us` is microseconds since the Unix epoch, as an integer; an integer is never read as a float, nor a float as an integer.
          additionalProperties:
            type: [boolean, number, string]

    ViewCreated:
      type: object
      additionalProperties: false
      required: [view, group, key, publication]
      properties:
        view:
          type: string
          description: The view's id, `<group>:<key>`.
        group:
          type: string
        key:
          type: string
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ViewDropped:
      type: object
      additionalProperties: false
      required: [deleted, fills_dropped, publication]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Items `delete_dangling` deleted. `0` without it.
        fills_dropped:
          type: integer
          minimum: 0
          description: Group-scoped values written for this view and not yet flushed, which were discarded with it.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    LayerDeclaration:
      type: object
      additionalProperties: false
      required: [name, views, membership, artifact_visibility, hierarchy]
      description: A corpus declaration's `[[layer]]` block.
      properties:
        name:
          type: string
          description: The layer's identity, for ever. Not empty and not `all`.
        title:
          type: [string, "null"]
        views:
          type: array
          items: { type: string }
          description: The views the layer is drawn on. A view group's name stands for every view the group holds at registration.
        membership:
          description: "Where artifacts get their members: `enumerated`, a stored set per artifact; `spatial`, the items inside the artifact's shape; `{\"attribute\": \"<column>\"}`, the items carrying each value of an attribute."
          oneOf:
            - type: string
              enum: [enumerated, spatial]
            - type: object
              additionalProperties: false
              required: [attribute]
              properties:
                attribute:
                  type: string
        value_set:
          type: string
          enum: [closed, open]
          default: closed
          description: "`closed` refuses a key no artifact holds when a batch names it; `open` creates the artifact."
        visibility:
          type: [string, "null"]
          description: The access label a viewer must hold to know the layer exists. Absent or `null`, every viewer may.
        artifact_visibility:
          type: object
          additionalProperties: false
          required: [default]
          description: Whether artifacts carry access labels of their own, and what one carrying none gets.
          properties:
            field:
              type: [string, "null"]
              description: Present, artifacts carry their own labels, and a publication states each artifact's `access`. Absent or `null`, they carry none, and a label on one is refused.
            default:
              description: "What an artifact with no label of its own gets: `inherited`, the layer's `visibility` alone, or `{\"label\": \"<label>\"}`."
              oneOf:
                - type: string
                  const: inherited
                - type: object
                  additionalProperties: false
                  required: [label]
                  properties:
                    label:
                      type: string
        require_member_visibility:
          description: "How many of an artifact's members a viewer must see for the artifact to exist for them: `{\"count\": n}`, or `{\"fraction\": p}` of its declared members with `p` in (0, 1]. Absent or `null` is no such rule. A fraction is refused where the membership is `spatial` or an attribute."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 0
            - type: object
              additionalProperties: false
              required: [fraction]
              properties:
                fraction:
                  type: number
        hierarchy:
          type: object
          required: [kind]
          description: Where the layer's lineage lives. Keys other than these two are ignored.
          properties:
            kind:
              type: string
              enum: [flat, nested, dag, stacked, tiered]
              description: "`flat` has no lineage. `nested` is a tree held in parent edges, and `dag` the same with several parents allowed; neither declares levels. `stacked` is independent analyses, one per level. `tiered` is levels with containment edges from each level to the one below. `stacked` and `tiered` declare at least one level."
            prune_children:
              type: boolean
              default: false
              description: The viewport's default cut. `true` serves only the deepest passing artifact on each branch where a parent and a child both pass; a request may ask for more.
        content:
          type: object
          additionalProperties: false
          description: What artifacts carry beside their members.
          properties:
            computed:
              type: array
              default: []
              description: Properties computed per viewer from the members that viewer can see.
              items:
                type: string
                enum: [centroid, box, hull]
            supplied:
              type: array
              default: []
              description: Content the publisher supplies, in the order each artifact's `values` carry it.
              items:
                $ref: "#/components/schemas/SuppliedContent"
        depends_on:
          type: array
          default: []
          items: { type: string }
          description: Registered layers whose artifacts this layer's artifacts may attach to or name as parents.
        levels:
          type: array
          default: []
          description: The layer's levels, numbered densely from 0. Empty on a `flat`, `nested` or `dag` layer.
          items:
            $ref: "#/components/schemas/LevelDeclaration"
        layout:
          description: How each level's membership is stored for serving. Absent or `null` lets the build and every fold choose. Every form serves the same answers.
          oneOf:
            - type: "null"
            - type: string
              enum: [artifact_major, row_major_label, row_major_list]
        shape:
          description: The kind of shape a `spatial` layer's artifacts carry. Refused on any other membership. A spatial layer without it accepts no artifacts.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [bbox, circle, ellipse, polygon]
        scope:
          description: "`entity`, one artifact set drawn on every view the layer names, or `{\"group\": \"<view_group>\"}`, a different set per view of that group. Absent is `entity`."
          default: entity
          oneOf:
            - type: string
              const: entity
            - $ref: "#/components/schemas/GroupScope"

    SuppliedContent:
      type: object
      additionalProperties: false
      required: [name, type, require_member_visibility]
      properties:
        name:
          type: string
          description: The content's name, unique in the layer.
        type:
          type: string
          description: The content's type, published in `/v1/meta`'s `supplied_content`. `polygon`, `circle` and `ellipse` are authored shapes, read from the value's text; any other type is served as the string sent.
        require_member_visibility:
          type: string
          enum: [all, inherited]
          description: "`all` serves the content only to a viewer who can see every item it was made from, and each content carries `generated_from`. `inherited` serves it wherever the artifact is served, and carries no `generated_from`."

    LevelDeclaration:
      type: object
      required: [level]
      description: One level of a `stacked` or `tiered` layer. Keys other than these three are ignored.
      properties:
        level:
          type: integer
          minimum: 0
        title:
          type: [string, "null"]
        zoom:
          description: "`[min, max]` tile depth: a viewport naming no `levels` is answered at the levels whose range covers its depth. Absent or `null`, the level is served at every depth. A range holding no depth from 0 to 16 is refused."
          oneOf:
            - type: "null"
            - type: array
              minItems: 2
              maxItems: 2
              items: { type: integer, minimum: 0 }

    LayerRegistered:
      type: object
      additionalProperties: false
      required: [name, tessera_id, publication]
      properties:
        name:
          type: string
        tessera_id:
          type: string
          pattern: "^[0-9]+$"
          description: The layer's own identifier, the address `POST /control/changes` suppresses the layer by.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    PublishRequest:
      type: object
      additionalProperties: false
      required: [addressing, artifacts]
      properties:
        level:
          type: integer
          minimum: 0
          default: 0
          description: The level the artifacts go into. Absent is 0, the only level of a layer that declares none.
        addressing:
          type: string
          enum: [external, tessera]
          description: How every member in the batch is written. `external` is a base64 external id; `tessera` is a `tessera_id` as a string of decimal digits.
        idset:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The idset the `tessera_id`s were minted under. Required with `tessera` addressing and refused with `external`.
        default_space:
          type: string
          enum: [view, wgs84]
          description: The space of a shape, and of authored shape content, whose artifact names none. `view` takes the view's own coordinates; `wgs84` takes degrees, projected by each view's own projection and refused on a view whose projection is `none`. Absent is `view`.
        artifacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PublishedArtifact"

    PublishedArtifact:
      type: object
      additionalProperties: false
      description: One artifact of a publication. Its members are `members` or `excluding`; an artifact with `attached_to` may carry neither, and is served over its target's members.
      properties:
        key:
          type: [string, "null"]
          description: The publisher's key, unique in the level. Needed by any artifact another names as a parent or target, and by any grown later.
        view:
          type: [string, "null"]
          description: The key of the view the artifact belongs to. Required on a layer scoped to a group, refused on any other.
        members:
          type: [array, "null"]
          items: { type: string }
          description: The members, addressed as the batch's `addressing` says. `[]` is a membership that holds nobody.
        excluding:
          type: [array, "null"]
          items: { type: string }
          description: The view's items the membership leaves out, addressed as `members` are. The membership is every other item of the view. Refused beside `members`.
        content:
          type: array
          default: []
          description: Ranked supplied content, most specific first.
          items:
            $ref: "#/components/schemas/ContentItem"
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        parent:
          type: array
          default: []
          items: { type: string }
          description: Parent keys. At most one on a `nested` or `tiered` layer, any number on a `dag`. A parent already exists or comes earlier in the batch.
        bbox:
          type: [array, "null"]
          items: { type: number }
          description: "`[min_x, min_y, max_x, max_y]`, on a layer whose `shape` is `bbox`."
        circle:
          type: [array, "null"]
          items: { type: number }
          description: "`[cx, cy, r]`, on a layer whose `shape` is `circle`."
        ellipse:
          type: [array, "null"]
          items: { type: number }
          description: "`[cx, cy, a, b, angle_degrees]`, on a layer whose `shape` is `ellipse`."
        wkt:
          type: [string, "null"]
          description: A WKT polygon or multipolygon, on a layer whose `shape` is `polygon`.
        space:
          type: [string, "null"]
          enum: [view, wgs84, null]
          description: This artifact's space, in place of `default_space`.
        access:
          type: [array, "null"]
          items: { type: string }
          description: The artifact's own access labels. `null` or `[]` is no label, which `artifact_visibility.default` answers. Absent states none, which a layer whose `artifact_visibility` names a field refuses. Refused on a layer that names no field.

    ContentItem:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          items: { type: string }
          description: One value per supplied content the layer declares, in the declaration's order.
        generated_from:
          type: array
          default: []
          items: { type: string }
          description: The items this content was made from, addressed as `members` are. Required where the content's `require_member_visibility` is `all`, and refused where it is `inherited`.

    Attachment:
      type: object
      additionalProperties: false
      required: [layer, key]
      description: The artifact this one is attached to, such as a cluster its label names. The target already exists, on a layer this one's `depends_on` names. The attached artifact is served only where its target is.
      properties:
        layer:
          type: string
        level:
          type: integer
          minimum: 0
          default: 0
        key:
          type: string

    ArtifactsPublished:
      type: object
      additionalProperties: false
      required: [artifacts, created, without_content, filled, joined, publication]
      properties:
        artifacts:
          type: array
          description: One entry per artifact, in the order sent.
          items:
            type: object
            additionalProperties: false
            required: [key, tessera_id]
            properties:
              key:
                type: [string, "null"]
              tessera_id:
                type: string
                pattern: "^[0-9]+$"
                description: The artifact's identifier, the held artifact's own where the key was held.
        created:
          type: integer
          minimum: 0
          description: Artifacts the batch created.
        without_content:
          type: integer
          minimum: 0
          description: Of those, the ones with no content on a layer that declares some.
        filled:
          type: integer
          minimum: 0
          description: Parts filled on held artifacts.
        joined:
          type: integer
          minimum: 0
          description: Memberships added, to created and held artifacts alike.
        shapes:
          type: array
          description: Present when the batch carried a shape or authored shape content.
          items:
            $ref: "#/components/schemas/ShapeReport"
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ShapeReport:
      type: object
      additionalProperties: false
      required: [key, views]
      description: What fitting one shape to each of its layer's views did.
      properties:
        key:
          type: [string, "null"]
          description: The artifact's key.
        content:
          type: integer
          minimum: 0
          description: The rank of the authored shape content this reports on. Absent for the artifact's own shape.
        views:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [view, clipped, outside, rings_dropped, degrees_looking, vertices_in, vertices_out, parts, rings, interior_tiles, boundary_cells]
            properties:
              view:
                type: string
              clipped:
                type: boolean
                description: Part of the shape lay outside the view's extent and was cut away.
              outside:
                type: boolean
                description: The whole shape lay outside the extent, so it holds nothing.
              rings_dropped:
                type: integer
                minimum: 0
                description: Rings that fell below three distinct vertices on the view's grid.
              degrees_looking:
                type: boolean
                description: Every coordinate lay within ±180 by ±90 while the extent does not. The shape may have been written in degrees for a view that is not.
              vertices_in:
                type: integer
                minimum: 0
              vertices_out:
                type: integer
                minimum: 0
              parts:
                type: integer
                minimum: 0
              rings:
                type: integer
                minimum: 0
              interior_tiles:
                type: integer
                minimum: 0
                description: Grid tiles wholly inside the shape.
              boundary_cells:
                type: integer
                minimum: 0
                description: Grid cells the shape's edge crosses.

    GrowRequest:
      type: object
      additionalProperties: false
      required: [addressing, artifacts]
      description: "`level`, `addressing`, `idset` and `default_space` are `PublishRequest`'s."
      properties:
        level:
          type: integer
          minimum: 0
          default: 0
        addressing:
          type: string
          enum: [external, tessera]
        idset:
          type: integer
          minimum: 0
          maximum: 4294967295
        default_space:
          type: string
          enum: [view, wgs84]
        artifacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GrowingArtifact"

    GrowingArtifact:
      type: object
      additionalProperties: false
      required: [key]
      description: One artifact of a growth, by key. Every other field is optional, and a row with only a key changes nothing.
      properties:
        key:
          type: string
          description: The key the artifact was published under.
        view:
          type: [string, "null"]
          description: The key of the view the artifact belongs to, as on a publication. Required on a layer scoped to a group, refused on any other.
        rank:
          type: [integer, "null"]
          minimum: 0
          maximum: 65535
          description: Absent, `members` joins the membership. Present, `members` and `leaving` move the generating set of the content at this rank, and the row fills no part.
        members:
          type: array
          default: []
          items: { type: string }
          description: Members joining, addressed as the batch's `addressing` says.
        leaving:
          type: array
          default: []
          items: { type: string }
          description: Members leaving a generating set, applied after the joins. Needs a `rank`.
        parent:
          type: array
          default: []
          items: { type: string }
          description: Parent keys. Filled where the artifact holds none; `409` where it holds others.
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        content:
          type: array
          default: []
          description: Contents by rank, each filled where the artifact lacks it. A content here carries no generating set.
          items:
            type: object
            additionalProperties: false
            required: [rank, values]
            properties:
              rank:
                type: integer
                minimum: 0
                maximum: 65535
              values:
                type: array
                items: { type: string }
        bbox:
          type: [array, "null"]
          items: { type: number }
          description: A shape field, as on a publication. Only a `spatial` layer takes a shape, and a `spatial` layer's artifacts cannot be grown, so a row carrying one is `422`.
        circle:
          type: [array, "null"]
          items: { type: number }
          description: As `bbox`.
        ellipse:
          type: [array, "null"]
          items: { type: number }
          description: As `bbox`.
        wkt:
          type: [string, "null"]
          description: As `bbox`.
        space:
          type: [string, "null"]
          enum: [view, wgs84, null]
          description: This row's space for authored shape content, in place of `default_space`.
        access:
          type: [array, "null"]
          items: { type: string }
          description: The artifact's access labels, filled where it has none.

    MembershipsGrown:
      type: object
      additionalProperties: false
      required: [artifacts, publication]
      properties:
        artifacts:
          type: array
          description: One entry per row, in the order sent.
          items:
            type: object
            additionalProperties: false
            required: [key, tessera_id, joined, filled, left]
            properties:
              key:
                type: string
              tessera_id:
                type: string
                pattern: "^[0-9]+$"
              joined:
                type: integer
                minimum: 0
                description: Joining members the membership did not already hold.
              filled:
                type: integer
                minimum: 0
                description: Parts that were absent and are now held.
              left:
                type: integer
                minimum: 0
                description: Leaving members taken out of a generating set.
              withdrawn:
                type: integer
                minimum: 0
                description: Present where this row emptied the generating set at this rank. The content is withdrawn, and the publisher supplies it again.
        shapes:
          type: array
          description: Present when the batch filled authored shape content.
          items:
            $ref: "#/components/schemas/ShapeReport"
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    Status:
      type: object
      additionalProperties: false
      description: The `GET /control/status` document. Counters count from the process's start; gauges are read when the request is answered. Byte figures are bytes and times are in the unit their name gives.
      required: [entity_id_high_water, publication, partitions, compute, bulk, write_executor, ingest, limits, segments, overlay, compaction, fragmentation, row_projection_cache, projection_builds_by_route, fragment_cache, sessions, masked_count_cache, region_cache, derived_cache, suggest_sets, occupancy, heap]
      properties:
        entity_id_high_water:
          type: integer
          minimum: 0
          description: The next entity id the allocator will issue to an item, a corpus-wide figure.
        publication:
          type: integer
          minimum: 0
          description: Publication cycles completed since the write executor started. A write is visible once this reaches the `publication` its answer named.
        partitions:
          type: array
          description: One entry per partition of the bundle.
          items:
            type: object
            additionalProperties: false
            required: [partition, segments_version, watermark, readiness]
            properties:
              partition:
                type: string
              segments_version:
                type: integer
                minimum: 0
                description: Moves when a flush, merge or fold publishes.
              watermark:
                type: integer
                minimum: 0
                description: The entities the published geometry covers.
              readiness:
                type: boolean
                description: Whether the write executor is `running`, the same for every partition. It does not reflect a stepped-down partition, which `/readyz` does.
        compute:
          type: object
          additionalProperties: false
          required: [admission, queue, in_flight, waiting, streaming, shed_total]
          description: The compute admission limit the viewport, item and session routes share.
          properties:
            admission:
              type: integer
              minimum: 0
              description: Requests computing at once.
            queue:
              type: integer
              minimum: 0
              description: Requests that may wait for a slot.
            in_flight:
              type: integer
              minimum: 0
            waiting:
              type: integer
              minimum: 0
            streaming:
              type: integer
              minimum: 0
              description: Responses still streaming, which hold a slot but no compute.
            shed_total:
              type: integer
              minimum: 0
              description: Requests this limit answered `429`. A `429` for a request waiting on another's build is not counted.
        bulk:
          type: object
          additionalProperties: false
          required: [admission, queue, in_flight, waiting, shed_total]
          description: The admission limit `POST /v1/items` and `POST /v1/artifacts` run under, `serve.bulk_admission`. A read holds its slot for its whole response.
          properties:
            admission:
              type: integer
              minimum: 0
            queue:
              type: integer
              minimum: 0
              description: Always 0, so a read past the limit is refused at once.
            in_flight:
              type: integer
              minimum: 0
            waiting:
              type: integer
              minimum: 0
            shed_total:
              type: integer
              minimum: 0
        write_executor:
          $ref: "#/components/schemas/WriteExecutorStatus"
        ingest:
          type: object
          additionalProperties: false
          required: [admission, in_flight, shed_total]
          description: The admission limit `POST /control/ingest` and `POST /control/values` share, `ingest.ingest_admission`.
          properties:
            admission:
              type: integer
              minimum: 0
            in_flight:
              type: integer
              minimum: 0
            shed_total:
              type: integer
              minimum: 0
              description: Requests this limit answered `429`. A `429` for a full buffer or queue is not counted.
        limits:
          type: object
          additionalProperties: false
          required: [ingest, values, publish, grow, changes, declarations]
          description: Each write route's caps, so a client can size its requests. A request over one is `422` naming the limit, and is never truncated.
          properties:
            ingest:
              $ref: "#/components/schemas/BatchLimits"
            values:
              $ref: "#/components/schemas/BatchLimits"
            publish:
              type: object
              additionalProperties: false
              required: [route, max_artifacts_per_request, max_body_bytes, max_shape_vertices, max_excluded_per_request]
              properties:
                route:
                  type: string
                max_artifacts_per_request:
                  type: integer
                  minimum: 0
                max_body_bytes:
                  type: integer
                  minimum: 0
                max_shape_vertices:
                  type: integer
                  minimum: 0
                max_excluded_per_request:
                  type: integer
                  minimum: 0
            grow:
              type: object
              additionalProperties: false
              required: [route, max_members_per_request, max_body_bytes]
              properties:
                route:
                  type: string
                max_members_per_request:
                  type: integer
                  minimum: 0
                  description: Joining and leaving members together.
                max_body_bytes:
                  type: integer
                  minimum: 0
            changes:
              type: object
              additionalProperties: false
              required: [route, max_changes_per_request, max_body_bytes]
              properties:
                route:
                  type: string
                max_changes_per_request:
                  type: integer
                  minimum: 0
                max_body_bytes:
                  type: integer
                  minimum: 0
            declarations:
              type: object
              additionalProperties: false
              required: [route, max_records_per_request, max_body_bytes]
              description: The declaration routes, which the `route` string lists.
              properties:
                route:
                  type: string
                max_records_per_request:
                  type: integer
                  minimum: 0
                  description: Always 1.
                max_body_bytes:
                  type: integer
                  minimum: 0
        segments:
          type: array
          description: The live segment count per partition and view, which every viewport pays for. A merge bounds the count; a fold resets it to one. A count past `compaction_max_segments` means folds are being refused.
          items:
            type: object
            additionalProperties: false
            required: [partition, view, count]
            properties:
              partition:
                type: string
              view:
                type: string
              count:
                type: integer
                minimum: 0
        overlay:
          type: object
          additionalProperties: false
          required: [depth, retirable, soft_limit_alarms]
          description: The deletions and suppressions in force and not yet folded.
          properties:
            depth:
              type: integer
              minimum: 0
              description: Deletions and suppressions together.
            retirable:
              type: integer
              minimum: 0
              description: Deletions alone, which a fold retires and the fold schedule keys on. A suppression never retires.
            soft_limit_alarms:
              type: integer
              minimum: 0
        compaction:
          $ref: "#/components/schemas/CompactionStatus"
        fragmentation:
          type: object
          additionalProperties: false
          required: [scope, postings_per_container, run_ratio, postings, runs, containers, rows, tiers, allocation]
          description: How scattered ingested entity ids are across the index, measured over delta tiers as each is flushed; the base bundle is not measured.
          properties:
            scope:
              type: string
              const: delta-tiers
            postings_per_container:
              type: [number, "null"]
              description: Mean entries per container touched. `null` before the first flush publishes.
            run_ratio:
              type: [number, "null"]
              description: Mean run length over the scattered baseline at the same density; `1.0` is fully scattered and larger is better. `null` before the first flush publishes.
            postings:
              type: integer
              minimum: 0
            runs:
              type: integer
              minimum: 0
            containers:
              type: integer
              minimum: 0
            rows:
              type: integer
              minimum: 0
            tiers:
              type: integer
              minimum: 0
              description: Published tiers measured.
            allocation:
              type: object
              additionalProperties: false
              required: [scope, postings, runs, containers, rows, windows]
              description: The same counts taken per commit window, before tiers are formed.
              properties:
                scope:
                  type: string
                  const: commit-window-allocation
                postings:
                  type: integer
                  minimum: 0
                runs:
                  type: integer
                  minimum: 0
                containers:
                  type: integer
                  minimum: 0
                rows:
                  type: integer
                  minimum: 0
                windows:
                  type: integer
                  minimum: 0
        row_projection_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, building_refusals, waits_satisfied, waiters_now, evictions, young_evictions, thrashing, oversized_admissions]
          description: The sessions' row projections of their visible sets.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            building_refusals:
              type: integer
              minimum: 0
              description: Requests refused with `429` while another built the same projection.
            waits_satisfied:
              type: integer
              minimum: 0
              description: Requests served by waiting for another's build.
            waiters_now:
              type: integer
              minimum: 0
              description: Requests waiting now, across the process.
            evictions: { type: integer, minimum: 0 }
            young_evictions:
              type: integer
              minimum: 0
              description: Entries evicted before they were read again, a sign the bound is smaller than what the sessions hold at once.
            thrashing:
              type: boolean
              description: "`young_evictions` is above 0."
            oversized_admissions: { type: integer, minimum: 0 }
        projection_builds_by_route:
          type: object
          additionalProperties: false
          required: [whole_domain, walk, split, complement]
          description: How row projections were built, per construction. Every construction gives the same rows; the shares show whether the choice between them fits the corpus.
          properties:
            whole_domain: { type: integer, minimum: 0 }
            walk: { type: integer, minimum: 0 }
            split: { type: integer, minimum: 0 }
            complement: { type: integer, minimum: 0 }
        fragment_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, building_refusals, evictions, young_evictions, thrashing, oversized_admissions, rebuilds]
          description: The mask fragments `POST /session/authorise` builds, one per credential.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            building_refusals: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            young_evictions: { type: integer, minimum: 0 }
            thrashing: { type: boolean }
            oversized_admissions: { type: integer, minimum: 0 }
            rebuilds:
              type: integer
              minimum: 0
              description: Fragments built again after an eviction, as against for the first time.
        sessions:
          type: object
          additionalProperties: false
          required: [retained, sweeps, swept_total, sweep_at]
          description: Viewer sessions held in memory. Expired ones are swept when `retained` reaches `sweep_at`; an expired session is refused whether or not it has been swept.
          properties:
            retained: { type: integer, minimum: 0 }
            sweeps: { type: integer, minimum: 0 }
            swept_total: { type: integer, minimum: 0 }
            sweep_at: { type: integer, minimum: 0 }
        masked_count_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, hits, misses, evictions]
          description: Per-session masked counts, pruned at revocation and at the expiry sweep.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
        region_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, building_refusals, waits_satisfied, evictions]
          description: The rows each `region` filter leaf selects, shared across sessions per generation.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            building_refusals: { type: integer, minimum: 0 }
            waits_satisfied: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
        derived_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, hits, misses, evictions, hit_rate]
          description: Artifact geometry derived per session, such as hulls.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            hit_rate:
              type: [number, "null"]
              description: Hits over lookups. `null` before the first lookup.
        suggest_sets:
          type: object
          additionalProperties: false
          required: [entries, bytes, hits, misses, builds, declined, discarded, evictions, in_flight]
          description: The per-session sets of visible category values `/v1/categories/{column}/suggest` answers from.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            builds: { type: integer, minimum: 0 }
            declined:
              type: integer
              minimum: 0
              description: Sessions too broad for a set, over `selection.max_suggest_set_entities`, which are answered by probing instead.
            discarded: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            in_flight: { type: integer, minimum: 0 }
        occupancy:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, evictions, walks]
          description: Which tiles hold visible rows, per session, view, depth and generation.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            walks:
              type: integer
              minimum: 0
              description: Occupancy walks. One per session, view and generation is expected; one per request means the cache is not holding.
        heap:
          type: object
          additionalProperties: false
          required: [anon_bytes, file_bytes, resident_bytes, trims, last_trim_returned_bytes, last_trim_micros, trim_baseline_bytes, trim_growth_bytes]
          description: The kernel's view of the process's memory. The gap between `anon_bytes` and the caches above is what the allocator retains.
          properties:
            anon_bytes: { type: integer, minimum: 0 }
            file_bytes: { type: integer, minimum: 0 }
            resident_bytes: { type: integer, minimum: 0 }
            trims:
              type: integer
              minimum: 0
              description: Times the allocator was asked to return memory to the kernel.
            last_trim_returned_bytes: { type: integer, minimum: 0 }
            last_trim_micros: { type: integer, minimum: 0 }
            trim_baseline_bytes: { type: integer, minimum: 0 }
            trim_growth_bytes:
              type: integer
              minimum: 0
              description: The growth over the baseline that asks for the next trim.

    BatchLimits:
      type: object
      additionalProperties: false
      required: [route, max_batch_rows, max_batch_bytes]
      properties:
        route:
          type: string
          description: The route these caps apply to, as `<method> <path>`.
        max_batch_rows:
          type: integer
          minimum: 0
          description: "`ingest.ingest_max_batch_rows`."
        max_batch_bytes:
          type: integer
          minimum: 0
          description: "`ingest.ingest_max_batch_bytes`."

    WriteExecutorStatus:
      type: object
      additionalProperties: false
      description: The write executor, the one thread that applies every write.
      required: [posture, ready, work_submitted, deny_submitted, wal_appends, wal_fsyncs, wal_recoveries, wal, apply_nanos_total, apply_nanos_max, foreign_side_manifests, work_completed, work_depth, work_service_nanos_ewma, flush, coalesces, merges, coalesce_in_flight, merge_in_flight, work_in_flight_nanos, bench_timing, stage_nanos, flush_stages]
      properties:
        posture:
          type: string
          enum: [not-started, running, wal-poisoned, dead]
          description: "`running` is ready. `wal-poisoned` is not ready, and still applies deletions and suppressions."
        ready:
          type: boolean
          description: Whether `posture` is `running`. `/readyz` answers `200` only when this is `true` and no partition serves a stepped-down manifest.
        work_submitted:
          type: integer
          minimum: 0
          description: Writes submitted to the queue that sheds, every write but changes.
        deny_submitted:
          type: integer
          minimum: 0
          description: Changes submitted to the queue that never sheds.
        wal_appends: { type: integer, minimum: 0 }
        wal_fsyncs:
          type: integer
          minimum: 0
          description: "`wal_appends / wal_fsyncs` is the mean writes per commit window."
        wal_recoveries:
          type: integer
          minimum: 0
          description: Write-ahead log faults recovered from. A rise means changes were answered `500` and their callers send them again.
        wal:
          type: object
          additionalProperties: false
          required: [members, bytes, position, pinned_by, pinned_at, pin_span_bytes, samples]
          description: The write-ahead log, sampled at most once per flush period.
          properties:
            members:
              type: integer
              minimum: 0
              description: Files the log is held in. Steady state is two; a rising count is a rotation that is not reclaiming.
            bytes: { type: integer, minimum: 0 }
            position:
              type: integer
              minimum: 0
              description: Record bytes written across every file the log has held. A position, not a size.
            pinned_by:
              type: [string, "null"]
              description: What keeps the log from rotating below `pinned_at`, or `null` when nothing does. A `growth` or `fill` pin clears only at a compaction fold.
            pinned_at:
              type: [integer, "null"]
              minimum: 0
            pin_span_bytes:
              type: integer
              minimum: 0
              description: "`position` less `pinned_at`; `0` when nothing pins the log."
            samples:
              type: integer
              minimum: 0
              description: Samples taken. Two reads with the same value read the same sample.
        apply_nanos_total: { type: integer, minimum: 0 }
        apply_nanos_max: { type: integer, minimum: 0 }
        foreign_side_manifests:
          type: integer
          minimum: 0
          description: Manifests another process wrote over this node's bundle root. Anything above 0 means a second writer.
        work_completed: { type: integer, minimum: 0 }
        work_depth:
          type: integer
          minimum: 0
          description: Writes submitted and not yet answered.
        work_service_nanos_ewma:
          type: integer
          minimum: 0
          description: A moving average of one write's service time. With `work_depth` it gives a `429`'s `Retry-After`.
        flush:
          type: object
          additionalProperties: false
          required: [ticks, flushes, flush_skips, flush_failures, flushable_items, flush_requested, in_flight, buffered_items, overlay_publications, refreshes, refresh_in_flight]
          properties:
            ticks: { type: integer, minimum: 0 }
            flushes: { type: integer, minimum: 0 }
            flush_skips:
              type: integer
              minimum: 0
              description: Ticks skipped because a flush was still running. A rising count means flushes are slower than the tick.
            flush_failures:
              type: integer
              minimum: 0
              description: Flushes that failed and left the buffer for the next tick.
            flushable_items:
              type: integer
              minimum: 0
              description: Rows the next flush would publish; an item in two views counts twice.
            flush_requested:
              type: boolean
              description: A `POST /control/flush` is waiting for the next tick.
            in_flight:
              type: boolean
              description: A flush is running, or finished and not yet published.
            buffered_items:
              type: integer
              minimum: 0
              description: Items buffered, the figure `ingest.ingest_buffer_max_items` bounds.
            overlay_publications:
              type: integer
              minimum: 0
              description: Manifests written for deletions and suppressions alone.
            refreshes:
              type: integer
              minimum: 0
              description: Session projections refreshed after a flush or merge. A session serves its old projection until its refresh.
            refresh_in_flight:
              type: boolean
              description: The refresh for the newest flush or merge is still running.
        coalesces: { type: integer, minimum: 0 }
        merges: { type: integer, minimum: 0 }
        coalesce_in_flight: { type: boolean }
        merge_in_flight: { type: boolean }
        work_in_flight_nanos:
          type: integer
          minimum: 0
          description: How long the current write has run; `0` when the executor is idle.
        bench_timing:
          type: boolean
          description: Whether this binary records stage times. Without it every stage time is 0.
        stage_nanos:
          type: object
          description: Time spent in each stage of closing a commit window, by stage name. The names are instrumentation and are not listed here.
          additionalProperties:
            type: integer
            minimum: 0
        flush_stages:
          type: object
          additionalProperties: false
          required: [bench_timing, executions, rows_executed, flushes, rows_published, executor_nanos, pool_nanos]
          description: Flush stage times, on the executor thread and on the pool. Divide pool times by `executions`, and executor times by `flushes`, for a per-flush figure.
          properties:
            bench_timing: { type: boolean }
            executions: { type: integer, minimum: 0 }
            rows_executed: { type: integer, minimum: 0 }
            flushes: { type: integer, minimum: 0 }
            rows_published: { type: integer, minimum: 0 }
            executor_nanos:
              type: object
              description: Nanoseconds by stage name, on the executor thread.
              additionalProperties:
                type: integer
                minimum: 0
            pool_nanos:
              type: object
              description: Nanoseconds by stage name, on the pool.
              additionalProperties:
                type: integer
                minimum: 0

    CompactionStatus:
      type: object
      additionalProperties: false
      description: Compaction folds. Alarm on `fold_failures`, and on `fold_refusals` rising while `folds` does not.
      required: [live_rows, folds, fold_failures, fold_requested, fold_refusals, fold_refusals_by_gate, last_refusal, last_secs, last_rss_bytes, last_attr_bytes_read, last_attr_bytes_written, passes]
      properties:
        live_rows: { type: integer, minimum: 0 }
        folds: { type: integer, minimum: 0 }
        fold_failures:
          type: integer
          minimum: 0
          description: Folds discarded. Each leaves a bundle-sized directory nothing reclaims.
        fold_requested:
          type: boolean
          description: A `POST /control/compact` is waiting for the next tick.
        fold_refusals:
          type: integer
          minimum: 0
          description: Folds asked for and not started, the sum of `fold_refusals_by_gate`.
        fold_refusals_by_gate:
          type: object
          additionalProperties: false
          required: [insufficient_disc, insufficient_memory, nothing_to_fold, overlay_diverged, stepped_down, wal_poisoned]
          properties:
            insufficient_disc: { type: integer, minimum: 0 }
            insufficient_memory: { type: integer, minimum: 0 }
            nothing_to_fold: { type: integer, minimum: 0 }
            overlay_diverged: { type: integer, minimum: 0 }
            stepped_down: { type: integer, minimum: 0 }
            wal_poisoned: { type: integer, minimum: 0 }
        last_refusal:
          description: The latest refusal, or `null` where there has been none.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [gate, need_bytes, had_bytes, at_unix]
              properties:
                gate:
                  type: string
                  description: One of `fold_refusals_by_gate`'s names.
                need_bytes:
                  type: [integer, "null"]
                  minimum: 0
                  description: For a memory or disc refusal, what the fold needs; `null` otherwise.
                had_bytes:
                  type: [integer, "null"]
                  minimum: 0
                  description: For a memory or disc refusal, what the host had; `null` otherwise.
                at_unix:
                  type: integer
                  minimum: 0
                  description: When, in seconds since the Unix epoch.
        last_secs: { type: integer, minimum: 0 }
        last_rss_bytes:
          type: integer
          minimum: 0
          description: The last fold's resident memory, sampled between passes, so it understates the peak.
        last_attr_bytes_read: { type: integer, minimum: 0 }
        last_attr_bytes_written: { type: integer, minimum: 0 }
        passes:
          type: array
          description: The last fold's passes, in order.
          items:
            type: object
            additionalProperties: false
            required: [pass, ms, rss_bytes, anon_bytes]
            properties:
              pass: { type: string }
              ms: { type: integer, minimum: 0 }
              rss_bytes: { type: integer, minimum: 0 }
              anon_bytes: { type: integer, minimum: 0 }
