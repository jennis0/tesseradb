# Tessera's HTTP API: the viewer, session and control planes, as an OpenAPI 3.1 description.
#
# Hand-authored, and kept true by `crates/tessera-server/tests/openapi.rs`, which starts the
# server, exercises every route below (a success and at least one refusal each) and validates
# every JSON request and response body against the schemas in `components`. A field added to a
# response and not to this file fails that test, because every closed DTO is declared
# `additionalProperties: false`. Where this file and the server disagree, the server is right and
# this file is wrong.
#
# What this file cannot say: the framed-Arrow bodies of `POST /v1/viewport`, `POST /v1/items` and
# `POST /v1/artifacts`, and the Arrow IPC forms of `POST /control/ingest`, `POST /control/values`
# and `PATCH /control/layers/{name}/artifacts`. They are not JSON, so each is declared as a binary
# media type and described in prose on its route. `docs/openapi/README.md` carries worked decodes
# of the framed bodies in Python and in JavaScript. The JSON frames of the two bulk reads have
# schemas below (`ItemsHead`, `ArtifactsHead`, `PageEnd`, `RecordsTrailer`).
openapi: 3.1.0
info:
  title: Tessera HTTP API
  version: "1"
  summary: The viewer, session and control planes of a Tessera server.
  description: |
    Three listeners. The **session plane** mints and revokes viewer sessions and is authenticated
    by the *session credential*, a shared secret the operator configures; it is never
    browser-facing. The **viewer plane** answers about the corpus as one principal may see it and
    is authenticated by the *session token* the session plane minted. The **control plane**
    declares, ingests, deletes, suppresses and publishes, reports the node's state, and is
    authenticated by the *operator credential*, a second shared secret. `/healthz` and `/readyz`
    sit on the viewer and session listeners, unauthenticated, bare status codes with no body.

    `api_version` is published by `GET /v1/meta` and by nothing else. There is no version header,
    on any plane. A client does not send one to negotiate, and a server does not refuse a client
    whose assumed version is wrong.

    Every refusal a route's handler makes is one envelope (`Error` below) with a closed code list.
    The codes group into three classes that tell a client whether to retry:

    - **Failure**: `500 fail-closed` and `503 not-ready`. Never a partial result.
    - **Backpressure**: `429 backpressure`. Retry the request unchanged after `Retry-After`, which
      every 429 carries with an agreeing body `retry_after_s`. The number depends on what shed the
      request: `1` for the compute-admission gate, and derived from the write executor's service
      time on the control plane. Read the header.
    - **Shape**: `422 contract`. The request has to change before it is sent again.

    `401`, `403`, `404` and `409` are in none of the three: they concern the credential or the
    thing addressed. A `401 bad-credential` on a session token that worked before is a revoked
    session, and a client treats it as `403 expired-token`: the session has ended, so
    re-authorise.

    The HTTP framework answers three refusals itself, before a handler runs, with a plain-text
    body instead of the envelope: `400` for a JSON body that does not parse or a path segment that
    is not UTF-8, `413` for a JSON body over its route's byte cap, and `415` for a JSON route
    called without `content-type: application/json`.

    On the viewer plane a refusal depends on the request and the deployment's configuration, and
    never on the viewer's data. `404 unknown` there is one status, one code and one detail string
    for *no such identifier* and *exists but is not visible to this principal*.
servers:
  - url: http://{viewer-host}
    description: The viewer plane's listener, `serve.viewer`. Routes under `/v1/`, and the probes.
    variables:
      viewer-host:
        default: 127.0.0.1:8080
  - url: http://{session-host}
    description: The session plane's listener, `serve.session`. Routes under `/session/`, and the probes.
    variables:
      session-host:
        default: 127.0.0.1:8081
  - url: http://{control-host}
    description: "The control plane's listener, `serve.control`: a loopback TCP address, or a Unix socket written `unix:<path>`. Routes under `/control/`."
    variables:
      control-host:
        default: 127.0.0.1:8082

tags:
  - name: session
    description: Minting and revoking viewer sessions. Authenticated by the session credential.
  - name: viewer
    description: The corpus as one principal sees it. Authenticated by a session token.
  - name: probes
    description: Liveness and readiness, on the viewer and session listeners, unauthenticated, no body.
  - name: "control: ingest"
    description: New items, with their positions, labels and values. Control plane.
  - name: "control: values"
    description: Values on items that already exist. Control plane.
  - name: "control: changes"
    description: Deletions, suppressions and lifted suppressions. Control plane.
  - name: "control: status"
    description: The node's state, counters and published limits. Control plane.
  - name: "control: flush"
    description: Publishing buffered writes ahead of the next tick. Control plane.
  - name: "control: compact"
    description: Asking for a compaction fold. Control plane.
  - name: "control: attributes"
    description: Declaring attribute columns. Control plane.
  - name: "control: vocabularies"
    description: Declaring vocabularies and adding values to them. Control plane.
  - name: "control: views"
    description: Declaring plain views, and creating and dropping the views of a view group. Control plane.
  - name: "control: view groups"
    description: Declaring view groups. Control plane.
  - name: "control: layers"
    description: Registering and dropping annotation layers. Control plane.
  - name: "control: artifacts"
    description: Publishing a layer's artifacts and growing their memberships. Control plane.

paths:
  /session/authorise:
    post:
      tags: [session]
      operationId: authorise
      summary: Mint a viewer session from a credential the auth plugin understands.
      description: |
        `auth_data` is base64 of bytes the deployment's auth plugin evaluates (`terms_of_auth`,
        contracts §4.3) — **opaque to this description**: what the bytes mean is the plugin's, and
        the built-in passthrough plugin reads them as JSON `{"terms": [...]}`. The decoded bytes are
        also the fast-path hash input, which is why the encoding is base64 and never "verbatim
        JSON".

        A valid credential yielding zero terms still mints a token, with zero visibility — the
        service cannot distinguish *wrong credential* from *cleared for nothing* and refusing
        would disclose which (contracts §3.3).

        Behind the compute-admission gate: a cold authorise builds and writes a mask fragment.
      security:
        - sessionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthoriseRequest"
      responses:
        "200":
          description: A session. `expires_at` is the time of the request plus the server's `token_max_lifetime_secs`, in seconds since the Unix epoch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthoriseResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "422":
          description: "`auth_data` is not base64, or the deployment's plugin refused it. The detail carries the plugin's reason, which only a holder of the session credential reads."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"
        "503":
          $ref: "#/components/responses/NotReady"

  /session/revoke:
    post:
      tags: [session]
      operationId: revoke
      summary: End a session by its non-capability `token_id`.
      description: |
        Revocation is by `token_id` so the capability itself never transits a second time. A
        `token_id` that names no live session is still a `204` — there is nothing to say about it
        that would not enumerate sessions.
      security:
        - sessionCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "204":
          description: Revoked, or never live. No body.
        "401":
          $ref: "#/components/responses/BadCredential"
        "422":
          $ref: "#/components/responses/Contract"

  /healthz:
    get:
      tags: [probes]
      operationId: healthz
      summary: Liveness. Unauthenticated, no body.
      security: []
      responses:
        "200":
          description: The process is up.

  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      summary: Readiness — bundle verified, workers ready, plugin loaded. Unauthenticated, no body.
      security: []
      responses:
        "200":
          description: Ready to serve.
        "503":
          description: Not ready. Deliberately no body and no `Retry-After` — a number that varied with the executor's posture would hand an unauthenticated caller exactly what the bare-boolean shape withholds.

  /v1/meta:
    get:
      tags: [viewer]
      operationId: meta
      summary: The deployment's shape as this principal may know it.
      description: |
        Everything here is a deployment constant identical for every principal **except
        `layers`**, which is filtered per principal — a layer this caller may not know about is
        absent by the same route a name nobody registered is. Never cache this document across
        principals.

        Not behind the compute-admission gate.
      security:
        - sessionToken: []
      responses:
        "200":
          description: The document. `declared_scalars` is the column schema in full; `filter_operands` is the subset a request may filter on, with each column's operator names; `selection` is design §7.2's clause parameters, which a client needs to read a mark count as a density at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "500":
          $ref: "#/components/responses/FailClosed"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/categories/{column}:
    get:
      tags: [viewer]
      operationId: categories
      summary: What a category column's codes stand for, gated by the vocabulary's `visibility`.
      description: |
        Two forms, one gate. `?codes=` resolves codes the caller already holds; the bare form
        enumerates ascending by value **key**, resuming after `?after=` and bounded by `?limit=`,
        whose ceiling and default are `selection.max_category_values`. `limit` above the ceiling is
        clamped; `limit=0` is `422`. A `visibility = "derived"` column is filtered per principal
        **before** the two forms diverge and the page is cut after the filter, so a page's length
        never counts what the principal cannot see.

        **An unresolvable code is omitted, never refused**, and an empty `values` is a real answer
        served with `200` — "no such code", "a code no key explains" and "a value you cannot see"
        are one outcome. No counts on this route: a legend with counts is a separate surface.
        A count beside a value the caller *asked for by prefix* is served by
        `/v1/categories/{column}/suggest`.

        Not behind the compute-admission gate. For a `public` column that is a walk of an in-memory
        map; a `derived` column composes the candidate and probes one memory-mapped posting per
        value it walks, over the whole vocabulary.
      security:
        - sessionToken: []
      parameters:
        - name: column
          in: path
          required: true
          description: |
            Any column from `/v1/meta`'s `declared_scalars` that carries a `category` block —
            including one with neither `render` nor `index`, which is blob-resident and is not a
            filter operand, a value list being a property of the vocabulary rather than of the
            placement — or
            a **group-scoped** category family from `filter_operands` — which is one column per
            view, so it is addressed with a view. Either pin one here, `<column>@<key>`, or name
            the request's own view in `view` below; a scoped column named with neither is a `422`
            naming the group, and a pin naming no view of it is the unknown-view `404`. A pin on an
            entity-scoped column is a `422`: it is one value set for the corpus.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+(@[A-Za-z0-9_.:-]+)?$"
        - name: view
          in: query
          required: false
          description: |
            The request's own view, for a **group-scoped** category (`views.md` §5). Resolved
            through the session's visible-view set exactly as a viewer verb's `view` is, and
            resolved **before** the column is, whatever that column's scope — so a `view` naming
            nothing, or naming a view this principal may not reach, is the `404` an unknown view
            gets even where the column is entity-scoped and no view would have decided anything
            about it. What the scope changes is only whether the view *chooses a column*: an
            entity-scoped column has one value set for the corpus.
          schema:
            type: string
        - name: codes
          in: query
          required: false
          description: Comma-separated `u32` codes to resolve. Present means bulk lookup; absent means enumerate. `next` is always `null` for this form.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Resume enumeration after this value key — the cursor, which is `next` from the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page bound. Clamped to `selection.max_category_values`; `0` is refused.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The values this principal may be told about, in key order for the bare form and request order for `?codes=`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: No such column, a column that is not a category, or a column whose vocabulary is missing — one answer for all three, so this route cannot become a finer schema oracle than `/v1/meta`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/categories/{column}/suggest:
    get:
      tags: [viewer]
      operationId: suggestCategoryValues
      summary: Typeahead over a category vocabulary — the values whose key, title or a word start of either has `q` as a prefix, gated by the vocabulary's `visibility`.
      description: |
        Specified by `value-suggestion.md` (normative r4) and decisions 0118–0124.

        The matching rule is declared and fixed: Unicode NFKC, then default case folding, then
        whitespace collapsed and trimmed, applied to `q` and to every indexed string alike. Each
        value contributes its whole folded key, its whole folded title where one exists, and the
        folded title (or key, where there is no title) from each word boundary after the first. A
        match is a **prefix** of one of those entries — no infix, no fuzziness, no stemming.

        Ordering is the matched text's own: ascending by folded entry string, ties by entry kind
        (key, then title, then word start), then by key. It is fixed at index build and identical
        for every principal — never frequency, never recency, and never the count. A value appears
        at most once, at its first matching entry.

        **One gate with the enumeration**: a `public` vocabulary is suggested as authored; a
        `derived` one offers a value iff at least one item carrying it is visible against the
        composed candidate. Address resolution is the enumeration's too, including the `@key` pin
        and the group gate's `404` collapse.

        **There is no cursor.** A typeahead does not page: the user types another character.
        `more` says the walk stopped early — the page filled, or the deployment's
        `selection.max_suggestion_walk` values were examined. That spent-budget form is the probe
        route's; where the server answers from a per-session set of visible values — built for a
        principal whose composed cardinality is at or under `selection.max_suggest_set_entities` —
        `more` means the page filled and nothing else.

        Not behind the compute-admission gate, and at most one suggest in flight per session: a
        second while one is running is the shared `429 backpressure`, shed whole and refused before
        any work is done, with `Retry-After` as every other shed request carries it.
      security:
        - sessionToken: []
      parameters:
        - name: column
          in: path
          required: true
          description: As on `/v1/categories/{column}` — any column carrying a `category` block, or a group-scoped family pinned `<column>@<key>`.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]+(@[A-Za-z0-9_.:-]+)?$"
        - name: q
          in: query
          required: true
          description: The text typed. Echoed in the response **as received**, not folded, so a client can match a response to the request it has in flight. Empty matches every value and returns the first `limit` visible ones in index order — the picker's list before anything is typed. Over 256 bytes is `422`.
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          description: Page bound. Clamped to `selection.max_suggestions`, which is also the default; `0` is refused, a zero-length suggestion page being a request for no answer.
          schema:
            type: integer
            minimum: 1
        - name: counts
          in: query
          required: false
          description: Serve `count` beside each value — the number of items carrying it that this principal may see, exact, computed per request. Absent from the response entirely when this is not `true`. It never orders the page.
          schema:
            type: boolean
        - name: view
          in: query
          required: false
          description: The request's own view, for a **group-scoped** category. Resolved exactly as on `/v1/categories/{column}`, and before the column is, whatever that column's scope.
          schema:
            type: string
      responses:
        "200":
          description: At most `limit` values this principal may be told about, in matched-entry order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: No such column, a column that is not a category, or a column whose vocabulary is missing — one answer for all three, as on the enumeration; and the answer a group-scoped family gives whole when its group gate fails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/viewport:
    post:
      tags: [viewer]
      operationId: viewport
      summary: Masked counts per tile, a served sample of points, and the served annotation artifacts, over a region at a depth.
      description: |
        The response is **not JSON**. It is a sequence of tagged, length-prefixed frames —
        `u8 kind`, `u32 little-endian payload length`, payload — each payload a complete Arrow IPC
        stream (JSON for the trailer), decodable alone (contracts §5). Kinds: `1` tiles (exactly
        one, first), `2` sub-cells (exactly one iff `underlay_offset` was supplied and non-zero),
        `5` artifacts (at most one, after tiles and before any points; **absent, never empty, when
        nothing is served**, deliberately), `3` points (zero or more, whole tiles per frame,
        boundaries not contract), `4` trailer (exactly one, last — its presence is the completeness
        signal). A body without a trailer is incomplete whatever the transport said; an unknown
        kind is a decoder error, never skipped. `docs/openapi/README.md` walks a decode in Python
        and JavaScript, and contracts §3.2 gives every batch's schema.

        **Exactly one of `bbox` and `tiles`.** `k` defaults to the deployment's `k_max_marks` and
        is capped by `max_k` (both in `/v1/meta`'s `selection`); it is design §7.2's cap clause,
        so a tile may return fewer than `k` while more are visible — that is the density signal,
        not truncation. **`k = 0` is the counts-only request**: tiles and artifacts as at any `k`,
        and no points frame at all. **A client must not decrease `k` as it zooms in**; the server
        cannot enforce this.

        The *artifacts* frame's `matched` column answers the request's `filters` per
        artifact, and is null where the request carried none — see `filters`. Its `layer` column
        is **dictionary-encoded** (u16 keys over utf8 values); its `rung` column is the number a
        client draws by — the declared level on a levelled layer, the response-local parent-chain
        depth on a treed one (the depth in the forest this response's own `parent_id` links form,
        after the budget cut), `0` on a flat one; and its two shape columns `shape_x`/`shape_y` —
        `list<list<list<uint32>>>`, parts then rings then vertices, one drawn geometry per artifact
        of the kind its layer's `shape` names — **trail the fixed columns and are absent from the
        schema entirely when no served layer draws a shape or the request did not ask for one** —
        an absent column is distinguishable from a null one, so a per-row null keeps its one
        meaning: *this layer declares no such property*, never *withheld* (decision 0076).
        `artifact_rows: "identity"` answers with the **same rows** in a fixed five-column schema —
        see its property.

        A request carrying a `highlight` gains three columns and loses none: `highlighted` fifth on
        the tiles frame (`uint64`, **always present**, equal to `matched` where the request carried
        no highlight), `highlighted` on the points frame (`bool`, after the render scalars and
        before the membership columns, **present only with a highlight**), and `highlighted`
        fifteenth on the artifacts frame (`bool?`, after `matched`). The served set is identical
        with and without one — see `highlight`.

        The artifacts frame's sixteenth column is `target` (`uint64?`): the `tessera_id` of the
        artifact this row is attached to, which for a clustering's label is its cluster. The
        target is a row of the same frame, and the column is null for a row attached to nothing.
        A label's `masked_count` is its own. The `"identity"` projection omits `target`.

        `layers` decides whether an artifacts frame can appear — see its schema; the semantics
        there are the owner's ruling of 2026-08-25 and the server change is landing on the s3
        track, so until that merges an *omitted* `layers` is read as `"all"` and the string form is
        not accepted. `artifact_budget` is honoured structurally (ancestors in place of their
        descendants), never by sampling, and is inert on a flat layer.

        Behind the compute-admission gate.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewportRequest"
      responses:
        "200":
          description: The framed body. Headers carry the coordinates a client caches and revalidates by.
          headers:
            etag:
              description: The **content key**, quoted — identity, the served watermark, the overlay version, a per-process nonce (`delta-serving.md` §2). What a held band may be *declared* under. Echoed as `If-Match`; a mismatch yields the full response, never `412`.
              required: true
              schema:
                type: string
            x-tessera-identity-key:
              description: The **identity key** — idset, auth-data hash, mask-fragment identity, view. What a held band may be *rendered* under at all; the client's cache partition key.
              required: true
              schema:
                type: string
            x-tessera-pin:
              description: The generation stamp this response was computed from, as JSON `{"prefix", "segments_version"}`. It names the generation of this session's visible set. While the background refresh after a flush has not reached this session, that is the previous generation, and the flush's new rows are not yet visible; deletions, suppressions, segments and the overlay are always current. Echo it back as `pin`; its only effect is `x-tessera-stale`.
              required: true
              schema:
                type: string
            x-tessera-stale:
              description: "`1` if the `pin` this request presented differs from this response's `x-tessera-pin`, else `0`. The **broadcast** form: it moves at every flush, merge and compaction whether or not anything this principal can see changed. After a flush it moves when the refresh reaches this session, not at the flush itself. Advisory in both directions."
              required: true
              schema:
                type: string
                enum: ["0", "1"]
            x-tessera-region:
              description: "Present exactly when the request's `filters` carried a `region` leaf: `exact` when every region's answer is exact for the shape against each point's stored position, or `cover; depth=<d>` when a shape's perimeter exceeded `max_region_cells` and the answer is exact for a cover of it — a superset — taken at depth `d` (`selection-operand.md` §6). A function of the shape and the grid alone, never of the rows, so it says nothing about the corpus; with several region leaves, the coarsest. A leaf by artifact is always exact."
              required: false
              schema:
                type: string
                pattern: "^(exact|cover; depth=[0-9]+)$"
            x-tessera-server-us:
              description: Server compute after admission to first-flush-ready, microseconds. The whole-stream wall total is the trailer's `stream_us`.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
            x-tessera-admission-us:
              description: Time spent in the compute-admission gate, microseconds.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: Framed Arrow IPC streams and one JSON trailer, per contracts §5.
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: Unknown `view`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`zoom` above 16; neither or both of `bbox`/`tiles`; a non-finite or inverted bbox; a tile prefix with bits above `zoom`; an `underlay_offset` beyond the deployment's ceiling, the grid or the sub-cell budget (refused, never clamped); an unknown filter column or an operator outside its family (an unknown *value* is an empty operand, never a refusal); `none_of` naming a text column or naming two columns."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/items:
    post:
      tags: [viewer]
      operationId: items
      summary: Every item this principal may see in one view that matches a filter, page by page, with the fields the caller names.
      description: |
        The response is **not JSON**. It is the viewport's framing: a sequence of frames, each
        `u8 kind`, `u32` little-endian payload length, payload. Kinds:

        - `6` head: JSON `ItemsHead`, exactly one, first.
        - `7` records: one Arrow IPC stream holding one batch of up to `page_rows` rows. Zero or
          more, each followed by a page end.
        - `8` page end: JSON `PageEnd`, carrying the cursor to resume after that page.
        - `4` trailer: JSON `RecordsTrailer`, exactly one, last.

        A body without a trailer is incomplete. A client whose connection drops resumes from the
        last page end it received and discards a records frame that no page end follows. A
        response with no rows is a head and a trailer. An unknown kind is a decoder error.
        `docs/openapi/README.md` walks a decode in Python and JavaScript.

        **Reading a whole result.** Each response carries at most `pages` pages and runs within
        the deployment's byte and time budgets. The trailer's `next` is the cursor to pass back
        as `cursor`, unchanged, until it is null. The server keeps nothing between requests: every
        page is built from the latest data, with the visible set composed again, so a deletion or
        suppression accepted during a read applies from the next page. A read returns each row at
        most once. A row inserted behind the cursor during a read is not returned; one inserted
        ahead of it is. `fields`, `system_fields`, `filters`, `keep_unmatched` and `page_rows` may
        change between the requests of one read, and the page schema changes with them.

        **Columns.** `tessera_id` (`uint64`) is first, then the named fields in the order named,
        then the system fields in the order named, then `tessera:matched` (`bool`) under
        `keep_unmatched`. Every named field is present whether or not an item carries a value. A
        number or bool arrives as its declared type, `timestamp_us` as `timestamp[us, UTC]`, a
        keyword or text field as `utf8`, and a category as `dictionary<int32, utf8>` holding its
        value keys, each frame's dictionary holding only the keys its rows carry. An absent value
        is null. `position` is two `float64` columns, `tessera:x` and `tessera:y`: the stored
        position converted back through the view's projection and frame, so degrees for a
        geographic view, exact to one step of the view's 32-bit grid. `external_id` is `binary`
        as `tessera:external_id`, null where the item has none. `labels` is `list<utf8>` as
        `tessera:labels`: the item's labels this principal holds, sorted. A rendered field is read
        from `view`; the item card reads the first view the principal can reach, so the two can
        differ. An item joined into `view` before its own ingest is flushed has null record
        fields until that flush.

        **Group-scoped fields** resolve as a filter leaf on them does: read in `view` under a view
        of the field's group, or of a group sharing its views, and otherwise pinned as
        `<field>@<key>`.

        **Order.** `map` returns rows by map cell in `view`, then by `tessera_id`. `stored`
        returns them in the order the record store holds items, which groups items by their full
        set of access labels. The two orders return the same rows. With neither `order` nor
        `cursor`, the server takes `stored` when any named field's `homes` in `/v1/meta` is
        `["record"]`, and `map` otherwise; that choice may change. A field read only from the
        record store is 1.3 to 1.8 times slower to read in map order at 100,000-row pages, and 8
        to 17 times slower at 1,000-row pages (measured).

        **Pages.** A page ends at `page_rows` rows, or before the row that would take its Arrow
        bytes past `selection.max_page_bytes`; a single larger row is sent alone. A page holds at
        least one row whenever one remains. When the response's time budget runs out, or the
        stream deadline cancels it, a page holding rows is sent short and the trailer follows.
        Every response moves the cursor on, including one that found no row under a sparse
        filter, and a response can run past its time budget by one evaluation of the filter over
        a stretch and one chunk of a page's scan.

        **Cursor.** Opaque, encrypted and authenticated under a key derived from the identity
        key, and bound to the route, the view and its incarnation, the order and the credential
        that received it. A cursor that fails any of these is one `422` with one detail. A
        cursor issued under another idset is the `409` below. A cursor survives flushes, merges,
        compactions and restarts, and stops opening when the identity key is rotated.

        Runs under its own admission limit, `serve.bulk_admission`, so a long read takes no slot
        from the viewport and item routes. A read past the limit is refused at once with `429`;
        none waits.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemsRequest"
      responses:
        "200":
          description: The framed body. The headers are the viewport's, without its cache coordinates.
          headers:
            x-tessera-identity-key:
              description: The viewport's identity coordinate for this principal and view, equal to the one a viewport over the same view returns. Absent only from a response that was cancelled before its first page, which is a head and a trailer ending by `deadline`; the coordinate is taken from the view the first page opens.
              required: false
              schema:
                type: string
            x-tessera-region:
              description: "Present exactly when the request's `filters` carried a `region` leaf, with the viewport's values: the coarsest verdict the head's count and the first page reached."
              required: false
              schema:
                type: string
                pattern: "^(exact|cover; depth=[0-9]+)$"
            x-tessera-server-us:
              description: Server time from admission to the head, microseconds. The whole response's is the trailer's `stream_us`.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
            x-tessera-admission-us:
              description: Time spent being admitted, microseconds. Near zero, since a bulk read waits for no slot.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: A head, records frames each followed by a page end, and a trailer, per contracts §5.
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: "Unknown `view`, or a pin naming no view of its field's group that this principal can reach."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`idset` was supplied and differs from the deployment's, or the cursor was issued under another idset. Re-resolve by external id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The viewport's filter refusals; a body with an unknown key, a missing `view` or `fields`, or an `order` or `compression` outside its values; an unknown or repeated field; an unpinned group-scoped field outside its group, a pin on a field that is not group-scoped, or a group-scoped `text` field; an unknown system field; `page_rows` or `pages` of 0; `count` with a `cursor`; a cursor that does not open for this request, or whose order differs from `order`. `page_rows` above `selection.max_page_rows` is capped, not refused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/items/{tessera_id}:
    post:
      tags: [viewer]
      operationId: item
      summary: One item's whole record, if this principal may see it.
      description: |
        The record assembled from its three homes and keyed by declared column name; a category
        appears as its vocabulary **key**, never its code; every width lands on a JSON number. **An
        absent field is absent from the object, never `null`.** `external_id` is the caller's own,
        base64, present only where one exists — the only place a caller external id appears on
        this plane.

        **The whole permitted picture of one point** (owner ruling 2026-09-01): beside the record,
        `views` names every view the item is in **that this principal may reach**, with the
        position each view places it at, and `scoped` carries the group-scoped attribute values
        keyed by the group's key. Both are gate-filtered against the session's visible-view set, so
        a point held only in views this principal cannot reach serves exactly what it served
        before — an empty `views` and no scoped entries — and nothing on this route names a
        gate-failed view.

        `404 unknown` is returned identically for *no such id* and *exists but not visible* — same
        status, same code, same detail, and the same work. Behind the compute-admission gate.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/TesseraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemRequest"
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          $ref: "#/components/responses/Unknown"
        "409":
          description: "`idset` was supplied and differs from the deployment's — *stale idset; re-resolve by external_id*. Decided before inversion and identically for every identifier."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/artifacts:
    post:
      tags: [viewer]
      operationId: artifacts
      summary: Every artifact of one layer this principal is served, page by page, with the properties the caller names.
      description: |
        The response is framed as `POST /v1/items`' is: a `6` head (JSON `ArtifactsHead`), `7`
        records frames each followed by an `8` page end (JSON `PageEnd`), and a `4` trailer
        (JSON `RecordsTrailer`). Its pages, budgets, page ends, trailer and cursor rules are that
        route's, and a read is carried across responses by passing each response's `next` back as
        `cursor` until it is null. Every page is built from the latest data with the visible set
        composed again, so a deletion or suppression accepted during a read applies from the next
        page.

        **Rows.** Every artifact of `layer` this principal is served at the moment its page is
        built, ordered by level and then by publication order within the level. Each page runs the
        viewport's own verdict for each artifact it walks: the artifact's label, its layer's
        existence criterion over this principal's visible members, and, where the layer declares
        content, whether this principal may read it. An attached artifact, such as a clustering's
        label, is served only while the artifact it is attached to is. Publication order is the
        publisher's own and is not grouped by access labels.

        **Narrowing.** `level` reads one level of a levelled layer. `parent` reads the artifacts
        naming that artifact among their parents; a parent this principal is not served answers
        exactly as a parent with no children does. `q` keeps the artifacts whose key, or whose
        first served text content, contains it case-insensitively; an authored shape is not text
        and is never searched. `filters` keeps the artifacts with at least one visible member
        matching it, and adds a `matched_count` column; under `keep_unmatched` every served
        artifact is returned, those with no matching member with a zero. An attached artifact,
        such as a label, is counted by the artifact it is attached to: its `matched_count` is its
        target's, it is kept or dropped as its target is, and the head's `matched` counts it so,
        as the viewport gives it its target's matched bit. A request with `filters` evaluates the
        filter over the whole view once per response.

        **Columns.** `tessera_id` (`uint64`) first, then the named properties in the order named,
        then `matched_count` (`uint64`) whenever the request carries `filters`. `key`: `utf8`, null
        where the publisher supplied none. `level`: `uint32`, the declared level, 0 on a layer
        without levels. `parents`: `list<uint64>`, the parents this principal is also served.
        `target`: `uint64`, the artifact this one is attached to, null where none. `masked_count`:
        `uint64`, how many members this principal can see. `content`: `list<utf8>`, the one set of
        supplied content this principal is served, positional to the layer's `supplied_content`,
        with an authored shape's slot empty: the shape is served as `shape`, for this view alone.
        `centroid`: `float64` columns `centroid_x`, `centroid_y`; `box`: `float64` columns
        `box_x_min`, `box_y_min`, `box_x_max`, `box_y_max`; both over the members this principal
        can see, in the view's coordinates as `POST /v1/items` converts `position`, null where it
        sees none. A centroid is the members' mean in the view's projected space, converted: on a
        geographic view it is not the mean of their longitudes and latitudes. `shape`: `binary`,
        a WKB `MultiPolygon` in the view's coordinates, null on a layer that draws no geometry: a
        derived hull over the members this principal can see, or a predicate or authored shape
        whole, as `POST /v1/artifacts/{tessera_id}` serves it. Every ring is closed and holds at
        least four points: a hull over one or two members, or over members on one line, is a
        zero-area polygon over their positions, repeated.

        **Cursor.** Bound to the route, the view and its incarnation, the layer, the `level`
        named and the credential that received it. A cursor that fails any of these is one `422`
        with one detail; one issued under another idset is the `409` below.

        Runs under the bulk-read admission limit, `serve.bulk_admission`, with `POST /v1/items`. A
        read past the limit is refused at once with `429`; none waits.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactsRequest"
      responses:
        "200":
          description: The framed body, with `POST /v1/items`' headers.
          headers:
            x-tessera-identity-key:
              description: As on `POST /v1/items`.
              required: false
              schema:
                type: string
            x-tessera-region:
              description: "Present exactly when the request's `filters` carried a `region` leaf, with the viewport's values."
              required: false
              schema:
                type: string
                pattern: "^(exact|cover; depth=[0-9]+)$"
            x-tessera-server-us:
              description: Server time from admission to the head, microseconds.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
            x-tessera-admission-us:
              description: Time spent being admitted, microseconds.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: A head, records frames each followed by a page end, and a trailer, as on `POST /v1/items`.
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: "Unknown `view`, or one this principal cannot reach."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`idset` was supplied and differs from the deployment's, or the cursor was issued under another idset."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The viewport's filter refusals; a body with an unknown key or missing `view`, `layer` or `fields`; a layer that is unknown or not published to this principal, with one detail for both; `level` on a layer whose kind has one level, or naming a level the layer does not hold; an unknown or repeated property; `parent` with `q`; `page_rows` or `pages` of 0; `count` with a `cursor`; a `compression` outside its values; a cursor that does not open for this request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/artifacts/browse:
    post:
      tags: [viewer]
      operationId: browseArtifacts
      summary: One page of a layer's hierarchy, by lineage — its roots, an artifact's children and parents, or a name search.
      description: |
        **Independent of the viewport** (`highlight-and-hierarchy.md` §4). A layer whose artifacts
        are spread across the map draws nothing at any zoom the viewport's budget cut reaches; this
        verb serves the same artifacts by relation instead of by position, each row carrying the
        masked count the artifacts frame carries.

        **One verb, three forms.** `parent` and `q` absent is the **roots** form — the layer's
        artifacts with no served parent. `parent` names the **children** form: the artifacts naming
        it, with the requested artifact's own served parents in `parents`, which is `[]` on the
        other two forms. `q` names the **search** form, matching a key or a first supplied text
        content case-insensitively. Both together is a `422`.

        **The gate runs before the page.** Every artifact served passed its own existence
        criterion, evaluated over the form's whole candidate set before `limit` and `cursor` — so a
        page's fill and its `next` count only artifacts this principal may see, and a withheld
        artifact leaves no gap. **The order is total**: count descending, then `tessera_id`
        ascending, so a cursor over tied counts neither duplicates nor drops a row. **A relation is
        named only where both ends are served**: a child whose parent is withheld is a root here,
        and a parent below this principal's floor is absent from `parents`.

        **The refusals name deployment schema and never an artifact.** An unknown layer, an
        attached layer, a `level` on a kind with one level, a level a layer does not hold, `limit =
        0` and both `parent` and `q` are each a `422`. A `parent` that names nothing, one of another
        layer, one suppressed and one below this principal's criterion answer an **empty page** —
        refusing would make the verb an existence oracle over what the criterion withholds.

        Behind the compute-admission gate.
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowseRequest"
      responses:
        "200":
          description: One page of the layer's hierarchy as this principal sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: "`404 unknown`: no such `view`, or one this principal's gate fails — the same answer, on the viewer plane's rule."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`422 contract`: an unknown or attached layer, a `level` the kind or the layer does not have, `limit = 0`, both `parent` and `q`, or a malformed `filters`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /v1/artifacts/{tessera_id}:
    post:
      tags: [viewer]
      operationId: artifact
      summary: Drill down on one annotation artifact — its masked count and derived geometry for this principal.
      description: |
        A separate route from `/v1/items`, so that the *shape* of an answer never says which of the
        two an identifier names. `masked_count` is **this principal's** count of the artifact's
        members and never its size. Geometry is recomputed per principal from `membership ∩ M_auth`
        and travels in the same 32-bit-per-axis grid units as the viewport's `code`; a client must
        not cache one principal's geometry against an identifier. An absent geometry field means
        *this layer declares no such property*, never *withheld*: an artifact whose content cannot
        be served is a `404` entire.

        `404` is the only failure shape and one construction site: nothing by that id, a point by
        that id, a layer this principal cannot reach, a suppressed artifact, and one below its
        layer's existence criterion are one answer. Behind the compute-admission gate.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/TesseraId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactRequest"
      responses:
        "200":
          description: The artifact as this principal sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"
        "401":
          $ref: "#/components/responses/BadCredential"
        "403":
          $ref: "#/components/responses/ExpiredToken"
        "404":
          description: "`404 unknown`: nothing this principal may see by that identifier — and an unknown `view` takes the same answer, since a view is addressed like any other named thing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Stale `idset`, on `/v1/items`' rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Contract"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/FailClosed"

  /control/ingest:
    post:
      tags: ["control: ingest"]
      operationId: ingest
      summary: Insert a batch of new items into one view.
      description: |
        The body is the batch's rows. `content-type` chooses the encoding: `application/json`,
        `application/x-ndjson` or none at all is JSON, an array of objects or one object per line,
        each keyed by column name; `application/vnd.apache.arrow.stream` is an Arrow IPC stream of
        one or more record batches. Any other `content-type` is `422`.

        **Columns.** The coordinates are `x` and `y` on a view whose projection is `none`, and
        `lon` and `lat` in degrees on any other; a number on every row in JSON, `float32` or
        `float64` in Arrow. A coordinate outside the view's extent is stored on its edge and
        counted in `clamped`; one outside the projection's domain is counted in `clipped`; a
        non-finite one is `422`. `access` holds the row's access labels: in JSON a string, a list
        of strings or `null`; in Arrow a required column of strings, lists of strings or a
        dictionary of strings. A null, an empty list and a label empty once trimmed are no label. A
        row with no label takes the view's `point_visibility.default`, and the batch is `422` where
        the view declares none. `external_id` is optional, base64 in JSON and `binary` in Arrow, at
        most 64 bytes. `node_id` is accepted and not stored. Every other column is a declared
        attribute, a group-scoped attribute of the view's group, or an enumerated layer; any other
        name is `422`.

        **Attributes.** A declared attribute the batch leaves out is absent on every row, and is
        counted in `padded_columns`. In JSON, an attribute one row names is named on every row,
        `null` where the row has no value. A category takes its vocabulary's key: under a `closed`
        vocabulary an unknown key is `422`, and under an `open` one it is added. An integer is
        read exactly, from a JSON number or a string of digits; `timestamp_us` is microseconds
        since the Unix epoch.

        **Layers.** A column named after an enumerated layer places each row in that layer's
        artifacts: a key, or a list of keys whose meaning follows the layer's `hierarchy`, `null`
        or `-1` for none. A `level` column places the keys at a level. On a `closed` layer an
        unknown key is `422`; on an `open` one it creates the artifact, counted in `minted`. A
        layer scoped to a view group needs the batch's view to be one of that group's.

        **Identity.** An external id that already has a row in this view is `409`: a position is
        not updated in place. One that has a row in another view joins that item, and a joining row
        whose labels or values differ from the item's is `409`. One whose item was deleted starts
        a new item, and one whose item is suppressed joins it and stays hidden. Two rows with the
        same external id are `409`.

        **Retries.** `x-tessera-batch-id` names the batch. The same bytes sent again under the same
        id answer `200` with `replayed: true` and change nothing; different bytes under a used id
        are `409`.

        **Limits.** The body is at most `ingest.ingest_max_batch_bytes` and the batch at most
        `ingest.ingest_max_batch_rows` rows; either over is `422`, and `/control/status` publishes
        both under `limits.ingest`. Past `ingest.ingest_admission` requests in flight across this
        route and `POST /control/values`, and while `ingest.ingest_buffer_max_items` items are
        buffered, the request is `429`. A `401` is answered before any other refusal, and a `429`
        for admission before the body is decoded.

        The answer follows the write-ahead log's fsync. The rows become visible in the publication
        cycle `publication` names.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/WriteView"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRecords"
          application/x-ndjson:
            schema:
              type: string
              description: One JSON object per line, each an `IngestRecord`. Blank lines are skipped.
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: An Arrow IPC stream whose columns are the JSON form's, at the Arrow types this route names.
      responses:
        "200":
          description: The batch was accepted, or was a replay of an accepted batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: "`x-tessera-view` names no view."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The batch id was used for a different body; two rows share an external id; an external id already has a row in this view; a row joining an item in another view carries labels or values that differ from the item's. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The body is over the byte cap or cannot be read; `x-tessera-batch-id` is missing; `content-type` names another encoding; no `x-tessera-view` on a deployment with several views; a column is misnamed, undeclared or of the wrong type; a cell does not fit its column; a key is not in a closed vocabulary or layer; unlabelled rows on a view with no default; the batch is over the row cap. The detail names the row and column, never the id sent. Nothing was written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          description: "`503 not-ready`: the write executor is not running, or a partition is serving a stepped-down manifest. Nothing was taken."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /control/values:
    post:
      tags: ["control: values"]
      operationId: values
      summary: Fill attribute values, and layer memberships, on items that already exist.
      description: |
        The body is encoded as `POST /control/ingest`'s is, and creates no item. A row names its
        item by exactly one of `external_id`, and `tessera_id` with the `idset` it was minted
        under. `tessera_id` is a string of decimal digits, `utf8` in Arrow, and `idset` an integer,
        `uint32` in Arrow. A row naming an item the deployment does not hold is `422`, naming the
        row by its index. The other columns are declared attributes, group-scoped attributes and enumerated
        layers, as on ingest, and a row may leave any of them out.

        **The fill rule.** A cell that holds no value takes the one sent and is counted in
        `filled`. A cell that holds the same value is counted in `held` and is not written again.
        A cell that holds a different value is `409`, and the batch has no effect. A layer column
        adds each row to the artifacts it names, counted in `joined`, and on an `open` layer
        creates the artifacts it does not find, counted in `minted`.

        **Views.** A group-scoped attribute or a layer scoped to a group is written under the key
        of the view `x-tessera-view` names, which must be a view of that group. Without the header
        the batch may carry entity-scoped columns only.

        Retries, byte and row caps and admission are `POST /control/ingest`'s, and `/control/status`
        publishes the caps under `limits.values`. A replay answers `replayed: true`, `filled: 0`
        and `held` equal to the row count.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/WriteView"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuesRecords"
          application/x-ndjson:
            schema:
              type: string
              description: One JSON object per line, each a `ValuesRecord`. Blank lines are skipped.
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: An Arrow IPC stream whose columns are the JSON form's. Every record batch of the stream carries the same columns.
      responses:
        "200":
          description: The batch was applied, or was a replay of an applied batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuesResponse"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: "`x-tessera-view` names no view."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cell holds a different value, the batch id was used for a different body, or `idset` is not the deployment's. The detail never names the held value. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The body is over the byte cap or cannot be read; `x-tessera-batch-id` is missing; a row names no item, two, one the deployment does not hold, or a `tessera_id` without an `idset`; two idsets in one batch; a column is undeclared or of the wrong type; a scoped column or layer without a view of its group; the batch is over the row cap. Nothing was written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/changes:
    post:
      tags: ["control: changes"]
      operationId: changes
      summary: Delete, suppress or lift the suppression of items.
      description: |
        `delete` removes an item from every view and every count; the compaction fold removes its
        rows from disc. `suppress` hides an item from every viewer until `unsuppress` lifts it.
        There is no edit: to change an item's access labels, delete it and ingest it again under
        the same external id, and `op: "predicate"` is refused with that advice.

        Every item is checked and its address resolved before any is applied, so a request with one
        bad item applies nothing. An unknown `tessera_id` is answered ahead of an unknown external
        id. A request carries at most 10,000 items in at most 2 MiB; over either is `422`, and
        `/control/status` publishes both under `limits.changes`.

        A deletion or suppression is in force from the moment it is accepted, for every request,
        and the `200` follows the write-ahead log's fsync. This route is never shed with `429` and
        has no readiness check. A `500` means a change may be in force without being durable:
        sending the same request again is safe, and treating the items as visible is not.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ChangeItem"
      responses:
        "200":
          description: Every change is applied and durable. `publication` is the next cycle; the changes do not wait for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: An external id or a `tessera_id` names nothing the deployment holds. The detail names the item by its index. Nothing was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`idset` is not the deployment's. Nothing was applied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The body is not a JSON array of change items, is over 2 MiB or carries more than 10,000 items; an unknown `op`; an item naming neither or both of `external_id` and `tessera_id`; `idset` with `external_id`, or none with `tessera_id`; two idsets in one request; an external id that is not base64; a `tessera_id` that is not a decimal string. Nothing was applied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "`500 fail-closed`: the request was attempted and did not complete. The detail says whether a change may be in force and whether one was certainly not applied. Send the whole request again."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "`503 not-ready`: no item reached the write executor, which is not running. Nothing was applied."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /control/status:
    get:
      tags: ["control: status"]
      operationId: status
      summary: The node's state, its counters and the write routes' limits.
      description: |
        One JSON document, read fresh on every request. It carries corpus-wide figures such as
        `entity_id_high_water`, which is why it sits behind the operator credential. Counters count
        from the process's start. `readiness` and `write_executor.ready` agree with `/readyz`.
      security:
        - operatorCredential: []
      responses:
        "200":
          description: The status document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"

  /control/flush:
    post:
      tags: ["control: flush"]
      operationId: flush
      summary: Publish buffered writes at the next tick instead of waiting for it.
      description: |
        Pulls the next publication cycle forward and answers `202` without waiting for it; two
        requests before one tick share it. `publication` names the first cycle certain to include
        every write buffered before the request. With `wait=visible` the `202` is held until that
        cycle has run, or until `serve.visible_wait_max_secs` passes. A cycle flushes one view's
        buffered rows, so rows in several views take one cycle each. A request body is not read.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      responses:
        "202":
          description: The cycle is requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "422":
          description: "`wait` has a value other than `visible`, or the query names another parameter. No cycle was requested."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /control/compact:
    post:
      tags: ["control: compact"]
      operationId: compact
      summary: Ask for a compaction fold at the next tick.
      description: |
        Sets a flag the write executor reads at its next tick, and answers `202` with no body. A
        fold rewrites the bundle with deleted rows removed and runs for minutes to hours on a
        large corpus. A request while a fold runs is dropped, and the `202` cannot say so;
        `compaction` on `/control/status` shows what happened, including a fold refused for want
        of memory or disc. The query string is not read.
      security:
        - operatorCredential: []
      responses:
        "202":
          description: The fold is requested. No body.
        "401":
          $ref: "#/components/responses/OperatorBadCredential"

  /control/attributes:
    put:
      tags: ["control: attributes"]
      operationId: declareAttribute
      summary: Declare an attribute column.
      description: |
        The body is a corpus declaration's `[[attribute]]` block in JSON, without the keys that
        say where a build reads the values. The column is added after every column declared
        before it. From the answer on, a batch may carry the column, `/v1/meta` lists it, and every
        item holds no value in it until one is written.

        The name is the column's identity. Declaring it again with the same fields answers `200`
        and changes nothing; with any field different it is `409`. A name a layer holds is `422`.
        `render = true` is refused on this route: declare a rendered column at a build.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeDeclaration"
      responses:
        "200":
          description: The name already carries this declaration. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDeclared"
        "201":
          description: The column is declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDeclared"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "409":
          description: The name is declared with a different type, vocabulary, analyser, flags or scope. A column's type is written into every row, so it cannot change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: "An unknown field or type; `render = true`; a name that is not a valid column name or is a layer's; a category with no `vocabulary`, or one naming no vocabulary; `vocabulary` on another type; `analyser` on a type other than `text`, or an unknown analyser; a group scope naming no view group, or a group that takes its views from another."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/vocabularies/{name}:
    put:
      tags: ["control: vocabularies"]
      operationId: declareVocabulary
      summary: Declare a vocabulary, the value set a category column draws on.
      description: |
        The body is a corpus declaration's `[[vocabulary]]` block in JSON, without the keys that
        say where a build reads the values. The server draws every value's code; a body naming a
        `code` is `422`.

        The name, `value_set`, `visibility`, `width` and `reserved` are the vocabulary's identity.
        Declaring it again with the same identity answers `200`, applies `values` as a page, as
        `PATCH /control/vocabularies/{name}/values` does, and changes nothing else. With a
        different identity it is `409`.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/VocabularyName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyDeclaration"
      responses:
        "200":
          description: The name already carries this identity, and the values were applied as a page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyDeclared"
        "201":
          description: The vocabulary is declared with the values sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyDeclared"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "409":
          description: The name is declared with a different value set, visibility, width or reserved list. A code's width is written into every row that carries one, so it cannot change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: "An unknown field, such as `code`; a name that is not a valid identifier; a `width` other than `u8`, `u16` or `u32`; a reserved code that is 0 or past the width; an empty key, or a key named twice; more values than the width holds."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/vocabularies/{name}/values:
    patch:
      tags: ["control: vocabularies"]
      operationId: addVocabularyValues
      summary: Add a page of values to a vocabulary, and set their titles.
      description: |
        Adds each key the vocabulary does not hold, with a code the server draws. A key it holds
        keeps its code. A title sent for a held key replaces the key's title, so a client draws the
        new name while every row carrying the code keeps its meaning. A page removes nothing. A
        page that adds no key and changes no title writes nothing.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/VocabularyName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyValues"
      responses:
        "200":
          description: The page is applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyValuesAdded"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: No vocabulary has this name. A page does not create one, since a vocabulary's width and visibility are its declaration's to state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: An unknown field; an empty key, or a key named twice; more values than the vocabulary's width holds. Nothing was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/view_groups/{name}:
    put:
      tags: ["control: view groups"]
      operationId: declareViewGroup
      summary: Declare a view group, whose views are created one key at a time.
      description: |
        The body is a corpus declaration's `[[view_group]]` block in JSON, without its roster and
        its source. The group starts with no views; `PUT /control/views/{group}/{key}` creates
        them. A group's name and a plain view's name share one namespace.

        The name is the group's identity. Declaring it again with the same fields answers `200`
        and changes nothing; with any field different it is `409`, since a group's frame and gate
        never change.
      security:
        - operatorCredential: []
      parameters:
        - name: name
          in: path
          required: true
          description: The group's name, which its views' ids begin with.
          schema:
            type: string
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewGroupDeclaration"
      responses:
        "200":
          description: The name already carries this declaration. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewGroupDeclared"
        "201":
          description: The group is declared, with no views.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewGroupDeclared"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: "`members` names no view group."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The name is declared with a different title, frame, projection, gate, point default, metadata or `members`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: "An unknown field; a name that is not a valid key, or a plain view's; an unknown projection; an extent that is not finite or has a maximum below its minimum; `members` naming a group that takes its own views from another, or with `metadata`; a metadata name declared twice, or of type `category`; a gate label or point default the auth plugin refuses."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/views/{name}:
    put:
      tags: ["control: views"]
      operationId: declarePlainView
      summary: Declare a plain view, a coordinate system that belongs to no group.
      description: |
        The body is a corpus declaration's `[[view]]` block in JSON, without its source. The view
        starts with no rows and takes them at its first flush. A plain view's name and a group's
        name share one namespace, and a plain view has no drop route.

        The name is the view's identity. Declaring it again with the same fields answers `200` and
        changes nothing; with a different title, frame, projection, gate or point default it is
        `409`.
      security:
        - operatorCredential: []
      parameters:
        - name: name
          in: path
          required: true
          description: The view's id, as a viewer request names it.
          schema:
            type: string
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlainViewDeclaration"
      responses:
        "200":
          description: The name already carries this declaration. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlainViewDeclared"
        "201":
          description: The view is declared, with no rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlainViewDeclared"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "409":
          description: The name is declared with a different title, frame, projection, gate or point default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: "An unknown field; a name that is not a valid key, or a view group's; an unknown projection; an extent that is not finite or has a maximum below its minimum; a gate label or point default the auth plugin refuses."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/views/{group}/{key}:
    put:
      tags: ["control: views"]
      operationId: createView
      summary: Create a view of a view group.
      description: |
        The view's id is `<group>:<key>`. It starts with no rows, and takes the group's frame and
        projection. Its gate is the one sent, or the group's where none is. Its metadata carries
        one value per name the group declares, each typed by its JSON form: a boolean, an integer,
        a number with a fraction, or a string. The record cannot be changed after it is created.

        A key held by a live view is `409`. A dropped key may be created again, and the new view
        starts with none of the old one's rows or artifacts.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/ViewGroup"
        - $ref: "#/components/parameters/ViewKey"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRecord"
      responses:
        "201":
          description: The view is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewCreated"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: No view group has this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A live view holds this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: "An unknown field; a key that is not valid; a metadata value that is null, an array or an object, or that does not match the type the group declares; a metadata name the group does not declare, or one it declares left out; a gate label the auth plugin refuses; a group that takes its views from another."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"
    delete:
      tags: ["control: views"]
      operationId: dropView
      summary: Drop a view of a view group and free its key.
      description: |
        The view leaves every roster at once, including the rosters of groups sharing its views,
        and its rows stay on disc, unreachable, until the compaction fold. Its artifacts become
        unreachable with it. Rows and group-scoped values buffered for it and not yet flushed are
        discarded, and `fills_dropped` counts the values.

        No item is deleted unless `delete_dangling` is `true`: then every item with a row in this
        view and in no other is deleted, as `POST /control/changes` deletes it, and `deleted`
        counts them.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/ViewGroup"
        - $ref: "#/components/parameters/ViewKey"
        - name: delete_dangling
          in: query
          required: false
          description: Also delete the items that have a row in this view and no other. Absent is `false`.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: The view is dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewDropped"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: No live view of this group holds this key, or no group has this name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`delete_dangling` is not `true` or `false`; `wait` has a value other than `visible`; the query names another parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/layers:
    put:
      tags: ["control: layers"]
      operationId: registerLayer
      summary: Register an annotation layer.
      description: |
        The body is a corpus declaration's `[[layer]]` block in JSON. `views` may name a view
        group, which stands for every view the group holds when the layer is registered. The
        answer follows the write-ahead log's fsync and carries the layer's `tessera_id`, the address
        `POST /control/changes` suppresses it by.

        A layer's name is its identity for ever: a name already registered, or one a dropped layer
        held, is `422`, including a second request with the same declaration. A refusal means the
        layer does not exist.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayerDeclaration"
      responses:
        "201":
          description: The layer is registered, with no artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerRegistered"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "413":
          $ref: "#/components/responses/DeclarationTooLarge"
        "415":
          $ref: "#/components/responses/NotJsonContentType"
        "422":
          description: "An unknown field, including the removed `withdraw_on_member_deletion`; a name that is empty, `all`, registered, or held by a dropped layer; a view that is neither a view nor a view group; a view outside the group a group-scoped layer names; a `depends_on` layer that is not registered, or the layer itself; levels on a `nested` or `dag` layer, none on a `stacked` or `tiered` one, levels not numbered densely from 0, or a level whose `zoom` range holds no depth; a `fraction` outside (0, 1], or on a `spatial` or attribute layer; `shape` on a layer that is not `spatial`; two drawn geometries; content, dependencies, levels, labels or a layout on an attribute layer; an unknown computed property; a repeated view, level title or content name; a label the auth plugin cannot read; a `spatial` layer over both projected and unprojected views."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/layers/{name}:
    delete:
      tags: ["control: layers"]
      operationId: dropLayer
      summary: Drop a layer and retire its name.
      description: |
        The layer and its artifacts stop being served at once. Its name is never registered again,
        since bookmarks, edges and suppressions name a layer, and its entity ids are not reused.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/LayerName"
        - $ref: "#/components/parameters/Wait"
      responses:
        "200":
          description: The layer is dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationAck"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "422":
          description: "No layer is registered under this name; `wait` has a value other than `visible`; the query names another parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

  /control/layers/{name}/artifacts:
    put:
      tags: ["control: artifacts"]
      operationId: publishArtifacts
      summary: Publish artifacts into one level of a layer, all or none.
      description: |
        The body is JSON only; `application/vnd.apache.arrow.stream` is `422`. Each artifact names
        its members by `members`, or by `excluding`, the view's items it leaves out. Members are
        addressed as the batch's `addressing` says: base64 external ids, or `tessera_id` decimal
        strings under the batch's `idset`. A member that names nothing is `404`, and a deleted one
        is `422`.

        An artifact whose `key` the level already holds is not created again: its members are
        added to the held membership, and a part it lacks (its parents, attachment, contents,
        shape or access labels) is filled. A part it holds with a different value is `409`, and the
        detail never names the held value. The answer is `201` if the batch created an artifact,
        and `200` if every key was held.

        A large membership is published with its first page here and the rest with `PATCH`.
        Per request: at most `ingest.max_artifacts_per_request` artifacts, `excluding` at most
        `ingest.max_excluded_per_request` long, a body of at most `ingest.publish_max_body_bytes`,
        and a shape of at most `serve.max_shape_vertices` vertices after it is fitted to each view.
        Over any is `422`; `/control/status` publishes them under `limits.publish`.

        The answer gives each artifact's `tessera_id` in the order sent, and never an ordinal or a
        membership's size. `shapes` reports what fitting each shape to each of the layer's views
        did.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/LayerName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Every key was held; the batch added members or filled parts, or changed nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsPublished"
        "201":
          description: The batch created at least one artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsPublished"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: A member or a content's generating set names nothing the deployment holds. The detail names it by its position in the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A held artifact holds a part with a different value, or a second `excluding` for a held key; or `idset` is not the deployment's. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The body is not JSON, is over its cap or is Arrow; an unknown field; no artifacts, or more than the cap; an artifact with neither `members` nor `excluding` that attaches to nothing, or with both; an exclusion list over its cap; `view` missing on a layer scoped to a group or present on another; `idset` missing with `tessera` addressing or present with `external`; a member that is not base64 or not a decimal string; a deleted member; an unknown layer or level; a shape on a layer that declares none, none on one that does, the wrong kind, or one over the vertex cap; labels the layer does not take, or none where it requires them; a parent or attachment that does not exist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"
    patch:
      tags: ["control: artifacts"]
      operationId: growMemberships
      summary: Add members to artifacts a level holds, remove them from generating sets, and fill missing parts.
      description: |
        Each row names an artifact by the key it was published under; an unknown key is `422`, and
        this verb creates nothing. `members` joins the membership. With a `rank`, `members` and
        `leaving` move the generating set of the content at that rank instead, and a page that
        empties the set withdraws the content, reported as `withdrawn`. A part the artifact lacks
        is filled; one it holds with a different value is `409`. The batch commits whole.

        The body is JSON, or an Arrow IPC stream as `application/vnd.apache.arrow.stream`. The
        Arrow form carries one row per artifact: `key` as `utf8`, `members` as `list<utf8>` or
        `large_list<utf8>`, and optionally `view` as `utf8` and `access` in any form ingest's
        `access` takes, with `addressing`, `level` and `idset` in the schema's metadata as strings.
        It carries joining members and access labels only; every other part travels as JSON. Any
        other column or metadata key is `422`.

        At most `ingest.max_members_per_request` members, joining and leaving together, and a body
        of at most `ingest.publish_max_body_bytes`; over either is `422`, and `/control/status`
        publishes both under `limits.grow`. The answer never carries an ordinal or a membership's
        size.
      security:
        - operatorCredential: []
      parameters:
        - $ref: "#/components/parameters/LayerName"
        - $ref: "#/components/parameters/Wait"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrowRequest"
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
              description: One row per artifact, with the envelope in the schema's metadata, as this route describes.
      responses:
        "200":
          description: The batch is applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipsGrown"
        "400":
          $ref: "#/components/responses/NotJson"
        "401":
          $ref: "#/components/responses/OperatorBadCredential"
        "404":
          description: A member names nothing the deployment holds. The detail names it by its position in the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An artifact holds a part with a different value, or `idset` is not the deployment's. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "The body cannot be read or is over its cap; an unknown field, column or metadata key; no artifacts; more members than the cap; an unknown key, layer or level; `leaving` without a `rank`; `view` missing on a layer scoped to a group or present on another; `idset` missing with `tessera` addressing or present with `external`; a member that is not base64 or not a decimal string; a deleted member; a shape the layer does not take; a content without a generating set on a layer whose content requires every member visible."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Backpressure"
        "500":
          $ref: "#/components/responses/WriteFailed"
        "503":
          $ref: "#/components/responses/ExecutorNotReady"

components:
  securitySchemes:
    sessionCredential:
      type: http
      scheme: bearer
      description: The session credential, a shared secret read from the file `serve.session_credential_file` names or the environment variable `serve.session_credential_env` names. Compared in constant time. Never handed to a browser.
    operatorCredential:
      type: http
      scheme: bearer
      description: The operator credential, a shared secret read from the file `serve.operator_credential_file` names or the environment variable `serve.operator_credential_env` names. Compared in constant time. Every path on the control listener requires it, and it is checked before the request's query or body is read, so a caller without it is answered `401` ahead of any other refusal.
    sessionToken:
      type: http
      scheme: bearer
      description: The `token` `POST /session/authorise` minted. A missing, malformed or unrecognised token — including a revoked one — is `401 bad-credential`; a recognised token past `expires_at` is `403 expired-token`. Both end the session.

  parameters:
    TesseraId:
      name: tessera_id
      in: path
      required: true
      description: The item's or artifact's opaque identifier, a `u64` in decimal. A keyed blinding permutation of the internal identity — stable across sessions, meaningless without the key, and **not** a cryptographic guarantee (contracts §5, decision 0014).
      schema:
        type: string
        pattern: "^[0-9]+$"
    Wait:
      name: wait
      in: query
      required: false
      description: "`visible` holds the answer until the publication cycle this write is in has run, or until `serve.visible_wait_max_secs` passes, and the answer's `visible` says which. Absent answers at once. Any other value, or a query parameter the route does not define, is `422`."
      schema:
        type: string
        enum: [visible]
    BatchId:
      name: x-tessera-batch-id
      in: header
      required: true
      description: The batch's identity, chosen by the caller, for retries. The same body sent again under the same id is answered as it was and changes nothing; a different body under a used id is `409`. Missing, or not UTF-8, is `422`.
      schema:
        type: string
    WriteView:
      name: x-tessera-view
      in: header
      required: false
      description: The view the batch writes into, by id. Required where the deployment has more than one view. A name no view has is `404`; a value that is not UTF-8 is `422`.
      schema:
        type: string
    VocabularyName:
      name: name
      in: path
      required: true
      description: The vocabulary's name, as an attribute's `vocabulary` names it.
      schema:
        type: string
    ViewGroup:
      name: group
      in: path
      required: true
      description: The view group's name.
      schema:
        type: string
    ViewKey:
      name: key
      in: path
      required: true
      description: The view's key within its group. The view's id is `<group>:<key>`.
      schema:
        type: string
    LayerName:
      name: name
      in: path
      required: true
      description: The layer's name. A `/` in it is sent as `%2F`.
      schema:
        type: string

  responses:
    OperatorBadCredential:
      description: "`401 bad-credential`: the operator credential is missing or wrong. Nothing about the request was read."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotJson:
      description: The JSON body does not parse, or a path segment is not UTF-8 once percent-decoded. The HTTP framework answers this before the handler runs, with a plain-text body.
      content:
        text/plain:
          schema:
            type: string
    NotJsonContentType:
      description: "The request does not carry `content-type: application/json`. The HTTP framework answers this before the handler runs, with a plain-text body."
      content:
        text/plain:
          schema:
            type: string
    DeclarationTooLarge:
      description: The body is over 2 MiB, the declaration routes' cap, published on `/control/status` as `limits.declarations.max_body_bytes`. The HTTP framework answers this before the handler runs, with a plain-text body.
      content:
        text/plain:
          schema:
            type: string
    WriteFailed:
      description: "`500 fail-closed`: the write could not be made durable, or the write executor stopped while holding it. It may have been applied in full, so this is not a refusal; the detail says so. Sending the same request again is safe."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExecutorNotReady:
      description: "`503 not-ready`: the write executor is not running. Nothing was taken."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadCredential:
      description: "`401 bad-credential`: missing, malformed or unrecognised bearer credential. On a token that previously worked this is the session ending — revoked — and a client treats it exactly as `403`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ExpiredToken:
      description: "`403 expired-token`: the token is recognised and its `expires_at` has passed. Re-authorise."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unknown:
      description: "`404 unknown`: nothing this principal may see by that identifier — indistinguishable from *nothing exists* by construction."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Contract:
      description: "`422 contract`: the request itself is wrong. Do not retry unchanged."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Backpressure:
      description: "`429 backpressure`: shed whole, never a narrowed answer. Retry unchanged after `Retry-After`, which agrees with the body's `retry_after_s`."
      headers:
        Retry-After:
          required: true
          description: Seconds. `1` for the compute-admission gate and the single-flight builders; other subjects derive their own figure. Read it rather than assuming it.
          schema:
            type: string
            pattern: "^[0-9]+$"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackpressureError"
    FailClosed:
      description: "`500 fail-closed`: a mask, composition or containment failure. Partial results do not exist."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: "`503 not-ready`: unverified bundle, unready worker, unloaded plugin. No `Retry-After`, deliberately."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: The one error envelope, on every plane. The code list is closed.
      additionalProperties: false
      required: [error, detail]
      properties:
        error:
          type: string
          enum:
            - bad-credential
            - expired-token
            - unknown
            - conflict
            - contract
            - backpressure
            - fail-closed
            - not-ready
        detail:
          type: string
          description: Human-readable. On the viewer plane it is identical for every branch of a `404`, so it discloses nothing an enumeration could use. On the control plane it names what was refused, and a row or member by its position in the batch, never by the identifier sent.
        retry_after_s:
          type: integer
          minimum: 0
          description: Present on every `429` and on nothing else; agrees with the `Retry-After` header.

    BackpressureError:
      description: An `Error` whose code is `backpressure` and whose `retry_after_s` is present.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [retry_after_s]
          properties:
            error:
              const: backpressure

    AuthoriseRequest:
      type: object
      additionalProperties: false
      required: [auth_data]
      properties:
        auth_data:
          type: string
          contentEncoding: base64
          description: >-
            Bytes the auth plugin evaluates. **Plugin-defined; this description can say only that
            they are bytes.** The passthrough plugin reads JSON `{"terms": ["<label>", ...]}`.

    AuthoriseResponse:
      type: object
      additionalProperties: false
      required: [token, token_id, expires_at]
      properties:
        token:
          type: string
          description: >-
            The capability. Presented as `Authorization: Bearer <token>` on the viewer plane;
            never logged, never transited to the session plane again.
        token_id:
          type: integer
          minimum: 0
          description: The non-capability handle `POST /session/revoke` takes.
        expires_at:
          type: integer
          minimum: 0
          description: Seconds since the Unix epoch. It is the time of the request plus the server's `token_max_lifetime_secs`.

    RevokeRequest:
      type: object
      additionalProperties: false
      required: [token_id]
      properties:
        token_id:
          type: integer
          minimum: 0

    Meta:
      type: object
      additionalProperties: false
      required: [api_version, bundle_format, idset, views, groups, declared_scalars, scoped_scalars, filter_operands, selection, layers]
      properties:
        api_version:
          type: integer
          const: 1
        bundle_format:
          type: integer
        idset:
          type: integer
          minimum: 0
          description: The identity set the `tessera_id`s were minted under. The identity **key** appears in no response on any plane.
        views:
          type: array
          description: "The views this principal may reach, in serving order. **Per-principal**: a view whose own `visibility` label — or whose group's — the principal does not satisfy is absent, and naming it on a viewer verb is the same `404` a name nobody declared gets (`views.md` §6). A filtered roster is a shorter list and nothing else: a view carries no position of its own, so nothing here counts the views withheld from this principal (decision 0113)."
          items:
            type: object
            additionalProperties: false
            required: [id, display_name, quantisation, projection, world_aspect, tile_scheme, tile, group, key, metadata]
            properties:
              id:
                type: string
              display_name:
                type: string
              quantisation:
                type: object
                additionalProperties: false
                required: [x_min, x_max, y_min, y_max]
                description: The extent a point's `code` is scaled against in this view — 32 bits per axis over this range. Per view and not per bundle (decision 0040), because two views of one bundle may quantise differently and a client drawing the second would otherwise decode every position against the first's ground.
                properties:
                  x_min: { type: number }
                  x_max: { type: number }
                  y_min: { type: number }
                  y_max: { type: number }
              projection:
                description: What placed this view's positions — the name declared, from the closed set `projections.md` §5 enumerates, and `none` for a view that projects nothing. A deployment constant, identical for every principal.
                type: string
                enum: [web_mercator, equirectangular, gall_isographic, none]
              world_aspect:
                description: The ratio the world should be drawn at, width ÷ height — 1 for `web_mercator`, `2cos φ₁` for an equirectangular alias, `null` for `none`, which has no world to draw.
                type: [number, "null"]
              tile_scheme:
                description: The tile scheme this view's frame addresses, and what decides whether a basemap may be drawn — a scheme's name rather than a boolean, because an equirectangular frame is aligned to a square tiling no server publishes (`projections.md` §9). `null` means draw the points and draw no basemap.
                type: [string, "null"]
                enum: [xyz, null]
              tile:
                description: The tile this view's frame is under `tile_scheme`. Present exactly when `tile_scheme` is.
                type: [object, "null"]
                additionalProperties: false
                required: [z, x, y]
                properties:
                  z: { type: integer, minimum: 0 }
                  x: { type: integer, minimum: 0 }
                  y: { type: integer, minimum: 0 }
              group:
                description: "The view group this view belongs to, or `null` for a plain view (`views.md` §3.2). The three roster fields are one record and are null together."
                type: [string, "null"]
              key:
                description: "This view's key within its group — the caller's own, required at creation, a view's only address, and the `<group>:<key>` that makes up `id` (decision 0113)."
                type: [string, "null"]
              metadata:
                description: "The typed per-view values this view carries, one entry per name its group declared. Empty on a `members` group's views, whose metadata belongs to the group that owns the keys (`views.md` §3.3). Not an attribute — one value per view rather than one per (entity, view), and it filters nothing."
                type: [object, "null"]
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required: [type, value]
                  properties:
                    type:
                      type: string
                      enum: [bool, int, float, text, timestamp_us]
                    value:
                      description: "The value under `type`; `timestamp_us` is microseconds since the Unix epoch, the one unit that type may hold."
                      type: [boolean, number, string]
        groups:
          type: array
          description: "The view groups this principal may reach, in manifest order, each listing its reachable view ids in creation order — what lets a client offer previous-and-next without interpreting a key. A group is not a view: it cannot be named on a viewer verb (`views.md` §3.1). **Per-principal**: a group whose gate the principal fails is absent, and takes its whole roster with it (`views.md` §6). Empty where the declaration carries plain views alone."
          items:
            type: object
            additionalProperties: false
            required: [name, title, members_of, views]
            properties:
              name:
                type: string
              title:
                description: "The group's human-readable title, or `null` where it declared none. Presentation metadata on an object whose visibility this roster has already decided, so it is a deployment constant rather than a per-principal field."
                type: [string, "null"]
              members_of:
                description: "The group whose keys these are, where this group is a second layout over another's views (`views.md` §3.3); `null` where it owns them."
                type: [string, "null"]
              views:
                description: "This group's view ids, in creation order — the joined `group:key` form a request names."
                type: array
                items: { type: string }
        declared_scalars:
          type: array
          description: The entity-scoped column schema in full, in declaration order. `render = true` columns arrive in the points frame after `tessera_id` and `code`, in this order, each named by its column — followed, under a view of a group, by that group's `render = true` scoped families (`scoped_scalars`). Readers take the columns by name. Every such column is nullable, and a point whose item has no value is null, except in a category, where no value is code 0.
          items:
            $ref: "#/components/schemas/DeclaredScalar"
        scoped_scalars:
          type: array
          description: "The **group-scoped** column families (`views.md` §5) — the same schema `declared_scalars` publishes, plus the scope that says which views each column arrives under. **Per-principal**: a family whose group this principal cannot reach is omitted, exactly as its `filter_operands` entry is."
          items:
            $ref: "#/components/schemas/ScopedScalar"
        filter_operands:
          type: array
          description: "The columns a request may filter on and each one's operator names. `family` is what tells a client which control to draw — a category has a value set `/v1/categories/{column}` fills; a keyword has none. `scope` is present only on a **group-scoped** attribute, whose values differ per view of the group it names. **Per-principal in its scoped entries**: a family whose group this principal cannot reach is omitted, and a leaf naming it — bare or pinned — is the ordinary unknown-column `422` (`views.md` §5, §6)."
          items:
            type: object
            additionalProperties: false
            required: [column, family, operands]
            properties:
              column:
                type: string
              family:
                type: string
                enum: [category, keyword, numeric, text]
              operands:
                type: array
                items:
                  type: string
                  enum: [eq, in, prefix, contains, range, match, phrase]
              scope:
                type: object
                additionalProperties: false
                required: [group]
                description: |
                  The view group whose views this column's values are per. Under a view of that
                  group — or of a group sharing its views — the request's own view decides which
                  column the leaf reads and nothing is added to the wire. Under any other view the
                  leaf must **pin** one: `<column>@<key>`, the same key form `views` publishes. An unpinned leaf there is a `422` naming the
                  group; a pin naming no view of it is the `404` an unknown view gets.
                properties:
                  group:
                    type: string
        selection:
          $ref: "#/components/schemas/Selection"
        layers:
          type: array
          description: The annotation layers this principal may know exist, and what each declared. Per-principal, as `views`, `groups` and `filter_operands`' scoped entries are; each layer's own `views` list is filtered by the view gate too. Never the artifact cardinality.
          items:
            $ref: "#/components/schemas/Layer"

    DeclaredScalar:
      type: object
      additionalProperties: false
      required: [name, arrow_type, category, analyser, render, index, homes]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: The column's identifier, unique bundle-wide, path-safe. Not view-qualified.
        arrow_type:
          type: string
          description: The storage type's name (`u8`, `u16`, `u32`, `u64`, `i8`…`i64`, `f32`, `f64`, `bool`, `timestamp_us`, `keyword`, `text`). Engine-derived; the set is the build schema's core types and this description does not enumerate it further.
        category:
          description: Present for a category column; `null` for a plain one — the signal a client keys a legend off, since the points frame ships a category as a bare integer.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [vocabulary, kind, visibility]
              properties:
                vocabulary:
                  type: string
                kind:
                  type: string
                  enum: [declared, discovered]
                visibility:
                  type: string
                  enum: [public, derived]
                  description: "`public`: the value set is served as authored to any session. `derived`: filtered per principal — a value appears iff at least one item carrying it is visible."
        analyser:
          description: For a `text` column, the `<name>/<version>` analyser identity that segmented the index — what lets a client tell *nothing says this* from *your query segmented differently*. `null` for every other type.
          type: [string, "null"]
        render:
          type: boolean
          description: The column arrives in the points frame, null where an item has no value, or code 0 for a category.
        index:
          type: boolean
          description: The column has an entity-space search structure. Neither flag set means blob-resident — returned at drill-down, never an operand.
        homes:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum: [rendered, value_column, record]
          description: "Where `POST /v1/items` reads the field's value from: `rendered`, the view's own columns; `value_column`, a per-item column in stored order; `record`, the record store. A field whose `homes` is `[\"record\"]` is read from the record store alone, which is fastest in `stored` order."

    ScopedScalar:
      type: object
      additionalProperties: false
      required: [name, arrow_type, scope, category, analyser, render, index, views]
      description: One group-scoped attribute's column family — one entity-space column per view of the group it names, and the same declaration an entity-scoped column carries.
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: The column's identifier, as a filter leaf spells it before any pin. Unique bundle-wide across the entity-scoped columns and the families alike.
        arrow_type:
          type: string
          description: The storage type's name, spelt exactly as `DeclaredScalar.arrow_type` is.
        scope:
          type: object
          additionalProperties: false
          required: [group]
          description: The view group whose views this family has a column per.
          properties:
            group:
              type: string
        category:
          description: Present for a category family; `null` otherwise — `DeclaredScalar.category`'s three facts, for the same reason.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [vocabulary, kind, visibility]
              properties:
                vocabulary:
                  type: string
                kind:
                  type: string
                  enum: [declared, discovered]
                visibility:
                  type: string
                  enum: [public, derived]
        analyser:
          description: For a `text` family, the `<name>/<version>` analyser identity that segmented its per-view indexes. `null` for every other family.
          type: [string, "null"]
        render:
          type: boolean
          description: The column arrives in the points frame **under a view of this group**, or of a group sharing its views via `members`, and under no other view. Under those views it follows the entity-scoped render columns; a row with no value is null, as in every render column but a category.
        index:
          type: boolean
          description: The family's columns carry an entity-space value column a filter may be answered from — which is the whole of whether it is an operand, a scoped column having no row route.
        views:
          type: array
          description: "Every view id whose rows carry this column and that this principal may reach: the owning group's own `group:key` ids, **and** the same keys under every group sharing those views via `members` — a client under a sharing group's view receives the column under that group's id, which the family's own list does not name. Gate-filtered per id, so a view this principal cannot reach is absent here as it is absent from `views`. Not the group's roster: a view created while the service runs has no column until a rebuild."
          items: { type: string }

    Selection:
      type: object
      additionalProperties: false
      description: Design §7.2's clause parameters and the request-shape ceilings. All deployment constants, identical for every principal; a client cannot read a mark count as a density without them.
      required: [k_min, k_max_marks, max_k, theta_target_marks, max_underlay_offset, max_tiles_per_request, max_category_values, max_shape_vertices, max_region_vertices, max_region_cells, max_suggestions, max_suggestion_walk, max_suggest_set_entities, max_browse_rows, max_page_rows, max_page_bytes]
      properties:
        k_min:
          type: integer
          minimum: 0
        k_max_marks:
          type: integer
          minimum: 0
          description: The overplot ceiling and `k`'s default.
        max_k:
          type: integer
          minimum: 0
          description: The machine ceiling. Effective cap is `min(k, max_k, k_max_marks)`.
        theta_target_marks:
          type: integer
          minimum: 0
        max_underlay_offset:
          type: integer
          minimum: 0
        max_tiles_per_request:
          type: integer
          minimum: 0
          description: The tile-count ceiling a `422` is otherwise indistinguishable from the client's own arithmetic being wrong.
        max_category_values:
          type: integer
          minimum: 0
          description: "`/v1/categories`' page ceiling and default."
        max_shape_vertices:
          type: integer
          minimum: 0
          description: The most vertices a published shape may carry after canonicalisation (`polygon-membership.md` §9). Over it, `PUT /control/layers/{name}/artifacts` is a `422` naming the count and the cap; the held decomposition is reported and never capped.
        max_region_vertices:
          type: integer
          minimum: 0
          description: The most vertices a `region` filter leaf's `polygon` may carry (`selection-operand.md` §2). Over it the request is a `422` naming the count and the cap.
        max_browse_rows:
          type: integer
          minimum: 1
          description: The most rows `POST /v1/artifacts/browse` returns in one page, and the default page size when a caller names none (`highlight-and-hierarchy.md` §4). `limit` clamps to it; `limit = 0` is a `422`. A response bound and not a disclosure control — what a principal may be told is the artifact's own existence criterion, settled before paging starts.
        max_page_rows:
          type: integer
          minimum: 1
          description: The most rows a `POST /v1/items` page holds. A request's `page_rows` is capped to it.
        max_page_bytes:
          type: integer
          minimum: 1
          description: The most Arrow bytes a `POST /v1/items` page holds before compression. A single row larger than this is sent alone.
        max_region_cells:
          type: integer
          minimum: 0
          description: The most boundary cells a `region` leaf's decomposition may hold at one depth (`selection-operand.md` §6). **Not a refusal** — over it the descent stops at the deepest depth that fits and the answer is exact for a cover, said on `x-tessera-region`.
        max_suggestions:
          type: integer
          minimum: 1
          description: "`/v1/categories/{column}/suggest`'s page ceiling and `limit`'s default; recommended 20. It is what lets a client tell a short list that means *that is all* from one the deployment truncated, which `more` alone does not."
        max_suggestion_walk:
          type: integer
          minimum: 1
          description: "The most values one suggestion request may examine before it stops and answers `more: true`; recommended 10⁵. It bounds latency and not disclosure — the enumeration walks the whole vocabulary unbudgeted — and a client that receives `more` on an unfilled page reads it as this budget rather than as its own arithmetic being wrong."
        max_suggest_set_entities:
          type: integer
          minimum: 1
          description: "The composed cardinality at or under which a suggestion is answered from a per-session set of the values this principal can see, rather than by probing one posting per value walked (`value-suggestion.md` §6.3, decision 0124); recommended 10⁷. Both routes serve the same page under the same gate and which answered is not on the wire; what differs is `more`, exact from the set route and possibly a spent walk budget from the probe route. A deployment constant, and the one here a caller can locate themselves against — they learn which side of it their own cardinality falls on, which a zoom-0 viewport already returns as `visible`."

    Layer:
      type: object
      additionalProperties: false
      required: [name, title, views, membership, hierarchy, levels, computed_content, shape, supplied_content, depends_on, version]
      properties:
        name:
          type: string
        title:
          type: [string, "null"]
        views:
          type: array
          items: { type: string }
        membership:
          description: Where the layer's artifacts get their members — a stored set per artifact, or a shape decomposed at request time. Engine-derived; other spellings are the declaration's and are not enumerated here.
          type: string
        hierarchy:
          type: object
          additionalProperties: false
          required: [kind, prune_children]
          properties:
            kind:
              type: string
              enum: [flat, nested, dag, stacked, tiered]
            prune_children:
              type: boolean
              description: The layer's **default** cut policy; `artifact_budget` may ask for more.
        levels:
          type: array
          description: Empty for a treed layer, whose lineage is in its edges.
          items:
            type: object
            additionalProperties: false
            required: [level, title, zoom]
            properties:
              level:
                type: integer
                minimum: 0
              title:
                type: [string, "null"]
              zoom:
                description: "`[min, max]` tile depth — **the default bound on this layer's response**: a `/v1/viewport` naming no `levels` is answered at the levels whose range covers the depth it asked at, and naming `levels` overrides that. Absent means served at every depth; a range containing no depth is refused at registration. It was advisory and bounded no work while nothing on the wire could name a level (contracts §3.2 r41, decision 0103)."
                oneOf:
                  - type: "null"
                  - type: array
                    minItems: 2
                    maxItems: 2
                    items: { type: integer, minimum: 0 }
        computed_content:
          type: array
          description: Properties recomputed per viewer from `membership ∩ M_auth` — `centroid`, `hull`, `box`.
          items: { type: string }
        shape:
          description: |
            **Which kind the layer's one drawn geometry is** (`polygon-membership.md` §7.1), or
            null where it draws none: `derived` — the hull over the members this principal can
            see, recomputed per principal; `predicate` — the membership shape of a `spatial`
            layer, identical for every principal served the artifact; `authored` — a supplied
            `polygon`, `circle` or `ellipse` content, gated by that content's own requirement and
            likewise identical. A client reads from it whether the outline moves with the
            principal, which decides whether it may hold one against a `tessera_id` across
            principals: a derived shape never, the other two may be. The geometry itself travels
            in the artifacts frame's `shape_x`/`shape_y` and in `ArtifactResponse.shape`, the same
            nesting for every kind.
          oneOf:
            - type: "null"
            - type: string
              enum: [derived, predicate, authored]
        supplied_content:
          type: array
          description: The **types** of publisher-supplied content, positional to the artifacts frame's `content` column. Safe to publish because an artifact failing containment is absent whole.
          items: { type: string }
        depends_on:
          type: array
          description: Layers whose artifacts this layer's may target — a clustering's labels name the clustering.
          items: { type: string }
        version:
          type: integer
          minimum: 0
          description: Moves on a gate edit; a client echoes it to notice one.

    CategoriesResponse:
      type: object
      additionalProperties: false
      required: [column, values, next]
      properties:
        column:
          type: string
        values:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, key, title]
            properties:
              code:
                type: integer
                minimum: 1
                description: Never `0`, the reserved *absent* sentinel.
              key:
                type: string
              title:
                type: [string, "null"]
                description: The authored presentation; `null` where no author wrote one, which is every value a discovered vocabulary mints. The key is the display fallback.
        next:
          type: [string, "null"]
          description: The last key returned, to pass as `?after=`; `null` when the set is complete, and always `null` for `?codes=`.

    SuggestResponse:
      type: object
      additionalProperties: false
      required: [column, q, values, more]
      description: "`value-suggestion.md` §5.1."
      properties:
        column:
          type: string
          description: The caller's own spelling, echoed back.
        q:
          type: string
          description: The query **as received**, not folded.
        values:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, key, title, match]
            properties:
              code:
                type: integer
                minimum: 1
                description: Never `0`, the reserved *absent* sentinel.
              key:
                type: string
              title:
                type: [string, "null"]
                description: The authored presentation; `null` where no author wrote one.
              match:
                type: object
                additionalProperties: false
                required: [field, start, len]
                description: Where the match sits, in **characters of the served string**, so a client highlights without re-implementing the fold.
                properties:
                  field:
                    type: string
                    enum: [key, title]
                    description: Which field matched. A word-start match reports the field the word came from, and is `key` for a word start on a value with no title.
                  start:
                    type: integer
                    minimum: 0
                  len:
                    type: integer
                    minimum: 0
              count:
                type: integer
                minimum: 0
                description: Present **iff** `counts=true` — the items carrying this value that this principal may see, exact and computed per request. Never `0` or `null` as a stand-in for absence, and never a sort key.
        more:
          type: boolean
          description: "`true` iff the walk stopped before its range was exhausted — the page filled, or `selection.max_suggestion_walk` values were examined. The budget form is the probe route's: answered from a per-session set of visible values (`value-suggestion.md` §6.3) it means the page filled and nothing else. There is no cursor; the client's response either way is to type more."

    Pin:
      type: object
      additionalProperties: false
      required: [prefix, segments_version]
      description: A generation stamp — the `x-tessera-pin` header's JSON, echoed back. Advisory, never authorisation.
      properties:
        prefix:
          type: string
        segments_version:
          type: integer
          minimum: 0

    ViewportRequest:
      type: object
      additionalProperties: false
      required: [view, zoom]
      description: Exactly one of `bbox` and `tiles` (contracts §3.2).
      properties:
        view:
          type: string
          description: A view id from `/v1/meta`.
        zoom:
          type: integer
          minimum: 0
          maximum: 16
          description: The tile depth — the grid is 2¹⁶ × 2¹⁶.
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
          description: "`[x0, y0, x1, y1]` in the view's quantisation extent's coordinates, `x0 ≤ x1`, `y0 ≤ y1`, all finite. The tiles answered for are the depth-`zoom` tiles it intersects."
        tiles:
          type: array
          items:
            type: integer
            minimum: 0
          description: Depth-`zoom` Morton prefixes, in place of `bbox`. Answered in the request's own order after duplicate removal (first occurrence kept); a prefix with bits above `zoom` is refused. Omitting a tile the client already holds costs the server nothing for it.
        k:
          type: integer
          minimum: 0
          description: The cap clause. Defaults to `k_max_marks`; capped by `max_k`. `0` is the counts-only request. Never decrease it on zoom.
        filters:
          description: |
            The filter. It narrows which marks are drawn and **answers one boolean beside each
            served artifact**: the *artifacts* frame's `matched` is `true` where a member this
            principal may see, inside the requested tiles, matches (contracts §3.2, decision 0104).
            The column is **null** on every response whose request carried no filter — there was no
            question, and `false` would answer one.

            **A filter moves nothing else about an artifact.** The same artifacts are served with
            the same `masked_count`, filtered or not: a filter may move the frontier up and never
            down (**I12**).
          allOf:
            - $ref: "#/components/schemas/FilterExpr"
        highlight:
          description: |
            A second boolean expression in **exactly `filters`' grammar**, and a second field of
            the one request rather than a second endpoint: a viewer narrowed by one clause and lit
            by another sends both here and reads both answers off the same frames
            (`highlight-and-hierarchy.md` §2).

            **It never changes which rows the response holds.** The cap clause, the density
            sampling and `served` all run over the `filters` candidate exactly as they do without
            it, so the served set is identical with and without a highlight — the map does not
            move, the marks do not resample, and a point the viewer was looking at stays where it
            is with its brightness changed. A client that wants the map to narrow uses `filters`;
            one that wants it lit uses this.

            It is evaluated over the candidate `filters` produced, so every answer is the
            conjunction `all_of[filters, highlight]`: the tiles frame's `highlighted` count (of
            this tile's `matched`, how many also satisfy it), the points frame's `highlighted` bit
            per served point, and the artifacts frame's `highlighted` bit — decision 0104's bit
            under the second expression. `highlighted ≤ matched ≤ visible` per tile.

            There is no list form, for the reason `filters` is one expression: two highlights are
            one expression under `all_of` or `any_of`.
          allOf:
            - $ref: "#/components/schemas/FilterExpr"
        pin:
          $ref: "#/components/schemas/Pin"
        underlay_offset:
          type: integer
          minimum: 0
          description: Serve exact masked counts at depth `zoom + underlay_offset` as the sub-cells frame. Absent or `0` serves none and adds no bytes. Refused, never clamped, above `max_underlay_offset`, past depth 16, or over the sub-cell budget.
        layers:
          description: |
            Which annotation layers to answer for — and so whether an artifacts frame can appear.
            **Omitted or `[]`: no layers**, no artifact pass, no cost. **`"all"`: every layer this
            principal reaches.** **An array: the named set intersected with the reachable set,
            never unioned** — a name this principal does not reach is absent whether or not it was
            asked for, so naming a layer is not a way to learn whether it exists. (Owner ruling
            2026-08-25; the server change lands on the s3 track. Until it merges, omitted is read
            as `"all"` and the string form is not accepted — send `[]` for none and an explicit
            array otherwise, which both servers read identically.)
          oneOf:
            - type: array
              items: { type: string }
            - type: string
              const: all
        artifact_budget:
          type: integer
          minimum: 0
          description: How many artifacts the client wants back at most. Honoured structurally — ancestors in place of their descendants — never by sampling (decision 0083); accepted and inert on a flat layer. Unbounded when absent.
        levels:
          description: |
            Which of each named layer's declared resolutions to answer for (contracts §3.2 r41,
            decision 0103).

            **Absent follows the layer's own declaration** — the levels whose declared zoom range
            covers this request's `zoom`, the two being the same 0–16 depth coordinate. The string
            `"all"` answers for every level; an array answers for exactly those, intersected with
            what the layer holds. A level a layer does not hold is absent from the answer rather
            than a refusal, the same way an unreachable layer name is; any other value is `422`.

            **A layer that declares no levels at all is inert to this in every form** — a treed
            or flat layer sits entirely at level 0, so naming levels for the tiered layer beside it
            does not blank its clusterings. **A layer that declares levels but no zoom range on any
            of them serves every level in the absent case**, there being no map to follow.

            **An empty array is *none***, as `layers: []` is.

            **The default is the reverse of `layers`' and deliberately so**: naming a layer has
            already opted into the artifact pass, so what is left is which of its rungs to pay for,
            and there the expensive answer is *every level* — the one a caller asks for by name.

            **It applies to every layer named**, against each layer's own declaration: a level
            number is a rung of one layer and means nothing across two.
          oneOf:
            - type: array
              items: { type: integer, minimum: 0 }
            - type: string
              const: all
        computed:
          description: |
            Which of each layer's **declared** derived properties the response should carry
            (contracts §3.2 r42, `artifact-shapes.md` §8 C).

            **Absent is the layer's own declaration**, which is what every response carried before
            this field existed. An array is that array **intersected** with each layer's
            declaration, and the empty array is *none* — counts and no geometry, the artifacts
            frame still served.

            **It narrows and can never widen.** A property a layer did not declare is not served
            for naming it. A name outside the vocabulary is `422`, unlike an unreachable layer
            name, which is absent: the three words are deployment schema and each layer's own set
            is published in `/v1/meta`, so refusing discloses nothing.

            **A cost control, not a disclosure one.** A derived shape is computed per artifact
            per request from `membership ∩ M_auth`, and a client draws one while a settled view
            carries hundreds; measured at 2,032 ms and 263 KB against 164 ms and 26 KB on a
            2.42M-member corpus. Fetch the one shape that draws from `POST /v1/artifacts/{tessera_id}`,
            which serves the same geometry and is unaffected by this field.

            `shape` names the layer's **one drawn geometry** of whichever kind `/v1/meta`'s
            `shape` publishes for it — the derived hull, the membership shape, or the authored
            one (`polygon-membership.md` §7.1); `hull` is the declaration's word and not an ask
            word. A predicate or an authored shape is served at this request's `zoom` under the
            vertex rule (§7.2): vertices that would move the drawn edge by less than a pixel at
            that depth are not sent, and at most 2,048 are.
          type: array
          items:
            type: string
            enum: [centroid, box, shape]
        artifact_rows:
          description: |
            Which columns each served artifact row answers with. **Absent or `"full"`: every
            column** — the default, and the answer a caller who has read nothing receives.
            **`"identity"`: the same rows in a fixed five-column schema** — `layer`
            (dictionary-encoded), `tessera_id`, `rung`, `matched`, `highlighted`, the payload
            columns absent from the schema rather than null. **The row set, the `matched` and
            `highlighted` bits and the `rung` values
            are identical under either value; only the columns change** — which keeps `parent_id`
            and the points frames' membership columns resolvable, and is why the projection
            discloses nothing: a column subset of what the same caller's identical request would
            have been served. For a filter change over rows the caller already holds. Any other
            value is `422`.
          type: string
          enum: [full, identity]
        point_rows:
          description: |
            Which columns each served point answers with, mirroring `artifact_rows`
            (`highlight-and-hierarchy.md` §2). **Absent or `"full"`: every column.**
            **`"highlight"`: the same points as `(tessera_id, highlighted)`**, the other columns
            absent from the schema rather than null. **The row set and the per-tile `served` split
            are identical under either value; only the columns change** — which is why the
            projection discloses nothing: the served set does not depend on the highlight at all.

            Nine bytes a point against the render columns' width. It is for the client that changed
            only its highlight and already holds every point it needs; the bits join its held
            points by `tessera_id`. **Bound to a generation**: a stamp move (`x-tessera-stale`)
            means the held set may no longer be what the same request serves, and the client
            re-asks with `"full"`. Without a `highlight` on the request there is nothing to project
            to and this answers as `"full"` does. Any other value is `422`.
          type: string
          enum: [full, highlight]

    BrowseRequest:
      type: object
      additionalProperties: false
      required: [view, layer]
      properties:
        view:
          type: string
          description: Which view's row space the counts are taken in. Required — a masked count is an intersection in row space, and row space is per view.
        layer:
          type: string
          description: The layer to browse. A name outside the list `/v1/meta` publishes to this principal is a `422`; so is a layer that attaches to another, which has no lineage of its own.
        level:
          type: integer
          minimum: 0
          description: Which level the form addresses on a **levelled** layer (`stacked`, `tiered`). A `422` on `flat`, `nested` and `dag`, which have one level, and on a level the layer does not hold — a kind's levels are deployment schema, and a parameter accepted and ignored is a wrong answer that looks right.
        parent:
          description: The children form — the artifacts naming this one among their parents, with its own served parents in `parents`. A `tessera_id`, as a number or its decimal string. One that names nothing, one of another layer, one suppressed and one below this principal's criterion all answer an empty page.
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"
        q:
          type: string
          description: The search form — the layer's artifacts whose key, or whose first supplied text content, contains this case-insensitively. Mutually exclusive with `parent`.
        filters:
          description: The viewport's own filter object. Each row then carries `matched_count = |membership ∩ M_auth ∩ filter|` and the page is ordered by it. **Existence and `masked_count` never move with it**, and a row whose `matched_count` is zero is still served.
          allOf:
            - $ref: "#/components/schemas/FilterExpr"
        limit:
          type: integer
          minimum: 1
          description: Page size, clamped to `selection.max_browse_rows` and defaulting to it. `0` is a `422`.
        cursor:
          type: string
          description: A previous page's `next`, passed back unchanged. Opaque; it carries a count and an identifier this principal was already served.

    BrowseResponse:
      type: object
      required: [artifacts, parents]
      properties:
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/BrowseRow" }
        parents:
          type: array
          description: The requested artifact's own served parents — **the children form only**, `[]` on the others so a client reads one shape.
          items: { $ref: "#/components/schemas/BrowseRow" }
        next:
          type: string
          description: The cursor for the next page. Absent where this page is the last.

    BrowseRow:
      type: object
      required: [tessera_id, masked_count, rung, parent_ids]
      properties:
        tessera_id:
          type: string
          description: A decimal string, for the reason every other viewer-plane JSON identifier is one — a `u64` does not ride through a JavaScript number intact.
        key:
          type: string
          description: The publisher's own key, where they supplied one.
        name:
          type: string
          description: The artifact's first supplied text content, where this principal may read it; absent where the first content is an authored shape, which is not text. An artifact whose content cannot be served is absent from the page entirely rather than served with this field empty.
        masked_count:
          type: integer
          description: How many of this artifact's members this principal can see — never how many it has, and never moved by `filters`.
        matched_count:
          type: integer
          description: "`|membership ∩ M_auth ∩ filter|`. Present exactly when the request carried `filters`: absent is *there was no question*."
        rung:
          type: integer
          description: The declared level on a levelled layer; the depth in the gated forest on a treed one; `0` on a flat one.
        parent_ids:
          type: array
          description: This artifact's parents **that this principal is also served**, ascending. Empty for a root and for one whose parents were all withheld alike — the two are one shape, and a client reads it as *no parent here*.
          items: { type: string }

    FilterExpr:
      description: |
        A boolean expression over declared columns (contracts §3.2, decisions 0062 and 0066). A node
        is a **leaf** — exactly one column name mapped to exactly one operator — or a
        **combinator**: `all_of`, `any_of` or `none_of` over sub-expressions. `all_of: []` matches
        the whole candidate; `any_of: []` matches nothing; `none_of: []` is `422`, as is a `none_of`
        whose branches name different columns or a `text` column. Nesting is bounded by the
        deployment and an over-deep expression is refused, never flattened.

        Values: a category takes its vocabulary **key** (string) or **code** (integer), freely
        mixed; a keyword takes byte-exact strings; a numeric takes numbers (and `range` a bounds
        object of `gte`/`gt`/`lte`/`lt`, at least one, at most one per side); a `text` column takes
        `match` with a string or `{"query", "minimum_should_match"}`, and `phrase` with a string.

        **An unknown column or an operator outside the column's family is `422`; an unknown
        *value* is an empty operand** — the one filter rule stated for clients: render *no
        matches* identically for a value you may not see and one that does not exist.

        **`region` is a leaf of its own, not a column** (`selection-operand.md` §2,
        `polygon-membership.md` §8; the name is reserved at the build): a set of rows over the
        whole view, composable with every other leaf, negatable with `none_of` — every rowed item
        carries a position, so the complement is well defined — and cached per generation across
        principals. The answer's exactness rides on `x-tessera-region`.

        **`member_of` is a second leaf of its own** (`highlight-and-hierarchy.md` §3; the name is
        reserved at the build): `{"layer", "artifact"}`, resolving to that artifact's membership
        inside `M_auth` as a set of rows over the whole view, composable and negatable exactly as
        `region` is. A layer this principal's `/v1/meta` does not list is a `422`; an artifact that
        names nothing, belongs to another layer, is suppressed or is below this principal's
        criterion is an **empty operand**, one answer for every reason.
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        all_of:
          type: array
          items: { $ref: "#/components/schemas/FilterExpr" }
        any_of:
          type: array
          items: { $ref: "#/components/schemas/FilterExpr" }
        none_of:
          type: array
          items: { $ref: "#/components/schemas/FilterExpr" }
        region:
          $ref: "#/components/schemas/RegionLeaf"
        member_of:
          $ref: "#/components/schemas/MemberOfLeaf"
      additionalProperties:
        $ref: "#/components/schemas/FilterLeafOperator"

    MemberOfLeaf:
      type: object
      description: |
        One artifact of one layer, as a set of rows over the whole view: that artifact's
        membership intersected with what this principal may see
        (`highlight-and-hierarchy.md` §3).

        **The two halves take opposite refusals.** `layer` is deployment schema — a name outside
        the layer list `/v1/meta` publishes to this principal is a `422`, and the registry answers
        alike for a gate-failed name and a never-registered one. `artifact` is a value and is never
        refused: an identifier that names nothing, one of another layer, one suppressed, one whose
        layer this principal does not reach, and one below their own existence criterion are all
        the empty operand, one answer for every reason. The artifact's gate — its layer's
        `visibility`, its own label, and `require_member_visibility` against `M_auth` — is the same
        conjunction the artifacts frame applies, and it runs before any membership is read.
      additionalProperties: false
      required: [layer, artifact]
      properties:
        layer:
          type: string
        artifact:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"

    RegionLeaf:
      type: object
      description: |
        Exactly one of `polygon`, `bbox`, `circle`, `ellipse` — a shape in the view's own space
        (the view's quantisation extent, as `/v1/meta` publishes it), with `space` (`view`, the
        default, or `wgs84` on a view that declares a projection — degrees, densified before projection so the edge is
        straight in the plane it was declared in; `wgs84` on a view that projects nothing is a
        `422`) — or `artifact`, a
        published shape named by its `tessera_id`, answered from its held membership under the
        artifact's own verdict: an artifact this principal would not be served, an id that names
        nothing, one on another view, one whose layer draws an authored shape, is an **empty
        operand**, one answer for every reason.

        A `polygon` is at least three vertices, implicitly closed, even-odd with a point on an
        edge inside, over `max_region_vertices` a `422`; a `bbox` is `[x0, y0, x1, y1]` closed on
        every side; a `circle` is `[cx, cy, r]`; an `ellipse` is `[cx, cy, a, b, angle_degrees]`.
        Coordinates are quantised to the view's 32-bit grid before anything is tested, so a
        client highlighting its own marks should quantise the same way.
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      properties:
        polygon:
          type: array
          minItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        circle:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
        ellipse:
          type: array
          minItems: 5
          maxItems: 5
          items: { type: number }
        artifact:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"
        space:
          type: string
          enum: [view, wgs84]

    FilterLeafOperator:
      type: object
      description: One operator from the column's family in `/v1/meta`'s `filter_operands`, with its value. Value shapes are per family (see `FilterExpr`) and are not narrowed further here, since the family is schema the description cannot know per column.
      minProperties: 1
      maxProperties: 1
      properties:
        eq: {}
        in:
          type: array
        prefix:
          type: string
        contains:
          type: string
        range:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            gte: { type: number }
            gt: { type: number }
            lte: { type: number }
            lt: { type: number }
        match:
          oneOf:
            - type: string
            - type: object
              additionalProperties: false
              required: [query, minimum_should_match]
              properties:
                query: { type: string }
                minimum_should_match: { type: integer, minimum: 1 }
        phrase:
          type: string
      additionalProperties: false

    ItemsRequest:
      type: object
      additionalProperties: false
      required: [view, fields]
      properties:
        view:
          type: string
          description: The view whose items are read, from `/v1/meta`. An item with no position in it is not returned.
        fields:
          type: array
          items: { type: string }
          description: Declared fields to return, by name, each once. A group-scoped field may be pinned as `<field>@<key>`. Empty returns `tessera_id` alone.
        system_fields:
          type: array
          items:
            type: string
            enum: [position, external_id, labels]
          description: System columns to return, in this order. Absent is none.
        filters:
          $ref: "#/components/schemas/FilterExpr"
        keep_unmatched:
          type: boolean
          description: Return every visible item with a `tessera:matched` column, in place of the matching ones only. Without `filters` every row is marked matched.
        count:
          type: boolean
          description: Put the numbers of visible and matching items in the head. Only on a request with no `cursor`; it costs one evaluation of the whole filter.
        order:
          type: string
          enum: [map, stored]
          description: Absent takes the cursor's order, or with no cursor the server's choice. A value differing from the cursor's is `422`.
        page_rows:
          type: integer
          minimum: 1
          description: Rows per page, capped by `selection.max_page_rows`. Absent is the cap.
        pages:
          type: integer
          minimum: 1
          description: The most pages this response may carry. Absent is as many as the response's budgets allow.
        cursor:
          type: string
          description: A previous response's `next`, unchanged. Absent starts from the beginning.
        compression:
          type: string
          enum: [zstd]
          description: Compress every records frame's Arrow buffers with zstd. Absent is uncompressed.
        idset:
          type: integer
          minimum: 0
          description: As on `POST /v1/items/{tessera_id}`; a mismatch is `409`.

    ArtifactsRequest:
      type: object
      additionalProperties: false
      required: [view, layer, fields]
      properties:
        view:
          type: string
          description: The view whose row space counts are taken in, from `/v1/meta`.
        layer:
          type: string
          description: A layer `/v1/meta` publishes to this principal. Attached layers are allowed.
        level:
          type: integer
          minimum: 0
          description: Only artifacts at this level, on a levelled layer.
        parent:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: "^[0-9]+$"
          description: A `tessera_id`. Only the artifacts naming it among their parents. Not with `q`.
        q:
          type: string
          description: Only artifacts whose key, or first served text content, contains this, case-insensitively. Not with `parent`.
        filters:
          $ref: "#/components/schemas/FilterExpr"
        keep_unmatched:
          type: boolean
          description: Return every served artifact under `filters`, those with no matching member included.
        count:
          type: boolean
          description: Put the numbers of artifacts served and of those matching in the head. Only on a request with no `cursor`.
        fields:
          type: array
          items:
            type: string
            enum: [key, level, parents, target, masked_count, content, centroid, box, shape]
          description: Properties to return, each once, in this order.
        page_rows:
          type: integer
          minimum: 1
          description: Rows per page, capped by `selection.max_page_rows`. Absent is the cap.
        pages:
          type: integer
          minimum: 1
          description: The most pages this response may carry.
        cursor:
          type: string
          description: A previous response's `next`, unchanged.
        compression:
          type: string
          enum: [zstd]
          description: Compress every records frame's Arrow buffers with zstd.
        idset:
          type: integer
          minimum: 0
          description: As on `POST /v1/items/{tessera_id}`; a mismatch is `409`.

    ArtifactsHead:
      type: object
      additionalProperties: false
      required: [page_rows]
      description: The kind-6 frame of a `POST /v1/artifacts` body. `served` and `matched` are present exactly when the request asked for `count`.
      properties:
        page_rows:
          type: integer
          minimum: 1
          description: The page size used, after the cap.
        served:
          type: integer
          minimum: 0
          description: The artifacts the request selects that this principal is served, at the start of the response.
        matched:
          type: integer
          minimum: 0
          description: Of those, the ones with a visible member matching `filters`; `served` without one.

    ItemsHead:
      type: object
      additionalProperties: false
      required: [order, page_rows]
      description: The kind-6 frame. `visible` and `matched` are present exactly when the request asked for `count`.
      properties:
        order:
          type: string
          enum: [map, stored]
          description: The order this response's rows are in.
        page_rows:
          type: integer
          minimum: 1
          description: The page size used, after the cap.
        visible:
          type: integer
          minimum: 0
          description: Visible items in the view at the start of the response, the count the viewport serves.
        matched:
          type: integer
          minimum: 0
          description: Of those, the ones matching `filters`; `visible` without one.

    PageEnd:
      type: object
      additionalProperties: false
      required: [next, ended_by]
      description: The kind-8 frame, after each records frame.
      properties:
        next:
          type: [string, "null"]
          description: The cursor to resume after this page; null where no row remains.
        ended_by:
          type: string
          enum: [rows, bytes, time, end]
          description: "`rows`: the page holds `page_rows`. `bytes`: the next row would have taken it past `max_page_bytes`. `time`: the response's time ran out, or the stream deadline cancelled it, and the response ends after this page. `end`: no row remains."

    RecordsTrailer:
      type: object
      additionalProperties: false
      required: [pages, rows, next, ended_by, stream_us]
      description: The kind-4 frame of a `POST /v1/items` or `POST /v1/artifacts` body.
      properties:
        pages:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        next:
          type: [string, "null"]
          description: The cursor to resume from, null where no row remains. It can be past the last page end, where the scan went on without finding a row.
        ended_by:
          type: string
          enum: [end, pages, budget_bytes, budget_time, deadline]
          description: "`end`: no row remains. `pages`: the response carried `pages` pages. `budget_bytes` and `budget_time`: the response's byte or time budget ran out. `deadline`: the stream deadline cancelled it."
        stream_us:
          type: integer
          minimum: 0
          description: The whole response's wall time in microseconds, including waits on the client.

    ItemRequest:
      type: object
      additionalProperties: false
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
        idset:
          type: integer
          minimum: 0
          description: The idset the caller minted its `tessera_id` under. Supplying it makes a `tessera_id` from a past idset a `409` rather than another item's record.

    ItemResponse:
      type: object
      additionalProperties: false
      required: [fields, labels, views, scoped]
      properties:
        fields:
          type: object
          description: The record by declared column name. Values are JSON numbers (every width), strings (a keyword, a text, or a category's **key**) or booleans. An absent field is absent, never `null`.
          additionalProperties:
            type: [number, string, boolean]
        external_id:
          type: string
          contentEncoding: base64
          description: The caller's own external id, present only where one exists.
        labels:
          type: array
          items:
            type: string
          description: |
            **The satisfied labels only** — the item's own access labels intersected with this
            session's satisfied term set, as the authorisation plugin presents them, sorted. Never
            the item's full label set: a viewer must not learn a compartment they do not hold, so
            every string here is one the credential itself presented. Always present; empty where
            this principal satisfies none of the item's labels, which is a fact and not an absence.
        views:
          type: array
          description: |
            **The views this item is in that this principal may reach**, sorted by id, each with
            the position that view places it at. **Gate-filtered**: a view the session's gate
            refuses is absent exactly as a view nobody declared is, so this is never the place a
            gate-failed view is named. Always present; `[]` says *none of this item's views is one
            you may reach* and says nothing else — an item in no view at all is a `404` before this
            field is built, so it is a different response rather than the other reading of an empty
            array.
          items:
            type: object
            additionalProperties: false
            required: [id, x, y]
            properties:
              id:
                type: string
                description: The view's id — a plain view's name or `<group>:<key>`.
              x:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: |
                  The horizontal axis in **this view's own grid units** — 32-bit fixed point
                  against the frame `/v1/meta` publishes for *this* view (decision 0040), which is
                  the same quantity the viewport's Morton codes decode to. Deinterleaved
                  server-side: a JSON number cannot carry a 64-bit code exactly.
              y:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: The vertical axis, on `x`'s terms.
        scoped:
          type: object
          description: |
            **The group-scoped attribute values, by family name and then by the group's key**
            (`views.md` §5) — `{"mood": {"2026-Q1": "calm"}}`. The key is a view's only address
            (decision 0113), so two views sharing a key through a `members` group share one entry.
            Which group a family's keys belong to is on `/v1/meta`'s `scoped_scalars` and is not
            repeated here. Gate-filtered per key on the same set `views` is; a family with no
            reachable key, one this item carries no value under, and a `text` family — which has
            no per-entity value slot — are all absent rather than empty. Always present; `{}` is
            the ordinary answer for a corpus whose attributes are all entity-scoped.
          additionalProperties:
            type: object
            additionalProperties:
              type: [number, string, boolean]

    ArtifactRequest:
      type: object
      additionalProperties: false
      required: [view]
      properties:
        view:
          type: string
          description: Which view's row space the count is taken in. Required, unlike `/v1/items` — a masked count is an intersection in row space, and row space is per view.
        idset:
          type: integer
          minimum: 0
        zoom:
          type: integer
          minimum: 0
          maximum: 16
          description: The depth the caller draws at, for the vertex rule a predicate or an authored shape is served under (`polygon-membership.md` §7.2). Absent serves the whole presimplified shape under the 2,048-vertex guard. A derived hull is unaffected.

    ArtifactResponse:
      type: object
      additionalProperties: false
      required: [layer, masked_count, rung]
      properties:
        layer:
          type: string
        key:
          type: string
          description: The publisher's own key, absent where none was supplied.
        masked_count:
          type: integer
          minimum: 0
          description: How many of this artifact's members **the asking principal** can see. Never the artifact's size.
        centroid:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: In the viewport's 32-bit-per-axis grid units, over the members this principal can see. Absent where the layer declares none.
        box:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0 }
          description: "`[min_x, min_y, max_x, max_y]`, grid units."
        shape:
          type: array
          description: "**The artifact's one drawn geometry** — parts, then rings, then vertices — of the kind `/v1/meta`'s `shape` names for its layer (`polygon-membership.md` §7.1): the derived hull, every α-group its own part; the predicate shape; or the authored one. A part's first ring is its outer and the rest are holes. Absent where the layer draws none."
          items:
            type: array
            description: One part — its outer ring, then its holes.
            items:
              type: array
              description: One closed ring in grid units; a derived hull's counter-clockwise from its lowest vertex.
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: integer, minimum: 0 }
        content:
          type: array
          items: { type: string }
          description: The publisher's supplied content, positional to the layer's declared `supplied_content` types. Absent where the layer declares none; never partial.
        rung:
          type: integer
          minimum: 0
          description: "The rung this artifact sits at — the declared level on a levelled layer, `0` on a treed or flat one (which, this response being one artifact with no parent links, is also its response-local chain depth; the viewport frame's `rung` column carries the same number). The one field here that is a fact about the artifact rather than about the asking principal: two principals served it agree on it."

    PublicationAck:
      type: object
      additionalProperties: false
      required: [publication]
      description: When a write becomes visible. Every write route's answer carries these two fields.
      properties:
        publication:
          type: integer
          minimum: 0
          description: The publication cycle this write is in. It is visible once `/control/status`'s `publication` reaches this number.
        visible:
          type: boolean
          description: "Present only with `wait=visible`: `true` where the cycle ran before the answer, `false` where `serve.visible_wait_max_secs` passed first."

    IngestRecords:
      type: array
      description: A JSON ingest batch, one object per row.
      items:
        $ref: "#/components/schemas/IngestRecord"

    IngestRecord:
      type: object
      description: One row of a JSON ingest batch. The properties below are the route's own; any other key is a declared attribute, a group-scoped attribute of the view's group, or an enumerated layer's name.
      properties:
        external_id:
          type: [string, "null"]
          contentEncoding: base64
          description: The caller's identifier for the item, at most 64 bytes. Absent or `null` is an item with none, addressed later only by the `tessera_id` the answer gives.
        x:
          type: number
          description: The horizontal coordinate, on a view whose projection is `none`.
        y:
          type: number
          description: The vertical coordinate, on a view whose projection is `none`.
        lon:
          type: number
          description: Longitude in degrees, on a projected view.
        lat:
          type: number
          description: Latitude in degrees, on a projected view.
        access:
          description: The row's access labels, one per element. Absent, `null` or `[]` is no label, which the view's `point_visibility.default` fills.
          oneOf:
            - type: string
            - type: array
              items:
                type: [string, "null"]
            - type: "null"
        node_id:
          type: [string, "null"]
          description: Accepted and not stored.
        level:
          type: [integer, string, "null"]
          description: The level at which this row's layer keys are placed, as an integer or a string of digits. Read only where the batch carries a layer column.
      additionalProperties:
        description: "An attribute's value, or a layer's key or list of keys. A category takes its key; an integer is a JSON number or a string of digits; `timestamp_us` is microseconds since the Unix epoch; `null` is no value."
        type: [boolean, number, string, array, "null"]

    IngestResponse:
      type: object
      additionalProperties: false
      required: [accepted, over_bound, over_bound_ids, clipped, clamped, padded_columns, tessera_ids, minted, publication]
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Rows accepted. `0` on a replay, so a sum over retried batches counts each row once.
        over_bound:
          type: integer
          minimum: 0
          description: Rows whose labels resolve to more terms than the auth plugin's per-item bound. They are stored, not refused.
        over_bound_ids:
          type: array
          maxItems: 100
          description: The external ids of the first 100 of those rows that carry one, in base64.
          items:
            type: string
            contentEncoding: base64
        clipped:
          type: integer
          minimum: 0
          description: Rows whose coordinates lay outside the projection's domain and were stored on the frame's edge. Always `0` on a view whose projection is `none`.
        clamped:
          type: integer
          minimum: 0
          description: Rows whose coordinates lay outside the view's extent and were stored on its edge.
        padded_columns:
          type: integer
          minimum: 0
          description: Declared attributes the batch left out, each absent on every row.
        tessera_ids:
          type: array
          description: One `tessera_id` per row in the order sent, as a string of decimal digits, whether or not the row carries an external id. A replay answers the original ids.
          items:
            type: string
            pattern: "^[0-9]+$"
        minted:
          type: integer
          minimum: 0
          description: Artifacts the batch's layer columns created on `open` layers. A created artifact cannot be undone. `0` on a replay.
        replayed:
          const: true
          description: Present only when this body was already accepted under this batch id. Nothing was written.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`. A replay names the next cycle, later than the one that published its rows."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ValuesRecords:
      type: array
      description: A JSON values batch, one object per row.
      items:
        $ref: "#/components/schemas/ValuesRecord"

    ValuesRecord:
      type: object
      description: One row of a JSON values batch. It names its item by exactly one of `external_id`, and `tessera_id` with `idset`. Any other key is a declared attribute, a group-scoped attribute of the view's group, or an enumerated layer's name, as on ingest.
      properties:
        external_id:
          type: [string, "null"]
          contentEncoding: base64
          description: The item's external id.
        tessera_id:
          type: [string, "null"]
          pattern: "^[0-9]+$"
          description: The item's `tessera_id`, as a string of decimal digits.
        idset:
          type: [integer, string, "null"]
          description: The idset `tessera_id` was minted under, from `/v1/meta`. Required with `tessera_id` and refused with `external_id`.
        level:
          type: [integer, string, "null"]
          description: As on `IngestRecord`.
      additionalProperties:
        description: An attribute's value, or a layer's key or list of keys, as on `IngestRecord`. A key the row leaves out leaves that cell as it is.
        type: [boolean, number, string, array, "null"]

    ValuesResponse:
      type: object
      additionalProperties: false
      required: [rows, filled, held, joined, minted, publication]
      properties:
        rows:
          type: integer
          minimum: 0
          description: Rows the batch carried.
        filled:
          type: integer
          minimum: 0
          description: Cells that held no value and now hold the one sent. `0` on a replay.
        held:
          type: integer
          minimum: 0
          description: Cells that already held the value sent.
        joined:
          type: integer
          minimum: 0
          description: Memberships the layer columns added, to artifacts created by this batch and to held ones alike.
        minted:
          type: integer
          minimum: 0
          description: Artifacts the layer columns created on `open` layers.
        replayed:
          const: true
          description: Present only when this body was already accepted under this batch id. Nothing was written.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ChangeItem:
      type: object
      additionalProperties: false
      required: [op]
      description: One change. It names its item by exactly one of `external_id`, and `tessera_id` with `idset`.
      properties:
        op:
          type: string
          enum: [delete, suppress, unsuppress]
          description: "`delete` removes the item; `suppress` hides it; `unsuppress` lifts a suppression."
        external_id:
          type: string
          contentEncoding: base64
          description: The item's external id.
        tessera_id:
          type: string
          pattern: "^[0-9]+$"
          description: The item's `tessera_id`, as a string of decimal digits; a JSON number is `422`.
        idset:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The idset `tessera_id` was minted under, from `/v1/meta`. Every item of one request carries the same one.
      oneOf:
        - required: [external_id]
          not:
            anyOf:
              - required: [tessera_id]
              - required: [idset]
        - required: [tessera_id, idset]
          not:
            required: [external_id]

    AttributeDeclaration:
      type: object
      additionalProperties: false
      required: [name, type]
      description: A corpus declaration's `[[attribute]]` block, without the keys that say where a build reads its values.
      properties:
        name:
          type: string
          description: The column's name, unique among attributes and layers.
        title:
          type: [string, "null"]
          description: A human-readable title. Not part of the column's identity.
        type:
          type: string
          enum: [bool, u8, u16, u32, u64, i8, i16, i32, i64, f32, f64, timestamp_us, keyword, text, category]
          description: The value type. `category` stores its vocabulary's codes at the vocabulary's width.
        vocabulary:
          type: [string, "null"]
          description: The vocabulary a `category` draws on, by name. Required for a category and refused on any other type.
        analyser:
          type: [string, "null"]
          description: The analyser that segments a `text` column for search. Absent is `unicode`, the only one. Refused on any other type.
        index:
          type: boolean
          default: false
          description: Build a search structure, so a filter may name the column.
        render:
          type: boolean
          default: false
          description: Serve the column in the viewport's points frame. `true` is refused on this route.
        scope:
          description: "`entity`, one value per item, or `{\"group\": \"<view_group>\"}`, one value per item for each view of that group. Absent is `entity`."
          default: entity
          oneOf:
            - type: string
              const: entity
            - $ref: "#/components/schemas/GroupScope"

    GroupScope:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group:
          type: string
          description: The view group whose views the values or artifacts are per.

    AttributeDeclared:
      type: object
      additionalProperties: false
      required: [name, existing, publication]
      properties:
        name:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this declaration and nothing was written."
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    VocabularyDeclaration:
      type: object
      additionalProperties: false
      required: [value_set, visibility, width]
      description: A corpus declaration's `[[vocabulary]]` block, without its name, which is in the path, and without the keys that say where a build reads its values.
      properties:
        title:
          type: [string, "null"]
          description: A human-readable title. Not part of the identity.
        value_set:
          type: string
          enum: [closed, open]
          description: "`closed` refuses a key it does not hold at ingest; `open` adds it."
        visibility:
          type: string
          enum: [public, derived]
          description: "`public` serves the values as declared to every viewer. `derived` serves a value only to a viewer who can see an item carrying it."
        width:
          type: string
          enum: [u8, u16, u32]
          description: The code's width, which bounds how many values the vocabulary can hold.
        values:
          type: array
          default: []
          description: The values to add, each with a code the server draws.
          items:
            $ref: "#/components/schemas/VocabularyValue"
        reserved:
          type: array
          default: []
          description: Retired codes, never drawn. Each is from 1 to the width's maximum. Compared as a set.
          items:
            type: integer
            minimum: 1

    VocabularyValue:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          description: The value's key, which ingest sends and filters name. Unique in the vocabulary.
        title:
          type: [string, "null"]
          description: The name a client draws. On a key the vocabulary holds, a title replaces the held one.

    VocabularyValues:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyValue"

    VocabularyDeclared:
      type: object
      additionalProperties: false
      required: [name, existing, added, titles, publication]
      properties:
        name:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this identity."
        added:
          type: integer
          minimum: 0
          description: Keys the request added.
        titles:
          type: integer
          minimum: 0
          description: Held keys whose title the request changed.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    VocabularyValuesAdded:
      type: object
      additionalProperties: false
      required: [name, added, existing, titles, publication]
      properties:
        name:
          type: string
        added:
          type: integer
          minimum: 0
          description: Keys the page added.
        existing:
          type: integer
          minimum: 0
          description: Keys the page named that the vocabulary already held.
        titles:
          type: integer
          minimum: 0
          description: Held keys whose title the page changed.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    Extent:
      type: object
      additionalProperties: false
      required: [x, y]
      description: The frame a view's positions are quantised over, in the view's own coordinates. It never changes.
      properties:
        x:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "`[min, max]` on the horizontal axis."
        y:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "`[min, max]` on the vertical axis."

    Gate:
      description: The access labels a viewer must hold one of to reach the view, as one label or a list. It never changes.
      oneOf:
        - type: string
        - type: array
          items: { type: string }

    PointVisibility:
      type: object
      additionalProperties: false
      properties:
        default:
          type: [string, "null"]
          description: The access label an ingested row with no label takes. Absent or `null`, such a row is refused.

    Projection:
      type: string
      enum: [none, web_mercator, equirectangular, plate_carree, gall_isographic]
      default: none
      description: What places positions in the view. `none` takes coordinates as written; the others take longitude and latitude in degrees. `plate_carree` is another name for `equirectangular`.

    ViewGroupDeclaration:
      type: object
      additionalProperties: false
      required: [extent]
      description: A corpus declaration's `[[view_group]]` block, without its name, which is in the path, and without its roster and source.
      properties:
        title:
          type: [string, "null"]
        projection:
          $ref: "#/components/schemas/Projection"
        extent:
          $ref: "#/components/schemas/Extent"
        visibility:
          description: The gate every view of the group takes unless it names its own. Absent or `null` is `public`.
          oneOf:
            - $ref: "#/components/schemas/Gate"
            - type: "null"
        point_visibility:
          oneOf:
            - $ref: "#/components/schemas/PointVisibility"
            - type: "null"
        members:
          type: [string, "null"]
          description: Another view group whose views this group lays out a second time, under the same keys. That group must own its keys, and a group with `members` declares no `metadata`.
        metadata:
          type: array
          default: []
          description: The typed values each view of the group carries, in the order a client is served them.
          items:
            $ref: "#/components/schemas/MetadataField"

    MetadataField:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name:
          type: string
          description: The name, unique in the group.
        type:
          type: string
          enum: [bool, u8, u16, u32, u64, i8, i16, i32, i64, float, text, timestamp_us, category]
          description: The value's type. `category` is refused on this route.
        vocabulary:
          type: [string, "null"]
          description: The vocabulary a `category` draws on.

    ViewGroupDeclared:
      type: object
      additionalProperties: false
      required: [group, existing, publication]
      properties:
        group:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this declaration and nothing was written."
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    PlainViewDeclaration:
      type: object
      additionalProperties: false
      required: [extent]
      description: A corpus declaration's `[[view]]` block, without its name, which is in the path, and without its source.
      properties:
        title:
          type: [string, "null"]
          description: The name a client draws. Absent is the view's id.
        projection:
          $ref: "#/components/schemas/Projection"
        extent:
          $ref: "#/components/schemas/Extent"
        visibility:
          description: The view's gate. Absent or `null` is `public`.
          oneOf:
            - $ref: "#/components/schemas/Gate"
            - type: "null"
        point_visibility:
          oneOf:
            - $ref: "#/components/schemas/PointVisibility"
            - type: "null"

    PlainViewDeclared:
      type: object
      additionalProperties: false
      required: [view, existing, publication]
      properties:
        view:
          type: string
        existing:
          type: boolean
          description: "`true` where the name already carried this declaration and nothing was written."
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ViewRecord:
      type: object
      additionalProperties: false
      description: A view's roster record. It cannot be changed after the view is created.
      properties:
        visibility:
          description: The view's own gate. Absent or `null` takes the group's.
          oneOf:
            - $ref: "#/components/schemas/Gate"
            - type: "null"
        metadata:
          type: object
          default: {}
          description: One value for each name the group declares, and no other. A `timestamp_us` is microseconds since the Unix epoch, as an integer; an integer is never read as a float, nor a float as an integer.
          additionalProperties:
            type: [boolean, number, string]

    ViewCreated:
      type: object
      additionalProperties: false
      required: [view, group, key, publication]
      properties:
        view:
          type: string
          description: The view's id, `<group>:<key>`.
        group:
          type: string
        key:
          type: string
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ViewDropped:
      type: object
      additionalProperties: false
      required: [deleted, fills_dropped, publication]
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Items `delete_dangling` deleted. `0` without it.
        fills_dropped:
          type: integer
          minimum: 0
          description: Group-scoped values written for this view and not yet flushed, which were discarded with it.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    LayerDeclaration:
      type: object
      additionalProperties: false
      required: [name, views, membership, artifact_visibility, hierarchy]
      description: A corpus declaration's `[[layer]]` block.
      properties:
        name:
          type: string
          description: The layer's identity, for ever. Not empty and not `all`.
        title:
          type: [string, "null"]
        views:
          type: array
          items: { type: string }
          description: The views the layer is drawn on. A view group's name stands for every view the group holds at registration.
        membership:
          description: "Where artifacts get their members: `enumerated`, a stored set per artifact; `spatial`, the items inside the artifact's shape; `{\"attribute\": \"<column>\"}`, the items carrying each value of an attribute."
          oneOf:
            - type: string
              enum: [enumerated, spatial]
            - type: object
              additionalProperties: false
              required: [attribute]
              properties:
                attribute:
                  type: string
        value_set:
          type: string
          enum: [closed, open]
          default: closed
          description: "`closed` refuses a key no artifact holds when a batch names it; `open` creates the artifact."
        visibility:
          type: [string, "null"]
          description: The access label a viewer must hold to know the layer exists. Absent or `null`, every viewer may.
        artifact_visibility:
          type: object
          additionalProperties: false
          required: [default]
          description: Whether artifacts carry access labels of their own, and what one carrying none gets.
          properties:
            field:
              type: [string, "null"]
              description: Present, artifacts carry their own labels, and a publication states each artifact's `access`. Absent or `null`, they carry none, and a label on one is refused.
            default:
              description: "What an artifact with no label of its own gets: `inherited`, the layer's gate alone, or `{\"label\": \"<label>\"}`."
              oneOf:
                - type: string
                  const: inherited
                - type: object
                  additionalProperties: false
                  required: [label]
                  properties:
                    label:
                      type: string
        require_member_visibility:
          description: "How many of an artifact's members a viewer must see for the artifact to exist for them: `{\"count\": n}`, or `{\"fraction\": p}` of its declared members with `p` in (0, 1]. Absent or `null` is no such rule. A fraction is refused where the membership is `spatial` or an attribute."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 0
            - type: object
              additionalProperties: false
              required: [fraction]
              properties:
                fraction:
                  type: number
        hierarchy:
          type: object
          required: [kind]
          description: Where the layer's lineage lives. Keys other than these two are ignored.
          properties:
            kind:
              type: string
              enum: [flat, nested, dag, stacked, tiered]
              description: "`flat` has no lineage. `nested` is a tree held in parent edges, and `dag` the same with several parents allowed; neither declares levels. `stacked` is independent analyses, one per level. `tiered` is levels with containment edges from each level to the one below. `stacked` and `tiered` declare at least one level."
            prune_children:
              type: boolean
              default: false
              description: The viewport's default cut. `true` serves only the deepest passing artifact on each branch where a parent and a child both pass; a request may ask for more.
        content:
          type: object
          additionalProperties: false
          description: What artifacts carry beside their members. The removed key `withdraw_on_member_deletion` is refused by name.
          properties:
            computed:
              type: array
              default: []
              description: Properties computed per viewer from the members that viewer can see.
              items:
                type: string
                enum: [centroid, box, hull]
            supplied:
              type: array
              default: []
              description: Content the publisher supplies, in the order each artifact's `values` carry it.
              items:
                $ref: "#/components/schemas/SuppliedContent"
        depends_on:
          type: array
          default: []
          items: { type: string }
          description: Registered layers whose artifacts this layer's artifacts may attach to or name as parents.
        levels:
          type: array
          default: []
          description: The layer's levels, numbered densely from 0. Empty on a `flat`, `nested` or `dag` layer.
          items:
            $ref: "#/components/schemas/LevelDeclaration"
        layout:
          description: How each level's membership is stored for serving. Absent or `null` lets the build and every fold choose. Every form serves the same answers.
          oneOf:
            - type: "null"
            - type: string
              enum: [artifact_major, row_major_label, row_major_list]
        shape:
          description: The kind of shape a `spatial` layer's artifacts carry. Refused on any other membership. A spatial layer without it accepts no artifacts.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [bbox, circle, ellipse, polygon]
        scope:
          description: "`entity`, one artifact set drawn on every view the layer names, or `{\"group\": \"<view_group>\"}`, a different set per view of that group. Absent is `entity`."
          default: entity
          oneOf:
            - type: string
              const: entity
            - $ref: "#/components/schemas/GroupScope"

    SuppliedContent:
      type: object
      additionalProperties: false
      required: [name, type, require_member_visibility]
      properties:
        name:
          type: string
          description: The content's name, unique in the layer.
        type:
          type: string
          description: The content's type, published in `/v1/meta`'s `supplied_content`. `polygon`, `circle` and `ellipse` are authored shapes, read from the value's text; any other type is served as the string sent.
        require_member_visibility:
          type: string
          enum: [all, inherited]
          description: "`all` serves the content only to a viewer who can see every item it was made from, and each content carries `generated_from`. `inherited` serves it wherever the artifact is served, and carries no `generated_from`."

    LevelDeclaration:
      type: object
      required: [level]
      description: One level of a `stacked` or `tiered` layer. Keys other than these three are ignored.
      properties:
        level:
          type: integer
          minimum: 0
        title:
          type: [string, "null"]
        zoom:
          description: "`[min, max]` tile depth: a viewport naming no `levels` is answered at the levels whose range covers its depth. Absent or `null`, the level is served at every depth. A range holding no depth from 0 to 16 is refused."
          oneOf:
            - type: "null"
            - type: array
              minItems: 2
              maxItems: 2
              items: { type: integer, minimum: 0 }

    LayerRegistered:
      type: object
      additionalProperties: false
      required: [name, tessera_id, publication]
      properties:
        name:
          type: string
        tessera_id:
          type: string
          pattern: "^[0-9]+$"
          description: The layer's own identifier, the address `POST /control/changes` suppresses the layer by.
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    PublishRequest:
      type: object
      additionalProperties: false
      required: [addressing, artifacts]
      properties:
        level:
          type: integer
          minimum: 0
          default: 0
          description: The level the artifacts go into. Absent is 0, the only level of a layer that declares none.
        addressing:
          type: string
          enum: [external, tessera]
          description: How every member in the batch is written. `external` is a base64 external id; `tessera` is a `tessera_id` as a string of decimal digits.
        idset:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: The idset the `tessera_id`s were minted under. Required with `tessera` addressing and refused with `external`.
        default_space:
          type: string
          enum: [view, wgs84]
          description: The space of a shape, and of authored shape content, whose artifact names none. `view` takes the view's own coordinates; `wgs84` takes degrees, projected by each view's own projection and refused on a view whose projection is `none`. Absent is `view`.
        artifacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PublishedArtifact"

    PublishedArtifact:
      type: object
      additionalProperties: false
      description: One artifact of a publication. Its members are `members` or `excluding`; an artifact with `attached_to` may carry neither, and is served over its target's members.
      properties:
        key:
          type: [string, "null"]
          description: The publisher's key, unique in the level. Needed by any artifact another names as a parent or target, and by any grown later.
        view:
          type: [string, "null"]
          description: The key of the view the artifact belongs to. Required on a layer scoped to a group, refused on any other.
        members:
          type: [array, "null"]
          items: { type: string }
          description: The members, addressed as the batch's `addressing` says. `[]` is a membership that holds nobody.
        excluding:
          type: [array, "null"]
          items: { type: string }
          description: The view's items the membership leaves out, addressed as `members` are. The membership is every other item of the view. Refused beside `members`.
        content:
          type: array
          default: []
          description: Ranked supplied content, most specific first.
          items:
            $ref: "#/components/schemas/ContentItem"
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        parent:
          type: array
          default: []
          items: { type: string }
          description: Parent keys. At most one on a `nested` or `tiered` layer, any number on a `dag`. A parent already exists or comes earlier in the batch.
        bbox:
          type: [array, "null"]
          items: { type: number }
          description: "`[min_x, min_y, max_x, max_y]`, on a layer whose `shape` is `bbox`."
        circle:
          type: [array, "null"]
          items: { type: number }
          description: "`[cx, cy, r]`, on a layer whose `shape` is `circle`."
        ellipse:
          type: [array, "null"]
          items: { type: number }
          description: "`[cx, cy, a, b, angle_degrees]`, on a layer whose `shape` is `ellipse`."
        wkt:
          type: [string, "null"]
          description: A WKT polygon or multipolygon, on a layer whose `shape` is `polygon`.
        space:
          type: [string, "null"]
          enum: [view, wgs84, null]
          description: This artifact's space, in place of `default_space`.
        access:
          type: [array, "null"]
          items: { type: string }
          description: The artifact's own access labels. `null` or `[]` is no label, which `artifact_visibility.default` answers. Absent states none, which a layer whose `artifact_visibility` names a field refuses. Refused on a layer that names no field.

    ContentItem:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          items: { type: string }
          description: One value per supplied content the layer declares, in the declaration's order.
        generated_from:
          type: array
          default: []
          items: { type: string }
          description: The items this content was made from, addressed as `members` are. Required where the content's `require_member_visibility` is `all`, and refused where it is `inherited`.

    Attachment:
      type: object
      additionalProperties: false
      required: [layer, key]
      description: The artifact this one is attached to, such as a cluster its label names. The target already exists, on a layer this one's `depends_on` names. The attached artifact is served only where its target is.
      properties:
        layer:
          type: string
        level:
          type: integer
          minimum: 0
          default: 0
        key:
          type: string

    ArtifactsPublished:
      type: object
      additionalProperties: false
      required: [artifacts, created, without_content, filled, joined, publication]
      properties:
        artifacts:
          type: array
          description: One entry per artifact, in the order sent.
          items:
            type: object
            additionalProperties: false
            required: [key, tessera_id]
            properties:
              key:
                type: [string, "null"]
              tessera_id:
                type: string
                pattern: "^[0-9]+$"
                description: The artifact's identifier, the held artifact's own where the key was held.
        created:
          type: integer
          minimum: 0
          description: Artifacts the batch created.
        without_content:
          type: integer
          minimum: 0
          description: Of those, the ones with no content on a layer that declares some.
        filled:
          type: integer
          minimum: 0
          description: Parts filled on held artifacts.
        joined:
          type: integer
          minimum: 0
          description: Memberships added, to created and held artifacts alike.
        shapes:
          type: array
          description: Present when the batch carried a shape or authored shape content.
          items:
            $ref: "#/components/schemas/ShapeReport"
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    ShapeReport:
      type: object
      additionalProperties: false
      required: [key, views]
      description: What fitting one shape to each of its layer's views did.
      properties:
        key:
          type: [string, "null"]
          description: The artifact's key.
        content:
          type: integer
          minimum: 0
          description: The rank of the authored shape content this reports on. Absent for the artifact's own shape.
        views:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [view, clipped, outside, rings_dropped, degrees_looking, vertices_in, vertices_out, parts, rings, interior_tiles, boundary_cells]
            properties:
              view:
                type: string
              clipped:
                type: boolean
                description: Part of the shape lay outside the view's extent and was cut away.
              outside:
                type: boolean
                description: The whole shape lay outside the extent, so it holds nothing.
              rings_dropped:
                type: integer
                minimum: 0
                description: Rings that fell below three distinct vertices on the view's grid.
              degrees_looking:
                type: boolean
                description: Every coordinate lay within ±180 by ±90 while the extent does not. The shape may have been written in degrees for a view that is not.
              vertices_in:
                type: integer
                minimum: 0
              vertices_out:
                type: integer
                minimum: 0
              parts:
                type: integer
                minimum: 0
              rings:
                type: integer
                minimum: 0
              interior_tiles:
                type: integer
                minimum: 0
                description: Grid tiles wholly inside the shape.
              boundary_cells:
                type: integer
                minimum: 0
                description: Grid cells the shape's edge crosses.

    GrowRequest:
      type: object
      additionalProperties: false
      required: [addressing, artifacts]
      description: "`level`, `addressing`, `idset` and `default_space` are `PublishRequest`'s."
      properties:
        level:
          type: integer
          minimum: 0
          default: 0
        addressing:
          type: string
          enum: [external, tessera]
        idset:
          type: integer
          minimum: 0
          maximum: 4294967295
        default_space:
          type: string
          enum: [view, wgs84]
        artifacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GrowingArtifact"

    GrowingArtifact:
      type: object
      additionalProperties: false
      required: [key]
      description: One artifact of a growth, by key. Every other field is optional, and a row with only a key changes nothing.
      properties:
        key:
          type: string
          description: The key the artifact was published under.
        view:
          type: [string, "null"]
          description: The key of the view the artifact belongs to, as on a publication. Required on a layer scoped to a group, refused on any other.
        rank:
          type: [integer, "null"]
          minimum: 0
          maximum: 65535
          description: Absent, `members` joins the membership. Present, `members` and `leaving` move the generating set of the content at this rank, and the row fills no part.
        members:
          type: array
          default: []
          items: { type: string }
          description: Members joining, addressed as the batch's `addressing` says.
        leaving:
          type: array
          default: []
          items: { type: string }
          description: Members leaving a generating set, applied after the joins. Needs a `rank`.
        parent:
          type: array
          default: []
          items: { type: string }
          description: Parent keys. Filled where the artifact holds none; `409` where it holds others.
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        content:
          type: array
          default: []
          description: Contents by rank, each filled where the artifact lacks it. A content here carries no generating set.
          items:
            type: object
            additionalProperties: false
            required: [rank, values]
            properties:
              rank:
                type: integer
                minimum: 0
                maximum: 65535
              values:
                type: array
                items: { type: string }
        bbox:
          type: [array, "null"]
          items: { type: number }
        circle:
          type: [array, "null"]
          items: { type: number }
        ellipse:
          type: [array, "null"]
          items: { type: number }
        wkt:
          type: [string, "null"]
        space:
          type: [string, "null"]
          enum: [view, wgs84, null]
        access:
          type: [array, "null"]
          items: { type: string }
          description: The artifact's access labels, filled where it has none.

    MembershipsGrown:
      type: object
      additionalProperties: false
      required: [artifacts, publication]
      properties:
        artifacts:
          type: array
          description: One entry per row, in the order sent.
          items:
            type: object
            additionalProperties: false
            required: [key, tessera_id, joined, filled, left]
            properties:
              key:
                type: string
              tessera_id:
                type: string
                pattern: "^[0-9]+$"
              joined:
                type: integer
                minimum: 0
                description: Joining members the membership did not already hold.
              filled:
                type: integer
                minimum: 0
                description: Parts that were absent and are now held.
              left:
                type: integer
                minimum: 0
                description: Leaving members taken out of a generating set.
              withdrawn:
                type: integer
                minimum: 0
                description: Present where this row emptied the generating set at this rank. The content is withdrawn, and the publisher supplies it again.
        shapes:
          type: array
          description: Present when the batch filled a shape or authored shape content.
          items:
            $ref: "#/components/schemas/ShapeReport"
        publication:
          type: integer
          minimum: 0
          description: "`PublicationAck.publication`."
        visible:
          type: boolean
          description: "`PublicationAck.visible`."

    Status:
      type: object
      additionalProperties: false
      description: The `GET /control/status` document. Counters count from the process's start; gauges are read when the request is answered. Byte figures are bytes and times are in the unit their name gives.
      required: [entity_id_high_water, publication, partitions, compute, bulk, write_executor, ingest, limits, segments, overlay, compaction, fragmentation, row_projection_cache, projection_builds_by_route, fragment_cache, sessions, masked_count_cache, region_cache, derived_cache, suggest_sets, occupancy, heap]
      properties:
        entity_id_high_water:
          type: integer
          minimum: 0
          description: The next entity id the allocator will issue to an item, a corpus-wide figure.
        publication:
          type: integer
          minimum: 0
          description: Publication cycles completed since the write executor started. A write is visible once this reaches the `publication` its answer named.
        partitions:
          type: array
          description: One entry per partition of the bundle.
          items:
            type: object
            additionalProperties: false
            required: [partition, segments_version, watermark, readiness]
            properties:
              partition:
                type: string
              segments_version:
                type: integer
                minimum: 0
                description: Moves when a flush, merge or fold publishes.
              watermark:
                type: integer
                minimum: 0
                description: The entities the published geometry covers.
              readiness:
                type: boolean
                description: Whether the node is ready, as `/readyz` answers.
        compute:
          type: object
          additionalProperties: false
          required: [admission, queue, in_flight, waiting, streaming, shed_total]
          description: The compute-admission gate the viewport, item and session routes share.
          properties:
            admission:
              type: integer
              minimum: 0
              description: Requests computing at once.
            queue:
              type: integer
              minimum: 0
              description: Requests that may wait for a slot.
            in_flight:
              type: integer
              minimum: 0
            waiting:
              type: integer
              minimum: 0
            streaming:
              type: integer
              minimum: 0
              description: Responses still streaming, which hold a slot but no compute.
            shed_total:
              type: integer
              minimum: 0
              description: Requests this gate answered `429`. Single-flight `429`s are not counted.
        bulk:
          type: object
          additionalProperties: false
          required: [admission, queue, in_flight, waiting, shed_total]
          description: The admission limit `POST /v1/items` and `POST /v1/artifacts` run under, `serve.bulk_admission`. A read holds its slot for its whole response.
          properties:
            admission:
              type: integer
              minimum: 0
            queue:
              type: integer
              minimum: 0
              description: Always 0, so a read past the limit is refused at once.
            in_flight:
              type: integer
              minimum: 0
            waiting:
              type: integer
              minimum: 0
            shed_total:
              type: integer
              minimum: 0
        write_executor:
          $ref: "#/components/schemas/WriteExecutorStatus"
        ingest:
          type: object
          additionalProperties: false
          required: [admission, in_flight, shed_total]
          description: The admission limit `POST /control/ingest` and `POST /control/values` share, `ingest.ingest_admission`.
          properties:
            admission:
              type: integer
              minimum: 0
            in_flight:
              type: integer
              minimum: 0
            shed_total:
              type: integer
              minimum: 0
              description: Requests this limit answered `429`. A `429` for a full buffer or queue is not counted.
        limits:
          type: object
          additionalProperties: false
          required: [ingest, values, publish, grow, changes, declarations]
          description: Each write route's caps, so a client can size its requests. A request over one is `422` naming the limit, and is never truncated.
          properties:
            ingest:
              $ref: "#/components/schemas/BatchLimits"
            values:
              $ref: "#/components/schemas/BatchLimits"
            publish:
              type: object
              additionalProperties: false
              required: [route, max_artifacts_per_request, max_body_bytes, max_shape_vertices, max_excluded_per_request]
              properties:
                route:
                  type: string
                max_artifacts_per_request:
                  type: integer
                  minimum: 0
                max_body_bytes:
                  type: integer
                  minimum: 0
                max_shape_vertices:
                  type: integer
                  minimum: 0
                max_excluded_per_request:
                  type: integer
                  minimum: 0
            grow:
              type: object
              additionalProperties: false
              required: [route, max_members_per_request, max_body_bytes]
              properties:
                route:
                  type: string
                max_members_per_request:
                  type: integer
                  minimum: 0
                  description: Joining and leaving members together.
                max_body_bytes:
                  type: integer
                  minimum: 0
            changes:
              type: object
              additionalProperties: false
              required: [route, max_changes_per_request, max_body_bytes]
              properties:
                route:
                  type: string
                max_changes_per_request:
                  type: integer
                  minimum: 0
                max_body_bytes:
                  type: integer
                  minimum: 0
            declarations:
              type: object
              additionalProperties: false
              required: [route, max_records_per_request, max_body_bytes]
              description: The declaration routes, which the `route` string lists.
              properties:
                route:
                  type: string
                max_records_per_request:
                  type: integer
                  minimum: 0
                  description: Always 1.
                max_body_bytes:
                  type: integer
                  minimum: 0
        segments:
          type: array
          description: The live segment count per partition and view, which every viewport pays for. A merge bounds the count; a fold resets it to one. A count past `compaction_max_segments` means folds are being refused.
          items:
            type: object
            additionalProperties: false
            required: [partition, view, count]
            properties:
              partition:
                type: string
              view:
                type: string
              count:
                type: integer
                minimum: 0
        overlay:
          type: object
          additionalProperties: false
          required: [depth, retirable, soft_limit_alarms]
          description: The deletions and suppressions in force and not yet folded.
          properties:
            depth:
              type: integer
              minimum: 0
              description: Deletions and suppressions together.
            retirable:
              type: integer
              minimum: 0
              description: Deletions alone, which a fold retires and the fold schedule keys on. A suppression never retires.
            soft_limit_alarms:
              type: integer
              minimum: 0
        compaction:
          $ref: "#/components/schemas/CompactionStatus"
        fragmentation:
          type: object
          additionalProperties: false
          required: [scope, postings_per_container, run_ratio, postings, runs, containers, rows, tiers, allocation]
          description: How scattered ingested entity ids are across the index, measured over delta tiers as each is flushed; the base bundle is not measured.
          properties:
            scope:
              type: string
              const: delta-tiers
            postings_per_container:
              type: [number, "null"]
              description: Mean entries per container touched. `null` before the first flush publishes.
            run_ratio:
              type: [number, "null"]
              description: Mean run length over the scattered baseline at the same density; `1.0` is fully scattered and larger is better. `null` before the first flush publishes.
            postings:
              type: integer
              minimum: 0
            runs:
              type: integer
              minimum: 0
            containers:
              type: integer
              minimum: 0
            rows:
              type: integer
              minimum: 0
            tiers:
              type: integer
              minimum: 0
              description: Published tiers measured.
            allocation:
              type: object
              additionalProperties: false
              required: [scope, postings, runs, containers, rows, windows]
              description: The same counts taken per commit window, before tiers are formed.
              properties:
                scope:
                  type: string
                  const: commit-window-allocation
                postings:
                  type: integer
                  minimum: 0
                runs:
                  type: integer
                  minimum: 0
                containers:
                  type: integer
                  minimum: 0
                rows:
                  type: integer
                  minimum: 0
                windows:
                  type: integer
                  minimum: 0
        row_projection_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, building_refusals, waits_satisfied, waiters_now, evictions, young_evictions, thrashing, oversized_admissions]
          description: The sessions' row projections of their visible sets.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            building_refusals:
              type: integer
              minimum: 0
              description: Requests refused with `429` while another built the same projection.
            waits_satisfied:
              type: integer
              minimum: 0
              description: Requests served by waiting for another's build.
            waiters_now:
              type: integer
              minimum: 0
              description: Requests waiting now, across the process.
            evictions: { type: integer, minimum: 0 }
            young_evictions:
              type: integer
              minimum: 0
              description: Entries evicted before they were read again, a sign the bound is smaller than what the sessions hold at once.
            thrashing:
              type: boolean
              description: "`young_evictions` is above 0."
            oversized_admissions: { type: integer, minimum: 0 }
        projection_builds_by_route:
          type: object
          additionalProperties: false
          required: [whole_domain, walk, split, complement]
          description: How row projections were built, per construction. Every construction gives the same rows; the shares show whether the choice between them fits the corpus.
          properties:
            whole_domain: { type: integer, minimum: 0 }
            walk: { type: integer, minimum: 0 }
            split: { type: integer, minimum: 0 }
            complement: { type: integer, minimum: 0 }
        fragment_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, building_refusals, evictions, young_evictions, thrashing, oversized_admissions, rebuilds]
          description: The mask fragments `POST /session/authorise` builds, one per credential.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            building_refusals: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            young_evictions: { type: integer, minimum: 0 }
            thrashing: { type: boolean }
            oversized_admissions: { type: integer, minimum: 0 }
            rebuilds:
              type: integer
              minimum: 0
              description: Fragments built again after an eviction, as against for the first time.
        sessions:
          type: object
          additionalProperties: false
          required: [retained, sweeps, swept_total, sweep_at]
          description: Viewer sessions held in memory. Expired ones are swept when `retained` reaches `sweep_at`; an expired session is refused whether or not it has been swept.
          properties:
            retained: { type: integer, minimum: 0 }
            sweeps: { type: integer, minimum: 0 }
            swept_total: { type: integer, minimum: 0 }
            sweep_at: { type: integer, minimum: 0 }
        masked_count_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, hits, misses, evictions]
          description: Per-session masked counts, pruned at revocation and at the expiry sweep.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
        region_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, building_refusals, waits_satisfied, evictions]
          description: The rows each `region` filter leaf selects, shared across sessions per generation.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            building_refusals: { type: integer, minimum: 0 }
            waits_satisfied: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
        derived_cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, hits, misses, evictions, hit_rate]
          description: Artifact geometry derived per session, such as hulls.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            hit_rate:
              type: [number, "null"]
              description: Hits over lookups. `null` before the first lookup.
        suggest_sets:
          type: object
          additionalProperties: false
          required: [entries, bytes, hits, misses, builds, declined, discarded, evictions, in_flight]
          description: The per-session sets of visible category values `/v1/categories/{column}/suggest` answers from.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            builds: { type: integer, minimum: 0 }
            declined:
              type: integer
              minimum: 0
              description: Sessions too broad for a set, over `selection.max_suggest_set_entities`, which are answered by probing instead.
            discarded: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            in_flight: { type: integer, minimum: 0 }
        occupancy:
          type: object
          additionalProperties: false
          required: [entries, bytes, bound_bytes, hits, misses, evictions, walks]
          description: Which tiles hold visible rows, per session, view, depth and generation.
          properties:
            entries: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
            bound_bytes: { type: integer, minimum: 0 }
            hits: { type: integer, minimum: 0 }
            misses: { type: integer, minimum: 0 }
            evictions: { type: integer, minimum: 0 }
            walks:
              type: integer
              minimum: 0
              description: Occupancy walks. One per session, view and generation is expected; one per request means the cache is not holding.
        heap:
          type: object
          additionalProperties: false
          required: [anon_bytes, file_bytes, resident_bytes, trims, last_trim_returned_bytes, last_trim_micros, trim_baseline_bytes, trim_growth_bytes]
          description: The kernel's view of the process's memory. The gap between `anon_bytes` and the caches above is what the allocator retains.
          properties:
            anon_bytes: { type: integer, minimum: 0 }
            file_bytes: { type: integer, minimum: 0 }
            resident_bytes: { type: integer, minimum: 0 }
            trims:
              type: integer
              minimum: 0
              description: Times the allocator was asked to return memory to the kernel.
            last_trim_returned_bytes: { type: integer, minimum: 0 }
            last_trim_micros: { type: integer, minimum: 0 }
            trim_baseline_bytes: { type: integer, minimum: 0 }
            trim_growth_bytes:
              type: integer
              minimum: 0
              description: The growth over the baseline that asks for the next trim.

    BatchLimits:
      type: object
      additionalProperties: false
      required: [route, max_batch_rows, max_batch_bytes]
      properties:
        route:
          type: string
          description: The route these caps apply to, as `<method> <path>`.
        max_batch_rows:
          type: integer
          minimum: 0
          description: "`ingest.ingest_max_batch_rows`."
        max_batch_bytes:
          type: integer
          minimum: 0
          description: "`ingest.ingest_max_batch_bytes`."

    WriteExecutorStatus:
      type: object
      additionalProperties: false
      description: The write executor, the one thread that applies every write.
      required: [posture, ready, work_submitted, deny_submitted, wal_appends, wal_fsyncs, wal_recoveries, wal, apply_nanos_total, apply_nanos_max, foreign_side_manifests, work_completed, work_depth, work_service_nanos_ewma, flush, coalesces, merges, coalesce_in_flight, merge_in_flight, work_in_flight_nanos, bench_timing, stage_nanos, flush_stages]
      properties:
        posture:
          type: string
          enum: [not-started, running, wal-poisoned, dead]
          description: "`running` is ready. `wal-poisoned` is not ready, and still applies deletions and suppressions."
        ready:
          type: boolean
          description: Whether `/readyz` answers `200`.
        work_submitted:
          type: integer
          minimum: 0
          description: Writes submitted to the queue that sheds, every write but changes.
        deny_submitted:
          type: integer
          minimum: 0
          description: Changes submitted to the queue that never sheds.
        wal_appends: { type: integer, minimum: 0 }
        wal_fsyncs:
          type: integer
          minimum: 0
          description: "`wal_appends / wal_fsyncs` is the mean writes per commit window."
        wal_recoveries:
          type: integer
          minimum: 0
          description: Write-ahead log faults recovered from. A rise means changes were answered `500` and their callers send them again.
        wal:
          type: object
          additionalProperties: false
          required: [members, bytes, position, pinned_by, pinned_at, pin_span_bytes, samples]
          description: The write-ahead log, sampled at most once per flush period.
          properties:
            members:
              type: integer
              minimum: 0
              description: Files the log is held in. Steady state is two; a rising count is a rotation that is not reclaiming.
            bytes: { type: integer, minimum: 0 }
            position:
              type: integer
              minimum: 0
              description: Record bytes written across every file the log has held. A position, not a size.
            pinned_by:
              type: [string, "null"]
              description: What keeps the log from rotating below `pinned_at`, or `null` when nothing does. A `growth` or `fill` pin clears only at a compaction fold.
            pinned_at:
              type: [integer, "null"]
              minimum: 0
            pin_span_bytes:
              type: integer
              minimum: 0
              description: "`position` less `pinned_at`; `0` when nothing pins the log."
            samples:
              type: integer
              minimum: 0
              description: Samples taken. Two reads with the same value read the same sample.
        apply_nanos_total: { type: integer, minimum: 0 }
        apply_nanos_max: { type: integer, minimum: 0 }
        foreign_side_manifests:
          type: integer
          minimum: 0
          description: Manifests another process wrote over this node's bundle root. Anything above 0 means a second writer.
        work_completed: { type: integer, minimum: 0 }
        work_depth:
          type: integer
          minimum: 0
          description: Writes submitted and not yet answered.
        work_service_nanos_ewma:
          type: integer
          minimum: 0
          description: A moving average of one write's service time. With `work_depth` it gives a `429`'s `Retry-After`.
        flush:
          type: object
          additionalProperties: false
          required: [ticks, flushes, flush_skips, flush_failures, flushable_items, flush_requested, in_flight, buffered_items, overlay_publications, refreshes, refresh_in_flight]
          properties:
            ticks: { type: integer, minimum: 0 }
            flushes: { type: integer, minimum: 0 }
            flush_skips:
              type: integer
              minimum: 0
              description: Ticks skipped because a flush was still running. A rising count means flushes are slower than the tick.
            flush_failures:
              type: integer
              minimum: 0
              description: Flushes that failed and left the buffer for the next tick.
            flushable_items:
              type: integer
              minimum: 0
              description: Rows the next flush would publish; an item in two views counts twice.
            flush_requested:
              type: boolean
              description: A `POST /control/flush` is waiting for the next tick.
            in_flight:
              type: boolean
              description: A flush is running, or finished and not yet published.
            buffered_items:
              type: integer
              minimum: 0
              description: Items buffered, the figure `ingest.ingest_buffer_max_items` bounds.
            overlay_publications:
              type: integer
              minimum: 0
              description: Manifests written for deletions and suppressions alone.
            refreshes:
              type: integer
              minimum: 0
              description: Session projections refreshed after a flush or merge. A session serves its old projection until its refresh.
            refresh_in_flight:
              type: boolean
              description: The refresh for the newest flush or merge is still running.
        coalesces: { type: integer, minimum: 0 }
        merges: { type: integer, minimum: 0 }
        coalesce_in_flight: { type: boolean }
        merge_in_flight: { type: boolean }
        work_in_flight_nanos:
          type: integer
          minimum: 0
          description: How long the current write has run; `0` when the executor is idle.
        bench_timing:
          type: boolean
          description: Whether this binary records stage times. Without it every stage time is 0.
        stage_nanos:
          type: object
          description: Time spent in each stage of closing a commit window, by stage name. The names are instrumentation and are not listed here.
          additionalProperties:
            type: integer
            minimum: 0
        flush_stages:
          type: object
          additionalProperties: false
          required: [bench_timing, executions, rows_executed, flushes, rows_published, executor_nanos, pool_nanos]
          description: Flush stage times, on the executor thread and on the pool. Divide pool times by `executions`, and executor times by `flushes`, for a per-flush figure.
          properties:
            bench_timing: { type: boolean }
            executions: { type: integer, minimum: 0 }
            rows_executed: { type: integer, minimum: 0 }
            flushes: { type: integer, minimum: 0 }
            rows_published: { type: integer, minimum: 0 }
            executor_nanos:
              type: object
              description: Nanoseconds by stage name, on the executor thread.
              additionalProperties:
                type: integer
                minimum: 0
            pool_nanos:
              type: object
              description: Nanoseconds by stage name, on the pool.
              additionalProperties:
                type: integer
                minimum: 0

    CompactionStatus:
      type: object
      additionalProperties: false
      description: Compaction folds. Alarm on `fold_failures`, and on `fold_refusals` rising while `folds` does not.
      required: [live_rows, folds, fold_failures, fold_requested, fold_refusals, fold_refusals_by_gate, last_refusal, last_secs, last_rss_bytes, last_attr_bytes_read, last_attr_bytes_written, passes]
      properties:
        live_rows: { type: integer, minimum: 0 }
        folds: { type: integer, minimum: 0 }
        fold_failures:
          type: integer
          minimum: 0
          description: Folds discarded. Each leaves a bundle-sized directory nothing reclaims.
        fold_requested:
          type: boolean
          description: A `POST /control/compact` is waiting for the next tick.
        fold_refusals:
          type: integer
          minimum: 0
          description: Folds asked for and not started, the sum of `fold_refusals_by_gate`.
        fold_refusals_by_gate:
          type: object
          additionalProperties: false
          required: [insufficient_disc, insufficient_memory, nothing_to_fold, overlay_diverged, stepped_down, wal_poisoned]
          properties:
            insufficient_disc: { type: integer, minimum: 0 }
            insufficient_memory: { type: integer, minimum: 0 }
            nothing_to_fold: { type: integer, minimum: 0 }
            overlay_diverged: { type: integer, minimum: 0 }
            stepped_down: { type: integer, minimum: 0 }
            wal_poisoned: { type: integer, minimum: 0 }
        last_refusal:
          description: The latest refusal, or `null` where there has been none.
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [gate, need_bytes, had_bytes, at_unix]
              properties:
                gate:
                  type: string
                  description: One of `fold_refusals_by_gate`'s names.
                need_bytes:
                  type: [integer, "null"]
                  minimum: 0
                  description: For a memory or disc refusal, what the fold needs; `null` otherwise.
                had_bytes:
                  type: [integer, "null"]
                  minimum: 0
                  description: For a memory or disc refusal, what the host had; `null` otherwise.
                at_unix:
                  type: integer
                  minimum: 0
                  description: When, in seconds since the Unix epoch.
        last_secs: { type: integer, minimum: 0 }
        last_rss_bytes:
          type: integer
          minimum: 0
          description: The last fold's resident memory, sampled between passes, so it understates the peak.
        last_attr_bytes_read: { type: integer, minimum: 0 }
        last_attr_bytes_written: { type: integer, minimum: 0 }
        passes:
          type: array
          description: The last fold's passes, in order.
          items:
            type: object
            additionalProperties: false
            required: [pass, ms, rss_bytes, anon_bytes]
            properties:
              pass: { type: string }
              ms: { type: integer, minimum: 0 }
              rss_bytes: { type: integer, minimum: 0 }
              anon_bytes: { type: integer, minimum: 0 }
