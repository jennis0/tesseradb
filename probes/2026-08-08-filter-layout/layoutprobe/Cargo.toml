[package]
name = "layoutprobe"
version = "0.1.0"
edition = "2021"

# Standalone: not a member of the repo workspace, and must not become one — the gate's
# `cargo test --workspace` should never build a probe harness.
[workspace]

[dependencies]
croaring = "2"
memchr = "2"
# **The shipped scan, not a model of it.** `realscan` calls `ValueColumn` directly: the other
# binaries here reimplement the loop, which is right for comparing *layouts* but means their
# constants describe the approach rather than the code. An optimisation measured against a
# reimplementation is measured against itself.
tessera-authz = { path = "../../../crates/tessera-authz" }
tessera-filter = { path = "../../../crates/tessera-filter" }
tessera-types = { path = "../../../crates/tessera-types" }

[profile.release]
opt-level = 3
debug = false
