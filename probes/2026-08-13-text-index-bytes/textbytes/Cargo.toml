[package]
name = "textbytes"
version = "0.1.0"
edition = "2021"

# Standalone: not a workspace member, for the reason `dictbytes` gives.
[workspace]

[dependencies]
# **The shipped writers**, so what is reported is the format's own output on disk rather than an
# accounting of it. That is the whole point: `2026-08-12-string-storage` arm 3 modelled the index
# at 22.7–23.6 B/entity by summing per-posting costs, and a model of a format is not the format.
tessera-analyse = { path = "../../../crates/tessera-analyse" }
tessera-filter = { path = "../../../crates/tessera-filter" }
tessera-authz = { path = "../../../crates/tessera-authz" }
tessera-types = { path = "../../../crates/tessera-types" }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
debug = false
