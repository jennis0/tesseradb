[package]
name = "suggestprobe"
version = "0.1.0"
edition = "2021"

# Standalone: not a member of the repo workspace, and must not become one — the gate's
# `cargo test --workspace` should never build a probe harness.
[workspace]

[dependencies]
fst = "0.4"
memmap2 = "0.9"
croaring = "2"
# The fold: NFKC from this crate; case folding is `str::to_lowercase` (see README, "Fold").
unicode-normalization = "0.1"
# The repository's own readers and writers, used as they ship rather than re-implemented:
# `SortedDictWriter`/`SortedDict` (front-coded block dictionary) and `ColumnPostings::narrow`
# from mosaica-filter; `PostingsSpool`/`encode_posting`/`PostingsReader` from mosaica-authz.
mosaica-filter = { path = "../../../crates/mosaica-filter" }
mosaica-authz = { path = "../../../crates/mosaica-authz" }
mosaica-types = { path = "../../../crates/mosaica-types" }

[profile.release]
debug = 1
