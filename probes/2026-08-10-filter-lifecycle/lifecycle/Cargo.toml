[package]
name = "lifecycle"
version = "0.1.0"
edition = "2021"

# Standalone: not a workspace member, so the gate's `cargo test --workspace` never builds it.
[workspace]

[dependencies]
arrow = { version = "59", default-features = false, features = ["ipc"] }
croaring = "2"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
serde_json = "1"
tempfile = "3"
tessera-build = { path = "../../../crates/tessera-build" }
# `fault-injection` is what lets the campaign hold the coalesce off for the flush-accumulation
# stage: a query curve measured against a policy that fired mid-run cannot separate the two.
tessera-engine = { path = "../../../crates/tessera-engine", features = ["fault-injection"] }
tessera-filter = { path = "../../../crates/tessera-filter" }
tessera-lifecycle = { path = "../../../crates/tessera-lifecycle" }
tessera-plugin = { path = "../../../crates/tessera-plugin" }
tessera-spatial = { path = "../../../crates/tessera-spatial" }
tessera-store = { path = "../../../crates/tessera-store" }
tessera-types = { path = "../../../crates/tessera-types" }

[profile.release]
opt-level = 3
debug = false
