[package]
name = "lifecycle"
version = "0.1.0"
edition = "2021"

# Standalone: not a workspace member, so the gate's `cargo test --workspace` never builds it.
[workspace]

[dependencies]
arrow = { version = "59", default-features = false, features = ["ipc"] }
croaring = "2"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }
serde_json = "1"
tempfile = "3"
mosaica-build = { path = "../../../crates/mosaica-build" }
# `fault-injection` is what lets the campaign hold the coalesce off for the flush-accumulation
# stage: a query curve measured against a policy that fired mid-run cannot separate the two.
mosaica-engine = { path = "../../../crates/mosaica-engine", features = ["fault-injection"] }
mosaica-filter = { path = "../../../crates/mosaica-filter" }
mosaica-lifecycle = { path = "../../../crates/mosaica-lifecycle" }
mosaica-spatial = { path = "../../../crates/mosaica-spatial" }
mosaica-store = { path = "../../../crates/mosaica-store" }
mosaica-types = { path = "../../../crates/mosaica-types" }

[profile.release]
opt-level = 3
debug = false
