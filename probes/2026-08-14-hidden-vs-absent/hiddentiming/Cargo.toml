[package]
name = "hiddentiming"
version = "0.1.0"
edition = "2021"

# Standalone: not a workspace member, for the reason `dictbytes` and `textbytes` give.
[workspace]

[dependencies]
# **The shipped route, not a model of it.** The whole gate on this campaign (#119) is that the
# timed call is `FilterColumns::resolve` — the same entry a served request takes — because the
# `utf8` retirement fence measured a route that did not exist and this branch's review caught the
# same defect twice more. `mosaica-engine` is here to be *called*, not to be reimplemented.
mosaica-engine = { path = "../../../crates/mosaica-engine" }
mosaica-analyse = { path = "../../../crates/mosaica-analyse" }
mosaica-filter = { path = "../../../crates/mosaica-filter" }
mosaica-filter-write = { path = "../../../crates/mosaica-filter-write" }
mosaica-authz = { path = "../../../crates/mosaica-authz" }
mosaica-store = { path = "../../../crates/mosaica-store" }
mosaica-spatial = { path = "../../../crates/mosaica-spatial" }
mosaica-types = { path = "../../../crates/mosaica-types" }
croaring = "2"
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
debug = false
