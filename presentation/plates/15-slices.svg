<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 484" width="860" height="484" font-family="ui-sans-serif, system-ui, sans-serif">
<title>A shared entity space fans into three slices — two temporal snapshots and an alternative embedding projection — each with its own coordinates for the same identified items; one item is absent from the earliest slice.</title>
<rect x="0" y="0" width="860" height="484" fill="#fbfcfc"/>


        <defs>
          <marker id="arS" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#101820"/></marker>
        </defs>
        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">Slices: the same identified items, placed by more than one coordinate system</text>
        <text x="840" y="26" font-size="11" fill="#7d6111" text-anchor="end">design under review — not yet built</text>

        <rect x="40" y="52" width="780" height="70" rx="2" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="56" y="76" font-size="12" fill="#101820">ENTITY SPACE — SHARED ACROSS EVERY SLICE</text>
        <text x="56" y="94" font-size="11" fill="#5b6a75">one identity per item · permissions (term postings) · labels and generating sets · metadata · the viewer's mask</text>
        <text x="56" y="110" font-size="11" fill="#5b6a75">all of it exists once, and is valid for every slice — nothing below owns any of it</text>

        <g stroke="#101820" stroke-width="1.2" marker-end="url(#arS)">
          <line x1="160" y1="126" x2="160" y2="162"/>
          <line x1="430" y1="126" x2="430" y2="162"/>
          <line x1="700" y1="126" x2="700" y2="162"/>
        </g>
        <text x="430" y="148" font-size="10.5" fill="#5b6a75" text-anchor="middle">the mask projects into whichever slice the request names</text>

        <g font-size="12" fill="#101820" text-anchor="middle">
          <text x="160" y="184">slice "2024-Q4"</text>
          <text x="430" y="184">slice "2025-Q1"</text>
          <text x="700" y="184">slice "embedding-B"</text>
        </g>
        <g font-size="10.5" fill="#5b6a75" text-anchor="middle">
          <text x="160" y="199">temporal snapshot</text>
          <text x="430" y="199">temporal snapshot</text>
          <text x="700" y="199">another projection of the same items</text>
        </g>
        <g fill="#ffffff" stroke="#b7c2c9">
          <rect x="60"  y="208" width="200" height="150"/>
          <rect x="330" y="208" width="200" height="150"/>
          <rect x="600" y="208" width="200" height="150"/>
        </g>
        <!-- slice A: items 1,2,3,5 (4 not yet ingested) -->
        <g fill="#9aa8b1">
          <circle cx="100" cy="244" r="5"/><circle cx="185" cy="236" r="5"/><circle cx="88" cy="330" r="5"/>
        </g>
        <circle cx="150" cy="296" r="6" fill="#0e6f8a"/>
        <circle cx="150" cy="296" r="10" fill="none" stroke="#0e6f8a"/>
        <g font-size="9.5" fill="#5b6a75">
          <text x="108" y="240">1</text><text x="193" y="232">2</text><text x="96" y="326">5</text>
        </g>
        <text x="164" y="292" font-size="9.5" fill="#0e6f8a">3</text>
        <!-- slice B: items 1..5, drifted -->
        <g fill="#9aa8b1">
          <circle cx="372" cy="252" r="5"/><circle cx="452" cy="228" r="5"/><circle cx="502" cy="318" r="5"/><circle cx="362" cy="336" r="5"/>
        </g>
        <circle cx="432" cy="304" r="6" fill="#0e6f8a"/>
        <circle cx="432" cy="304" r="10" fill="none" stroke="#0e6f8a"/>
        <g font-size="9.5" fill="#5b6a75">
          <text x="380" y="248">1</text><text x="460" y="224">2</text><text x="510" y="314">4</text><text x="370" y="332">5</text>
        </g>
        <text x="446" y="300" font-size="9.5" fill="#0e6f8a">3</text>
        <!-- slice C: items 1..5, different arrangement -->
        <g fill="#9aa8b1">
          <circle cx="642" cy="332" r="5"/><circle cx="702" cy="230" r="5"/><circle cx="652" cy="248" r="5"/><circle cx="732" cy="338" r="5"/>
        </g>
        <circle cx="762" cy="276" r="6" fill="#0e6f8a"/>
        <circle cx="762" cy="276" r="10" fill="none" stroke="#0e6f8a"/>
        <g font-size="9.5" fill="#5b6a75">
          <text x="650" y="328">1</text><text x="710" y="226">2</text><text x="660" y="244">4</text><text x="740" y="334">5</text>
        </g>
        <text x="776" y="272" font-size="9.5" fill="#0e6f8a">3</text>

        <text x="430" y="380" font-size="11.5" fill="#101820" text-anchor="middle">each slice owns only what is downstream of the permutation: its coordinates, its Morton ranking, its tile ranges</text>
        <text x="430" y="397" font-size="11.5" fill="#0e6f8a" text-anchor="middle">item 3 is the same entity everywhere — same ID, same permissions, same record; only its position differs</text>
        <text x="430" y="414" font-size="11.5" fill="#5b6a75" text-anchor="middle">item 4 has no row in "2024-Q4": slice membership is simply "has a position here" — no membership structure is stored</text>

        <g font-size="11">
          <text x="20" y="444" fill="#101820">one token authorises across every slice — the mask is built once in entity space, and current credentials govern historical slices too</text>
          <text x="20" y="462" fill="#5b6a75">deliberately not time-as-a-third-Morton-axis: slices are discrete and viewed one at a time, so each keeps its own clean ranking</text>
          <text x="20" y="480" fill="#5b6a75">the price per slice: its own permutation array (~4 GB flat at 10⁹, pageable when sparse) and one projection per session that touches it</text>
        </g>
      

</svg>
