<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 376" width="860" height="376" font-family="ui-sans-serif, system-ui, sans-serif">
<title>One cluster node's candidate labels with generating sets of decreasing size, each tested for containment in the viewer's visible set; the first label passing is served.</title>
<rect x="0" y="0" width="860" height="376" fill="#fbfcfc"/>


        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">A label is served only if the viewer can see everything it was generated from</text>
        <text x="840" y="26" font-size="11" fill="#7d6111" text-anchor="end">designed — not yet implemented</text>
        <text x="20" y="52" font-size="11.5" fill="#5b6a75" letter-spacing="1">ONE NODE'S CANDIDATE LABELS, GENERATED PER SET, TESTED TOP-DOWN FOR ONE VIEWER</text>
        <g stroke="#c8d2d8" fill="#ffffff">
          <rect x="20" y="64"  width="500" height="56" rx="2"/>
          <rect x="20" y="130" width="500" height="56" rx="2"/>
        </g>
        <rect x="20" y="196" width="500" height="56" rx="2" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="20" y="262" width="500" height="56" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <g font-size="12.5" fill="#101820">
          <text x="36" y="86">full-node label</text>
          <text x="36" y="152">cumulative-union label</text>
          <text x="36" y="218">single-term label</text>
          <text x="36" y="284">extractive term list</text>
        </g>
        <g font-size="10.5" fill="#5b6a75">
          <text x="36" y="104">generated from all 1,240 members</text>
          <text x="36" y="170">from the members under the two largest permission terms — 980 items</text>
          <text x="36" y="236">from one term's members — everyone holding the term sees all of them</text>
          <text x="36" y="302">key terms computed at view time from exactly the viewer's own visible members</text>
        </g>
        <g font-size="12.5" text-anchor="end">
          <text x="500" y="86" fill="#7d6111">✕ withheld</text>
          <text x="500" y="152" fill="#7d6111">✕ withheld</text>
          <text x="500" y="218" fill="#0e6f8a">✓ served</text>
          <text x="500" y="284" fill="#5b6a75">always passes</text>
        </g>
        <g font-size="10.5" text-anchor="end" fill="#5b6a75">
          <text x="500" y="104">31 source items the viewer cannot see</text>
          <text x="500" y="170">4 source items the viewer cannot see</text>
          <text x="500" y="236">every source item visible</text>
          <text x="500" y="302">its inputs are visible by definition</text>
        </g>
        <text x="560" y="64" font-size="11.5" fill="#5b6a75" letter-spacing="1">THE TEST</text>
        <circle cx="700" cy="178" r="78" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="700" y="136" font-size="11.5" fill="#101820" text-anchor="middle">what the viewer may see</text>
        <circle cx="686" cy="198" r="34" fill="#ffffff" stroke="#101820"/>
        <text x="686" y="202" font-size="11" fill="#101820" text-anchor="middle">✓</text>
        <circle cx="784" cy="120" r="30" fill="#ffffff" stroke="#7d6111"/>
        <text x="790" y="124" font-size="11" fill="#7d6111" text-anchor="middle">✕</text>
        <text x="700" y="288" font-size="11.5" fill="#101820" text-anchor="middle">served iff the generating set fits inside —</text>
        <text x="700" y="305" font-size="11.5" fill="#5b6a75" text-anchor="middle">one bitmap containment test per candidate,</text>
        <text x="700" y="321" font-size="11.5" fill="#5b6a75" text-anchor="middle">per request, never cached above the check</text>
        <text x="20" y="348" font-size="11.5" fill="#101820">withheld labels are invisible, not marked withheld: the decision depends only on data the viewer can already see, so the refusal itself reveals nothing;</text>
        <text x="20" y="365" font-size="11.5" fill="#5b6a75">a single label from the whole node would be servable to almost nobody — which is why the caller generates several, keyed by set selection, and the richest passing one wins</text>
      

</svg>
