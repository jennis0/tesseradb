<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 508" width="860" height="508" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Nested sets — everything, what the viewer may see, what the filter matched — feed a stable context layer and a match layer; below, sampling the matches is contrasted with filtering a global sample, which empties the screen.</title>
<rect x="0" y="0" width="860" height="508" fill="#fbfcfc"/>


        <defs>
          <marker id="ar8" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#101820"/></marker>
        </defs>
        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">A filter narrows what is highlighted — never what frames it, and never what you are allowed to see</text>

        <rect x="20" y="52" width="300" height="214" rx="4" fill="#ffffff" stroke="#b7c2c9"/>
        <text x="36" y="74" font-size="11.5" fill="#5b6a75" letter-spacing="1">EVERYTHING</text>
        <rect x="48" y="90" width="244" height="152" rx="4" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="64" y="112" font-size="12" fill="#101820">what you may see</text>
        <rect x="76" y="128" width="150" height="88" rx="4" fill="#ffffff" stroke="#0e6f8a" stroke-dasharray="4 3"/>
        <text x="92" y="150" font-size="12" fill="#101820">what your</text>
        <text x="92" y="166" font-size="12" fill="#101820">filter matched</text>

        <g stroke="#101820" stroke-width="1.3" marker-end="url(#ar8)">
          <line x1="294" y1="110" x2="352" y2="96"/>
          <line x1="228" y1="176" x2="352" y2="226"/>
        </g>

        <rect x="360" y="52" width="470" height="110" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="376" y="76" font-size="12.5" fill="#101820">context layer — sampled from <tspan fill="#0e6f8a">everything you may see</tspan></text>
        <text x="376" y="96" font-size="11" fill="#5b6a75">holds still while you type: marks, cluster structure and labels keep</text>
        <text x="376" y="110" font-size="11" fill="#5b6a75">the frame of reference — filtering highlights, it never dissolves the map</text>
        <text x="376" y="130" font-size="11" fill="#5b6a75">labels and cluster depth are governed by this set, so no filter can</text>
        <text x="376" y="144" font-size="11" fill="#5b6a75">reveal — or hide — structure the viewer's permissions alone would not (plates 16–17)</text>
        <rect x="712" y="66" width="104" height="82" fill="#fbfcfc" stroke="#b7c2c9"/>
        <g fill="#9aa8b1">
          <circle cx="728" cy="82" r="3.5"/><circle cx="760" cy="90" r="3.5"/><circle cx="794" cy="78" r="3.5"/>
          <circle cx="740" cy="112" r="3.5"/><circle cx="778" cy="120" r="3.5"/><circle cx="726" cy="134" r="3.5"/>
          <circle cx="798" cy="138" r="3.5"/><circle cx="762" cy="140" r="3.5"/>
        </g>

        <rect x="360" y="182" width="470" height="120" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="376" y="206" font-size="12.5" fill="#101820">match layer — drawn from <tspan fill="#0e6f8a">what the filter matched</tspan></text>
        <text x="376" y="226" font-size="11" fill="#5b6a75">narrow filter &#8594; sent in full, unsampled · broad filter &#8594; sampled,</text>
        <text x="376" y="240" font-size="11" fill="#5b6a75">by the same static rule, applied after the filter</text>
        <text x="376" y="260" font-size="11" fill="#5b6a75">per tile, two exact range counts: matched and visible —</text>
        <text x="376" y="274" font-size="11" fill="#101820">"312 of the 8,140 you can see here match"</text>
        <rect x="712" y="196" width="104" height="92" fill="#fbfcfc" stroke="#b7c2c9"/>
        <g fill="#c4ccd2">
          <circle cx="728" cy="212" r="3.5"/><circle cx="760" cy="220" r="3.5"/><circle cx="794" cy="208" r="3.5"/>
          <circle cx="740" cy="242" r="3.5"/><circle cx="778" cy="250" r="3.5"/><circle cx="726" cy="264" r="3.5"/>
          <circle cx="798" cy="268" r="3.5"/><circle cx="762" cy="270" r="3.5"/>
        </g>
        <g fill="none" stroke="#0e6f8a" stroke-width="2">
          <circle cx="760" cy="220" r="6"/><circle cx="740" cy="242" r="6"/><circle cx="798" cy="268" r="6"/>
        </g>

        <text x="20" y="344" font-size="11.5" fill="#5b6a75" letter-spacing="1">SAMPLED AFTER FILTERING — NOT FILTERED OUT OF A GLOBAL SAMPLE</text>
        <rect x="20" y="360" width="160" height="104" fill="#ffffff" stroke="#0e6f8a"/>
        <g fill="#0e6f8a">
          <circle cx="52" cy="384" r="4"/><circle cx="98" cy="396" r="4"/><circle cx="140" cy="380" r="4"/>
          <circle cx="66" cy="430" r="4"/><circle cx="122" cy="440" r="4"/>
        </g>
        <text x="100" y="484" font-size="11.5" fill="#101820" text-anchor="middle">sample of your matches ✓</text>
        <rect x="220" y="360" width="160" height="104" fill="#ffffff" stroke="#b7c2c9"/>
        <circle cx="330" cy="436" r="4" fill="#9aa8b1"/>
        <text x="300" y="484" font-size="11.5" fill="#7d6111" text-anchor="middle">matches ∩ a global sample ✗</text>
        <g font-size="12" fill="#101820">
          <text x="420" y="384">a global sample selects around rare matches: thousands of</text>
          <text x="420" y="401">matching items, none of them sampled &#8594; an empty screen</text>
          <text x="420" y="430">so the sample is defined over the filtered set itself, and the</text>
          <text x="420" y="447">threshold pass re-runs on every filter change — the depth-</text>
          <text x="420" y="464">preserving guarantees of the previous plate apply unchanged,</text>
          <text x="420" y="481">within any one filter state</text>
        </g>
      

</svg>
