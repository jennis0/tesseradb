<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" width="860" height="384" font-family="ui-sans-serif, system-ui, sans-serif">
<title>A boolean filter tree with the viewer's visible set entering every leaf, and the measured rule for crossing the result onto the map.</title>
<rect x="0" y="0" width="860" height="384" fill="#fbfcfc"/>


        <defs>
          <marker id="ar9" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#101820"/></marker>
          <marker id="ar9c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0e6f8a"/></marker>
        </defs>
        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">A filter is a boolean tree, evaluated inside what the viewer may see</text>
        <text x="20" y="52" font-size="11.5" fill="#5b6a75" letter-spacing="1">THE EXPRESSION</text>
        <rect x="150" y="62" width="120" height="40" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="210" y="86" font-size="12.5" fill="#101820" text-anchor="middle">all_of</text>
        <rect x="60" y="142" width="130" height="40" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="125" y="166" font-size="12.5" fill="#101820" text-anchor="middle">any_of</text>
        <rect x="240" y="142" width="150" height="40" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="315" y="161" font-size="12" fill="#101820" text-anchor="middle">year ≥ 2020</text>
        <text x="315" y="175" font-size="10" fill="#5b6a75" text-anchor="middle">numeric scan</text>
        <rect x="20" y="222" width="120" height="40" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="80" y="241" font-size="12" fill="#101820" text-anchor="middle">type = memo</text>
        <text x="80" y="255" font-size="10" fill="#5b6a75" text-anchor="middle">category</text>
        <rect x="160" y="222" width="120" height="40" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="220" y="241" font-size="12" fill="#101820" text-anchor="middle">match "fraud"</text>
        <text x="220" y="255" font-size="10" fill="#5b6a75" text-anchor="middle">analysed text</text>
        <g stroke="#9aa8b1" stroke-width="1.1">
          <line x1="185" y1="102" x2="140" y2="138"/>
          <line x1="235" y1="102" x2="300" y2="138"/>
          <line x1="105" y1="182" x2="85" y2="218"/>
          <line x1="145" y1="182" x2="205" y2="218"/>
        </g>
        <rect x="20" y="302" width="370" height="44" rx="2" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="205" y="322" font-size="12" fill="#101820" text-anchor="middle">the viewer's visible set, pushed into every leaf</text>
        <text x="205" y="338" font-size="10.5" fill="#5b6a75" text-anchor="middle">so no intermediate result ever holds an item they cannot see</text>
        <g stroke="#0e6f8a" stroke-width="1.3" marker-end="url(#ar9c)">
          <line x1="80"  y1="298" x2="80"  y2="266"/>
          <line x1="220" y1="298" x2="220" y2="266"/>
          <line x1="330" y1="298" x2="318" y2="186"/>
        </g>
        <text x="20" y="374" font-size="11" fill="#5b6a75">new capability = a new leaf type, never a new query language — the disclosure surface stays enumerable</text>

        <text x="450" y="52" font-size="11.5" fill="#5b6a75" letter-spacing="1">CROSSING THE RESULT ONTO THE MAP — MEASURED RULE</text>
        <rect x="450" y="62" width="380" height="56" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="466" y="86" font-size="12" fill="#101820">is the result ≤ 3 × the viewport's rows?</text>
        <text x="466" y="104" font-size="10.5" fill="#5b6a75">the only decision the crossing needs</text>
        <g stroke="#101820" stroke-width="1.2" marker-end="url(#ar9)">
          <line x1="560" y1="118" x2="560" y2="152"/>
          <line x1="740" y1="118" x2="740" y2="152"/>
        </g>
        <text x="548" y="140" font-size="10.5" fill="#5b6a75" text-anchor="end">yes — narrow</text>
        <text x="752" y="140" font-size="10.5" fill="#5b6a75">no — broad</text>
        <rect x="450" y="156" width="200" height="72" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="466" y="178" font-size="12" fill="#101820">project the result</text>
        <text x="466" y="196" font-size="10.5" fill="#5b6a75">cost scales with the result —</text>
        <text x="466" y="210" font-size="10.5" fill="#5b6a75">cheap because it is narrow:</text>
        <text x="466" y="224" font-size="10.5" fill="#5b6a75">3.8 ms at 10⁵ matches</text>
        <rect x="666" y="156" width="164" height="72" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="682" y="178" font-size="12" fill="#101820">test the viewport's</text>
        <text x="682" y="194" font-size="12" fill="#101820">own rows instead</text>
        <text x="682" y="212" font-size="10.5" fill="#5b6a75">bounded by the screen,</text>
        <text x="682" y="226" font-size="10.5" fill="#5b6a75">not the corpus: tens of ms</text>
        <text x="450" y="264" font-size="11.5" fill="#101820">projecting a broad result would cost more than the scan that found it:</text>
        <text x="450" y="282" font-size="11.5" fill="#7d6111">10⁸ matches &#8594; 2,779 ms to project, against a 730 ms scan</text>
        <text x="450" y="312" font-size="11" fill="#5b6a75">ranked queries are expressed as thresholds and ranked after intersection —</text>
        <text x="450" y="328" font-size="11" fill="#5b6a75">a corpus-wide top-k intersected afterwards would let results vary with items</text>
        <text x="450" y="344" font-size="11" fill="#5b6a75">the viewer cannot see; and no pre-intersection match count is ever exposed</text>
        <text x="450" y="372" font-size="11" fill="#5b6a75">filter budget at 10⁹: 0.5–1 s · category scans 74–280 ms · worst cases closed 17–74× by block-building</text>
      

</svg>
