<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 474" width="860" height="474" font-family="ui-sans-serif, system-ui, sans-serif">
<title>A corpus of documents, each with a map position and permission terms, served as two different screens of the same region: one viewer sees many marks and a count of 8,140, the other sees few marks and 312 - every quantity computed from what that viewer may see.</title>
<rect x="0" y="0" width="860" height="474" fill="#fbfcfc"/>

        <defs>
          <marker id="arI" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#101820"/></marker>
        </defs>
        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">One corpus; a different map for every viewer</text>

        <text x="20" y="58" font-size="11.5" fill="#5b6a75" letter-spacing="1">THE CORPUS — POSITIONS + PERMISSIONS</text>
        <rect x="20" y="68" width="300" height="210" fill="#ffffff" stroke="#b7c2c9"/>
        <g fill="#9aa8b1">
          <circle cx="60" cy="100" r="3.5"/><circle cx="110" cy="88" r="3.5"/><circle cx="170" cy="110" r="3.5"/>
          <circle cx="230" cy="92" r="3.5"/><circle cx="285" cy="120" r="3.5"/><circle cx="80" cy="150" r="3.5"/>
          <circle cx="150" cy="165" r="3.5"/><circle cx="210" cy="150" r="3.5"/><circle cx="265" cy="175" r="3.5"/>
          <circle cx="55" cy="210" r="3.5"/><circle cx="180" cy="215" r="3.5"/><circle cx="240" cy="230" r="3.5"/>
          <circle cx="95" cy="250" r="3.5"/><circle cx="160" cy="255" r="3.5"/><circle cx="290" cy="240" r="3.5"/>
        </g>
        <circle cx="120" cy="180" r="5" fill="#0e6f8a"/>
        <line x1="120" y1="186" x2="120" y2="292" stroke="#9aa8b1" stroke-dasharray="3 3"/>
        <rect x="20" y="296" width="300" height="108" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="36" y="318" font-size="12" fill="#101820">document #4127</text>
        <g font-size="10.5" fill="#5b6a75">
          <text x="36" y="336">position — from the deployment&#8217;s own 2-D layout</text>
          <text x="36" y="350">(an embedding projection, geography, &#8230;)</text>
          <text x="36" y="366">permission terms: project-x · region-eu</text>
          <text x="36" y="382">fields: archive = cs · submitted = 2025-03</text>
          <text x="36" y="398">the document itself stays in the caller&#8217;s systems</text>
        </g>

        <line x1="324" y1="150" x2="394" y2="150" stroke="#101820" stroke-width="1.2" marker-end="url(#arI)"/>
        <text x="358" y="138" font-size="10.5" fill="#5b6a75" text-anchor="middle">served through</text>
        <text x="358" y="166" font-size="10.5" fill="#5b6a75" text-anchor="middle">permissions</text>

        <text x="400" y="58" font-size="11.5" fill="#5b6a75" letter-spacing="1">THE SAME REGION, AT THE SAME MOMENT, FOR TWO VIEWERS</text>
        <rect x="400" y="68" width="200" height="170" fill="#ffffff" stroke="#b7c2c9"/>
        <g fill="#0e6f8a">
          <circle cx="430" cy="100" r="3.5"/><circle cx="470" cy="90" r="3.5"/><circle cx="510" cy="120" r="3.5"/>
          <circle cx="550" cy="100" r="3.5"/><circle cx="440" cy="150" r="3.5"/><circle cx="490" cy="160" r="3.5"/>
          <circle cx="530" cy="140" r="3.5"/><circle cx="570" cy="170" r="3.5"/><circle cx="420" cy="190" r="3.5"/>
          <circle cx="460" cy="200" r="3.5"/><circle cx="520" cy="195" r="3.5"/><circle cx="560" cy="210" r="3.5"/>
        </g>
        <rect x="412" y="208" width="118" height="22" rx="11" fill="#fbfcfc" stroke="#0e6f8a"/>
        <text x="471" y="223" font-size="10.5" fill="#101820" text-anchor="middle">8,140 visible here</text>
        <rect x="630" y="68" width="200" height="170" fill="#ffffff" stroke="#b7c2c9"/>
        <g fill="#0e6f8a">
          <circle cx="700" cy="90" r="3.5"/><circle cx="740" cy="120" r="3.5"/>
          <circle cx="720" cy="160" r="3.5"/><circle cx="790" cy="210" r="3.5"/>
        </g>
        <rect x="642" y="208" width="106" height="22" rx="11" fill="#fbfcfc" stroke="#0e6f8a"/>
        <text x="695" y="223" font-size="10.5" fill="#101820" text-anchor="middle">312 visible here</text>
        <g font-size="11.5" fill="#101820" text-anchor="middle">
          <text x="500" y="258">viewer A — broad grants</text>
          <text x="730" y="258">viewer B — narrow grants</text>
        </g>

        <g font-size="11.5">
          <text x="400" y="292" fill="#101820">every quantity on either screen — marks, counts, density,</text>
          <text x="400" y="308" fill="#101820">structure — is computed from that viewer&#8217;s visible set alone</text>
          <text x="400" y="334" fill="#5b6a75">a document outside a viewer&#8217;s permissions contributes nothing</text>
          <text x="400" y="350" fill="#5b6a75">to anything they are shown — not to a count, a shade,</text>
          <text x="400" y="366" fill="#5b6a75">a cluster or a label</text>
          <text x="400" y="392" fill="#101820">an index beside your document store, not a database: it</text>
          <text x="400" y="408" fill="#101820">answers how many, where, and which examples — pannable</text>
          <text x="400" y="424" fill="#101820">and zoomable at up to 10⁹ documents, updating continuously</text>
        </g>
        <text x="20" y="460" font-size="11" fill="#5b6a75">the corpus and its permissions come from the caller: Tessera holds positions, permission terms and declared fields — never the documents themselves</text>
      
</svg>
