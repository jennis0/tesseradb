<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 418" width="860" height="418" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Documents are labelled with terms at ingest; a session's credentials resolve to satisfied terms; a document is visible to a session exactly when the two term sets intersect.</title>
<rect x="0" y="0" width="860" height="418" fill="#fbfcfc"/>


        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">Documents carry terms; a session satisfies terms; visible means the two sets intersect</text>

        <text x="40" y="56" font-size="11.5" fill="#5b6a75" letter-spacing="1">AT INGEST — EACH DOCUMENT IS LABELLED WITH TERMS</text>
        <text x="570" y="56" font-size="11.5" fill="#5b6a75" letter-spacing="1">AT SESSION — CREDENTIALS RESOLVE TO TERMS</text>

        <g stroke="#c8d2d8" fill="#ffffff">
          <rect x="40" y="68"  width="250" height="98" rx="2"/>
          <rect x="40" y="192" width="250" height="98" rx="2"/>
          <rect x="570" y="68"  width="250" height="98" rx="2"/>
          <rect x="570" y="192" width="250" height="98" rx="2"/>
        </g>
        <g font-size="12.5" fill="#101820">
          <text x="56" y="90">document #4127</text>
          <text x="56" y="214">document #88410</text>
          <text x="586" y="90">viewer A — analyst</text>
          <text x="586" y="214">viewer B — finance</text>
        </g>
        <g font-size="10.5" fill="#5b6a75">
          <text x="56" y="106">labelled once, at ingest</text>
          <text x="56" y="230">labelled once, at ingest</text>
          <text x="586" y="106">terms their credential satisfies</text>
          <text x="586" y="230">terms their credential satisfies</text>
        </g>
        <g fill="#dcedf3" stroke="#0e6f8a">
          <rect x="56"  y="122" width="88" height="22" rx="11"/>
          <rect x="152" y="122" width="88" height="22" rx="11"/>
          <rect x="56"  y="246" width="96" height="22" rx="11"/>
          <rect x="586" y="122" width="88" height="22" rx="11"/>
          <rect x="682" y="122" width="80" height="22" rx="11"/>
          <rect x="586" y="246" width="96" height="22" rx="11"/>
        </g>
        <g font-size="10.5" fill="#101820" text-anchor="middle">
          <text x="100" y="137">project-x</text>
          <text x="196" y="137">region-eu</text>
          <text x="104" y="261">finance-q3</text>
          <text x="630" y="137">project-x</text>
          <text x="722" y="137">briefing</text>
          <text x="634" y="261">finance-q3</text>
        </g>

        <line x1="566" y1="100" x2="294" y2="100" stroke="#0e6f8a" stroke-width="2"/>
        <text x="430" y="92" font-size="11" fill="#0e6f8a" text-anchor="middle">project-x on both sides → visible</text>
        <line x1="566" y1="258" x2="294" y2="258" stroke="#0e6f8a" stroke-width="2"/>
        <text x="430" y="250" font-size="11" fill="#0e6f8a" text-anchor="middle">finance-q3 on both sides → visible</text>
        <g stroke="#9aa8b1" stroke-width="1.2" stroke-dasharray="4 4">
          <line x1="566" y1="132" x2="294" y2="226"/>
          <line x1="566" y1="226" x2="294" y2="132"/>
        </g>
        <rect x="336" y="158" width="190" height="48" fill="#fbfcfc"/>
        <g font-size="10.5" fill="#5b6a75" text-anchor="middle">
          <text x="431" y="172">no shared term → invisible,</text>
          <text x="431" y="186">absent from every count,</text>
          <text x="431" y="200">sample and label</text>
        </g>

        <text x="430" y="322" font-size="12.5" fill="#0e6f8a" text-anchor="middle">the whole rule: a document is visible to a session ⇔ their term sets intersect</text>

        <g font-size="11">
          <text x="40" y="350" fill="#101820">terms are opaque bytes to the engine — the deployment's plugin defines them: classifications, compartments, tenancies, teams, ownership…</text>
          <text x="40" y="368" fill="#5b6a75">a term is a route in, not a requirement: a document carrying several terms is visible through any one of them</text>
          <text x="40" y="386" fill="#101820">authorisation comes only from the presented token — the engine never looks up credentials; staleness is bounded by token lifetime, which the caller sets</text>
          <text x="40" y="404" fill="#7d6111">the one thing the engine cannot check: the ingest-side and session-side term derivations must agree on what a term means — every mask and label rests on it</text>
        </g>
      

</svg>
