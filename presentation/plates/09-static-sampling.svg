<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 548" width="860" height="548" font-family="ui-sans-serif, system-ui, sans-serif">
<title>A sixteen-row table in Morton order with fixed two-digit priorities and two masked rows; zoomed out, the whole table is one tile serving IDs below 20; zoomed in, four tiles serve IDs below 80 - the zoomed-out marks reappear in their own tiles, one tile falls back to the floor, and masked rows never enter any selection.</title>
<rect x="0" y="0" width="860" height="548" fill="#fbfcfc"/>

        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">Static sampling, worked: sixteen rows, four tiles, two zoom levels</text>
        <text x="20" y="46" font-size="11.5" fill="#5b6a75">every item keeps one fixed draw priority for life — a 2-digit ID here, the leading 16 bits of its keyed public ID in reality; there is no randomness at query time</text>

        <text x="96" y="82" font-size="11" fill="#5b6a75">one view&#8217;s rows, in Morton order — so each tile below is a contiguous run (plates 04–05); two rows are outside this viewer&#8217;s mask</text>
        <g stroke="#b7c2c9">
          <rect x="96"  y="92" width="44" height="36" fill="#ffffff"/><rect x="140" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="184" y="92" width="44" height="36" fill="#ffffff"/><rect x="228" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="272" y="92" width="44" height="36" fill="#ffffff"/><rect x="316" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="360" y="92" width="44" height="36" fill="#eef1f3"/><rect x="404" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="448" y="92" width="44" height="36" fill="#ffffff"/><rect x="492" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="536" y="92" width="44" height="36" fill="#eef1f3"/><rect x="580" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="624" y="92" width="44" height="36" fill="#ffffff"/><rect x="668" y="92" width="44" height="36" fill="#ffffff"/>
          <rect x="712" y="92" width="44" height="36" fill="#ffffff"/><rect x="756" y="92" width="44" height="36" fill="#ffffff"/>
        </g>
        <g font-size="12.5" fill="#101820" text-anchor="middle">
          <text x="118" y="115">47</text><text x="162" y="115">12</text><text x="206" y="115">83</text><text x="250" y="115">59</text>
          <text x="294" y="115">31</text><text x="338" y="115">76</text><text x="426" y="115">64</text>
          <text x="470" y="115">92</text><text x="514" y="115">87</text><text x="602" y="115">95</text>
          <text x="646" y="115">19</text><text x="690" y="115">88</text><text x="734" y="115">36</text><text x="778" y="115">60</text>
        </g>
        <g font-size="12.5" fill="#9aa8b1" text-anchor="middle">
          <text x="382" y="115">08</text><text x="558" y="115">55</text>
        </g>
        <g stroke="#9aa8b1" stroke-width="1.2">
          <line x1="368" y1="122" x2="396" y2="98"/>
          <line x1="544" y1="122" x2="572" y2="98"/>
        </g>
        <g font-size="9" fill="#9aa8b1" text-anchor="middle">
          <text x="118" y="140">0</text><text x="162" y="140">1</text><text x="206" y="140">2</text><text x="250" y="140">3</text>
          <text x="294" y="140">4</text><text x="338" y="140">5</text><text x="382" y="140">6</text><text x="426" y="140">7</text>
          <text x="470" y="140">8</text><text x="514" y="140">9</text><text x="558" y="140">10</text><text x="602" y="140">11</text>
          <text x="646" y="140">12</text><text x="690" y="140">13</text><text x="734" y="140">14</text><text x="778" y="140">15</text>
        </g>
        <g fill="none" stroke="#101820" stroke-width="1.2">
          <path d="M96,148 L96,156 L270,156 L270,148"/>
          <path d="M274,148 L274,156 L446,156 L446,148"/>
          <path d="M450,148 L450,156 L622,156 L622,148"/>
          <path d="M626,148 L626,156 L798,156 L798,148"/>
        </g>
        <g font-size="11" fill="#101820" text-anchor="middle">
          <text x="183" y="174">tile A · rows 0–3</text>
          <text x="360" y="174">tile B · rows 4–7</text>
          <text x="536" y="174">tile C · rows 8–11</text>
          <text x="712" y="174">tile D · rows 12–15</text>
        </g>

        <text x="20" y="210" font-size="11.5" fill="#5b6a75" letter-spacing="1">ZOOMED OUT — THE WHOLE VIEWPORT IS ONE TILE (ROWS 0–15) · THRESHOLD AT THIS DEPTH: SERVE VISIBLE IDs BELOW 20</text>
        <g>
          <rect x="96"  y="222" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
          <rect x="93"  y="219" width="52" height="30" rx="15" fill="none" stroke="#0e6f8a"/>
          <rect x="156" y="222" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
          <rect x="153" y="219" width="52" height="30" rx="15" fill="none" stroke="#0e6f8a"/>
        </g>
        <g font-size="12" fill="#101820" text-anchor="middle">
          <text x="119" y="238">12</text>
          <text x="179" y="238">19</text>
        </g>
        <text x="226" y="234" font-size="11" fill="#101820">two marks — how many visible rows sit below the cut is proportional to the visible total,</text>
        <text x="226" y="248" font-size="11" fill="#101820">so mark count carries density</text>
        <text x="96" y="272" font-size="11" fill="#5b6a75">08 would have been drawn, but it is not visible to this viewer — selection walks only their own rows; a different mask gives a different, equally stable sample</text>

        <text x="20" y="306" font-size="11.5" fill="#5b6a75" letter-spacing="1">ZOOMED IN ONE LEVEL — FOUR TILES · THE THRESHOLD QUADRUPLES: SERVE VISIBLE IDs BELOW 80</text>
        <g stroke="#c8d2d8" fill="#ffffff">
          <rect x="96"  y="318" width="174" height="88" rx="2"/>
          <rect x="272" y="318" width="174" height="88" rx="2"/>
          <rect x="448" y="318" width="174" height="88" rx="2"/>
          <rect x="624" y="318" width="174" height="88" rx="2"/>
        </g>
        <rect x="106" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="103" y="327" width="52" height="30" rx="15" fill="none" stroke="#0e6f8a"/>
        <rect x="162" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="218" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <g font-size="12" fill="#101820" text-anchor="middle">
          <text x="129" y="346">12</text><text x="185" y="346">47</text><text x="241" y="346">59</text>
        </g>
        <text x="106" y="378" font-size="10" fill="#5b6a75">83 is above the cut</text>
        <rect x="282" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="338" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="394" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <g font-size="12" fill="#101820" text-anchor="middle">
          <text x="305" y="346">31</text><text x="361" y="346">64</text><text x="417" y="346">76</text>
        </g>
        <text x="282" y="378" font-size="10" fill="#5b6a75">08 is not visible</text>
        <rect x="458" y="330" width="46" height="24" rx="12" fill="#f4ecd7" stroke="#7d6111"/>
        <rect x="514" y="330" width="46" height="24" rx="12" fill="#f4ecd7" stroke="#7d6111"/>
        <g font-size="12" fill="#101820" text-anchor="middle">
          <text x="481" y="346">87</text><text x="537" y="346">92</text>
        </g>
        <text x="568" y="346" font-size="10" fill="#7d6111">← floor</text>
        <text x="458" y="378" font-size="10" fill="#5b6a75">nothing below 80 → serve the</text>
        <text x="458" y="392" font-size="10" fill="#5b6a75">2 lowest visible — never blank</text>
        <rect x="634" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="631" y="327" width="52" height="30" rx="15" fill="none" stroke="#0e6f8a"/>
        <rect x="690" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <rect x="746" y="330" width="46" height="24" rx="12" fill="#dcedf3" stroke="#0e6f8a"/>
        <g font-size="12" fill="#101820" text-anchor="middle">
          <text x="657" y="346">19</text><text x="713" y="346">36</text><text x="769" y="346">60</text>
        </g>
        <text x="634" y="378" font-size="10" fill="#5b6a75">88 is above the cut</text>

        <text x="20" y="436" font-size="11.5" fill="#0e6f8a">the zoomed-out marks — 12 and 19, ringed — are served again in their own tiles: served at the shallow depth means ID &lt; 20, the deeper threshold is 80,</text>
        <text x="20" y="452" font-size="11.5" fill="#0e6f8a">and the item is still in whichever sub-tile contains it. zoom refines the picture — it never reshuffles it</text>
        <g font-size="11">
          <text x="20" y="482" fill="#101820">the real quantities: priority is the top 16 bits of the keyed public ID — uniform, uncorrelated with permissions; the threshold is anchored per session so a</text>
          <text x="20" y="498" fill="#101820">tile draws ~16 marks, and it quadruples per depth exactly as here. a floor (2) and a cap (500) bound every tile: never blank, never unbounded</text>
          <text x="20" y="524" fill="#5b6a75">panning changes nothing — the threshold depends on the viewer&#8217;s visible total, never the viewport; the same viewer over the same data draws the same</text>
          <text x="20" y="540" fill="#5b6a75">marks on every revisit. under a filter, the identical rule re-runs over the matching rows alone (next plate)</text>
        </g>
      
</svg>
