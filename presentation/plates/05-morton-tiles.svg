<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="ui-sans-serif, system-ui, sans-serif">
<title>A four-by-four grid traversed by a Z-shaped curve, next to the same sixteen cells as a flat array where one quadrant occupies a contiguous run intersected with a viewer's mask.</title>
<rect x="0" y="0" width="860" height="330" fill="#fbfcfc"/>


        <defs>
          <marker id="ar4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#101820"/></marker>
        </defs>
        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">Morton order: interleave the coordinate bits, sort, and every map tile becomes a contiguous range</text>
        <text x="40" y="52" font-size="11.5" fill="#5b6a75" letter-spacing="1">THE GRID, TRAVERSED IN Z-ORDER</text>
        <rect x="144" y="64" width="104" height="104" fill="#dcedf3"/>
        <g stroke="#b7c2c9" fill="none">
          <rect x="40" y="64" width="208" height="208"/>
          <line x1="92"  y1="64" x2="92"  y2="272"/>
          <line x1="144" y1="64" x2="144" y2="272"/>
          <line x1="196" y1="64" x2="196" y2="272"/>
          <line x1="40" y1="116" x2="248" y2="116"/>
          <line x1="40" y1="168" x2="248" y2="168"/>
          <line x1="40" y1="220" x2="248" y2="220"/>
        </g>
        <polyline points="66,90 118,90 66,142 118,142 170,90 222,90 170,142 222,142 66,194 118,194 66,246 118,246 170,194 222,194 170,246 222,246"
          fill="none" stroke="#0e6f8a" stroke-width="1.6" opacity="0.75"/>
        <g font-size="11" fill="#101820" text-anchor="middle">
          <text x="66" y="84">0</text><text x="118" y="84">1</text><text x="170" y="84">4</text><text x="222" y="84">5</text>
          <text x="66" y="136">2</text><text x="118" y="136">3</text><text x="170" y="136">6</text><text x="222" y="136">7</text>
          <text x="66" y="188">8</text><text x="118" y="188">9</text><text x="170" y="188">12</text><text x="222" y="188">13</text>
          <text x="66" y="240">10</text><text x="118" y="240">11</text><text x="170" y="240">14</text><text x="222" y="240">15</text>
        </g>
        <text x="40" y="298" font-size="11.5" fill="#101820">every quadtree tile at every zoom = one bit-prefix</text>
        <text x="40" y="315" font-size="11.5" fill="#5b6a75">(highlighted: the tile whose codes start 01)</text>

        <line x1="262" y1="164" x2="316" y2="164" stroke="#101820" stroke-width="1.2" marker-end="url(#ar4)"/>

        <path d="M450,126 L450,118 L570,118 L570,126" fill="none" stroke="#0e6f8a" stroke-width="1.4"/>
        <text x="510" y="106" font-size="12" fill="#0e6f8a" text-anchor="middle">the tile is rows [4, 8) — contiguous</text>
        <text x="330" y="86" font-size="11.5" fill="#5b6a75" letter-spacing="1">THE SAME CELLS AS STORED ROWS</text>
        <g stroke="#b7c2c9">
          <rect x="330" y="134" width="120" height="34" fill="#ffffff"/>
          <rect x="450" y="134" width="120" height="34" fill="#dcedf3" stroke="#0e6f8a"/>
          <rect x="570" y="134" width="240" height="34" fill="#ffffff"/>
        </g>
        <g stroke="#b7c2c9" stroke-width="0.8">
          <line x1="360" y1="134" x2="360" y2="168"/><line x1="390" y1="134" x2="390" y2="168"/><line x1="420" y1="134" x2="420" y2="168"/>
          <line x1="480" y1="134" x2="480" y2="168"/><line x1="510" y1="134" x2="510" y2="168"/><line x1="540" y1="134" x2="540" y2="168"/>
          <line x1="600" y1="134" x2="600" y2="168"/><line x1="630" y1="134" x2="630" y2="168"/><line x1="660" y1="134" x2="660" y2="168"/>
          <line x1="690" y1="134" x2="690" y2="168"/><line x1="720" y1="134" x2="720" y2="168"/><line x1="750" y1="134" x2="750" y2="168"/>
          <line x1="780" y1="134" x2="780" y2="168"/>
        </g>
        <g font-size="10.5" fill="#101820" text-anchor="middle">
          <text x="345" y="156">0</text><text x="375" y="156">1</text><text x="405" y="156">2</text><text x="435" y="156">3</text>
          <text x="465" y="156">4</text><text x="495" y="156">5</text><text x="525" y="156">6</text><text x="555" y="156">7</text>
          <text x="585" y="156">8</text><text x="615" y="156">9</text><text x="645" y="156">10</text><text x="675" y="156">11</text>
          <text x="705" y="156">12</text><text x="735" y="156">13</text><text x="765" y="156">14</text><text x="795" y="156">15</text>
        </g>
        <text x="330" y="210" font-size="11.5" fill="#5b6a75" letter-spacing="1">A VIEWER'S MASK OVER THE SAME ROWS</text>
        <rect x="330" y="222" width="480" height="26" fill="#ffffff" stroke="#b7c2c9"/>
        <g fill="#0e6f8a">
          <rect x="331" y="223" width="28" height="24"/>
          <rect x="391" y="223" width="28" height="24"/>
          <rect x="451" y="223" width="58" height="24"/>
          <rect x="541" y="223" width="28" height="24"/>
          <rect x="631" y="223" width="88" height="24"/>
          <rect x="781" y="223" width="28" height="24"/>
        </g>
        <g stroke="#b7c2c9" stroke-width="0.8">
          <line x1="360" y1="222" x2="360" y2="248"/><line x1="390" y1="222" x2="390" y2="248"/><line x1="420" y1="222" x2="420" y2="248"/>
          <line x1="450" y1="222" x2="450" y2="248"/><line x1="480" y1="222" x2="480" y2="248"/><line x1="510" y1="222" x2="510" y2="248"/>
          <line x1="540" y1="222" x2="540" y2="248"/><line x1="570" y1="222" x2="570" y2="248"/><line x1="600" y1="222" x2="600" y2="248"/>
          <line x1="630" y1="222" x2="630" y2="248"/><line x1="660" y1="222" x2="660" y2="248"/><line x1="690" y1="222" x2="690" y2="248"/>
          <line x1="720" y1="222" x2="720" y2="248"/><line x1="750" y1="222" x2="750" y2="248"/><line x1="780" y1="222" x2="780" y2="248"/>
        </g>
        <text x="330" y="282" font-size="11.5" fill="#101820">visible count in the tile = set bits in [4, 8) — <tspan fill="#0e6f8a">exact, no document data read</tspan></text>
        <text x="330" y="299" font-size="11.5" fill="#5b6a75">a tile's [lo, hi) comes from two binary searches over the sorted code column; no tile table is stored</text>
        <text x="330" y="316" font-size="11.5" fill="#5b6a75">the grid is 2¹⁶ × 2¹⁶ — ~0.23 items per cell at 10⁹, so collisions do not bind</text>
      

</svg>
