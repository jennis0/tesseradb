<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 448" width="860" height="448" font-family="ui-sans-serif, system-ui, sans-serif">
<title>A supplied cluster tree annotated with one viewer's visible counts; the descent frontier passes above a node whose visible count falls below the threshold, so its members surface in the parent.</title>
<rect x="0" y="0" width="860" height="448" fill="#fbfcfc"/>


        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">Insufficient visibility becomes rollup, never a hole</text>
        <text x="20" y="46" font-size="11.5" fill="#5b6a75">one supplied hierarchy; per viewer, descend while the count of visible members stays above a threshold — the frontier of that descent is their clustering</text>
        <text x="840" y="26" font-size="11" fill="#7d6111" text-anchor="end">designed — not yet implemented</text>
        <g stroke="#9aa8b1" stroke-width="1.1">
          <line x1="430" y1="106" x2="210" y2="146"/>
          <line x1="430" y1="106" x2="650" y2="146"/>
          <line x1="210" y1="214" x2="100" y2="254"/>
          <line x1="210" y1="214" x2="320" y2="254"/>
          <line x1="650" y1="214" x2="540" y2="254"/>
          <line x1="650" y1="214" x2="760" y2="254"/>
        </g>
        <rect x="360" y="58" width="140" height="48" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="430" y="78" font-size="12" fill="#101820" text-anchor="middle">root</text>
        <text x="430" y="95" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 1,930</text>
        <rect x="140" y="146" width="140" height="68" rx="2" fill="#ffffff" stroke="#c8d2d8"/>
        <text x="210" y="166" font-size="12" fill="#101820" text-anchor="middle">node A</text>
        <text x="210" y="183" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 1,720</text>
        <text x="210" y="200" font-size="10.5" fill="#5b6a75" text-anchor="middle">≥ 25 &#8594; descend</text>
        <rect x="580" y="146" width="140" height="68" rx="2" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="650" y="166" font-size="12" fill="#101820" text-anchor="middle">node B</text>
        <text x="650" y="183" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 210</text>
        <text x="650" y="200" font-size="10.5" fill="#0e6f8a" text-anchor="middle">served — B2 rolls up here</text>
        <rect x="30" y="254" width="140" height="60" rx="2" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="100" y="274" font-size="12" fill="#101820" text-anchor="middle">A1</text>
        <text x="100" y="291" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 1,050</text>
        <text x="100" y="306" font-size="10.5" fill="#0e6f8a" text-anchor="middle">served</text>
        <rect x="250" y="254" width="140" height="60" rx="2" fill="#dcedf3" stroke="#0e6f8a"/>
        <text x="320" y="274" font-size="12" fill="#101820" text-anchor="middle">A2</text>
        <text x="320" y="291" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 670</text>
        <text x="320" y="306" font-size="10.5" fill="#0e6f8a" text-anchor="middle">served</text>
        <rect x="470" y="254" width="140" height="60" rx="2" fill="#ffffff" stroke="#c8d2d8" stroke-dasharray="4 3"/>
        <text x="540" y="274" font-size="12" fill="#5b6a75" text-anchor="middle">B1</text>
        <text x="540" y="291" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 198</text>
        <text x="540" y="306" font-size="10.5" fill="#5b6a75" text-anchor="middle">not split — B2 blocks</text>
        <rect x="690" y="254" width="140" height="60" rx="2" fill="#ffffff" stroke="#7d6111" stroke-dasharray="4 3"/>
        <text x="760" y="274" font-size="12" fill="#7d6111" text-anchor="middle">B2</text>
        <text x="760" y="291" font-size="10.5" fill="#5b6a75" text-anchor="middle">visible 12 &lt; 25</text>
        <text x="760" y="306" font-size="10.5" fill="#7d6111" text-anchor="middle">below threshold</text>
        <polyline points="20,242 440,242 460,178 840,178" fill="none" stroke="#0e6f8a" stroke-width="1.8" stroke-dasharray="7 5"/>
        <text x="24" y="232" font-size="11" fill="#0e6f8a">this viewer's frontier</text>
        <text x="30" y="346" font-size="11.5" fill="#101820">counts are one bitmap intersection per node, so another viewer walks the same tree to a different frontier;</text>
        <text x="30" y="363" font-size="11.5" fill="#5b6a75">node geometry — centroid, hull, extent — is recomputed from the viewer's visible members only, since a shared build-time hull would point at invisible items</text>
        <g font-size="11.5">
          <text x="30" y="398" fill="#101820">the thresholds under discussion — <tspan font-weight="600">absolute floor (min_points, e.g. 25)</tspan>: counted against everything the viewer may see; a disclosure</text>
          <text x="30" y="415" fill="#101820">control on how finely structure is exposed, and a filter may never lower it · <tspan font-weight="600">relative floor (min-%) and a display threshold on the</tspan></text>
          <text x="30" y="432" fill="#101820"><tspan font-weight="600">filtered set</tspan>: how deep to refine where matches concentrate — display-side choices, inside the bound the absolute floor sets</text>
        </g>
      

</svg>
