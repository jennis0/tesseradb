<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 176" width="860" height="176" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Five stops: the model, permissions to pixels, drawing the map, change, and the parts under discussion — with the plates belonging to each.</title>
<rect x="0" y="0" width="860" height="176" fill="#fbfcfc"/>


        <defs>
          <marker id="ar0" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#101820"/></marker>
        </defs>
        <text x="20" y="26" font-size="15" font-weight="600" fill="#101820">The route: five stops, eighteen plates</text>
        <g stroke="#c8d2d8" fill="#ffffff">
          <rect x="20"  y="44" width="150" height="92" rx="2"/>
          <rect x="186" y="44" width="150" height="92" rx="2"/>
          <rect x="352" y="44" width="150" height="92" rx="2"/>
          <rect x="518" y="44" width="150" height="92" rx="2"/>
        </g>
        <rect x="684" y="44" width="150" height="92" rx="2" fill="#ffffff" stroke="#7d6111" stroke-dasharray="4 3"/>
        <g font-size="12.5" fill="#101820" text-anchor="middle">
          <text x="95"  y="66">the model</text>
          <text x="261" y="66">permissions→pixels</text>
          <text x="427" y="66">drawing the map</text>
          <text x="593" y="66">change</text>
          <text x="759" y="66">under discussion</text>
        </g>
        <g font-size="10.5" fill="#5b6a75" text-anchor="middle">
          <text x="95"  y="84">what it is;</text>
          <text x="95"  y="97">who sees what</text>
          <text x="261" y="84">one viewer's terms</text>
          <text x="261" y="97">become a map</text>
          <text x="427" y="84">fields, sampling</text>
          <text x="427" y="97">and filtering</text>
          <text x="593" y="84">writes, then the</text>
          <text x="593" y="97">machine in one view</text>
          <text x="759" y="84">slices, clusters and</text>
          <text x="759" y="97">labels — unbuilt</text>
        </g>
        <g font-size="10.5" fill="#0e6f8a" text-anchor="middle">
          <text x="95"  y="122">plates 01–03</text>
          <text x="261" y="122">04–07</text>
          <text x="427" y="122">08–11</text>
          <text x="593" y="122">12–14</text>
          <text x="759" y="122">15–17</text>
        </g>
        <g stroke="#101820" stroke-width="1.2" marker-end="url(#ar0)">
          <line x1="172" y1="90" x2="182" y2="90"/>
          <line x1="338" y1="90" x2="348" y2="90"/>
          <line x1="504" y1="90" x2="514" y2="90"/>
          <line x1="670" y1="90" x2="680" y2="90"/>
        </g>
        <text x="20" y="164" font-size="11.5" fill="#5b6a75">the figure board (18) underwrites every number quoted along the way — one machine, synthetic fixtures, re-runnable campaigns</text>
      

</svg>
